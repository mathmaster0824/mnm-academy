name: Class record regression
on:
  push:
    branches:
      - fix/class-record-persistence-20261008
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/class-record-regression.js
