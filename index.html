function problemArrayValue(...values){
  for(const value of values){
    if(Array.isArray(value)){
      const out=value.map(x=>String(x??'').trim()).filter(Boolean);
      if(out.length) return [...new Set(out)];
    }
    if(typeof value==='string' && value.trim()){
      const out=value.split(/[,·|;/\\n]+/).map(x=>x.trim()).filter(Boolean);
      if(out.length) return [...new Set(out)];
    }
  }
  return [];
}
function problemScalarValue(...values){
  for(const value of values){
    if(value===0) return '0';
    if(typeof value==='string' && value.trim()) return value.trim();
    if(typeof value==='number' && Number.isFinite(value)) return String(value);
  }
  return '';
}
function normalizeProblemAiAnalysis(raw,d={}){
  const a=(raw&&typeof raw==='object')?raw:{};
  const rule=problemRuleAnalysis({...d,problemText:problemPdfDecodeText(
    problemScalarValue(a.problemText,a.transcribedText,a.ocrText,a.extractedText,problemReadableProblemText(d))
  )});
  const problemText=problemPdfDecodeText(problemScalarValue(
    a.problemText,a.transcribedText,a.ocrText,a.extractedText,problemReadableProblemText(d)
  ));
  const conceptTags=problemArrayValue(a.conceptTags,a.concepts,a.tags,a.conceptKeywords,d.conceptTags,rule.conceptTags);
  const relatedConceptIds=problemArrayValue(a.relatedConceptIds,a.relatedConcepts,a.subConcepts,a.related,d.relatedConceptIds);
  const solutionSkills=problemArrayValue(a.solutionSkills,a.skills,a.solutionMethods,a.methods,a.techniques,d.solutionSkills,rule.solutionSkills);
  let mainConceptId=problemScalarValue(a.mainConceptId,a.mainConcept,a.coreConcept,a.concept,a.primaryConcept,d.mainConceptId);
  if(!mainConceptId && conceptTags.length) mainConceptId=conceptTags[0];
  let askType=problemScalarValue(a.askType,a.questionType,a.target,a.ask,a.askedFor,d.askType,rule.askType);
  let predictedDifficulty=problemScalarValue(a.predictedDifficulty,a.difficulty,a.level,a.difficultyLevel,d.predictedDifficulty);
  const geometryStructure=problemScalarValue(a.geometryStructure,a.figureStructure,a.geometry,a.diagramStructure,d.geometryStructure);
  let type=problemScalarValue(a.type,a.problemType,a.questionFormat,d.type);
  const typeMap={'객관식':'mc','선택형':'mc','multiple-choice':'mc','multiple_choice':'mc','단답형':'short','단답':'short','short-answer':'short','short_answer':'short','서술형':'constructed','증명':'constructed','constructed-response':'constructed','constructed_response':'constructed'};
  if(typeMap[type]) type=typeMap[type];
  if(!['mc','short','constructed'].includes(type)) type=problemPdfInferType(problemText||d.problemText||d.rawText||'',{answer:d.answer||''});
  let confidence=Number(a.confidence??a.aiConfidence??a.score??a.confidenceScore??0);
  if(confidence>1 && confidence<=100) confidence/=100;
  if(!Number.isFinite(confidence)) confidence=0;
  confidence=Math.max(0,Math.min(1,confidence));
  // 모델이 confidence를 생략했더라도 핵심 필드를 모두 채웠다면 응답 자체의 구조적 완성도를 반영한다.
  if(!confidence && mainConceptId && askType && solutionSkills.length && predictedDifficulty) confidence=0.7;
  return {problemText,conceptTags,mainConceptId,relatedConceptIds,geometryStructure,askType,solutionSkills,predictedDifficulty,type,confidence};
}
function problemAiPatch(raw,d,method='server-vision'){
  const a=normalizeProblemAiAnalysis(raw,d);
  const patch={
    problemText:a.problemText||problemReadableProblemText(d),
    conceptTags:a.conceptTags,
    mainConceptId:a.mainConceptId,
    relatedConceptIds:a.relatedConceptIds,
    geometryStructure:a.geometryStructure,
    askType:a.askType,
    solutionSkills:a.solutionSkills,
    predictedDifficulty:a.predictedDifficulty,
    type:a.type,
    analysis:{version:PROBLEM_ANALYSIS_VERSION,method,needsVision:false,status:'analyzed',confidence:a.confidence,analyzedAt:new Date().toISOString()}
  };
  const next={...d,...patch,status:''};
  patch.confidence=problemDraftConfidence(next);
  patch.status=problemDraftStatus(next);
  return patch;
}

async function analyzeProblemDraftWithServer(d){
  if(!PROBLEM_ANALYSIS_API) throw new Error('문항 분석 서버가 아직 연결되지 않았습니다.');
  const token=await photoApiToken();
  const cropKey=d.cropKey||photoStorageKey(d.media?.[0])||'';
  if(!cropKey) throw new Error('원본 crop key가 없습니다.');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),90000);
  let res;
  try{
    res=await fetch(PROBLEM_ANALYSIS_API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'X-MNM-Role':session?.mode||'user'},body:JSON.stringify({
      problemId:d.id,problemNo:d.problemNo||d.no||'',grade:d.grade||'',semester:d.semester||'',majorUnit:d.majorUnit||'',
      extractedText:problemReadableProblemText(d)||d.questionText||'',cropKey,taxonomyVersion:PROBLEM_ANALYSIS_VERSION
    }),signal:controller.signal});
  }catch(e){
    if(e?.name==='AbortError') throw new Error('AI 분석 응답이 90초 안에 오지 않았습니다.');
    throw e;
  }finally{
    clearTimeout(timer);
  }
  let out={};
  try{ out=await readMnmJsonResponse(res); }
  catch(parseErr){
    if(!res.ok) throw parseErr;
    throw new Error(`AI 문항분석 응답 해석 실패 · ${parseErr.message}`);
  }
  if(res.status===404||res.status===501) throw new Error('문항 이미지 분석 서버는 다음 배포 단계에서 연결됩니다.');
  if(!res.ok) throw new Error([out?.error||`문항 분석 ${res.status}`,out?.detail].filter(Boolean).join(' · '));
  return out.analysis||out;
}
async function analyzePendingProblemDrafts(){
  const run=problemStore.analysisRun;
  if(run.active){alert(`이미 이미지 분석 중이에요. (${run.done}/${run.total})`);return;}
  const rows=problemStore.ingest.drafts.filter(d=>{
    if(!(d.cropKey||photoStorageKey(d.media?.[0]))) return false;
    if(d.analysis?.status==='vision-pending') return true;
    if(d.analysis?.status==='analyzed' && !problemAiQuality(d).valid) return true;
    return false;
  });
  if(!rows.length){alert('AI 분석이 필요한 문항이 없어요.');return;}

  Object.assign(run,{active:true,total:rows.length,done:0,failed:0,current:'',message:`필요문항 AI 분석 시작 · 0/${rows.length}`,error:''});
  render();

  for(let i=0;i<rows.length;i++){
    const d=rows[i];
    try{
      d.status='analyzing';
      run.current=d.problemNo||d.no||`문항 ${i+1}`;
      run.message=`AI 이미지 분석 중 · ${i+1}/${rows.length} · ${run.current}`;
      render();

      const a=await analyzeProblemDraftWithServer(d);
      const patch=problemAiPatch(a,d,'server-vision');
      if(!await fsUpdate('problemDrafts',d.id,patch)) throw new Error('분석 결과 저장에 실패했습니다.');
      Object.assign(d,patch);
      run.done=i+1;
      run.message=`AI 이미지 분석 완료 ${run.done}/${rows.length}${run.done<rows.length?' · 다음 문항 준비 중':''}`;
      render();
    }catch(e){
      d.status='review';
      const msg=String(e?.message||e);
      console.error('problem vision analysis failed',e);
      run.failed=(run.failed||0)+1;
      run.done=i+1;
      run.error=msg;
      run.message=`AI 분석 진행 ${run.done}/${rows.length} · 실패 ${run.failed} · 다음 문항 계속`;
      try{
        await fsUpdate('problemDrafts',d.id,{
          status:'review',
          analysis:{...(d.analysis||{}),needsVision:true,status:'vision-pending',lastError:msg,updatedAt:new Date().toISOString()}
        });
      }catch(saveErr){ console.error('AI 분석 실패상태 저장 실패',saveErr); }
      render();
      continue;
    }
  }

  const failed=Number(run.failed||0), success=Math.max(0,run.total-failed);
  Object.assign(run,{active:false,current:'',message:`필요문항 AI 분석 완료 · 성공 ${success} · 실패 ${failed}`});
  render();
  alert(`AI 분석 완료\n성공 ${success}문항 · 실패 ${failed}문항${failed?'\n실패 문항은 검토 상태로 남겨두었습니다.':''}`);
}

function problemDraftMissing(d){
  const miss=[];
  if(!(d.problemText||d.rawText)) miss.push('문제텍스트 미확인');
  if(!d.grade) miss.push('학년 미확인');
  if(!d.semester) miss.push('학기 미확인');
  if(!(d.majorUnit||d.major)) miss.push('대단원 미확인');
  if(!(d.middleUnit||d.middle)) miss.push('중단원 미확인');
  if(!d.type) miss.push('문항유형 미확인');
  if((d.type||'short')!=='constructed'&&!String(d.answer||'').trim()) miss.push('정답 미확인');
  if(!(d.cropKey||d.cropUrl||d.imageUrl||d.originalRegion)) miss.push('원본 crop 없음');
  if(d.analysis?.needsVision&&d.analysis?.status==='vision-pending') miss.push('이미지분석 대기');
  const aq=problemAiQuality(d);
  if(aq.analyzed&&!aq.valid) miss.push('AI분석 검토: '+aq.issues.join(', '));
  return miss;
}

function problemIngestSummary(rows){
  const s={total:rows.length,ready:0,review:0,vision:0,answer:0};
  for(const d of rows){
    const st=problemDraftStatus(d); if(st==='ready')s.ready++; else if(st==='review')s.review++;
    if(d.analysis?.needsVision&&d.analysis?.status==='vision-pending')s.vision++;
    if((d.type||'short')!=='constructed'&&!String(d.answer||'').trim())s.answer++;
  }
  return s;
}
function problemDraftCropSrc(d){
  if(d.cropUrl) return absolutePhotoUrl(d.cropUrl);
  if(d.cropKey) return photoSrc({storageKey:d.cropKey});
  if(Array.isArray(d.media)&&d.media[0]) return photoSrc(d.media[0]);
  return d.imageUrl||'';
}

function renderProblemIngest(){
  ensureProblemIngestLoaded();
  const ing=problemStore.ingest;
  const drafts=ing.drafts.filter(d=>{
    if(ing.sourceFilter&&d.sourceId!==ing.sourceFilter) return false;
    if(ing.statusFilter&&problemDraftStatus(d)!==ing.statusFilter) return false;
    if(ing.aiFilter==='done') return problemAiQuality(d).valid;
    if(ing.aiFilter==='review') return d.analysis?.status==='analyzed'&&!problemAiQuality(d).valid;
    if(ing.aiFilter==='pending') return d.analysis?.status==='vision-pending';
    return true;

function problemText(p){ return p?.problemText || p?.text || p?.stem || p?.title || ''; }
function problemMetaLabel(p){ return [p.grade,p.semester,p.majorUnit||p.major,p.middleUnit||p.middle].filter(Boolean).join(' · '); }
function problemTypeLabel(t){ return ({mc:'객관식',short:'단답형',constructed:'서술형'})[t]||t||'미지정'; }
function problemFilteredItems(){
  const f=problemStore.filter, q=String(f.q||'').trim().toLowerCase();
  return problemStore.items.filter(p=>{
    const concepts=[p.mainConceptId,...(p.relatedConceptIds||[]),...(p.conceptTags||[])].filter(Boolean).join(' ');
    const skills=(p.solutionSkills||[]).join(' ');
    const hay=[problemText(p),p.sourceName,p.bookName,p.grade,p.semester,p.majorUnit,p.major,p.middleUnit,p.middle,p.problemNo,concepts,p.geometryStructure,p.askType,skills].join(' ').toLowerCase();
    return (!q||hay.includes(q)) && (!f.grade||p.grade===f.grade) && (!f.semester||p.semester===f.semester)
      && (!f.major||String(p.majorUnit||p.major||'').includes(f.major)) && (!f.middle||String(p.middleUnit||p.middle||'').includes(f.middle))
      && (!f.concept||concepts.includes(f.concept)) && (!f.geometry||String(p.geometryStructure||'').includes(f.geometry))
      && (!f.ask||String(p.askType||'').includes(f.ask)) && (!f.skill||skills.includes(f.skill));
  });
}
async function loadProblemPage(reset=true){
  if(problemStore.loading) return;
  const token=problemPrimarySearchToken(problemStore.filter);
  if(!reset && token!==problemStore.queryToken) reset=true;
  problemStore.loading=true;
  if(reset){
    problemStore.items=[]; problemStore.lastDoc=null; problemStore.page=1; problemStore.queryToken=token;
  }
  render();
  try{
    const pageSize=60;
    let q=fsdb.collection('problems');
    if(token) q=q.where('searchTokens','array-contains',token);
    q=q.limit(pageSize);
    if(!reset && problemStore.lastDoc) q=q.startAfter(problemStore.lastDoc);
    const snap=await q.get();
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    problemStore.items=reset?rows:[...problemStore.items,...rows];
    problemStore.lastDoc=snap.docs[snap.docs.length-1]||problemStore.lastDoc;
    problemStore.hasMore=snap.size===pageSize; problemStore.loaded=true;
    if(!reset) problemStore.page+=1;
  }catch(e){
    console.error('problem repository load',e);
    // 이전 저장 문항처럼 searchTokens가 없거나 검색 쿼리가 실패하면 일반 목록이라도 보여준다.
    if(reset && token){
      try{
        const snap=await fsdb.collection('problems').limit(60).get();
        problemStore.items=snap.docs.map(d=>({id:d.id,...d.data()}));
        problemStore.lastDoc=snap.docs[snap.docs.length-1]||null;
        problemStore.hasMore=snap.size===60; problemStore.loaded=true; problemStore.queryToken='';
      }catch(e2){ alert('문제저장소를 불러오지 못했어요.'); }
    }else alert('문제저장소를 불러오지 못했어요.');
  }finally{ problemStore.loading=false; render(); }
}
function ensureProblemRepositoryLoaded(){ if(!problemStore.loaded&&!problemStore.loading) setTimeout(()=>loadProblemPage(true),0); }
function setProblemFilter(key,value){
  problemStore.filter[key]=value;
  const nextToken=problemPrimarySearchToken(problemStore.filter);
  if(nextToken!==problemStore.queryToken){
    clearTimeout(problemStore.searchDebounce);
    problemStore.searchDebounce=setTimeout(()=>loadProblemPage(true),260);
  }
  render();
}

async function createProblemManually(){
  const text=prompt('문제 내용을 입력하세요.'); if(!text)return;
  const grade=prompt('학년 (예: 중2)','중2')||''; const semester=prompt('학기 (1학기/2학기)','1학기')||'';
  const majorUnit=prompt('대단원','')||''; const middleUnit=prompt('중단원','')||'';
  const type0=prompt('유형: mc / short / constructed','short')||'short'; const type=['mc','short','constructed'].includes(type0)?type0:'short';
  const answer=type==='constructed'?'':(prompt('정답','')||''); const points=Number(prompt('배점','1'))||1;
  const now=new Date().toISOString(), occurrenceId=uid('manual');
  const baseData={problemText:text,grade,semester,majorUnit,middleUnit,type,points,sourceType:'manual',occurrenceId,status:'active',createdAt:now,updatedAt:now};
  const fp=problemFingerprintInfo(baseData);
  const data={...baseData,dedupFingerprint:fp.fingerprint,dedupFingerprintVersion:fp.version,dedupMode:fp.mode};
  data.searchTokens=problemSafeSearchTokens(problemSearchTokens(data));
  assertNoAnswerLeak(data);
  const id=await fsAdd('problems',data);
  if(id){
    if(type!=='constructed'){
      const keyOk=await fsSet('problemKeys',id,{problemId:id,answer,acceptedAnswers:answer?[answer]:[],updatedAt:now});
      if(!keyOk){ await fsDelete('problems',id); alert('정답키 저장에 실패해 문제 등록을 취소했어요.'); return; }
    }
    problemStore.items.unshift({id,...data}); render();
  }
}

const ANSWER_WRONG_REASONS = ['개념부족','문제해석','풀이방법을 떠올리지 못함','계산실수','조건누락','마킹실수','기타'];
// 답 비교용 정규화: 공백 제거 + 동그라미 숫자(①~⑩)·전각 숫자를 일반 숫자로. PDF 정답표는 ③ 로 오고 학생 답지는 1~5 로 입력되므로 같은 답으로 봐야 한다.
// (NFKC 전체를 쓰지 않는다 — x² 와 x2 처럼 서로 다른 답이 같아지는 것을 막기 위해)
function normalizeAnswerValue(v){
  return String(v??'').trim().replace(/\s+/g,'')
    .replace(/[\u2460-\u2469]/g,c=>String(c.charCodeAt(0)-0x2460+1))
    .replace(/[\uFF10-\uFF19]/g,c=>String(c.charCodeAt(0)-0xFF10));
}
function assignmentPublicCopy(a){
  if(!a) return null;
  return {...a, problems:(a.problems||[]).map(({answer,acceptedAnswers,explanation,...p})=>p)};
}
function localGradeProblem(problem, answer){
  if(problem.type==='constructed') return {state:'pending', earnedPoints:null};
  const given=normalizeAnswerValue(answer);
  const candidates=(problem.acceptedAnswers&&problem.acceptedAnswers.length?problem.acceptedAnswers:[problem.answer]).filter(v=>v!==undefined&&v!==null&&String(v).trim()!=='');
  // 정답키가 없으면 오답으로 단정하지 않고 '확인중'으로 둔다(저장소 문제는 정답키가 problemKeys 에만 있다).
  if(!candidates.length) return {state:'pending', earnedPoints:null, keyMissing:true};
  const accepted=candidates.map(normalizeAnswerValue);
  const correct=accepted.includes(given);
  return {state:correct?'correct':'wrong',earnedPoints:correct?Number(problem.points||1):0};
}

async function submitAnswerSheet(assignmentId,stuId){
  const a=db.assignments[assignmentId]; if(!a) return;
  const problems=a.problems||[]; const answers=[];
  for(let i=0;i<problems.length;i++){ const el=document.getElementById(`ans_${assignmentId}_${i}`); answers.push(el?el.value:''); if(problems[i].type!=='constructed'&&!String(el?.value||'').trim()){ alert(`${problems[i].no||i+1}번 답을 입력해주세요.`); return; } }
  const id=answerSubmissionId(assignmentId,stuId);
  const exists=await fsdb.collection('answerSubmissions').doc(id).get();
  if(exists.exists){ alert('최초 제출 답지는 이미 저장되어 있어요.'); return; }
  // 학생에게 정답키를 노출하지 않기 위해 여기서는 객관/단답을 서버채점대기 상태로 저장한다.
  const autoResults=problems.map(p=>({state:p.type==='constructed'?'pending':'grading',earnedPoints:null}));
  const payload={assignmentId,studentId:stuId,originalAnswers:answers,autoResults,wrongReasons:{},submittedAt:new Date().toISOString(),learningCompletedAt:null,review:null};
  const ok=await fsSet('answerSubmissions',id,payload,false); if(ok){
    db.answerSubmissions[id]={id,...payload};
    const serverResults=await requestServerGrade(assignmentId,stuId,answers);
    if(Array.isArray(serverResults)){ await fsUpdate('answerSubmissions',id,{autoResults:serverResults}); db.answerSubmissions[id].autoResults=serverResults; }
    render();
  }
}
async function saveWrongReason(assignmentId,stuId,idx,value){
  const id=answerSubmissionId(assignmentId,stuId); const sub=db.answerSubmissions[id]; if(!sub)return;
  const wr={...(sub.wrongReasons||{})}; if(value)wr[idx]=value;else delete wr[idx];
  const ok=await fsUpdate('answerSubmissions',id,{wrongReasons:wr}); if(ok){sub.wrongReasons=wr;render();}
}
async function completeAnswerLearning(assignmentId,stuId){
  const id=answerSubmissionId(assignmentId,stuId), sub=db.answerSubmissions[id]; if(!sub)return;
  const results=(sub.review&&sub.review.finalResults)||sub.autoResults||[];
  const wrong=results.map((r,i)=>r&&r.state==='wrong'?i:-1).filter(i=>i>=0);
  if(!wrong.every(i=>sub.wrongReasons&&sub.wrongReasons[i])){alert('틀린 문제의 이유를 모두 선택해주세요.');return;}
  const at=new Date().toISOString(); const ok=await fsUpdate('answerSubmissions',id,{learningCompletedAt:at}); if(ok){sub.learningCompletedAt=at;render();}
}
// 문제저장소에서 배정한 문항은 정답키가 배정 문서에 없다(학생에게 내려가는 문서와 분리). 원장 채점 때만 problemKeys 에서 읽는다.
// 테스트 세트(정답이 배정 문서에 들어 있는 경우)는 그대로 사용한다.
async function problemWithGradingKey(problem){
  if(!problem || problem.type==='constructed') return problem;
  if(problem.answer!==undefined || (problem.acceptedAnswers&&problem.acceptedAnswers.length)) return problem;
  if(!problem.problemId) return problem;
  try{
    const doc=await fsdb.collection('problemKeys').doc(problem.problemId).get();
    if(doc.exists){ const k=doc.data()||{}; return {...problem, answer:k.answer, acceptedAnswers:k.acceptedAnswers}; }
  }catch(e){ console.error('정답키 조회 실패',problem.problemId,e); }
  return problem;
}
// 채점 공통부: 이미 정답키를 합친 문항(graded)으로 한 학생의 제출을 채점해 저장한다.
async function gradeSubmissionWithKeys(assignmentId,stuId,graded){
  const id=answerSubmissionId(assignmentId,stuId), sub=db.answerSubmissions[id]; if(!sub) return null;
  const results=graded.map((p,i)=>localGradeProblem(p,(sub.originalAnswers||[])[i]));
  const missing=results.filter(r=>r.keyMissing).length;
  const ok=await fsUpdate('answerSubmissions',id,{autoResults:results}); if(ok){sub.autoResults=results;}
  return {ok:!!ok,missing};
}
async function directorGradeAnswerSubmission(assignmentId,stuId){
  const a=db.assignments[assignmentId], id=answerSubmissionId(assignmentId,stuId), sub=db.answerSubmissions[id]; if(!a||!sub)return;
  const graded=await Promise.all((a.problems||[]).map(p=>problemWithGradingKey(p)));
  const r=await gradeSubmissionWithKeys(assignmentId,stuId,graded); if(!r)return;
  if(r.missing) alert(`정답키를 찾지 못한 문항이 ${r.missing}개 있어요. 해당 문항은 '확인중'으로 두었으니 직접 채점해주세요.`);
  if(r.ok) render();
}
// 채점 대기('grading') 상태인 제출만 한꺼번에 채점한다. 최종확인·수동 수정이 끝난 제출과 서술형은 건드리지 않는다.
function pendingGradingStudentIds(a){
  return (a?.studentIds||[]).filter(stuId=>{const sub=db.answerSubmissions[answerSubmissionId(a.id,stuId)];return sub&&!sub.review?.finalizedAt&&(sub.autoResults||[]).some(r=>r&&r.state==='grading');});
}
async function directorGradeAllPending(assignmentId){
  const a=db.assignments[assignmentId]; if(!a)return;
  const targets=pendingGradingStudentIds(a);
  if(!targets.length){alert('채점 대기 중인 제출이 없어요.');return;}
  if(!confirm(`채점 대기 ${targets.length}명을 정답키로 ○/× 채점할까요?\n서술형과 이미 최종확인한 제출은 건드리지 않아요.`))return;
  const graded=await Promise.all((a.problems||[]).map(p=>problemWithGradingKey(p))); // 정답키는 문항마다 한 번만 읽는다
  let done=0,failed=0,missing=0;
  for(const stuId of targets){ const r=await gradeSubmissionWithKeys(assignmentId,stuId,graded); if(r&&r.ok){done++;missing+=r.missing;}else failed++; }
  alert(`채점 완료 ${done}명`+(failed?` · 저장 실패 ${failed}명(다시 눌러주세요)`:'')+(missing?`\n정답키를 찾지 못한 문항이 있어 '확인중'으로 남았어요(합계 ${missing}건).`:''));
  render();
}
function renderDirectorAnswerReview(a,stuId){
  const id=answerSubmissionId(a.id,stuId), sub=db.answerSubmissions[id]; if(!sub)return '<div class="empty">아직 답지를 제출하지 않았어요.</div>';
  const results=(sub.review&&sub.review.finalResults)||sub.autoResults||[];
  return `<div style="margin-top:8px;">${(a.problems||[]).map((p,i)=>{const r=results[i]||{};return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);"><b style="width:40px;">${p.no||i+1}번</b><span style="min-width:90px;">${escapeHtml((sub.originalAnswers||[])[i]||'(서술형)')}</span><span class="badge ${r.state==='correct'?'green':r.state==='wrong'?'red':'yellow'}">${r.state==='correct'?'○':r.state==='wrong'?'×':'확인중'}</span><input type="number" min="0" max="${p.points||1}" step="0.5" id="reviewPts_${id}_${i}" value="${r.earnedPoints??''}" placeholder="점수" style="width:70px;"></div>`;}).join('')}<button class="btn sm gold" style="margin-top:8px;" onclick="finalizeAnswerReview('${a.id}','${stuId}')">최종 채점 저장</button></div>`;
}
async function finalizeAnswerReview(assignmentId,stuId){
  const a=db.assignments[assignmentId], id=answerSubmissionId(assignmentId,stuId), sub=db.answerSubmissions[id]; if(!a||!sub)return;
  const finalResults=(a.problems||[]).map((p,i)=>{const raw=document.getElementById(`reviewPts_${id}_${i}`)?.value;const max=Number(p.points||1);const earned=raw===''?(sub.autoResults?.[i]?.earnedPoints??0):Math.max(0,Math.min(max,Number(raw)));return {state:earned>=max?'correct':'wrong',earnedPoints:earned,maxPoints:max};});
  const earned=finalResults.reduce((n,r)=>n+Number(r.earnedPoints||0),0), max=finalResults.reduce((n,r)=>n+Number(r.maxPoints||0),0);
  const review={finalResults,earnedPoints:earned,maxPoints:max,finalizedAt:new Date().toISOString()};
  const ok=await fsUpdate('answerSubmissions',id,{review}); if(ok){sub.review=review;render();}
}
async function createTestAnswerAssignment(clsId){

  const problems=raw.split(/\n+/).map((line,i)=>{const [type0,answer='',pts='1']=line.split(',').map(x=>x.trim());const type=['mc','short','constructed'].includes(type0)?type0:'short';return {no:i+1,type,answer,acceptedAnswers:answer?[answer]:[],points:Number(pts)||1};}).filter(Boolean);
  if(!problems.length)return;

  const id=await fsAdd('assignments',data); if(id){db.assignments[id]={id,...data};alert('테스트 답지 세트를 배정했어요.');render();}
}

// 학생 두 번째 페이지: 기존 숙제계획/영상과 기존 숙제인증/Q&A 기능을 한 화면에 재배치한다.
// 데이터 스키마와 저장 함수는 변경하지 않는다.
function renderStudentHomeworkPage(){
  const stuId = session.studentId;
  const s = studentById(stuId);
  if(!s) return `<div class="empty">학생 정보를 찾을 수 없어요.</div>`;
  const cls = classForStudent(stuId);
  const clsId = cls?.id || s.classId || '';
  const wk = weekStartISO(todayISO());

  const videoAssignFlat = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    if(!obj[stuId]) return;
    const date = key.slice(-10);
    (obj[stuId].videoAssignments||[]).forEach((v,i)=> videoAssignFlat.push({...v,date,key,idx:i}));
  });
  videoAssignFlat.sort((a,b)=>b.date.localeCompare(a.date));

  return `
    <div class="card">
      <h2 style="margin:0 0 4px;">✏️ 오늘의 숙제</h2>
      <div style="font-size:13px;color:#8a8674;">${s.name} · ${escapeHtml(classNamesForStudent(stuId))}</div>
    </div>

    ${renderWeekPlanGrids(stuId,'이번 주 숙제')}

    <div class="card">
      <h3 style="margin-top:0;">개념동영상학습</h3>
      ${videoAssignFlat.length ? videoAssignFlat.map(v=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line);">
        <input type="checkbox" ${v.done?'checked':''} onchange="toggleVideoDoneByKey('${v.key}','${stuId}',${v.idx})">
        <a class="link" href="${v.url}" target="_blank">${v.title}</a><span style="color:#9c9880;font-size:11px;">(${fmtDate(v.date)})</span>
      </div>`).join('') : `<div class="empty">부여된 영상 과제가 없어요.</div>`}
    </div>

    ${renderStudentAnswerSheets(stuId)}

    <div style="margin-bottom:8px;font-size:14px;font-weight:800;color:var(--navy2);">📸 숙제인증</div>
    ${renderSubmissionCard(stuId, false, false)}

    <div style="margin-bottom:8px;font-size:14px;font-weight:800;color:var(--navy2);">💬 질문게시판</div>
    ${renderQnaStudentSection(stuId, false)}
  `;
}

function renderUnseenCommentBanner(stuId){
  const withComment = Object.entries(db.submissions)
    .filter(([k,v])=>k.startsWith(stuId+'_') && v.teacherComment && !v.commentSeen)
    .sort((a,b)=>b[0].localeCompare(a[0]));
  if(!withComment.length) return '';
  const [key, sub] = withComment[0];
  return `<div class="card" style="border:2px solid var(--gold);background:#fffbea;margin-bottom:14px;">
    <div style="font-size:13px;font-weight:700;color:var(--navy2);margin-bottom:6px;">✏️ 선생님이 숙제에 코멘트를 남기셨어요!</div>
    <div style="font-size:14px;line-height:1.6;">${sub.teacherComment}</div>
    <button class="btn sm gold" style="margin-top:10px;" onclick="markCommentSeen('${key}')">확인했어요</button>
  </div>`;
}
async function markCommentSeen(key){
  const ok = await fsUpdate('submissions', key, {commentSeen: true});
  if(ok && db.submissions[key]){ db.submissions[key].commentSeen = true; render(); }
}

/* MONTHLY_CORE_START */
/* MNM monthly report core v1
 * 월말 학습 리포트 초안 생성 로직. Firestore/DOM에 접근하지 않는 순수 함수 모음이다.
 * - 앱(index.html)과 Cloud Functions(functions/index.js)가 이 파일의 동일한 코드를 사용한다.
 *   index.html 안의 MONTHLY_CORE_START ~ MONTHLY_CORE_END 사이 내용은 이 파일과 항상 같아야 하며,
 *   `node scripts/check-monthly-core-sync.js` 로 확인한다.
 * - 기록에 실제로 있는 정보만 쓰고, 없으면 '기록 없음'으로 둔다. 내부 전용 메모(conceptMemo 등)는 입력으로 받지 않는다.
 */
var MR_VERSION = 1;
var MR_CUTOVER = '2026-09-07'; // 숙제 리스타트 기준일: 이전 날짜는 제출 집계에서 제외
var MR_NONE = '기록 없음';
var MR_DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

function mrPad(n) { return String(n).padStart(2, '0'); }
function mrMonthRange(ym) {
  var p = String(ym).split('-'), y = Number(p[0]), m = Number(p[1]);
  var ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
  var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return { start: y + '-' + mrPad(m) + '-01', endEx: ny + '-' + mrPad(nm) + '-01', end: y + '-' + mrPad(m) + '-' + mrPad(last) };
}
// 'YYYY-MM-DD' 날짜가 속한 달의 직전 달 'YYYY-MM'
function mrPrevMonthOf(dateISO) {
  var y = Number(dateISO.slice(0, 4)), m = Number(dateISO.slice(5, 7));
  m -= 1; if (m === 0) { m = 12; y -= 1; }
  return y + '-' + mrPad(m);
}
function mrAddDays(dateISO, n) {
  var d = new Date(dateISO + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.getUTCFullYear() + '-' + mrPad(d.getUTCMonth() + 1) + '-' + mrPad(d.getUTCDate());
}
function mrWeekStart(dateISO) {
  var dow = new Date(dateISO + 'T00:00:00Z').getUTCDay();
  return mrAddDays(dateISO, dow === 0 ? -6 : 1 - dow);
}
// 월에 걸친 모든 주의 월요일 목록 (weeklyPlans 문서 ID: 반ID_주시작일)
function mrWeekStartsOfMonth(ym) {
  var r = mrMonthRange(ym), out = [], w = mrWeekStart(r.start);
  while (w < r.endEx) { out.push(w); w = mrAddDays(w, 7); }
  return out;
}
function mrHash(str) {
  var h = 5381;
  for (var i = 0; i < str.length; i++) { h = ((h << 5) + h + str.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(16);
}
function mrMd(dateISO) { return Number(dateISO.slice(5, 7)) + '/' + Number(dateISO.slice(8, 10)); }
function mrHasText(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }

// 제출 문서 상태 분류: submitted(제출 완료·인정·레거시) / pending(과거 방식 검토대기) / rejected(불합격·재제출 필요)
function mrSubmissionKind(sub) {
  var st = String((sub && sub.status) || '').trim();
  if (st === '' || st === '확인' || st === 'approved' || st === '제출완료') return 'submitted';
  if (st === '불합격' || st === '최종불합격' || st === 'rejected') return 'rejected';
  return 'pending';
}

/* input:
 *  month 'YYYY-MM', today 'YYYY-MM-DD'
 *  student {id,name,grade}
 *  classes [{id,name}]            이 달에 기록이 있거나 현재 소속인 반
 *  records [{clsId,date,rec}]     classRecords[반_날짜][학생ID]
 *  plans   [{clsId,weekStart,plan}] weeklyPlans[반_주시작일] 문서 데이터
 *  submissions [{date,classId,sub}] 해당 학생의 이 달 제출 문서 (classId는 문서의 classId, 없으면 '')
 *  kmm [{date,score,range}]
 *  stepLabelOf(stepId, rec) → 표시용 STEP 이름 (없으면 스냅샷 사용)
 */
function mrBuildMonthlyReport(input) {
  var range = mrMonthRange(input.month);
  var today = input.today || range.end;
  var stepLabelOf = input.stepLabelOf || function (id, rec) { return (rec && rec.stepLabelSnapshot) || ''; };
  var classes = input.classes || [];
  var clsName = {}; classes.forEach(function (c) { clsName[c.id] = c.name; });
  var records = (input.records || []).filter(function (r) { return r.date >= range.start && r.date < range.endEx; })
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.clsId < b.clsId ? -1 : 1); });

  // 1) 출결
  var att = { lessons: records.length, present: 0, late: 0, absent: 0, other: 0, abnormal: [] };
  records.forEach(function (r) {
    var a = (r.rec && r.rec.attendance) || '';
    if (a === '출석') att.present++; else if (a === '지각') { att.late++; att.abnormal.push(mrMd(r.date) + ' 지각'); }
    else if (a === '결석') { att.absent++; att.abnormal.push(mrMd(r.date) + ' 결석'); } else att.other++;
  });

  // 2) 진도 + 수업 상세
  var progress = [];
  records.forEach(function (r) {
    var rec = r.rec || {};
    var step = rec.stepId ? (stepLabelOf(rec.stepId, rec) || rec.stepLabelSnapshot || '') : (rec.stepLabelSnapshot || '');
    var extras = (rec.extraSteps || []).map(function (id, i) { return stepLabelOf(id, rec) || (rec.extraStepLabelSnapshots || [])[i] || ''; }).filter(Boolean);
    var detail = mrHasText(rec.lessonDetail) ? String(rec.lessonDetail).replace(/\s*\n+\s*/g, ' ').trim() : '';
    if (!step && !extras.length && !detail) return;
    progress.push({ date: r.date, clsId: r.clsId, step: step, extras: extras, detail: detail });
  });

  // 3) 숙제 제출 이행: 주간계획에 숙제가 적힌 날(리스타트 기준일 이후, 오늘까지)을 기준으로 반별 집계
  var perClassHw = {};
  classes.forEach(function (c) { perClassHw[c.id] = { planned: 0, submitted: 0, pending: 0, rejected: 0, missing: 0, missingDates: [], hasPlan: false }; });
  var subsByDate = {};
  (input.submissions || []).forEach(function (s) { if (s.date >= range.start && s.date < range.endEx) { (subsByDate[s.date] = subsByDate[s.date] || []).push(s); } });
  (input.plans || []).forEach(function (pl) {
    var h = perClassHw[pl.clsId]; if (!h) return;
    var per = (pl.plan && pl.plan[input.student.id]) || {};
    h.hasPlan = true;
    for (var off = 0; off < 7; off++) {
      var date = mrAddDays(pl.weekStart, off);
      if (date < range.start || date >= range.endEx || date > today || date < MR_CUTOVER) continue;
      var cell = per[MR_DAY_KEYS[new Date(date + 'T00:00:00Z').getUTCDay()]];
      if (!mrHasText(cell)) continue;
      h.planned++;
      var cands = (subsByDate[date] || []).filter(function (s) { return !s.classId || s.classId === pl.clsId; });
      var best = cands.find(function (s) { return s.classId === pl.clsId; }) || cands[0];
      if (!best) { h.missing++; h.missingDates.push(date); continue; }
      var k = mrSubmissionKind(best.sub);
      if (k === 'submitted') h.submitted++; else if (k === 'pending') h.pending++; else h.rejected++;
    }
  });
  var hwTotals = { planned: 0, submitted: 0, pending: 0, rejected: 0, missing: 0 };
  Object.keys(perClassHw).forEach(function (id) { ['planned', 'submitted', 'pending', 'rejected', 'missing'].forEach(function (k) { hwTotals[k] += perClassHw[id][k]; }); });
  var hwHasPlan = Object.keys(perClassHw).some(function (id) { return perClassHw[id].hasPlan; });
  var submittedDays = {}; (input.submissions || []).forEach(function (s) { if (mrSubmissionKind(s.sub) === 'submitted') submittedDays[s.date] = true; });

  // 4) 숙제 완성도 (수업 중 기록한 값만, 미기록은 미평가)
  var comp = { '상': 0, '중': 0, '하': 0, unrated: 0, perClass: {} };
  classes.forEach(function (c) { comp.perClass[c.id] = { '상': 0, '중': 0, '하': 0, unrated: 0 }; });
  records.forEach(function (r) {
    var lv = r.rec && r.rec.homeworkCompletionLevel;
    var pc = comp.perClass[r.clsId] || (comp.perClass[r.clsId] = { '상': 0, '중': 0, '하': 0, unrated: 0 });
    if (lv === '상' || lv === '중' || lv === '하') { comp[lv]++; pc[lv]++; } else { comp.unrated++; pc.unrated++; }
  });

  // 5) 점수
  var tests = [];
  records.forEach(function (r) {
    var v = r.rec && r.rec.dailyTestScore;
    if (v !== undefined && v !== null && v !== '' && !isNaN(Number(v))) tests.push({ date: r.date, score: Number(v) });
  });
  var kmm = (input.kmm || []).filter(function (k) { return k.date >= range.start && k.date < range.endEx && k.score !== undefined && k.score !== '' && !isNaN(Number(k.score)); })
    .map(function (k) { return { date: k.date, score: Number(k.score), range: k.range || '' }; })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var avg = tests.length ? Math.round(tests.reduce(function (a, b) { return a + b.score; }, 0) / tests.length) : null;

  // 6) 특이사항
  var notes = [];
  records.forEach(function (r) { if (r.rec && mrHasText(r.rec.note)) notes.push({ date: r.date, clsId: r.clsId, note: String(r.rec.note).replace(/\s*\n+\s*/g, ' ').trim() }); });

  // 7) 다음 달 방향 초안 (기록 기반 문장만. 원장 검토 전제)
  var dir = [];
  if (progress.length) {
    var last = progress[progress.length - 1];
    var lastTxt = last.step || last.detail;
    if (lastTxt) dir.push('이번 달 마지막 진도(' + lastTxt + ')에 이어 다음 단계를 진행할 예정입니다.');
  }
  if (tests.length >= 2 && tests[tests.length - 1].score < tests[0].score - 5) dir.push('일일테스트 점수가 월초보다 내려가 있어 취약 단원 점검과 복습을 병행하겠습니다.');
  else if (avg !== null && avg < 70) dir.push('일일테스트 평균이 ' + avg + '점으로, 기본 개념 정리와 반복 확인에 비중을 두겠습니다.');
  if (comp['하'] >= 2 || (comp['하'] >= 1 && comp['하'] >= comp['상'] + comp['중'])) dir.push('숙제 완성도 ‘하’가 반복되어, 분량 조절과 풀이·오답 정리 습관 점검을 함께 하겠습니다.');
  if (att.absent >= 2) dir.push('결석이 있었던 부분은 보강 여부를 확인하겠습니다.');
  if (hwHasPlan && hwTotals.missing >= 2) dir.push('숙제 미제출이 있었던 날이 있어 제출 습관을 함께 점검하겠습니다.');

  var multi = classes.length > 1;
  var perClass = classes.map(function (c) {
    var recs = records.filter(function (r) { return r.clsId === c.id; });
    var lastP = progress.filter(function (p) { return p.clsId === c.id; }).pop();
    return {
      clsId: c.id, name: c.name, lessons: recs.length,
      present: recs.filter(function (r) { return r.rec && r.rec.attendance === '출석'; }).length,
      lastProgress: lastP ? (lastP.step || lastP.detail || '') : '',
      homework: perClassHw[c.id], completeness: comp.perClass[c.id]
    };
  });

  var data = {
    version: MR_VERSION, month: input.month, studentId: input.student.id,
    attendance: att, progress: progress, homework: { totals: hwTotals, hasPlan: hwHasPlan, perClass: perClassHw, submittedDays: Object.keys(submittedDays).length },
    completeness: { '상': comp['상'], '중': comp['중'], '하': comp['하'], unrated: comp.unrated },
    scores: { dailyTests: tests, average: avg, kmm: kmm }, notes: notes, nextDirection: dir,
    perClass: multi ? perClass : []
  };
  return { data: data, text: mrRenderText(input.student, data, clsName, multi), sig: mrHash(JSON.stringify(data)) };
}

function mrRenderText(student, d, clsName, multi) {
  var m = Number(d.month.slice(5, 7));
  var L = [];
  L.push('[M&m 수학훈련소] ' + student.name + ' 학생 ' + m + '월 학습 리포트');
  L.push('');
  L.push('1. 출결·수업 참여');
  if (!d.attendance.lessons) L.push('· ' + MR_NONE);
  else {
    L.push('· 수업 ' + d.attendance.lessons + '회 (출석 ' + d.attendance.present + ' · 지각 ' + d.attendance.late + ' · 결석 ' + d.attendance.absent + ')');
    if (d.attendance.abnormal.length) L.push('· 지각·결석: ' + d.attendance.abnormal.join(', '));
  }
  L.push('');
  L.push('2. 진도와 수업 내용');
  if (!d.progress.length) L.push('· ' + MR_NONE);
  d.progress.forEach(function (p) {
    var head = (multi && clsName[p.clsId] ? '[' + clsName[p.clsId] + '] ' : '') + (p.step || '');
    if (p.extras.length) head += (head ? ' + ' : '') + p.extras.join(', ');
    L.push('· ' + mrMd(p.date) + ' ' + head + (p.detail ? (head ? ' — ' : '') + p.detail : ''));
  });
  L.push('');
  L.push('3. 숙제 제출 이행');
  if (d.homework.hasPlan) {
    var t = d.homework.totals;
    if (!t.planned) L.push('· ' + MR_NONE);
    else {
      L.push('· 숙제가 있었던 ' + t.planned + '일 중 제출 완료 ' + t.submitted + '일' + (t.pending ? ' · 확인 대기 ' + t.pending + '일' : '') + (t.rejected ? ' · 재제출 필요 ' + t.rejected + '일' : '') + (t.missing ? ' · 미제출 ' + t.missing + '일' : ''));
    }
  } else if (d.homework.submittedDays) {
    L.push('· 제출 완료 ' + d.homework.submittedDays + '일 (주간 숙제 계획 기록 없음)');
  } else L.push('· ' + MR_NONE);
  L.push('');
  L.push('4. 숙제 완성도 (수업 시간 확인)');
  var c = d.completeness, ratedN = c['상'] + c['중'] + c['하'];
  if (!ratedN && !c.unrated) L.push('· ' + MR_NONE);
  else L.push('· 상 ' + c['상'] + ' · 중 ' + c['중'] + ' · 하 ' + c['하'] + ' · 미평가 ' + c.unrated);
  L.push('');
  L.push('5. 점수');
  if (!d.scores.dailyTests.length && !d.scores.kmm.length) L.push('· ' + MR_NONE);
  if (d.scores.dailyTests.length) {
    var ts = d.scores.dailyTests, f = ts[0], l = ts[ts.length - 1];
    L.push('· 일일테스트 ' + ts.length + '회 평균 ' + d.scores.average + '점' + (ts.length > 1 ? ' (' + mrMd(f.date) + ' ' + f.score + '점 → ' + mrMd(l.date) + ' ' + l.score + '점)' : ''));
  }
  d.scores.kmm.forEach(function (k) { L.push('· KMM ' + mrMd(k.date) + ' ' + k.score + '점' + (k.range ? ' (' + k.range + ')' : '') + ' ' + (k.score >= 80 ? 'PASS' : 'FAIL')); });
  L.push('');
  L.push('6. 특이사항');
  if (!d.notes.length) L.push('· ' + MR_NONE);
  d.notes.forEach(function (n) { L.push('· ' + mrMd(n.date) + (multi && clsName[n.clsId] ? ' [' + clsName[n.clsId] + ']' : '') + ' ' + n.note); });
  if (multi && d.perClass.length) {
    L.push('');
    L.push('[반별 요약]');
    d.perClass.forEach(function (p) {
      var hw = p.homework || {}, cp = p.completeness || {};
      L.push('· ' + p.name + ': 수업 ' + p.lessons + '회' + (p.lastProgress ? ' · 최근 진도 ' + p.lastProgress : '') +
        (hw.planned ? ' · 숙제 제출 ' + hw.submitted + '/' + hw.planned + '일' : '') +
        ' · 완성도 상 ' + (cp['상'] || 0) + ' 중 ' + (cp['중'] || 0) + ' 하 ' + (cp['하'] || 0) + ' 미평가 ' + (cp.unrated || 0));
    });
  }
  L.push('');
  L.push('7. 다음 달 학습 방향');
  if (!d.nextDirection.length) L.push('· ' + MR_NONE);
  d.nextDirection.forEach(function (x) { L.push('· ' + x); });
  return L.join('\n');
}

/* 재생성 시 문서 갱신 규칙 (앱·함수 공통).
 * existing: 기존 monthlyReports 문서 데이터 또는 null, built: mrBuildMonthlyReport 결과, nowISO: 생성 시각
 * 반환: { action: 'create'|'skip'|'update'|'newer', doc } — doc은 저장할 전체 문서(create/update) 또는 변경 필드(newer)
 * 원칙: 원장 수정본(edited)은 절대 덮어쓰지 않는다. 수정본이 있으면 새 초안은 versions에만 쌓고 hasNewerDraft로 알린다. */
function mrApplyGenerated(existing, built, nowISO, studentName) {
  var entry = { version: 1, generatedAt: nowISO, sig: built.sig, text: built.text };
  if (!existing) {
    return { action: 'create', doc: { month: built.data.month, studentId: built.data.studentId, studentName: studentName || '', status: 'draft',
      generated: { version: 1, generatedAt: nowISO, sig: built.sig, text: built.text, data: built.data }, versions: [entry], edited: null, hasNewerDraft: false, createdAt: nowISO } };
  }
  var cur = existing.generated || {};
  if (cur.sig === built.sig) return { action: 'skip', doc: {} };
  var versions = (existing.versions || []).slice();
  var nextVersion = (versions.length ? Math.max.apply(null, versions.map(function (v) { return v.version || 0; })) : (cur.version || 0)) + 1;
  entry.version = nextVersion;
  versions.push(entry);
  if (versions.length > 8) versions = versions.slice(versions.length - 8);
  if ((existing.edited && mrHasText(existing.edited.text)) || existing.status === 'reviewed' || existing.status === 'edited') {
    // 수정본 보존: generated는 최신 자동 초안으로 갱신하되 edited는 그대로 두고 알림만 켠다.
    return { action: 'newer', doc: { generated: { version: nextVersion, generatedAt: nowISO, sig: built.sig, text: built.text, data: built.data }, versions: versions, hasNewerDraft: true, updatedAt: nowISO } };
  }
  return { action: 'update', doc: { generated: { version: nextVersion, generatedAt: nowISO, sig: built.sig, text: built.text, data: built.data }, versions: versions, hasNewerDraft: false, status: 'draft', updatedAt: nowISO } };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { MR_VERSION: MR_VERSION, mrMonthRange: mrMonthRange, mrPrevMonthOf: mrPrevMonthOf, mrWeekStartsOfMonth: mrWeekStartsOfMonth, mrBuildMonthlyReport: mrBuildMonthlyReport, mrApplyGenerated: mrApplyGenerated, mrSubmissionKind: mrSubmissionKind, mrAddDays: mrAddDays };
}
/* MONTHLY_CORE_END */

/* MONTHLY_UI_START */
/* ---------------- 월말 리포트 초안 (v97) ----------------
   - 생성 로직은 위 MONTHLY_CORE(순수 함수)를 쓴다. 이 화면은 데이터 조회·저장·검토 UI만 담당한다.
   - 저장: monthlyReports/{YYYY-MM}_{학생ID}. 자동 초안(generated)과 원장 수정본(edited)을 따로 보관하고,
     수정본이 있으면 재생성이 덮어쓰지 않는다(새 초안은 versions에 쌓고 알림만 켠다).
   - 자동 발송 없음. 원장이 검토·수정한 뒤 복사해서 전달한다. */
function mrState(){ currentSubState.mr = currentSubState.mr || {month:mrPrevMonthOf(todayISO()), docs:null, loading:false, busy:'', open:'', text:'', showNew:false, msg:''}; return currentSubState.mr; }
function mrDocId(ym,stuId){ return ym+'_'+stuId; }
async function mrLoadDocs(ym){
  const st=mrState(); st.loading=true; st.docs=null; scheduleRender();
  try{
    const snap=await fsdb.collection('monthlyReports').where('month','==',ym).get();
    const m={}; snap.docs.forEach(d=>{ m[d.data().studentId]={id:d.id,...d.data()}; });
    st.docs=m;
  }catch(e){ console.error('[월말 리포트 조회]',e); st.docs={}; st.msg='월말 리포트 목록을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.'; }
  st.loading=false; scheduleRender();
}
function mrSetMonth(ym){ if(!/^\d{4}-\d{2}$/.test(ym)) return; const st=mrState(); st.month=ym; st.open=''; st.msg=''; mrLoadDocs(ym); }
// 선택한 달의 원자료를 한 번에 읽는다 (반별 수업기록 범위 조회 + 주간계획 문서 + 해당 월 제출 날짜 범위 조회)
async function mrFetchMonthData(ym){
  const r=mrMonthRange(ym), fp=firebase.firestore.FieldPath.documentId();
  const classes=db.classes||[], weeks=mrWeekStartsOfMonth(ym);
  const recs={}, plans=[];
  await Promise.all(classes.map(async c=>{
    const snap=await fsdb.collection('classRecords').where(fp,'>=',c.id+'_'+r.start).where(fp,'<',c.id+'_'+r.endEx).get();
    recs[c.id]=snap.docs.map(d=>({date:d.id.slice(-10),data:d.data()}));
    await Promise.all(weeks.map(async w=>{ const doc=await fsdb.collection('weeklyPlans').doc(c.id+'_'+w).get(); if(doc.exists) plans.push({clsId:c.id,weekStart:w,plan:doc.data()}); }));
  }));
  const ss=await fsdb.collection('submissions').where('date','>=',r.start).where('date','<',r.endEx).get();
  const subs=ss.docs.map(d=>({key:d.id,date:d.data().date||d.id.slice(-10),...d.data()}));
  return {recs,plans,subs};
}
function mrInputForStudent(s,ym,raw){
  const classIds=new Set(classesForStudent(s.id).map(c=>c.id));
  const records=[];
  Object.keys(raw.recs).forEach(cid=>raw.recs[cid].forEach(x=>{ if(x.data&&x.data[s.id]){ classIds.add(cid); records.push({clsId:cid,date:x.date,rec:x.data[s.id]}); } }));
  const classes=[...classIds].map(classById).filter(Boolean).map(c=>({id:c.id,name:c.name}));
  const submissions=raw.subs.filter(x=>{
    const sid=x.studentId||'';
    return sid===s.id || (!sid && x.key.startsWith(s.id+'_'));
  }).map(x=>({date:x.date,classId:x.classId||'',sub:x}));
  return {month:ym,today:todayISO(),student:{id:s.id,name:s.name,grade:s.grade},classes,records,
    plans:raw.plans.filter(p=>classIds.has(p.clsId)),submissions,
    kmm:(db.kmm||[]).filter(k=>k.studentId===s.id).map(k=>({date:k.date,score:k.score,range:k.range||''})),
    stepLabelOf:(id,rec)=>stepShortLabel(id)||stepLabel(id)||(rec&&rec.stepLabelSnapshot)||''};
}
// 한 학생 문서를 트랜잭션으로 생성/갱신 → 중복 실행돼도 문서는 월·학생당 1개, 같은 자료면 변경 없음
async function mrWriteOne(s,ym,raw){
  const built=mrBuildMonthlyReport(mrInputForStudent(s,ym,raw));
  const ref=fsdb.collection('monthlyReports').doc(mrDocId(ym,s.id));
  const nowISO=new Date().toISOString();
  return fsdb.runTransaction(async tx=>{
    const snap=await tx.get(ref);
    const res=mrApplyGenerated(snap.exists?snap.data():null,built,nowISO,s.name);
    if(res.action==='create') tx.set(ref,res.doc);
    else if(res.action==='update'||res.action==='newer') tx.update(ref,res.doc);
    return res.action;
  });
}
async function mrGenerate(onlyStuId){
  const st=mrState(); if(st.busy) return;
  const ym=st.month;
  if(ym>=todayISO().slice(0,7) && !confirm('아직 끝나지 않은 달이에요. 지금까지의 기록으로 초안을 만들까요?')) return;
  st.busy=onlyStuId?'one':'all'; st.msg=''; scheduleRender();
  try{
    const raw=await mrFetchMonthData(ym);
    const targets=(db.students||[]).filter(s=>s.status!=='withdrawn' && (!onlyStuId||s.id===onlyStuId));
    const count={create:0,update:0,newer:0,skip:0};
    for(const s of targets){ const a=await mrWriteOne(s,ym,raw); count[a]=(count[a]||0)+1; }
    st.msg=`완료 · 새로 ${count.create}명 · 갱신 ${count.update}명 · 수정본 보존+새 초안 알림 ${count.newer}명 · 변화 없음 ${count.skip}명`;
  }catch(e){ console.error('[월말 리포트 생성]',e); st.msg='월말 리포트를 만들지 못했어요. 기존 기록은 바뀌지 않았습니다. 다시 시도해주세요.'; }
  st.busy=''; await mrLoadDocs(ym);
}
function mrCurrentText(doc){ return (doc.edited&&doc.edited.text)||(doc.generated&&doc.generated.text)||''; }
function mrOpen(stuId){ const st=mrState(); st.open=stuId; st.showNew=false; const d=st.docs&&st.docs[stuId]; st.text=d?mrCurrentText(d):''; scheduleRender(); }
async function mrSaveEdit(stuId){
  const st=mrState(), d=st.docs&&st.docs[stuId]; if(!d) return;
  const text=(document.getElementById('mrText')||{}).value??st.text;
  const ok=await fsSet('monthlyReports',d.id,{edited:{text,editedAt:new Date().toISOString(),basedOnVersion:(d.generated&&d.generated.version)||1},status:'edited'});
  if(ok){ d.edited={text,editedAt:new Date().toISOString(),basedOnVersion:(d.generated&&d.generated.version)||1}; d.status='edited'; st.text=text; st.msg='수정본을 저장했어요.'; } else st.msg='저장하지 못했어요. 다시 시도해주세요.';
  scheduleRender();
}
async function mrMarkReviewed(stuId){
  const st=mrState(), d=st.docs&&st.docs[stuId]; if(!d) return;
  const next=d.status==='reviewed'?(d.edited?'edited':'draft'):'reviewed';
  const ok=await fsSet('monthlyReports',d.id,{status:next}); if(ok){ d.status=next; scheduleRender(); }
}
async function mrAdoptNewDraft(stuId){
  const st=mrState(), d=st.docs&&st.docs[stuId]; if(!d||!d.generated) return;
  if(!confirm('새 초안으로 바꿀까요? 지금 수정본은 버전 기록에 보관돼요.')) return;
  const versions=(d.versions||[]).slice();
  if(d.edited&&d.edited.text) versions.push({version:'edited-'+Date.now(),kind:'edited',generatedAt:d.edited.editedAt||'',text:d.edited.text});
  const patch={edited:null,versions:versions.slice(-8),hasNewerDraft:false,status:'draft'};
  const ok=await fsSet('monthlyReports',d.id,patch);
  if(ok){ Object.assign(d,patch); st.text=mrCurrentText(d); st.showNew=false; st.msg='새 초안을 적용했어요.'; scheduleRender(); }
}
async function mrKeepEdited(stuId){
  const st=mrState(), d=st.docs&&st.docs[stuId]; if(!d) return;
  const ok=await fsSet('monthlyReports',d.id,{hasNewerDraft:false}); if(ok){ d.hasNewerDraft=false; st.showNew=false; scheduleRender(); }
}
function mrCopy(btn){
  const ta=document.getElementById('mrText'); if(!ta||!ta.value) return;
  btn.setAttribute('data-text',encodeURIComponent(ta.value)); copyText(btn);
}
function mrStatusBadge(d){
  if(!d) return '<span class="badge gray">초안 없음</span>';
  if(d.hasNewerDraft) return '<span class="badge yellow">새 초안 있음</span>';
  if(d.status==='reviewed') return '<span class="badge green">확인 완료</span>';
  if(d.edited) return '<span class="badge" style="background:#e8eefc;color:#32508f;">수정본</span>';
  return '<span class="badge gray">초안</span>';
}
function renderMonthlyReports(){
  const st=mrState();
  if(st.docs===null && !st.loading) setTimeout(()=>mrLoadDocs(st.month),0);
  const students=(db.students||[]).filter(s=>s.status!=='withdrawn').sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  const open=st.open&&st.docs?st.docs[st.open]:null, openStu=st.open?studentById(st.open):null;
  const nextRun=(()=>{ const t=todayISO(); const y=Number(t.slice(0,4)), m=Number(t.slice(5,7)); const ny=m===12?y+1:y, nm=m===12?1:m+1; return `${ny}-${String(nm).padStart(2,'0')}-01 00:10`; })();
  return `
  <h1 class="page-title">월말 리포트 초안</h1>
  <p class="page-sub">수업·숙제·점수 기록을 모아 학생별 월말 리포트 초안을 만들어요. 자동 발송은 없고, 검토·수정 후 복사해서 전달합니다. 예약 자동 생성은 설정 시 매월 1일 00:10(한국시간)에 직전 달 초안이 만들어져요 (다음 예정: ${nextRun}).</p>
  <div class="card" style="padding:12px 16px;">
    <div class="row between" style="gap:10px;flex-wrap:wrap;">
      <div class="row" style="gap:8px;"><b>대상 월</b><input type="month" value="${escapeHtml(st.month)}" onchange="mrSetMonth(this.value)"></div>
      <div class="row" style="gap:6px;">
        <button class="btn sm gold" ${st.busy?'disabled':''} onclick="mrGenerate()">${st.busy==='all'?'만드는 중…':'이 달 초안 만들기 · 새 자료 반영'}</button>
      </div>
    </div>
    <div style="font-size:11px;color:#8a8674;margin-top:6px;">이미 수정한 리포트는 덮어쓰지 않고, 새 초안을 따로 보관한 뒤 알려드려요. 같은 자료로 다시 눌러도 변화 없이 넘어갑니다.</div>
    ${st.msg?`<div style="margin-top:8px;font-size:12px;color:var(--navy2);font-weight:700;">${escapeHtml(st.msg)}</div>`:''}
  </div>
  ${st.loading?'<div class="empty">불러오는 중…</div>':''}
  <div style="display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start;">
    <div class="card" style="padding:8px 10px;max-height:70vh;overflow:auto;">
      ${students.map(s=>{ const d=st.docs&&st.docs[s.id]; return `<div class="row between" style="padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;${st.open===s.id?'background:#f7f4ea;':''}" onclick="mrOpen('${s.id}')">
        <div><b>${escapeHtml(s.name)}</b> <span style="color:#9c9880;font-size:11px;">${escapeHtml(classNamesForStudent(s.id))}</span></div>${mrStatusBadge(d)}</div>`; }).join('') || '<div class="empty">학생이 없어요.</div>'}
    </div>
    <div class="card">
      ${!st.open?'<div class="empty">왼쪽에서 학생을 선택하세요.</div>':!open?`<div class="empty">${openStu?escapeHtml(openStu.name):''} 학생의 ${escapeHtml(st.month)} 초안이 아직 없어요.<br><button class="btn sm gold" style="margin-top:10px;" ${st.busy?'disabled':''} onclick="mrGenerate('${st.open}')">이 학생 초안 만들기</button></div>`:`
        <div class="row between" style="gap:8px;flex-wrap:wrap;"><h3 style="margin:0;">${escapeHtml(openStu?openStu.name:'')} · ${escapeHtml(st.month)} ${mrStatusBadge(open)}</h3>
          <div style="font-size:11px;color:#8a8674;">자동 초안 v${(open.generated&&open.generated.version)||1} · ${escapeHtml(((open.generated&&open.generated.generatedAt)||'').slice(0,16).replace('T',' '))}${open.edited?` · 수정 ${escapeHtml((open.edited.editedAt||'').slice(0,16).replace('T',' '))}`:''}</div></div>
        ${open.hasNewerDraft?`<div style="margin:10px 0;padding:10px 12px;border-radius:9px;background:#fff9e8;border:1px solid #ead89a;font-size:12px;">📌 새 기록이 반영된 새 초안이 있어요. <b>내 수정본은 그대로 보존</b>돼 있습니다.
          <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap;"><button class="btn sm outline" onclick="mrState().showNew=!mrState().showNew;scheduleRender();">${st.showNew?'새 초안 닫기':'새 초안 보기'}</button>
          <button class="btn sm gold" onclick="mrAdoptNewDraft('${st.open}')">새 초안으로 바꾸기 (수정본은 보관)</button>

        <textarea id="mrText" rows="22" style="width:100%;box-sizing:border-box;margin-top:10px;font-size:13px;line-height:1.7;" oninput="mrState().text=this.value">${escapeHtml(st.text||mrCurrentText(open))}</textarea>
        <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap;">

          <button class="btn sm outline" ${st.busy?'disabled':''} onclick="mrGenerate('${st.open}')">이 학생만 새 자료 반영</button>
        </div>
        <div style="font-size:11px;color:#8a8674;margin-top:8px;">내부 전용 메모(다음 시간 메모)는 포함되지 않아요. 기록이 없는 항목은 ‘기록 없음’으로 표시됩니다. ‘다음 달 학습 방향’은 기록으로 만든 초안이니 꼭 검토해주세요.</div>`}
    </div>
  </div>`;
