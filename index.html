  draft.checked = draft.checked || {};

  const coursesUsed = [...new Set(db.videos.filter(v=>(v.videoType||'개념')===draft.type).map(v=>v.courseId))];
  const bookOptions = draft.type==='유형' ? [...new Set(db.videos.filter(v=>v.videoType==='유형' && v.courseId===draft.courseId).map(v=>v.book).filter(Boolean))] : [];
  const unitOptions = draft.courseId ? [...new Set(db.videos.filter(v=>{
    if((v.videoType||'개념')!==draft.type) return false;
    if(v.courseId!==draft.courseId) return false;
    if(draft.type==='유형' && draft.book && v.book!==draft.book) return false;
    return true;
  }).map(v=>v.unit).filter(Boolean))] : [];

  const matches = db.videos.filter(v=>{
    if((v.videoType||'개념')!==draft.type) return false;
    if(draft.courseId && v.courseId!==draft.courseId) return false;
    if(draft.type==='유형' && draft.book && v.book!==draft.book) return false;
    if(draft.unit && v.unit!==draft.unit) return false;
    return true;
  }).sort((a,b)=>{
    const ua = (a.unit||'').localeCompare(b.unit||'');
    if(ua!==0) return ua;
    const oa = a.order ?? 999, ob = b.order ?? 999;

    return (a.title||'').localeCompare(b.title||'');

      ${history.length>1 ? `<details style="display:inline;"><summary style="display:inline;cursor:pointer;color:#8a8674;"> · 이전 기록 더보기(${history.length-1}개)</summary>
        <div style="max-height:100px;overflow-y:auto;margin-top:4px;">
          ${history.slice(0,-1).slice().reverse().map(v=>`<div style="font-size:10px;color:#6f6958;padding:2px 0;">${fmtDate(v.date)} · ${v.done?'✅':'⬜'} ${escapeHtml(v.title)}</div>`).join('')}
        </div>
      </details>` : ''}
    </div>` : `<div style="font-size:10.5px;color:#aaa;margin-bottom:5px;">이 학기로 부여된 영상이 아직 없어요.</div>`}
    <select style="width:100%;font-size:10.5px;margin-bottom:3px;" onchange="currentSubState._vidAssignDraft['${rowKey}']={type:this.value,courseId:'',book:'',unit:'',checked:{}};render();">
      <option value="개념" ${draft.type==='개념'?'selected':''}>개념 영상</option>
      <option value="유형" ${draft.type==='유형'?'selected':''}>유형 영상</option>
    </select>
    <select style="width:100%;font-size:10.5px;margin-bottom:3px;" onchange="currentSubState._vidAssignDraft['${rowKey}'].courseId=this.value;currentSubState._vidAssignDraft['${rowKey}'].book='';currentSubState._vidAssignDraft['${rowKey}'].unit='';currentSubState._vidAssignDraft['${rowKey}'].checked={};render();">
      <option value="">① 학년학기 선택</option>
      ${sortedCourses().filter(c=>coursesUsed.includes(c.id)).map(c=>`<option value="${c.id}" ${draft.courseId===c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>
    ${draft.type==='유형' ? `<select style="width:100%;font-size:10.5px;margin-bottom:3px;" onchange="currentSubState._vidAssignDraft['${rowKey}'].book=this.value;currentSubState._vidAssignDraft['${rowKey}'].unit='';currentSubState._vidAssignDraft['${rowKey}'].checked={};render();" ${!draft.courseId?'disabled':''}>
      <option value="">② 교재 선택</option>
      ${bookOptions.map(b=>`<option value="${b}" ${draft.book===b?'selected':''}>${b}</option>`).join('')}
    </select>` : ''}
    <select style="width:100%;font-size:10.5px;margin-bottom:3px;" onchange="currentSubState._vidAssignDraft['${rowKey}'].unit=this.value;currentSubState._vidAssignDraft['${rowKey}'].checked={};render();" ${!draft.courseId?'disabled':''}>
      <option value="">${draft.type==='유형'?'③':'②'} 단원 선택</option>
      ${unitOptions.map(u=>`<option value="${u}" ${draft.unit===u?'selected':''}>${u}</option>`).join('')}
    </select>
    ${matches.length ? `<div style="max-height:110px;overflow-y:auto;background:#fff;border-radius:6px;padding:4px 6px;margin-bottom:4px;">
      ${matches.map(v=>`<label style="display:block;font-size:10.5px;padding:2px 0;"><input type="checkbox" ${draft.checked[v.id]?'checked':''} onchange="currentSubState._vidAssignDraft['${rowKey}'].checked['${v.id}']=this.checked;render();"> ${escapeHtml(v.title)}</label>`).join('')}
    </div>
    <button class="btn sm gold" style="width:100%;" onclick="addVideoAssign('${clsId}','${date}','${stuId}')">선택한 영상 ${checkedCount?`${checkedCount}개 `:''}과제로 추가</button>` : `<div style="font-size:10.5px;color:#aaa;">조건에 맞는 영상이 없어요.</div>`}
  </div>`;

async function addVideoAssign(clsId,date,stuId){
  const rowKey = `${clsId}_${date}_${stuId}`;
  const draft = currentSubState._vidAssignDraft[rowKey];
  if(!draft) return;
  const ids = Object.keys(draft.checked||{}).filter(id=>draft.checked[id]);
  if(!ids.length){ alert('과제로 낼 영상을 먼저 선택해주세요.'); return; }
  const vids = ids.map(id=>db.videos.find(v=>v.id===id)).filter(Boolean);

async function applyBulkTrack(clsId, btn){
  const courseId = document.getElementById('bulkTrackCourseSel').value;
  const category = document.getElementById('bulkTrackCategorySel').value;
  const bundleIdx = document.getElementById('bulkTrackBundleSel').value;
  if(!courseId || !category || bundleIdx===''){ alert('학년학기·분류·묶음을 모두 선택해주세요.'); return; }
  const level = courseGradeLevel(courseId);
  const bundle = ((BOOK_PRESETS[level]||{})[category]||[])[Number(bundleIdx)];
  if(!bundle || !bundle.length){ alert('선택한 묶음을 찾을 수 없어요.'); return; }

  const students = (cls.studentIds||[]).map(studentById).filter(Boolean);
  const original = btn.textContent;
  btn.textContent = '등록 중...'; btn.disabled = true;
  let count = 0;
  for(const s of students){
    const rec = db.practiceProgress[s.id] || {tracks:[]};
    const existing = new Set((rec.tracks||[]).filter(t=>t.courseId===courseId).map(t=>t.book));
    const newTracks = bundle.filter(b=>!existing.has(b)).map(b=>({id:uid('trk'), book:b, courseId, completedUnits:[], done:false}));
    if(newTracks.length){
      const tracks = [...(rec.tracks||[]), ...newTracks];

    }

async function applyBulk(clsId,date){
  const cls=classById(clsId);

  const stepType=document.getElementById('bulkStepType').value;
  const step=document.getElementById('bulkStep').value;
  const hw=document.getElementById('bulkHwComp').value;
  const study=document.getElementById('bulkStudyComp').value;
  const key=clsId+'_'+date;
  const upd = {};
  (cls.studentIds||[]).forEach(stuId=>{

    if(stepType) patch.stepType=stepType;
    if(step){ patch.stepId=step; if(!stepType) patch.stepType='개념'; patch.stepLabelSnapshot=stepShortLabel(step)||stepLabel(step)||''; }
    if(hw) patch.homeworkCompletionLevel=hw;
    if(study) patch.studyCompletionLevel=study;
    if(Object.keys(patch).length) upd[stuId]=patch;
  });
  if(!Object.keys(upd).length){ alert('적용할 항목을 먼저 선택해주세요. (STEP은 학년학기를 고른 뒤 STEP까지 선택해야 해요. 개념/유형만 바꾸려면 그것만 골라도 돼요)'); return; }

  const before=db.classRecords[key]?JSON.parse(JSON.stringify(db.classRecords[key])):null;
  const merged={...(db.classRecords[key]||{})};
  Object.keys(upd).forEach(id=>{ merged[id]={...(merged[id]||{}),...upd[id]}; });
  db.classRecords[key]=merged;

  }
}

function weekendWeekStart(dateISO){
  const d=new Date((dateISO||todayISO())+'T00:00:00');
  const day=d.getDay();
  const delta=(day===0?-6:1-day);
  d.setDate(d.getDate()+delta);
  return toLocalISODate(d);
}
// 원장 확인 화면은 가장 최근에 끝난 주말(토·일)을 기본으로 연다.
// 월~금에는 직전 주의 토·일, 토·일에는 현재 주말을 가리킨다.
function weekendReviewWeekStart(dateISO){
  const d=new Date((dateISO||academicTodayISO())+'T00:00:00');
  const day=d.getDay();
  if(day>=1 && day<=5) d.setDate(d.getDate()-7);
  return weekendWeekStart(toLocalISODate(d));
}
let weekendAdminQueryWeek='', weekendAdminQueryUnsub=null, weekendAdminQueryVersion=0;
let weekendAdminLoadState={week:'',status:'idle'};
function clearWeekendAdminWeekListener(){
  weekendAdminQueryVersion++;
  if(weekendAdminQueryUnsub){ try{weekendAdminQueryUnsub();}catch(e){} }
  weekendAdminQueryUnsub=null;
  weekendAdminQueryWeek='';
}
function subscribeWeekendAdminWeek(wk){
  if(!session || session.mode!=='director' || !wk || weekendAdminQueryWeek===wk) return;
  clearWeekendAdminWeekListener();
  const version=weekendAdminQueryVersion;
  weekendAdminQueryWeek=wk;
  weekendAdminLoadState={week:wk,status:'loading'};
  db.weekendSubmissions={};
  weekendAdminQueryUnsub=fsdb.collection('weekendSubmissions').where('weekStart','==',wk).onSnapshot(snap=>{
    if(version!==weekendAdminQueryVersion) return;
    const m={}; snap.docs.forEach(d=>m[d.id]=d.data());
    db.weekendSubmissions=m;
    weekendAdminLoadState={week:wk,status:'ready'};
    scheduleRender();
  },e=>{
    if(version!==weekendAdminQueryVersion) return;
    weekendAdminLoadState={week:wk,status:'error'};
    roleListenerError('weekendSubmissions')(e);
    scheduleRender();
  });
}
function setWeekendAdminWeek(dateISO){
  const wk=weekendWeekStart(dateISO);
  currentSubState.weekendWeek=wk;
  subscribeWeekendAdminWeek(wk);
  render();
}

async function uploadWeekendPhoto(input,stuId,wk,slot){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  input.disabled=true;
  try{
    const key=weekendSubmissionKey(stuId,wk,slot);
    const existing = db.weekendSubmissions[key];
    let photos = existing ? (existing.photos || (existing.photo ? [existing.photo] : [])) : [];
    for(const file of files){
      const params = photos.length>=6 ? {maxW:340, quality:0.3} : photos.length>=3 ? {maxW:420, quality:0.35} : {maxW:480, quality:0.4};
      const photo = await storePhotoFile(file, params);
      photos.push(photo);
    }
    const sizeKB = firestorePayloadSizeKB(photos);
    if(embeddedPhotoLimitExceeded(photos, 850)){
      alert('사진 용량이 너무 커요. 사진 개수를 줄이거나 다시 찍어서 올려주세요.');
      input.disabled=false;
      return;
    }
    await fsSet('weekendSubmissions',key,{
      studentId:stuId, weekStart:wk, slot, photos, submittedAt:new Date().toISOString()
    });
  }catch(e){ alert('사진 인증을 저장하지 못했습니다. 다시 시도해주세요.'); }
  input.disabled=false;
}
async function removeWeekendPhoto(stuId, wk, slot, idx){
  const key = weekendSubmissionKey(stuId, wk, slot);
  const existing = db.weekendSubmissions[key];
  if(!existing) return;
  let photos = existing.photos || (existing.photo ? [existing.photo] : []);
  photos = photos.slice(0,idx).concat(photos.slice(idx+1));
  if(photos.length===0){
    await fsDelete('weekendSubmissions', key);
  }else{
    await fsSet('weekendSubmissions', key, {studentId:stuId, weekStart:wk, slot, photos, submittedAt:existing.submittedAt||new Date().toISOString()});
  }
}

/* ---------------- STAD (Save Time And Do) ---------------- */
// 2026-09-08: 원장님과 설계 후 신규 추가.
// - 매달 신청기간에만 신청 가능 → 원장이 입금확인 후 승인해야 그 달 참여 확정
// - 아침 6:20 줌 출석은 원장이 수동 체크 (자동판정 금지 원칙에 따라 시스템이 임의 판단하지 않음)
// - to-do list 작성은 오전 7시까지, 저녁 정산 제출은 그날 자정까지 (학생 쪽 버튼만 잠김, 원장 화면은 언제나 가능)
// - 엽전은 원장이 실물로 지급 → 앱은 월말 집계(아침출석+저녁정산승인 합계, 출석률)만 보여줌
const STAD_MONTH = ()=> academicTodayISO().slice(0,7);
const STAD_TODAY = ()=> todayISO(); // 정산 마감은 진짜 자정이라 심야보정(academicTodayISO) 없이 실제 날짜 그대로 씀
function stadAppKey(stuId, month){ return `${stuId}_${month}`; }
function stadDailyKey(stuId, date){ return `${stuId}_${date}`; }
// 20일~말일 신청기간에 신청하면 "다음 달" 참여로 등록되므로, 신청 저장 시엔 이 함수로 대상 달을 구한다.
function stadTargetMonth(dateISO){
  const d = new Date((dateISO||STAD_TODAY())+'T00:00:00');
  d.setMonth(d.getMonth()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function stadApplicationFor(stuId, month){ return db.stadApplications[stadAppKey(stuId, month||STAD_MONTH())] || null; }
function stadDailyFor(stuId, date){ return db.stadDaily[stadDailyKey(stuId, date||STAD_TODAY())] || null; }
// 매월 20일 ~ 말일이 기본 신청기간. 특정 달만 다르게 하고 싶을 때는
// stadSettings.applyMode==='manual' + applyOpen/applyClose로 예외 지정 가능.
function stadRecurringApplyWindow(dateISO){
  const d = new Date((dateISO||STAD_TODAY())+'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth();
  const mm = String(m+1).padStart(2,'0');
  const lastDay = new Date(y, m+1, 0).getDate(); // 그 달의 마지막 날짜(28~31)
  return { open: `${y}-${mm}-20`, close: `${y}-${mm}-${String(lastDay).padStart(2,'0')}` };
}
function stadCurrentApplyWindow(){
  const s = db.stadSettings||{};
  if(s.applyMode==='manual' && s.applyOpen && s.applyClose) return {open:s.applyOpen, close:s.applyClose};
  return stadRecurringApplyWindow(STAD_TODAY());
}
function isStadApplyOpen(){
  const {open, close} = stadCurrentApplyWindow();
  const today = STAD_TODAY();
  return today >= open && today <= close;
}
function isStadParticipant(stuId, month){
  const app = stadApplicationFor(stuId, month);
  return !!(app && app.status==='approved');
}
function stadTodoWindowOpen(){ return new Date().getHours() < 7; } // 오전 7시까지
function countWeekdaysBetween(startISO, endISO){
  let count=0;
  let d = new Date(startISO+'T00:00:00');
  const end = new Date(endISO+'T00:00:00');
  while(d<=end){ const wd=d.getDay(); if(wd!==0 && wd!==6) count++; d.setDate(d.getDate()+1); }
  return count;
}
function stadMonthStats(stuId, month){
  month = month || STAD_MONTH();
  const app = stadApplicationFor(stuId, month);
  const monthStart = month+'-01';
  const today = STAD_TODAY();
  const rangeEnd = today.slice(0,7)===month ? today : monthStart; // 지난달 조회는 통계 목적 밖(현재는 이번달만 사용)
  const approvedFrom = (app && app.approvedAt) ? app.approvedAt.slice(0,10) : monthStart;
  const effectiveStart = approvedFrom > monthStart ? approvedFrom : monthStart;
  const possibleDays = rangeEnd>=effectiveStart ? countWeekdaysBetween(effectiveStart, rangeEnd) : 0;
  let morning=0, evening=0;
  Object.keys(db.stadDaily).forEach(k=>{
    if(!k.startsWith(stuId+'_')) return;
    const d = db.stadDaily[k];
    if(!d || !d.date || !d.date.startsWith(month)) return;
    if(d.attended) morning++;
    // 저녁 정산은 학생이 제출한 순간 바로 인정한다. 원장 승인 단계는 사용하지 않는다.
    if(d.settlementSubmittedAt || d.settlementText) evening++;
  });
  const rate = possibleDays>0 ? Math.round(morning/possibleDays*100) : 0;
  return { morning, evening, total: morning+evening, possibleDays, rate };
}

function stadItemsFromDaily(daily){
  if(Array.isArray(daily?.todoItems) && daily.todoItems.length){
    return daily.todoItems.map((x,i)=>({
      id:String(x.id||`todo_${i+1}`), task:String(x.task||'').trim(),
      expectedMinutes:Number(x.expectedMinutes||0)||0,
      completed:!!x.completed,
      actualMinutes:Number(x.actualMinutes||0)||0
    })).filter(x=>x.task);
  }
  // 예전 STAD 텍스트 기록도 버리지 않고 줄 단위로 읽어준다.
  const legacy=String(daily?.todoText||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  return legacy.map((task,i)=>({id:`legacy_${i+1}`,task,expectedMinutes:0,completed:false,actualMinutes:0}));
}

async function submitStadTodo(stuId){
  if(!stadTodoWindowOpen()){ alert('오전 7시가 지나 오늘 계획을 수정할 수 없어요.'); return; }
  if(!isStadParticipant(stuId)){ alert('이번 달 STAD 참여자가 아니에요.'); return; }
  const items=collectStadTodoItems();
  if(!items.length){ alert('오늘 할 일을 한 가지 이상 적어주세요.'); return; }
  if(items.some(x=>!x.expectedMinutes)){ alert('각 할 일의 예상 소요시간을 분 단위로 적어주세요.'); return; }
  const date=STAD_TODAY(), key=stadDailyKey(stuId,date), existing=db.stadDaily[key]||{};
  const previous=stadItemsFromDaily(existing);
  const prevMap=new Map(previous.map(x=>[x.task,x]));
  const merged=items.map(x=>{
    const old=prevMap.get(x.task);
    return old?{...x,completed:!!old.completed,actualMinutes:Number(old.actualMinutes||0)||0}:x;
  });
  const ok=await fsSet('stadDaily',key,{...existing,studentId:stuId,date,todoItems:merged,todoSubmittedAt:new Date().toISOString()});
  if(ok) render();
}

  const date=STAD_TODAY(), key=stadDailyKey(stuId,date), existing=db.stadDaily[key];
  const base=stadItemsFromDaily(existing||{});
  if(!existing || !base.length){ alert('먼저 오전에 오늘의 계획을 작성해야 정산할 수 있어요.'); return; }
  const rows=[...document.querySelectorAll('[data-stad-settle-row]')];

    actualMinutes:Number(row.querySelector('.stadActual')?.value||0)||0
  }));
  if(settled.some(x=>x.completed && !x.actualMinutes)){ alert('완료한 일은 실제 소요시간도 적어주세요.'); return; }
  const carryOvers=[];
  for(const item of settled.filter(x=>!x.completed)){
    const row=document.querySelector(`[data-stad-carry-id="${item.id}"]`);
    const selected=!!row?.querySelector('.stadCarryCheck')?.checked;
    const when=(row?.querySelector('.stadCarryWhen')?.value||'').trim();
    if(selected && !when){ alert(`“${item.task}”을 언제 할지 적어주세요.`); return; }
    if(selected) carryOvers.push({itemId:item.id,task:item.task,when});
  }
  const ratings={
    completion:Number(document.getElementById('stadRating_completion')?.value||0),
    focus:Number(document.getElementById('stadRating_focus')?.value||0),
    timeManagement:Number(document.getElementById('stadRating_timeManagement')?.value||0)
  };
  if(Object.values(ratings).some(v=>v<1)){ alert('완성도·집중력·시간관리 별점을 모두 매겨주세요.'); return; }
  const reflection=(document.getElementById('stadReflection')?.value||'').trim();
  const pledge=(document.getElementById('stadPledge')?.value||'').trim();
  if(!reflection || !pledge){ alert('한 줄 반성과 한 줄 다짐을 모두 적어주세요.'); return; }
  const ok=await fsSet('stadDaily',key,{...existing,todoItems:settled,carryOvers,ratings,reflection,pledge,settlementSubmittedAt:new Date().toISOString()});
  if(ok) render();
}
async function toggleStadAttendance(stuId, date){

async function addStep(courseId){

async function deleteStep(courseId,stepId){

async function fixVideoUnitNumbers(){
  const toFix = [];
  db.videos.forEach(v=>{
    if(!v.courseId || !v.unit) return;
    const units = courseUnitsList(v.courseId);
    if(units.includes(v.unit)) return; // 이미 정확히 일치
    const match = units.find(u => u.replace(/^\d+\.\s*/, '').trim() === v.unit.trim());
    if(match) toFix.push({video:v, newUnit:match});
  });
  if(!toFix.length){
    alert('고칠 게 없어요. 이미 정상이거나, 일치하는 단원을 찾지 못했어요 (커리큘럼에 등록 안 된 단원명일 수 있어요).');
    return;
  }
  openConfirm('단원명을 일괄 수정할까요?', `${toFix.length}개 영상의 단원명에 번호를 붙여드릴게요. 예: "${toFix[0].video.unit}" → "${toFix[0].newUnit}"`, async ()=>{
    for(const {video, newUnit} of toFix){
      await fsUpdate('videos', video.id, {unit: newUnit});
    }
    alert(`${toFix.length}개 영상의 단원명을 고쳤어요.`);
  });
}

function solutionPhotoSearch(list, {courseId, unit, text}){
  let out = courseId ? list.filter(p=>p.courseId===courseId) : list;
  if(unit) out = out.filter(p=>p.unit===unit);
  const q = (text||'').trim().toLowerCase();
  if(q) out = out.filter(p=> [p.book,p.page,p.problemNo].filter(Boolean).join(' ').toLowerCase().includes(q));
  return out.sort((a,b)=>(b.uploadedAt||'').localeCompare(a.uploadedAt||''));
}

  </div>

function solutionLibraryProblemRepoSummary(){
  const rows=Array.isArray(db.solutionPhotos)?db.solutionPhotos:[];
  const complete=rows.filter(p=>p?.courseId&&p?.book&&p?.page&&p?.problemNo);
  const linked=complete.filter(p=>p.problemId||p.problemDraftId);
  const missing=rows.length-complete.length;
  const eligible=complete.length-linked.length;
  return {total:rows.length,complete:complete.length,linked:linked.length,missing,eligible};
}
function renderSolutionLibraryProblemRepoBackfill(){
  const s=solutionLibraryProblemRepoSummary(), run=currentSubState._solProblemRepoSync;
  const busy=!!run?.active;
  return `<div class="card" style="border:1px solid #e8d7ad;background:#fffdf7;">
    <b>문제저장소 연결</b>
    <div style="font-size:12px;line-height:1.6;margin:5px 0 9px;">기존 해설 보관 자료 중 출처 정보가 완성된 ${s.eligible}개를 문제저장소에 연결할 수 있어요. 연결된 자료 ${s.linked}개, 출처 정보가 부족해 건너뛰는 자료 ${s.missing}개입니다. 원본 자료는 삭제되거나 덮어써지지 않습니다.</div>
    ${run?.message?`<div id="solutionLibProblemRepoStatus" style="font-size:12px;color:${run.failed?'#a33':'#6f6958'};margin-bottom:8px;">${escapeHtml(run.message)}</div>`:''}
    <button class="btn gold sm" ${busy||!s.eligible?'disabled':''} onclick="syncExistingSolutionPhotosToProblemRepo()">${busy?`연결 중 ${run.done}/${run.total}`:`기존 자료 ${s.eligible}개 연결`}</button>
  </div>`;
}
async function syncExistingSolutionPhotosToProblemRepo(){
  const s=solutionLibraryProblemRepoSummary();
  if(!s.eligible||currentSubState._solProblemRepoSync?.active) return;
  const rows=(db.solutionPhotos||[]).filter(p=>p?.courseId&&p?.book&&p?.page&&p?.problemNo&&!p.problemId&&!p.problemDraftId);
  if(!confirm(`출처가 완성된 기존 자료 ${rows.length}개를 문제저장소에 연결할까요?\n\n같은 교재·페이지·문제번호는 하나의 후보로 묶이며, 원본 자료는 그대로 유지됩니다. 출처 정보가 부족한 자료는 건너뜁니다.`)) return;
  const run=currentSubState._solProblemRepoSync={active:true,total:rows.length,done:0,linked:0,failed:0,message:'연결을 시작했어요.'};
  render();
  for(const row of rows){
    try{
      const result=await syncSolutionPhotoToProblemRepo(row.id,row);
      if(result?.status==='error'||result?.status==='ignored') run.failed++;
      else if(result?.problemId||result?.problemDraftId||['candidate','linked','saved'].includes(result?.status)){
        run.linked++;
        if(result.problemId) row.problemId=result.problemId;
        if(result.problemDraftId) row.problemDraftId=result.problemDraftId;
        if(result.status==='saved'&&result.id) row.problemId=result.id;
      }
      else run.failed++;
    }catch(e){ console.error('[기존 학습보관 자료 연결]',e); run.failed++; }
    run.done++;
    run.message=`기존 자료 처리 중 ${run.done}/${run.total} · 연결 ${run.linked} · 실패 ${run.failed}`;
    const status=document.getElementById('solutionLibProblemRepoStatus');
    if(status) status.textContent=run.message;
  }
  run.active=false;
  run.message=`연결 완료 · ${run.linked}개 연결, ${run.failed}개 실패 또는 확인 필요`;
  run.failed=run.failed>0;
  problemStore.ingest.loaded=false;
  render();

function autoSolutionMatchesForQuestion(q){
  if(!q || q.sourceType!=='TEXTBOOK') return [];
  const qKey=q.sourceKey||textbookSourceKey(q.sourceCourseId,q.sourceBook,q.sourcePage,q.sourceProblemNo);
  if(!qKey) return [];
  return (db.solutionPhotos||[]).filter(p=>{
    const pKey=p.sourceKey||textbookSourceKey(p.courseId,p.book,p.page,p.problemNo);

async function commitDeleteOpsInChunks(ops, chunkSize=400){
  for(let i=0;i<ops.length;i+=chunkSize){
    const batch=fsdb.batch();
    ops.slice(i,i+chunkSize).forEach(op=>{
      if(op.type==='delete') batch.delete(op.ref);
      else if(op.type==='set') batch.set(op.ref,op.data,{merge:true});
      else if(op.type==='update') batch.update(op.ref,op.data);
    });
    await batch.commit();
  }
}
async function collectStudentDeletionOps(stuId){
  const ops=[];
  // 학생 본체 + 단일 학생 문서
  ops.push({type:'delete',ref:fsdb.collection('students').doc(stuId)});
  ops.push({type:'delete',ref:fsdb.collection('practiceProgress').doc(stuId)});

  // 반 명단에서는 학생 ID만 제거한다.
  const classSnap=await fsdb.collection('classes').get();
  classSnap.docs.forEach(d=>{
    const data=d.data(), ids=data.studentIds||[];
    if(ids.includes(stuId)) ops.push({type:'set',ref:d.ref,data:{studentIds:ids.filter(id=>id!==stuId)}});
  });

  // 학생 ID가 문서 내부 key인 누적 기록은 lazy cache를 믿지 않고 원본을 직접 확인한다.
  for(const col of ['classRecords','weeklyPlans','fridaySupp']){
    const snap=await fsdb.collection(col).get();
    snap.docs.forEach(d=>{ if(Object.prototype.hasOwnProperty.call(d.data()||{},stuId)) ops.push({type:'set',ref:d.ref,data:{[stuId]:firebase.firestore.FieldValue.delete()}}); });
  }

  // document id가 학생ID_날짜 형식인 컬렉션.
  for(const col of ['submissions','timerState','stadApplications','stadDaily']){
    const snap=await idRangeQuery(col,stuId+'_').get();
    snap.docs.forEach(d=>ops.push({type:'delete',ref:d.ref}));
  }

  // studentId 필드로 찾을 수 있는 컬렉션.
  for(const col of ['questions','kmm','feedbacks','schoolScores','weekendSubmissions','focusHistory','answerSubmissions']){
    const snap=await fsdb.collection(col).where('studentId','==',stuId).get();
    snap.docs.forEach(d=>ops.push({type:'delete',ref:d.ref}));
  }

  // 배정지는 다른 학생과 공유될 수 있으므로 문서를 지우지 않고 명단에서만 제거한다.
  const asg=await fsdb.collection('assignments').where('studentIds','array-contains',stuId).get();
  asg.docs.forEach(d=>{
    const data=d.data(), ids=(data.studentIds||[]).filter(id=>id!==stuId);
    ops.push({type:'set',ref:d.ref,data:{studentIds:ids}});
  });
  return ops;
}
function deleteStudentPermanently(stuId){

  openConfirm('이 학생을 완전히 삭제할까요?',

  );
}

function promptReissueAll(){

    db.students.forEach(s=>{ (byGrade[s.grade] = byGrade[s.grade]||[]).push(s); });

  });
}

async function loadStudentHistoryDate(stuId,date){
  if(!stuId||!/^\d{4}-\d{2}-\d{2}$/.test(date||'')) return;
  const stu=studentById(stuId), cls=classForStudent(stuId)||(stu?.classId?classById(stu.classId):null);
  currentSubState.studentHistoryLoading=true; currentSubState.studentHistoryLoadError=false; render();
  try{
    const tasks=[];
    if(cls){
      const classKey=cls.id+'_'+date;
      tasks.push(fsdb.collection('classRecords').doc(classKey).get().then(doc=>{if(doc.exists)db.classRecords[classKey]=doc.data();}));
      const focusId=focusKey(cls.id,date,stuId);
      tasks.push(fsdb.collection('focusHistory').doc(focusId).get().then(doc=>{if(doc.exists)db.focusHistory[focusId]=doc.data();}));
    }
    const subKey=stuId+'_'+date;
    tasks.push(fsdb.collection('submissions').doc(subKey).get().then(doc=>{if(doc.exists)db.submissions[subKey]=doc.data();}));
    tasks.push(fsdb.collection('stadDaily').doc(subKey).get().then(doc=>{if(doc.exists)db.stadDaily[subKey]=doc.data();}));
    tasks.push(fsdb.collection('kmm').doc(subKey).get().then(doc=>{
      if(doc.exists){
        const row={id:doc.id,...doc.data()};
        db.kmm=[...db.kmm.filter(x=>x.id!==row.id),row];
      }
    }));
    await Promise.all(tasks);
    currentSubState.studentHistoryDate=date;
  }catch(e){
    console.error('[과거 학생기록 조회]',e);
    currentSubState.studentHistoryLoadError=true;
  }finally{
    currentSubState.studentHistoryLoading=false; render();
  }
}
async function loadHomeworkReviewDate(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')){ alert('날짜를 선택해주세요.'); return; }
  currentSubState.hwHistoryLoading=true; currentSubState.hwHistoryDate=date; render();
  const gen=homeworkLoadGen;
  try{
    // (1) date 필드가 있는 문서 + (2) date 필드가 없는 기존 문서(문서ID=학생ID_날짜)를 모두 조회한다.
    const found={};
    const byField=await fsdb.collection('submissions').where('date','==',date).get({source:'server'});
    byField.docs.forEach(d=>{found[d.id]=d.data();});
    const ids=(db.students||[]).filter(x=>x && x.id).map(x=>x.id+'_'+date);
    const fp=firebase.firestore.FieldPath.documentId();
    for(let i=0;i<ids.length;i+=10){
      const snap=await fsdb.collection('submissions').where(fp,'in',ids.slice(i,i+10)).get({source:'server'});
      snap.docs.forEach(d=>{found[d.id]=d.data();});
    }
    if(gen!==homeworkLoadGen) return;
    Object.assign(db.submissions,found);
    homeworkKnownDates.add(date);
  }catch(e){
    console.error('[과거 숙제 조회]',e);
    alert('해당 날짜 숙제 기록을 불러오지 못했어요.');
  }finally{
    currentSubState.hwHistoryLoading=false; render();
  }
}

function renderDonut(agg){
  const colors = {'개념부족':'#D65A4A','계산실수':'#E0A82E','문제해석':'#3EA55A','유형미숙':'#4a7fd6','성실부족':'#8a5fc9'};
  const total = Object.values(agg).reduce((a,b)=>a+b,0);
  if(!total) return `<div class="empty" style="padding:20px;">아직 데이터가 없어요.</div>`;
  let cum=0; const R=48, C=2*Math.PI*R;
  const circles = Object.entries(agg).map(([type,val])=>{
    const frac = val/total; const dash = frac*C;
    const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${colors[type]||'#999'}" stroke-width="16" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-cum}" />`;
    cum += dash; return el;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);">${circles}</svg>
    <div class="legend">${Object.entries(agg).map(([type,val])=>`<div><span class="sw" style="background:${colors[type]||'#999'};"></span>${type} ${Math.round(val/total*100)}%</div>`).join('')}</div>
  </div>`;
}

async function applyHomeworkReviewPatch(stuId,date,patch,btn){
  const key=stuId+'_'+date;
  const before=db.submissions[key];
  if(!before) return false;

  // 기존 문서에 studentId/date 필드가 없으면 판정 저장 때 함께 기록한다(문서 ID에서 유도한 값).
  // → 이후 원장 화면의 최근 숙제 실시간 조회에서 누락되지 않는다. 기존 사진·필드는 건드리지 않는다.
  patch={...patch};
  if(!before.studentId) patch.studentId=stuId;
  if(!before.date) patch.date=date;
  // 운영 화면은 서버 왕복을 기다리지 않는다.
  // 먼저 로컬 상태를 반영하고, 저장 실패시에만 원상복구한다.
  db.submissions[key]={...before,...patch};
  render();

  const ok=await fsUpdate('submissions',key,patch);
  if(ok) return true;

  db.submissions[key]=before;
  render();
  alert('숙제 판정을 저장하지 못해 이전 상태로 되돌렸어요. 다시 시도해주세요.');
  return false;
}
/* ---- 선생님이 학생별·날짜별 숙제 확인 상태를 직접 바꾸기(인증 ↔ 미인증) ----
   - 저장 위치: 기존과 같은 submissions/<학생(또는 반 슬롯)ID>_<날짜> 문서 1건만 쓴다(다른 학생·날짜·반 문서는 건드리지 않음).
   - 기기로 낸 제출이 없으면 새 문서를 만들며 verifyMethod:'teacher-direct' 로 '선생님이 직접 확인'임을 표시한다(사진·제출시각 없음).
   - 학생이 낸 제출이 있으면 사진·시각 등은 그대로 두고 status 만 바꾼다(인증→'확인', 해제→'미인증'=×). */
const hwVerifyUi={};   // '학생|반|날짜' -> {state:'saving'|'saved'|'error', msg}
function hwVerifyUiKey(stuId,clsId,date){ return stuId+'|'+clsId+'|'+date; }
function homeworkSubmittedByStudent(sub){
  return !!sub && (!!sub.submittedAt || (sub.hwPhotos||[]).length>0 || (sub.practicePhotos||[]).length>0 || (sub.timerPhotos||[]).length>0);
}
function homeworkIsTeacherDirect(sub){
  return !!sub && sub.verifyMethod==='teacher-direct' && !homeworkSubmittedByStudent(sub);
}
// 이 학생·반·날짜의 숙제 문서 ID. 다른 반의 기록과 겹쳐 안전하게 정할 수 없으면 ''.
function homeworkVerifyDocKey(stuId,clsId,date){
  const slot=hwSlotId(stuId,clsId), base=db.submissions[stuId+'_'+date];
  if(slot!==stuId){
    if(db.submissions[slot+'_'+date]) return slot+'_'+date;
    if(base && !base.classId) return stuId+'_'+date;
    return slot+'_'+date;
  }
  if(base && base.classId && base.classId!==clsId) return '';
  return stuId+'_'+date;
}
// wantVerified=true → 인증, false → 미인증. 바꿀 것이 없으면 null.
function homeworkVerifyPatch(existing,wantVerified,stuId,clsId,date){
  const iso=new Date().toISOString();
  if(!existing){
    if(!wantVerified) return null;
    return {studentId:baseStudentId(stuId),classId:clsId||'',date,status:'확인',reviewCount:0,reviewReason:'',reviewedAt:iso,verifyMethod:'teacher-direct',verifiedAt:iso};
  }
  const p={};
  if(!existing.studentId) p.studentId=baseStudentId(stuId);
  if(!existing.date) p.date=date;
  if(wantVerified){
    Object.assign(p,{status:'확인',reviewReason:'',reviewedAt:iso});
    if(!homeworkSubmittedByStudent(existing)){ p.verifyMethod='teacher-direct'; p.verifiedAt=iso; }
  }else{
    // 기기로 제출한 기록이어도 선생님 확인 상태만 '미인증'(×)으로 바꾼다. 사진·제출시각 등 제출 기록은 patch 에 넣지 않으므로 그대로 남는다.
    // (학생이 다시 제출하면 기존 흐름대로 '제출완료'가 되어 다시 인정된다.)
    Object.assign(p,{status:'미인증',reviewReason:'',reviewedAt:iso});
  }
  return p;
}
function hwVerifyUiSet(k,v,clearMs){
  if(v) hwVerifyUi[k]=v; else delete hwVerifyUi[k];
  render();
  if(v && clearMs) setTimeout(()=>{ if(hwVerifyUi[k]===v){ delete hwVerifyUi[k]; render(); } },clearMs);
}
async function toggleHomeworkVerify(clsId,stuId,date){
  if(!session || session.mode!=='director') return;   // 학생에게는 수정 권한이 없다
  const uk=hwVerifyUiKey(stuId,clsId,date);
  if(hwVerifyUi[uk] && hwVerifyUi[uk].state==='saving') return;
  const fail=(msg)=>hwVerifyUiSet(uk,{state:'error',msg},6000);
  if(isLegacyHomeworkDate(date)) return fail('9/6까지의 과거 숙제는 조회만 가능해요');
  if(date>todayISO()) return fail('아직 오지 않은 날짜예요');
  const key=homeworkVerifyDocKey(stuId,clsId,date);
  if(!key) return fail('다른 반 기록과 겹쳐 여기서 바꿀 수 없어요');
  const existing=db.submissions[key];
  if(submissionIsFinalRejected(existing)) return fail('3회 검사가 끝난 최종 불합격 기록이에요');
  const wantVerified=!homeworkCountsAsCompleted(subForClass(stuId,clsId,date),date);
  const patch=homeworkVerifyPatch(existing,wantVerified,stuId,clsId,date);
  if(!patch) return;
  hwVerifyUiSet(uk,{state:'saving',msg:'저장 중…'});
  let ok=false;
  try{ await fsdb.collection('submissions').doc(key).set(patch,{merge:true}); ok=true; }
  catch(e){ console.error('[숙제 확인 상태 저장 실패]',{key,code:e&&e.code||'',message:e&&e.message||''}); }
  if(ok){
    db.submissions[key]={...(existing||{}),...patch};   // 저장에 성공한 뒤에만 화면 데이터를 바꾼다
    hwVerifyUiSet(uk,{state:'saved',msg:wantVerified?'인증 저장됨':'미인증 저장됨'},2500);
  }else{
    hwVerifyUiSet(uk,{state:'error',msg:'저장 실패 · 다시 눌러주세요'},6000);
  }
}
async function confirmSubmission(stuId,date,btn){
  if(isLegacyHomeworkDate(date)){ alert('9/6까지의 과거 숙제는 조회만 가능합니다 (시스템 장애로 인한 리스타트).'); return; }
  const sub = db.submissions[stuId+'_'+date];
  if(!sub){ alert('제출된 숙제가 없습니다.'); return; }
  if(submissionIsFinalRejected(sub)){ alert('3회 검사가 끝난 최종 불합격 숙제입니다.'); return; }
  const nextCount = Math.min(HOMEWORK_MAX_REVIEWS, homeworkReviewCount(sub)+1);
  await applyHomeworkReviewPatch(stuId,date,{
    status:'확인',
    reviewCount:nextCount,
    reviewReason:'',
    reviewedAt:new Date().toISOString()
  },btn);
}
function rejectSubmission(stuId,date){
  if(isLegacyHomeworkDate(date)){ alert('9/6까지의 과거 숙제는 조회만 가능합니다 (시스템 장애로 인한 리스타트).'); return; }
  const s=studentById(stuId);
  const name=s?s.name:'학생';
  const sub=db.submissions[stuId+'_'+date];
  if(!sub){ alert('제출된 숙제가 없습니다.'); return; }
  if(submissionIsFinalRejected(sub)){
    alert('이미 3회 검사가 끝난 최종 불합격 숙제입니다.');
    return;
  }

  const nextCount=Math.min(HOMEWORK_MAX_REVIEWS, homeworkReviewCount(sub)+1);
  const finalReject=nextCount>=HOMEWORK_MAX_REVIEWS;
  const reason=prompt(`${name} 숙제를 ${nextCount}차 검사 불합격 처리합니다.\n사유를 짧게 적어주세요.`, '숙제 내용 미완료');
  if(reason===null) return;
  const trimmed=String(reason||'').trim();

  openConfirm(
    finalReject ? '3차 검사입니다. 최종 불합격 처리할까요?' : `${nextCount}차 검사 불합격 처리할까요?`,
    finalReject
      ? '최종 불합격 후에는 추가 제출할 수 없고 해당 숙제는 미이행으로 처리됩니다.'
      : `불합격 처리 후 숙제 검사 기회가 ${HOMEWORK_MAX_REVIEWS-nextCount}회 남습니다.`,
    async ()=>{
      await applyHomeworkReviewPatch(stuId,date,{
        status:finalReject ? '최종불합격' : '불합격',
        reviewCount:nextCount,
        reviewReason:trimmed,
        reviewedAt:new Date().toISOString()
      });
    }
  );
}

function homeworkFileFingerprint(file){
  return [file?.name||'',Number(file?.size||0),Number(file?.lastModified||0),file?.type||''].join('|');

function homeworkPhotoIdentity(photo){
  if(!photo) return '';
  if(typeof photo==='string') return 'data:'+photo;
  return photo.clientFingerprint ? 'file:'+photo.clientFingerprint : (photoStorageKey(photo)?'key:'+photoStorageKey(photo):'');

function dedupeHomeworkPhotos(list){
  const seen=new Set(), out=[];
  for(const p of (list||[])){
    const k=homeworkPhotoIdentity(p);
    if(k && seen.has(k)) continue;
    if(k) seen.add(k);
    out.push(p);
  }

async function uploadSubPhoto(inputEl, field){
  const selected=Array.from(inputEl.files||[]);
  inputEl.value='';
  if(!selected.length) return;
  if(homeworkUploadState.active){
    alert('사진을 이미 업로드하고 있어요. 완료된 뒤 다시 선택해주세요.');
    return;
  }
  if(!currentSubState._draftSub || !Array.isArray(currentSubState._draftSub[field])){
    alert('사진 입력 화면을 다시 열어주세요.');
    return;
  }

  // 같은 선택 안에 중복 파일이 들어온 경우 제거
  const uniq=[], selectedSeen=new Set();
  for(const f of selected){
    const fp=homeworkFileFingerprint(f);
    if(selectedSeen.has(fp)) continue;
    selectedSeen.add(fp); uniq.push(f);
  }

  // 이미 현재 초안에 업로드된 동일 파일은 다시 올리지 않음
  const existingFp=new Set((currentSubState._draftSub[field]||[])
    .map(p=>p&&typeof p==='object'?p.clientFingerprint:'').filter(Boolean));
  const files=uniq.filter(f=>!existingFp.has(homeworkFileFingerprint(f)));
  if(!files.length){
    alert('선택한 사진은 이미 올라가 있어요.');
    return;
  }

  const batchSig=field+'|'+files.map(homeworkFileFingerprint).sort().join('||');
  const now=Date.now();
  if(homeworkUploadState.recentSig===batchSig && now-homeworkUploadState.recentAt<12000){
    alert('같은 사진 묶음은 방금 업로드했습니다. 중복 업로드를 막았어요.');
    return;
  }

  Object.assign(homeworkUploadState,{active:true,total:files.length,done:0,failed:0});
  render(); // 시작할 때 1회만: 모든 사진선택 버튼 잠금

  const baseCount=(currentSubState._draftSub.hwPhotos||[]).length+(currentSubState._draftSub.practicePhotos||[]).length+(currentSubState._draftSub.timerPhotos||[]).length;
  const results=new Array(files.length);
  let cursor=0;

  const updateProgress=()=>{
    const el=document.getElementById('hwUploadStatus');
    if(el) el.innerHTML=`📤 사진 업로드 중 · ${homeworkUploadState.done}/${homeworkUploadState.total}${homeworkUploadState.failed?` · 실패 ${homeworkUploadState.failed}`:''}<br><span style="font-weight:400;color:#8a8674;">완료될 때까지 사진 선택 버튼은 잠깁니다.</span>`;
  };

  async function worker(){
    while(true){
      const idx=cursor++;
      if(idx>=files.length) return;
      const f=files[idx];
      const projected=baseCount+idx;
      const params=projected>=8?{maxW:340,quality:0.3,kind:'homework'}:projected>=4?{maxW:420,quality:0.35,kind:'homework'}:{maxW:480,quality:0.4,kind:'homework'};
      try{
        let photo=await storePhotoFile(f,params);
        if(!photo) throw new Error('사진 변환에 실패했습니다.');
        if(photo && typeof photo==='object'){
          photo={...photo,clientFingerprint:homeworkFileFingerprint(f),originalName:String(f.name||'').slice(0,120)};
        }
        results[idx]=photo;
      }catch(e){
        console.error('Homework photo upload failed.',e);
        homeworkUploadState.failed++;
      }finally{
        homeworkUploadState.done++;
        updateProgress();
      }
    }
  }

  try{
    const concurrency=Math.min(3,files.length);
    await Promise.all(Array.from({length:concurrency},()=>worker()));
    const added=results.filter(Boolean);
    currentSubState._draftSub[field]=dedupeHomeworkPhotos([...(currentSubState._draftSub[field]||[]),...added]);
    saveActiveHomeworkDraft();
    homeworkUploadState.recentSig=batchSig;
    homeworkUploadState.recentAt=Date.now();
    if(homeworkUploadState.failed){
      alert(`${homeworkUploadState.failed}장의 사진을 처리하지 못했습니다. 실패한 사진만 다시 선택해주세요.`);
    }
  }finally{
    homeworkUploadState.active=false;
    render(); // 끝날 때 1회만
  }
}

// Firestore 문서 크기 제한에 걸리는 기존 dataURL 사진만 제출용으로 재압축한다.
// 학생의 원본 임시 초안과 이미 업로드된 R2 사진 참조는 변경하지 않는다.
async function compactSubmissionLegacyPhotos(payload){
  const copy={...payload};
  for(const field of ['hwPhotos','practicePhotos','timerPhotos']){
    copy[field]=await Promise.all((payload[field]||[]).map(async photo=>{
      if(!photoIsLegacyDataURL(photo)) return photo;
      try{
        const blob=await (await fetch(photo)).blob();
        const file=new File([blob],'homework.jpg',{type:blob.type||'image/jpeg'});
        return await fileToCompressedDataURL(file,260,0.24);
      }catch(e){
        console.warn('[숙제 제출용 사진 재압축 실패]',e);
        return photo;
      }
    }));
  }
  return copy;
}

async function submitHomework(stuId,date){
  const draft = currentSubState._draftSub;
  const existingSubmission = db.submissions[stuId+'_'+date] || null;
  const preservedFirstSubmittedAt = existingSubmission ? (existingSubmission.firstSubmittedAt || existingSubmission.submittedAt || null) : null;
  const key = stuId+'_'+date;
  const existing = db.submissions[key];

  if(submissionIsFinalRejected(existing)){
    alert('이 숙제는 3회 검사가 끝나 최종 불합격 처리되었습니다. 추가 제출할 수 없습니다.');
    return;
  }

  // 입력 화면 상태가 없으면 제출하지 않는다(빈 내용으로 기존 사진을 덮어쓰는 사고 방지).
  if(!draft || currentSubState._draftSubKey!==key){
    alert('숙제 입력 화면을 다시 열어주세요. 첨부한 사진은 지워지지 않았어요.');
    render();
    return;
  }
  const nowIso = new Date().toISOString();
  if(draft){
    draft.hwPhotos=dedupeHomeworkPhotos(draft.hwPhotos||[]);
    draft.practicePhotos=dedupeHomeworkPhotos(draft.practicePhotos||[]);
    draft.timerPhotos=dedupeHomeworkPhotos(draft.timerPhotos||[]);
  }
  const {errorTypes: _legacyErrorTypes, ...submissionDraft} = draft || {};
  const payload = {
    ...submissionDraft,
    studentId:baseStudentId(stuId),
    // v97: 신규 제출에만 어느 반 숙제인지 기록(과거 문서는 변환하지 않음)
    classId:(hwSlotParts(stuId)?.clsId)||primaryClassId(baseStudentId(stuId))||'',
    date:date,
    status:HW_AUTO_SUBMITTED,
    reviewCount:homeworkReviewCount(existing),
    reviewReason:'',
    reviewedAt:null,
    submittedAt:nowIso,
    // 재제출해도 최초 제출시각은 절대 덮어쓰지 않는다.
    firstSubmittedAt:preservedFirstSubmittedAt || nowIso
  };
  // Firestore rejects undefined values. Optional fields (including the retired timer duration) are omitted.
  Object.keys(payload).forEach(field=>{ if(payload[field]===undefined) delete payload[field]; });
  if(homeworkUploadState.active){
    alert('사진 업로드가 끝난 뒤 숙제를 제출해주세요.');
    return;
  }
  // 서버 저장에는 불필요한 사진 메타데이터를 제거한다.
  let savedPayload={...payload,
    hwPhotos:(payload.hwPhotos||[]).map(photoRefForFirestore),
    practicePhotos:(payload.practicePhotos||[]).map(photoRefForFirestore),
    timerPhotos:(payload.timerPhotos||[]).map(photoRefForFirestore)
  };
  if(embeddedPhotoLimitExceeded(savedPayload, 750)){
    savedPayload=await compactSubmissionLegacyPhotos(savedPayload);
  }
  if(firestorePayloadSizeKB(savedPayload)>900){
    alert('사진 11장 등 제출 데이터가 서버 허용 용량을 초과했어요. 사진은 보존되어 있습니다. 선생님께 알려주세요.');
    return;
  }

function homeworkContentForDate(stuId, clsId, date){
  const memberOfGiven = clsId && classesForStudent(stuId).some(c=>c.id===clsId);
  const actual=classForStudent(stuId);
  const effectiveClsId=memberOfGiven ? clsId : (actual?.id || clsId || '');
  if(!effectiveClsId) return '';
  const wk = weekStartISO(date);
  const plan = db.weeklyPlans[effectiveClsId+'_'+wk];
  if(!plan) return '';
  const per = plan[stuId] || {};
  const dayKey = DAY_KEYS[new Date(date+'T00:00:00').getDay()];
  return per[dayKey] || '';
}
function mostRecentLessonDateOnOrBefore(dayGroup, dateISO){
  let d = new Date(dateISO+'T00:00:00');
  for(let i=0;i<7;i++){
    const iso = toLocalISODate(d);
    if(isLessonDay(dayGroup, iso)) return iso;
    d.setDate(d.getDate()-1);
  }
  return null;
}
function homeworkGlanceRowsForStudent(stuId, limitDays){
  const today = todayISO(); // 원장님이 보는 화면이므로 실제 달력 날짜 기준 (학생 제출용 '오전 6시 규칙'은 여기 적용 안 함)
  const seenLesson = new Set();
  const lessons = [];
  const addLesson = (date, clsId)=>{
    if(!date || !clsId || date>today) return;
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup,date)) return;
    const k=clsId+'|'+date;
    if(seenLesson.has(k)) return;
    seenLesson.add(k);
    lessons.push({date,clsId,dayGroup:cls.dayGroup});
  };
  studentLessonRecords(stuId).forEach(r=>addLesson(r.date,r.clsId));
  const s=studentById(stuId);
  const cls=s&&s.classId?classById(s.classId):null;
  // 원장님이 그 반의 최근 수업 페이지를 아직 안 열어봤어도, 반 스케줄만으로 "가장 최근 수업일"을
  // 항상 계산해서 추가한다 — 학생마다 범위가 들쭉날쭉해 보이지 않도록 일관되게 맞추기 위함.
  if(cls){
    const recent = mostRecentLessonDateOnOrBefore(cls.dayGroup, today);
    if(recent) addLesson(recent, cls.id);
  }
  lessons.sort((a,b)=>a.date.localeCompare(b.date));

  const byDate=new Map();
  for(const l of lessons){
    for(const d of homeworkDateRangeDates(l.dayGroup,l.date)){
      const sub = subForClass(stuId,l.clsId,d);
      const st = homeworkEffectiveState(sub, d, stuId);
      const prev = byDate.get(d);
      // 같은 날짜에 두 반 숙제가 있으면 더 나쁜 상태를 대표로 보여준다(미제출이 인정으로 가려지지 않게).
      const rank = {missing:6,finalRejected:6,rejected:5,pending:4,unknown:3,open:2,approved:1};
      if(!prev || (rank[st]||0) > (rank[prev.state]||0)) byDate.set(d, {state: st, clsId: l.clsId});
    }
  }
  const dates = [...byDate.keys()].sort();
  const sliced = limitDays ? dates.slice(-limitDays) : dates;
  return sliced.map(d=>{
    const info = byDate.get(d);
    return {date:d, state:info.state, clsId:info.clsId, content: homeworkContentForDate(stuId, info.clsId, d)};
  });
}
function operationStartDateForStudent(stuId){
  return studentById(stuId)?.operationStartDate || '';
}
function currentMissedStreakForStudent(stuId){
  const start = operationStartDateForStudent(stuId);
  const rows = homeworkGlanceRowsForStudent(stuId, 30).filter(r=>!start || r.date>=start);
  let streak=0;
  for(let i=rows.length-1;i>=0;i--){
    const st=rows[i].state;
    if(st==='missing'||st==='finalRejected') streak++;
    else break;
  }
  return streak;
}

function sourceNorm(v){
  return String(v||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').trim();
}
function sourcePageNorm(v){
  return sourceNorm(v).replace(/^page/,'').replace(/^p\.?/,'').replace(/쪽$/,'');
}
function sourceProblemNorm(v){
  return sourceNorm(v).replace(/번$/,'');
}
function sourceBookKey(courseId,book){
  const b=sourceNorm(book);
  return courseId&&b ? `${courseId}::${b}` : '';
}
function textbookSourceKey(courseId,book,page,problemNo){
  const bk=sourceBookKey(courseId,book), pg=sourcePageNorm(page), no=sourceProblemNorm(problemNo);
  return bk&&pg&&no ? `${bk}::p${pg}::q${no}` : '';
}
function courseIdForStep(stepId){
  if(!stepId) return '';
  for(const c of db.courses||[]){
    if((c.steps||[]).some(st=>st.id===stepId)) return c.id;
  }
  return '';
}
function studentCurrentCourseIds(stuId){
  const ids=new Set();
  const tracks=(db.practiceProgress?.[stuId]?.tracks||[]).filter(t=>!t.done);
  tracks.forEach(t=>{ if(t.courseId) ids.add(t.courseId); });
  Object.values(db.classRecords||{}).forEach(byStu=>{
    const r=byStu?.[stuId]; if(!r) return;
    const main=courseIdForStep(r.stepId); if(main) ids.add(main);
    (r.extraSteps||[]).forEach(stepId=>{ const cid=courseIdForStep(stepId); if(cid) ids.add(cid); });
  });
  return [...ids];
}
const OFFICIAL_BOOKS_BY_LEVEL = Object.freeze({
  '초': ['개념책','복습책','쎈','최상위','에이급'],
  '중': ['개념책','익힘책','최상위라이트','일품','고쟁이'],
  '고': ['라쎈','마플시너지','고쟁이','올림포스고난도']
});
function officialBooksForCourse(courseId){
  const name=courseById(courseId)?.name||'';
  const level=name.includes('초등')?'초':name.includes('중등')?'중':name.includes('고등')?'고':'';
  return OFFICIAL_BOOKS_BY_LEVEL[level]||[];
}
function courseBookCatalog(courseId){
  const names=new Set();
  Object.values(db.practiceProgress||{}).forEach(rec=>{
    (rec.tracks||[]).forEach(t=>{ if(t.courseId===courseId && t.book) names.add(t.book); });
  });
  // 과거 데이터가 practiceProgress에 아직 없을 때를 위한 보조 후보.
  Object.values(db.classRecords||{}).forEach(byStu=>{
    Object.values(byStu||{}).forEach(r=>{
      const cid=courseIdForStep(r?.stepId);
      if(cid===courseId && r?.practiceBook) names.add(r.practiceBook);
    });
  });
  return [...names].sort((a,b)=>a.localeCompare(b,'ko'));
}
function studentQuestionBooks(stuId,courseId,allCatalog=false){
  const own=(db.practiceProgress?.[stuId]?.tracks||[])
    .filter(t=>!t.done && t.courseId===courseId && t.book)
    .map(t=>t.book);
  const names=new Set(own);
  if(allCatalog || !names.size) courseBookCatalog(courseId).forEach(x=>names.add(x));
  return [...names].sort((a,b)=>a.localeCompare(b,'ko'));
}

function readNewQuestionSource(stuId,index=0){
  const d=newQuestionSourceDraft(stuId,index);

  if(sourceType==='TEXTBOOK'){

    const sourceProblemNo=String(d.sourceProblemNo||'').trim();
    return {
      sourceType,sourceCourseId,sourceBook,
      sourceBookNotListed:!!d.sourceBookNotListed,
      sourceBookKey:sourceBookKey(sourceCourseId,sourceBook),
      sourcePage,sourcePageKey:sourcePageNorm(sourcePage),
      sourceProblemNo,sourceProblemNoKey:sourceProblemNorm(sourceProblemNo),
      sourceKey:textbookSourceKey(sourceCourseId,sourceBook,sourcePage,sourceProblemNo)
    };
  }
  if(sourceType==='PRINT') return {sourceType,printId:String(d.printId||'').trim(),sourceProblemNo:String(d.sourceProblemNo||'').trim()};
  if(sourceType==='OTHER') return {sourceType};
  return {sourceType,problemId:String(d.problemId||'').trim()};
}

async function findExactSolutionPhotosForQuestion(source){
  if(!source || source.sourceType!=='TEXTBOOK' || !source.sourceKey) return {photos:[],checked:true};
  try{
    const snap=await fsdb.collection('solutionPhotos').where('sourceKey','==',source.sourceKey).limit(8).get();
    const photos=snap.docs.map(d=>d.data()).filter(p=>p && p.sourceKey===source.sourceKey && p.photo).map(p=>p.photo);
    return {photos,checked:true};
  }catch(e){
    // 학생 계정에 학습보관함 조회 권한이 없으면 질문은 안전하게 대기 목록으로 보낸다.
    console.warn('[학습보관함 자동 연결]',e);
    return {photos:[],checked:false};
  }
}
async function submitQuestion(stuId){
  rememberQuestionTexts();
  const drafts=questionDraftItems(stuId);
  for(let i=0;i<drafts.length;i++){
    const item=drafts[i], text=String(item.text||'').trim(), photos=item.photos||[];
    if(!text&&!photos.length){alert(`질문 ${i+1}에 내용이나 사진을 등록해주세요.`);return;}
    const source=readNewQuestionSource(stuId,i);
    if(source.sourceType==='TEXTBOOK'){
      if(!source.sourceCourseId){alert(`질문 ${i+1}: 학년·학기를 선택해주세요.`);return;}
      if(!source.sourceBook){alert(`질문 ${i+1}: 교재를 선택해주세요.`);return;}
      if(!source.sourcePage){alert(`질문 ${i+1}: 페이지를 입력해주세요.`);return;}
      if(!source.sourceProblemNo){alert(`질문 ${i+1}: 문제번호를 입력해주세요.`);return;}
      if(!source.sourceKey){alert(`질문 ${i+1}: 문제 출처를 다시 확인해주세요.`);return;}
    }else if(source.sourceType==='MNM'&&!source.problemId){alert(`질문 ${i+1}: M&m 문제 ID를 입력해주세요.`);return;}
  }
  const prepared=[];
  for(let i=0;i<drafts.length;i++){
    const item=drafts[i],text=String(item.text||'').trim(),photos=item.photos||[],source=readNewQuestionSource(stuId,i);
    const libraryLookup=await findExactSolutionPhotosForQuestion(source);
    const matchedSolutionPhotos=libraryLookup.photos;
    const payload={studentId:stuId,date:todayISO(),text,photos,...source,solutionLibraryLookupFailed:!libraryLookup.checked,answerText:matchedSolutionPhotos.length?'학습보관함에서 출처가 정확히 일치하는 풀이를 연결했어요.':'',answerPhotos:matchedSolutionPhotos,status:matchedSolutionPhotos.length?'답변완료':'대기'};
    if(embeddedPhotoLimitExceeded(payload,900)){alert(`질문 ${i+1} 사진 용량이 너무 커요. 이 질문의 사진 수를 줄여주세요.`);return;}
    prepared.push(payload);
  }
  let saved=0;
  for(let i=0;i<prepared.length;i++){
    const item=drafts[i],payload=prepared[i],matchedSolutionPhotos=payload.answerPhotos;
    const ok=await fsAdd('questions',payload);
    if(!ok) break;
    if(matchedSolutionPhotos.length) syncAnsweredQuestionToProblemRepo(ok,payload.answerText,matchedSolutionPhotos).catch(e=>console.error(e));
    else syncQuestionToProblemRepo(ok,payload).catch(e=>console.error(e));
    item._saved=true; saved++;
  }
  if(saved){
    currentSubState._newQDraftItems=drafts.filter(item=>!item._saved).map(item=>{delete item._saved;return item;});
    currentSubState._newQDraftText='';currentSubState._newQDraftPhotos=[];currentSubState._newQDraftSource=null;
    if(!currentSubState._newQDraftItems.length) currentSubState._newQDraftItems=[{text:'',photos:[],source:{}}];
    if(saved<drafts.length) alert(`${saved}개 질문은 등록됐고, 나머지 질문은 저장되지 않았어요. 남은 입력을 확인한 뒤 다시 등록해주세요.`);
    render();
  }
}

async function saveEditQuestion(qId){

  const photos = currentSubState._editQDraft.photos;

  const patch = {text, photos};
  if(q.status==='답변완료'){ patch.status='대기'; }
  if(embeddedPhotoLimitExceeded({...q, ...patch}, 900)){ alert('사진 용량이 너무 커요. ✕ 버튼으로 사진을 몇 장 지워주세요.'); return; }
  const ok = await fsUpdate('questions', qId, patch);
  if(ok){ currentSubState.editingQId = null; currentSubState._editQDraft = null; render(); }
}

async function removeAnswerPhoto(qId, idx){

    .filter(([key])=>key.startsWith(sid+'_'))
    .map(([key,v])=>({key, ...(v||{})}));

  const assessRows = homeworkStatusRowsForStudent(sid)||[];
  const submitted = assessRows.filter(r=>r.submitted).length;
  const pendingHomework = assessRows.filter(r=>r.pending).length;
  const missed = assessRows.filter(r=>!r.submitted && !r.pending && !r.unknown).length;

  // 2026-09-02부터 경고는 관리자가 수동으로만 입력하며, type:'homework3days' 표시를 달지 않는다.
  // (그 표시는 이제 중단된 옛 자동경고 시스템 전용이었음.) 그래서 실제 화면에 보이는 경고 횟수와
  // 항상 일치하도록, 여기서도 verifiedWarnings()와 같은 기준(수동경고 전체)으로 집계한다.
  const homeworkWarnings = verifiedWarnings(stu);
  const pendingQuestions = questionRows.filter(q=>!(q.answerText || q.answerImage || q.teacherComment)).length;

  const issues = [];
  if(!classRecs.length) issues.push('수업기록 없음');
  if(assessRows.length && submitted===0) issues.push('숙제 인증 없음');
  if(pendingQuestions>0) issues.push(`미답변 질문 ${pendingQuestions}`);
  if(homeworkWarnings.length>0) issues.push(`경고 ${homeworkWarnings.length}`);

  return {
    name:stu.name,
    grade:stu.grade||'',
    classRecords:classRecs.length,
    kmm:kmmRows.length,
    submissions:submissionRows.length,
    questions:questionRows.length,
    pendingQuestions,
    homeworkAssess:assessRows.length,
    homeworkSubmitted:submitted,
    homeworkPending:pendingHomework,
    homeworkMissed:missed,
    warnings:homeworkWarnings.length,
    issues
  };
}

function classRecordContextForStudentDate(stuId,date){
  for(const [key,obj] of Object.entries(db.classRecords||{})){

    const clsId = key.slice(0, -(date.length+1));
    const cls = classById(clsId);
    return {cls, record:obj[stuId]||{}};
  }
  const fallbackClass=classForStudent(stuId);
  return {cls:fallbackClass||null, record:{}};
}
async function ensureFeedbackDailyRecordLoaded(stuId,date){
  if(!stuId||!date) return;
  const cls=classForStudent(stuId);
  if(!cls) return;
  const key=cls.id+'_'+date;
  if(db.classRecords[key]&&db.classRecords[key][stuId]) return;
  try{
    const doc=await fsdb.collection('classRecords').doc(key).get();
    if(doc.exists){
      db.classRecords[key]=doc.data()||{};
      render();
    }
  }catch(e){
    console.error('[일일리포트 수업기록 조회 오류]',e);
  }
}

function dailyTrafficForStudentDate(stuId, date){
  const s = studentById(stuId);
  if(!s) return 'green';

  // 신호등은 경고 이력과 무관하게, 그날의 시험 점수·숙제 인증 상태만으로 판정합니다.

  // 1. 해당 날짜 일일테스트 점수 판정.
  const scoreRow = studentDailyScores(stuId).find(r=>String(r.date||'')===String(date||''));
  const hasScore = !!scoreRow && Number.isFinite(Number(scoreRow.score));
  const score = hasScore ? Number(scoreRow.score) : null;
  let testTraffic = 'green';
  if(hasScore){
    if(score < 60) testTraffic = 'red';
    else if(score < 80) testTraffic = 'yellow';
  }

  // 2. 숙제 인증 상태 판정.
  // 한 번의 미인증만으로 빨강 처리하지 않는다.
  // 해당 수업일 기준 확인 대상 숙제 중 미인증이 있으면 '주의(노랑)' 요소로 반영한다.
  const cls = classForStudent(stuId) || classById(s.classId);
  const dayGroup = cls && cls.dayGroup;
  const hwDates = dayGroup ? homeworkDateRangeDates(dayGroup, date) : [];
  const hwNotApprovedCount = hwDates.filter(d=>!homeworkCountsAsCompleted(db.submissions[stuId+'_'+d],d)).length;
  const homeworkTraffic = hwNotApprovedCount > 0 ? 'yellow' : 'green';

  // 3. 일일테스트 + 숙제 중 더 강한 상태를 최종 신호등으로 사용.
  const rank = {green:0, yellow:1, red:2};
  return rank[testTraffic] >= rank[homeworkTraffic] ? testTraffic : homeworkTraffic;
}

function monthlyTrafficForStudent(stuId, ym){
  const monthScores = studentDailyScores(stuId)
    .filter(r=>String(r.date||'').startsWith(ym))
    .map(r=>Number(r.score))
    .filter(Number.isFinite);

  // 신호등은 경고 이력과 무관하게, 해당 월 일일테스트 평균으로만 판정합니다.
  // 80점 이상: 순항 / 60~79점: 주의 / 60점 미만: 관찰필요.
  if(!monthScores.length) return 'green';
  const avg = monthScores.reduce((a,b)=>a+b,0) / monthScores.length;
  if(avg>=80) return 'green';
  if(avg>=60) return 'yellow';
  return 'red';
}

function normalizeSchoolExamDate(e){
  // 기존 schoolExams 데이터의 날짜 표현을 안전하게 흡수한다.
  // 우선순위: date → examDate → testDate
  const raw = e && (e.date ?? e.examDate ?? e.testDate);
  if(raw===undefined || raw===null) return '';

  // Firestore Timestamp 호환
  if(raw && typeof raw==='object'){
    if(typeof raw.toDate==='function'){
      const d = raw.toDate();
      if(d && !isNaN(d.getTime())){
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
    }
    if(typeof raw.seconds==='number'){
      const d = new Date(raw.seconds*1000);
      if(!isNaN(d.getTime())){
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
    }
  }

  const s = String(raw).trim();
  if(!s) return '';

  // YYYY-MM-DD / YYYY.MM.DD / YYYY/MM/DD
  let m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(m) return `${m[1]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[3])).padStart(2,'0')}`;

  // YYYYMMDD
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;

  // 2026년 9월 3일
  m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);
  if(m) return `${m[1]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[3])).padStart(2,'0')}`;

  // Date-parsable fallback
  const d = new Date(s);
  if(!isNaN(d.getTime())){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return '';
}

function renderSchoolExamCalendar(){
  const baseYm = currentSubState.examCalendarMonth || todayISO().slice(0,7);
  currentSubState.examCalendarMonth = baseYm;

  const [yy,mm] = baseYm.split('-').map(Number);
  const first = new Date(yy, mm-1, 1);
  const last = new Date(yy, mm, 0);
  const firstDow = first.getDay();
  const daysInMonth = last.getDate();

  // 모든 기존 schoolExams 레코드를 읽고 날짜를 정규화해서 표시한다.
  const allExams = (db.schoolExams||[]).map(e=>({
    ...e,
    _calendarDate: normalizeSchoolExamDate(e)
  }));

  const monthExams = allExams
    .filter(e=>String(e._calendarDate||'').startsWith(baseYm))
    .sort((a,b)=>{
      const d = String(a._calendarDate||'').localeCompare(String(b._calendarDate||''));
      if(d!==0) return d;
      const s = String(a.school||'').localeCompare(String(b.school||''));
      if(s!==0) return s;
      return Number(a.grade||0)-Number(b.grade||0);
    });

  const byDate = {};
  monthExams.forEach(e=>{
    const d = e._calendarDate;
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push(e);
  });

  const cells = [];
  for(let i=0;i<firstDow;i++){
    cells.push(`<div style="min-height:102px;background:#faf9f4;border:1px solid var(--line);border-radius:10px;"></div>`);
  }

  for(let d=1; d<=daysInMonth; d++){
    const iso = `${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDate[iso] || [];
    cells.push(`
      <div style="min-height:102px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;">
        <div style="font-weight:800;font-size:12px;margin-bottom:5px;">${d}</div>
        ${items.map(e=>`
          <div style="font-size:10px;line-height:1.35;padding:4px 5px;margin-top:3px;border-radius:7px;background:#f3f0e5;">
            <b>${e.school||'-'} ${e.grade||''}학년</b><br>
            <span>${e.examName||e.name||'시험'}</span>
            ${e.range?`<br><span class="muted">${e.range}</span>`:''}
          </div>`).join('')}
      </div>`);
  }

  const undated = allExams.filter(e=>!e._calendarDate);

  return `
    <div class="card">
      <div class="row between" style="gap:10px;flex-wrap:wrap;">
        <div>
          <h3 style="margin:0;">📅 전체 학교 내신 시험 일정</h3>
          <div class="muted" style="font-size:11px;margin-top:4px;">
            기존에 저장된 모든 학교·학년 시험을 읽어 달력에 표시합니다.
          </div>
        </div>
        <div class="row" style="gap:6px;">
          <button class="btn sm outline" onclick="shiftExamCalendarMonth(-1)">‹ 이전달</button>
          <b style="align-self:center;">${yy}년 ${mm}월</b>
          <button class="btn sm outline" onclick="shiftExamCalendarMonth(1)">다음달 ›</button>
          <button class="btn sm outline" onclick="currentSubState.examCalendarMonth=todayISO().slice(0,7);render();">이번달</button>
        </div>
      </div>

      <div style="overflow-x:auto;margin-top:12px;">
        <div style="display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:5px;min-width:760px;">
          ${['일','월','화','수','목','금','토'].map(x=>`<div style="text-align:center;font-size:11px;font-weight:800;padding:5px;">${x}</div>`).join('')}
          ${cells.join('')}
        </div>
      </div>

      <div class="muted" style="font-size:11px;margin-top:10px;">
        이번 달 표시 ${monthExams.length}개 · 전체 저장 시험 ${(db.schoolExams||[]).length}개
      </div>

      ${undated.length ? `
        <details style="margin-top:10px;">
          <summary style="cursor:pointer;font-weight:700;font-size:12px;">⚠️ 날짜를 읽지 못한 기존 시험 ${undated.length}개 확인</summary>
          <div style="margin-top:8px;">
            ${undated.map(e=>`<div style="font-size:11px;padding:5px 0;border-bottom:1px solid var(--line);">
              ${e.school||'-'} ${e.grade||''}학년 · ${e.examName||e.name||'시험'} · 원본 날짜: ${String(e.date ?? e.examDate ?? e.testDate ?? '-')}
            </div>`).join('')}
          </div>
        </details>` : ''}
    </div>`;
}

function shiftExamCalendarMonth(delta){
  const ym = currentSubState.examCalendarMonth || todayISO().slice(0,7);
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  currentSubState.examCalendarMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

async function addSchoolExam(){
  const school = document.getElementById('examSchool').value.trim();
  const grade = document.getElementById('examGrade').value;
  const examName = document.getElementById('examName').value.trim();
  const range = document.getElementById('examRange').value.trim();
  const date = document.getElementById('examDate').value;
  if(!school || !examName || !date){ alert('학교명, 시험명, 날짜를 모두 입력해주세요.'); return; }
  await fsAdd('schoolExams', {school, grade:Number(grade), examName, range, date});
  document.getElementById('examSchool').value=''; document.getElementById('examName').value=''; document.getElementById('examRange').value='';
}

    const original = btn.textContent;

function renderKmmMakeup(){
  const active = db.students
    .filter(s=>s.status!=='withdrawn')
    .map(s=>({s, latest: latestKmmForStudent(s.id)}))
    .filter(x=>isKmmMakeupActive(x.latest));
  const resolved = db.students
    .filter(s=>s.status!=='withdrawn')
    .map(s=>({s, latest: latestKmmForStudent(s.id)}))
    .filter(x=>x.latest && x.latest.score<70 && x.latest.retryScore!=null && x.latest.retryScore>=70)
    .sort((a,b)=> (b.latest.retryDate||'').localeCompare(a.latest.retryDate||''));

  const groups = {};
  active.forEach(x=>{ const g=x.s.grade||'기타'; groups[g]=groups[g]||[]; groups[g].push(x); });
  const gradeKeys = Object.keys(groups).sort((a,b)=>{
    const ia=GRADE_ORDER.indexOf(a), ib=GRADE_ORDER.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1; if(ib===-1) return -1;
    return ia-ib;
  });

  return `
  <h1 class="page-title">📐 KMM 보강 대상</h1>
  <p class="page-sub">최근 KMM 점수가 70점 미만인 학생이 학년별로 자동으로 모여요. 같은 학년은 시험범위가 같으니 한 번만 입력하면 전체 적용돼요. 재시험에서 70점 이상 받으면 자동으로 목록에서 빠지고, 학부모님께 보낼 안내 문자가 만들어져요.</p>
  ${active.length ? gradeKeys.map(g=>renderKmmGradeGroup(g, groups[g])).join('') : `<div class="empty"><div class="big">🎉</div>지금 보강이 필요한 학생이 없어요.</div>`}
  ${resolved.length ? `
    <h3 style="margin:22px 0 8px;color:#8a8674;">✅ 최근 재시험 통과 (보강 종료)</h3>
    ${resolved.map(({s, latest})=>`<div class="card" style="opacity:.85;padding:10px 14px;">
      <div class="row between">
        <div style="font-size:12.5px;">
          <b>${s.name}</b> <span class="badge gray" style="font-size:9px;">${s.grade}</span>
          — ${latest.range?`"${latest.range}" · `:''}최초 ${latest.score}점 → 재시험 <b style="color:var(--green);">${latest.retryScore}점</b> (${fmtDate(latest.retryDate)})
        </div>
        <button class="btn sm outline" onclick="copyText(this)" data-text="${encodeURIComponent(kmmRetryPassMessage(s.name, latest.range, latest.retryScore))}">문자 복사</button>
      </div>
    </div>`).join('')}
  ` : ''}
  `;
}
function renderKmmGradeGroup(grade, list){
  // 이 학년 안에서 이미 입력된 범위가 있으면 그걸 기본값으로 보여줌 (다들 같은 시험 범위라서)
  const commonRange = (list.find(x=>x.latest.range)||{}).latest?.range || '';
  return `<div class="card" style="padding:12px 14px;">
    <div class="row between" style="margin-bottom:8px;">
      <h3 style="margin:0;color:var(--navy2);">${grade} <span style="font-weight:400;color:#8a8674;font-size:12px;">(${list.length}명)</span></h3>
      <div class="row" style="gap:4px;">
        <input type="text" id="gradeRange_${grade}" placeholder="이 학년 시험범위" style="width:130px;font-size:11px;" value="${commonRange}">
        <button class="btn sm outline" style="font-size:11px;padding:4px 8px;" onclick="applyGradeRange('${grade}', this)">전체 적용</button>
      </div>
    </div>
    <table style="width:100%;">
      <tr><th style="text-align:left;">학생</th><th>최근점수</th><th>재도전 점수</th><th>해야 할 학습</th><th></th></tr>
      ${list.map(({s, latest})=>{
        const cls = db.classes.find(c=>(c.studentIds||[]).includes(s.id));
        return `<tr>
          <td><b style="font-size:12.5px;">${s.name}</b><br><span style="font-size:10px;color:#9c9880;">${cls?cls.name:'미배정'}</span></td>
          <td style="text-align:center;"><b style="color:var(--red);">${latest.score}</b><div style="font-size:9.5px;color:#9c9880;">${fmtDate(latest.date)}</div></td>
          <td style="text-align:center;"><input type="number" id="kmmRetryScore_${latest.id}" style="width:56px;font-size:12px;text-align:center;" value="${latest.retryScore ?? ''}"></td>
          <td><input type="text" id="kmmNote_${s.id}" placeholder="해야 할 학습" style="width:100%;font-size:11.5px;" value="${s.kmmMakeupNote||''}"></td>
          <td><button class="btn sm gold" style="font-size:10.5px;padding:4px 8px;white-space:nowrap;" onclick="saveKmmRowCompact('${s.id}','${latest.id}', this)">저장</button></td>
        </tr>
        ${latest.retryScore!=null && latest.retryScore<70 ? `<tr><td colspan="5" style="font-size:10.5px;color:#8a8674;padding-top:0;">↳ 최근 재도전 ${latest.retryScore}점 (${fmtDate(latest.retryDate)}) — 아직 기준 미달, 보강 계속</td></tr>` : ''}`;
      }).join('')}
    </table>
  </div>`;
}
async function applyGradeRange(grade, btn){
  const range = document.getElementById(`gradeRange_${grade}`).value;
  const targets = db.students.filter(s=>s.status!=='withdrawn' && s.grade===grade)
    .map(s=>latestKmmForStudent(s.id)).filter(k=>k && isKmmMakeupActive(k));
  const original = btn.textContent;
  btn.textContent = '적용 중...'; btn.disabled = true;
  for(const k of targets){ await fsUpdate('kmm', k.id, {range}); }
  btn.textContent = `✅ ${targets.length}명 적용됨`;
  setTimeout(()=>{ btn.textContent = original; btn.disabled=false; }, 1800);
}
async function saveKmmRowCompact(stuId, kmmId, btn){
  const noteEl = document.getElementById(`kmmNote_${stuId}`);
  const scoreEl = document.getElementById(`kmmRetryScore_${kmmId}`);
  const note = noteEl.value;
  await fsUpdate('students', stuId, {kmmMakeupNote: note});
  const val = scoreEl.value;
  if(val===''){
    const original = btn.textContent;
    btn.textContent = '✅ 메모 저장됨';
    setTimeout(()=>{ btn.textContent = original; }, 1500);
    return;
  }
  const score = Number(val);

function monthlyAttendanceRate(stuId, yearMonth){
  const rows = [];

function monthlyHomeworkRate(stuId, yearMonth){

function copyText(btn){
  if(!btn || !btn.getAttribute) return;
  const encoded = btn.getAttribute('data-text') || '';
  const text = decodeURIComponent(encoded);
  if(!text) return;

  const originalText = btn.textContent;
  const copied = ()=>{
    btn.textContent='복사됨 ✓';
    showCopyToast('복사되었습니다 ✓');
    setTimeout(()=>{ btn.textContent=originalText; },1500);
  };

  const fallbackCopy = ()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      const ok=document.execCommand('copy');
      if(ok) copied();
    }finally{
      ta.remove();
    }
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(copied).catch(fallbackCopy);
  }else{
    fallbackCopy();
  }
}

async function migrateWeekStartBug(){
  let fixedCount = 0;
  const fixedList = [];
  for(const [key, data] of Object.entries(db.weeklyPlans)){
    const datePart = key.slice(-10);
    const clsId = key.slice(0, key.length-11);
    const d = new Date(datePart+'T00:00:00');
    if(isNaN(d.getTime())) continue;
    if(d.getDay() === 0){
      const newDate = new Date(d); newDate.setDate(newDate.getDate()+1);
      const newKey = clsId + '_' + toLocalISODate(newDate);
      if(!db.weeklyPlans[newKey]){
        const ok = await fsSet('weeklyPlans', newKey, data, false);
        if(ok){ fixedCount++; fixedList.push(`요일별 숙제 계획표 (${classById(clsId)?.name||clsId}, ${toLocalISODate(newDate)} 주)`); }
      }
    }
  }
  for(const [key, data] of Object.entries(db.fridaySupp)){
    const datePart = key.slice(-10);
    const clsId = key.slice(0, key.length-11);
    const d = new Date(datePart+'T00:00:00');
    if(isNaN(d.getTime())) continue;
    if(d.getDay() === 0){
      const newDate = new Date(d); newDate.setDate(newDate.getDate()+1);
      const newKey = clsId + '_' + toLocalISODate(newDate);
      if(!db.fridaySupp[newKey]){
        const ok = await fsSet('fridaySupp', newKey, data, false);
        if(ok){ fixedCount++; fixedList.push(`금요일 보강 (${classById(clsId)?.name||clsId}, ${toLocalISODate(newDate)} 주)`); }
      }
    }
  }
  if(fixedCount===0){
    alert('밀린 데이터를 찾지 못했어요. 이미 정상이거나, 처음부터 문제가 없었을 수 있어요.');
  }else{
    alert(`${fixedCount}개 항목을 복구했어요:\n\n${fixedList.join('\n')}\n\n반 페이지에서 확인해보세요.`);
  }
}
async function buildFullBackupSnapshot(){
  // 화면 성능을 위해 메모리에 일부 기록만 들고 있으므로, 백업할 때만 Firestore 원본 전체를 읽는다.
  const arrayCols=['classes','students','courses','videos','questions','feedbacks','kmm','schoolExams','weekendClasses','solutionPhotos'];
  const mapCols=['classRecords','weeklyPlans','fridaySupp','submissions','practiceProgress','schoolScores','timerState','weekendSubmissions','stadApplications','stadDaily','focusHistory','assignments','answerSubmissions'];
  const out={_backupMeta:{createdAt:new Date().toISOString(),version:'v87',source:'Firestore full snapshot'}};
  await Promise.all(arrayCols.map(async col=>{
    const snap=await fsdb.collection(col).get();
    out[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
  }));
  await Promise.all(mapCols.map(async col=>{
    const snap=await fsdb.collection(col).get(); const m={};
    snap.docs.forEach(d=>{m[d.id]=d.data();}); out[col]=m;
  }));
  const singles=[['settings','main'],['weekendSettings','main'],['stadSettings','main']];
  await Promise.all(singles.map(async ([name,id])=>{
    const doc=await fsdb.collection(name).doc(id).get(); out[name]=doc.exists?doc.data():{};
  }));
  return out;
}
async function showBackupText(){
  const area=document.getElementById('backupTextArea'), ta=document.getElementById('backupTextContent');
  area.style.display='block'; ta.value='전체 데이터를 불러오는 중...';
  try{ ta.value=JSON.stringify(await buildFullBackupSnapshot()); }
  catch(e){ console.error(e); ta.value=''; alert('전체 백업 데이터를 불러오지 못했어요. 연결 상태를 확인해주세요.'); }
}
function copyBackupText(){
  const el = document.getElementById('backupTextContent'); el.select();
  navigator.clipboard.writeText(el.value).then(()=>{ alert('복사됐어요!'); }).catch(()=>{ alert('자동 복사가 안 됐어요. 텍스트를 길게 눌러 직접 복사해주세요.'); });
}
async function downloadBackup(){
  try{
    const full=await buildFullBackupSnapshot();
    const blob = new Blob([JSON.stringify(full,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download = `mnm_backup_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }catch(e){ console.error(e); alert('전체 백업 다운로드에 실패했어요. 연결 상태를 확인해주세요.'); }
}

function renderStudentHomeworkSummary(stuId){
  const rows = Object.entries(db.submissions)
    .filter(([key])=>key.startsWith(stuId+'_'))
    .map(([key,sub])=>({key,date:key.slice(-10),sub}))
    .sort((a,b)=>b.date.localeCompare(a.date));

  // 학생 첫 화면은 "가장 최근 제출"보다 "가장 최근 판정 완료 결과"를 우선한다.
  const latestReviewed = rows.find(r=>submissionIsApproved(r.sub,r.date) || submissionIsRejected(r.sub,r.date));
  const latestPending = rows.find(r=>submissionIsPending(r.sub,r.date));
  const focus = latestReviewed || latestPending || rows[0];
  const month = todayISO().slice(0,7);
  const monthRows = rows.filter(r=>r.date.startsWith(month));
  const monthPass = monthRows.filter(r=>submissionIsApproved(r.sub,r.date)).length;
  const monthFail = monthRows.filter(r=>submissionIsRejected(r.sub,r.date)).length;
  const latestComment = latestReviewed && latestReviewed.sub && latestReviewed.sub.teacherComment ? latestReviewed : null;

  let resultBox = `<div class="empty" style="padding:18px 0 8px;">아직 판정된 숙제 결과가 없어요.</div>`;
  if(focus){
    const approved=submissionIsApproved(focus.sub,focus.date);
    const pending=submissionIsPending(focus.sub,focus.date);
    const rejected=submissionIsRejected(focus.sub,focus.date);
    const title=approved?'PASS':pending?'검토대기':rejected?'불합격':'제출';
    const color=approved?'#207a3b':pending?'#9a6b16':'#b33b32';
    const bg=approved?'#eef9f0':pending?'#fff8e8':'#fff1ef';
    const border=approved?'#bfe3c6':pending?'#e8cf95':'#efc2bd';
    resultBox=`<div style="margin-top:12px;padding:18px;border-radius:14px;text-align:center;background:${bg};border:1px solid ${border};">
      <div style="font-size:12px;color:#7b7667;margin-bottom:4px;">최근 숙제 결과 · ${fmtDate(focus.date)}</div>
      <div style="font-size:28px;font-weight:900;color:${color};letter-spacing:-.02em;">${title}</div>
      ${latestComment && latestComment.key===focus.key ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid ${border};font-size:13px;line-height:1.6;color:#4a4636;">${escapeHtml(latestComment.sub.teacherComment)}</div>` : ''}
    </div>`;
  }

  return `<div class="card">
    <h3 style="margin:0;">📸 숙제 결과</h3>
    ${resultBox}
    <div style="margin-top:12px;padding:12px 14px;background:#f6f4ec;border:1px solid var(--line);border-radius:10px;">
      <div style="font-size:12px;color:#7b7667;margin-bottom:5px;">${Number(month.slice(5))}월 숙제</div>
      <div style="font-size:14px;font-weight:800;">PASS ${monthPass}회 · 불합격 ${monthFail}회</div>
    </div>
  </div>`;
}
