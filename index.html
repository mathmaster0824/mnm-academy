   정답키는 학생 화면에 렌더링하지 않는다. 실제 자동채점은 서버 채점 연결 전까지 원장 검수용으로만 사용한다. */

/* ---------------- PROBLEM REPOSITORY (on-demand / paged) ---------------- */

function setProblemRepoTab(tab){ problemStore.tab=tab; if(tab==='ingest') ensureProblemIngestLoaded(); render(); }
async function loadProblemIngestQueue(){
  if(problemStore.ingest.loading) return;
  problemStore.ingest.loading=true; render();
  try{
    const [srcSnap,draftSnap]=await Promise.all([
      fsdb.collection('problemSources').orderBy('createdAt','desc').limit(50).get().catch(()=>fsdb.collection('problemSources').limit(50).get()),
      fsdb.collection('problemDrafts').orderBy('createdAt','desc').limit(200).get().catch(()=>fsdb.collection('problemDrafts').limit(200).get())
    ]);
    problemStore.ingest.sources=srcSnap.docs.map(d=>({id:d.id,...d.data()}));
    problemStore.ingest.drafts=draftSnap.docs.map(d=>({id:d.id,...d.data()}));
    problemStore.ingest.loaded=true;
  }catch(e){ console.error('problem ingest queue load',e); alert('문제 수집 대기열을 불러오지 못했어요.'); }
  finally{ problemStore.ingest.loading=false; render(); }
}
function ensureProblemIngestLoaded(){ if(!problemStore.ingest.loaded&&!problemStore.ingest.loading) setTimeout(loadProblemIngestQueue,0); }
function ingestStatusLabel(s){ return ({queued:'수집대기',analyzing:'자동분석',review:'검토필요',ready:'저장가능',saved:'저장완료',superseded:'이전버전',error:'오류'})[s]||s||'수집대기'; }

const PROBLEM_ANALYSIS_VERSION='mnm-taxonomy-v1';
function problemRuleAnalysis(d){
  const t=String(d.problemText||d.rawText||'').normalize('NFKC');
  const tags=new Set(), skills=new Set(); let ask='';
  const add=(cond,tag)=>{if(cond)tags.add(tag)};
  add(/이등변삼각형/.test(t),'이등변삼각형'); add(/외심|외접원/.test(t),'외심·외접원');
  add(/내심|내접원/.test(t),'내심·내접원'); add(/평행사변형/.test(t),'평행사변형');
  add(/사다리꼴/.test(t),'사다리꼴'); add(/직사각형/.test(t),'직사각형');
  add(/마름모/.test(t),'마름모'); add(/정사각형/.test(t),'정사각형'); add(/닮음/.test(t),'닮음');
  add(/중점/.test(t),'중점'); add(/접었|접은|접는다/.test(t),'접기'); add(/수선|수직/.test(t),'수선');
  if(/합동/.test(t)) skills.add('합동');
  if(/평행/.test(t)) skills.add('평행선 성질');
  if(/중점/.test(t)) skills.add('중점 활용');
  if(/넓이/.test(t)) skills.add('넓이 관계');
  if(/외심|외접원/.test(t)) skills.add('외심 성질');
  if(/내심|내접원/.test(t)) skills.add('내심 성질');
  if(/접었|접은|접는다/.test(t)) skills.add('접기 대응');
  if(/각의 크기|∠/.test(t)) ask='각도';
  else if(/넓이/.test(t)) ask='넓이';
  else if(/둘레/.test(t)) ask='둘레';
  else if(/길이/.test(t)) ask='길이';
  const confidence=(tags.size||skills.size||ask)?0.45:0;
  return {conceptTags:[...tags],solutionSkills:[...skills],askType:ask,confidence,method:'text-rule'};
}
function mergeProblemRuleAnalysis(d){
  const a=problemRuleAnalysis(d);
  return {...d,
    conceptTags:Array.isArray(d.conceptTags)&&d.conceptTags.length?d.conceptTags:a.conceptTags,
    solutionSkills:Array.isArray(d.solutionSkills)&&d.solutionSkills.length?d.solutionSkills:a.solutionSkills,
    askType:d.askType||a.askType,
    analysis:{...(d.analysis||{}),version:PROBLEM_ANALYSIS_VERSION,textRuleConfidence:a.confidence,needsVision:true,status:'vision-pending'}
  };
}

function problemDraftConfidence(d){
  const checks=[
    !!(d.problemText||d.rawText), !!(d.problemNo||d.no), !!d.grade, !!d.semester,
    !!(d.majorUnit||d.major), !!(d.middleUnit||d.middle), !!d.type,
    d.type==='constructed' || !!(d.answer||d.answerMatched), !!(d.cropKey||d.cropUrl||d.imageUrl||d.originalRegion)
  ];
  return Math.round(checks.filter(Boolean).length/checks.length*100);
}
function problemAiQuality(d){
  if(d.analysis?.status!=='analyzed') return {analyzed:false,valid:false,issues:[]};
  const issues=[];
  const aiConf=Math.max(0,Math.min(1,Number(d.analysis?.confidence||0)));
  const main=String(d.mainConceptId||'').trim();
  const tags=Array.isArray(d.conceptTags)?d.conceptTags.filter(Boolean):[];
  const related=Array.isArray(d.relatedConceptIds)?d.relatedConceptIds.filter(Boolean):[];
  const skills=Array.isArray(d.solutionSkills)?d.solutionSkills.filter(Boolean):[];
  const ask=String(d.askType||'').trim();
  const diff=String(d.predictedDifficulty||'').trim();

  if(!main) issues.push('핵심개념 없음');
  else if(main.length<2 && !tags.length && !related.length) issues.push('핵심개념이 너무 모호함');
  if(!ask) issues.push('묻는 것 없음');
  if(!skills.length) issues.push('풀이기술 없음');
  if(!diff) issues.push('난이도 없음');
  if(aiConf<0.55) issues.push('AI 확신도 낮음');

  const valid=issues.length===0;
  return {analyzed:true,valid,issues,confidence:aiConf};
}
function problemDraftStatus(d){
  if(d.status==='saved'||d.status==='superseded'||d.status==='error'||d.status==='analyzing'||d.status==='queued') return d.status;
  if(d.analysis?.needsVision && d.analysis?.status==='vision-pending') return 'review';
  const aq=problemAiQuality(d);
  if(aq.analyzed && !aq.valid) return 'review';
  return problemDraftConfidence(d)>=78 ? 'ready' : 'review';
}

function normalizeProblemNo(v){ return String(v??'').trim().replace(/^0+(?=\d)/,'') || ''; }
function validateProblemIngestPacket(packet){
  const src=packet&&packet.source||{}, rows=Array.isArray(packet&&packet.problems)?packet.problems:[];
  const errors=[], warnings=[], seen=new Set();
  if(!rows.length) errors.push('problems 배열이 비어 있습니다.');
  rows.forEach((x,i)=>{
    const no=normalizeProblemNo(x?.problemNo||x?.no||String(i+1));
    if(seen.has(no)) errors.push(`문항번호 중복: ${no}`); else seen.add(no);
    const type=x?.type||'short';
    if(!String(x?.problemText||x?.rawText||'').trim()) warnings.push(`${no}번: 문제 텍스트 없음`);
    if(type!=='constructed' && !String(x?.answer||'').trim()) warnings.push(`${no}번: 정답 검토 필요`);
    if(!(x?.cropKey||x?.cropUrl||x?.imageUrl||x?.originalRegion)) warnings.push(`${no}번: 원본 crop/영역 없음`);
  });
  if(src.problemCount && Number(src.problemCount)!==rows.length) warnings.push(`원본 표기 문항수 ${src.problemCount}개와 실제 ${rows.length}개가 다릅니다.`);
  return {ok:errors.length===0,errors,warnings,count:rows.length,uniqueProblemNos:seen.size};
}
async function sha256BlobHex(blob){
  if(!blob || !crypto?.subtle) return '';
  const buf=await blob.arrayBuffer();
  const digest=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function storeProblemCropFile(file, options={}){
  if(!PHOTO_API_BASE) throw new Error('문제 원본 저장소(R2)가 연결되지 않았습니다.');
  const token=await photoApiToken();
  const form=new FormData();
  form.append('file',file,file.name||'problem-crop.jpg');
  form.append('kind',options.kind||'problem-crop');
  form.append('category','problem-crop');
  form.append('studentId','problem-bank');
  const res=await fetch(PHOTO_API_BASE.replace(/\/$/,'')+'/upload',{
    method:'POST',headers:{Authorization:'Bearer '+token,'X-MNM-Role':session?.mode||'user'},body:form
  });
  const out=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(out?.error||('문제 crop R2 업로드 '+res.status));
  const raw=out.photo||out, key=raw.storageKey||raw.key||raw.r2Key||raw.r2_key||'';
  if(!key) throw new Error('문제 crop 업로드 응답에 storage key가 없습니다.');
  return photoRefForFirestore({...raw,storageKey:key,url:raw.url||raw.downloadUrl||('/photo?key='+encodeURIComponent(key)),contentType:raw.contentType||raw.type||file.type||'image/jpeg',size:raw.size||file.size||null});
}

function assertNoAnswerLeak(publicData){
  const forbidden=['answer','acceptedAnswers','correctAnswer','solution','explanation','answerText','answerKey'];
  const leaked=forbidden.filter(k=>Object.prototype.hasOwnProperty.call(publicData||{},k));
  if(leaked.length) throw new Error('PUBLIC_PROBLEM_ANSWER_LEAK:'+leaked.join(','));
  return true;
}
function problemHash32(text){
  const base=String(text||'');
  let h=2166136261;
  for(let i=0;i<base.length;i++){ h^=base.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(36);
}
function normalizedProblemText(d){
  return problemReadableProblemText(d)
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\s\u00a0]+/g,'')
    .replace(/[“”"'`´]/g,'')
    .replace(/[‐‑‒–—―]/g,'-')
    .trim();
}
function problemFingerprintInfo(d){
  const text=normalizedProblemText(d);
  const cropHash=String(d?.cropHash||d?.media?.[0]?.cropHash||'').trim().toLowerCase();
  const type=String(d?.type||'short');
  if(cropHash){
    const basis=`v2|img:${cropHash}|text:${text}|type:${type}`;
    return {fingerprint:'p2_'+problemHash32(basis),version:2,mode:'image+text',safe:true};
  }
  // 이미지 해시가 없는 과거 문항은 텍스트가 충분히 구체적인 경우에만 중복 병합.
  const distinctChars=new Set(text.replace(/[^0-9a-z가-힣]/g,'')).size;
  if(text.length>=80 && distinctChars>=18){
    const basis=`v2|text:${text}|type:${type}`;
    return {fingerprint:'p2_'+problemHash32(basis),version:2,mode:'strong-text',safe:true};
  }
  // 빈 OCR/짧은 문구/도형 중심 문항은 false-positive 방지를 위해 occurrence별 고유값 사용.
  const occurrence=[
    d?.sourceId||'', d?.page||'', d?.problemNo||d?.no||'',
    d?.cropKey||'', d?.occurrenceId||d?.id||uid('occ')
  ].join('|');
  return {fingerprint:'occ_'+problemHash32(`v2|${occurrence}`),version:2,mode:'occurrence-safe',safe:false};
}
function problemFingerprint(d){ return problemFingerprintInfo(d).fingerprint; }
function problemTokenNorm(v){
  return String(v||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/[^0-9a-z가-힣]/g,'');
}
function problemLexemes(v){
  const raw=String(v||'').normalize('NFKC').toLowerCase()
    .replace(/[^0-9a-z가-힣]+/g,' ').trim().split(/\s+/).filter(x=>x.length>=2);
  const out=[];
  for(const word of raw){
    out.push(word);
    const stripped=word.replace(/(으로|에서|에게|한테|까지|부터|처럼|보다|으로써|으로서|의|을|를|이|가|은|는|에|와|과|로)$/,'');
    if(stripped.length>=2&&stripped!==word) out.push(stripped);
  }
  return [...new Set(out)];
}
function problemFieldSearchTokens(prefix,value){
  const out=new Set(), full=problemTokenNorm(value);
  if(full.length>=2) out.add(prefix+':'+full);
  for(const w of problemLexemes(value)){
    const n=problemTokenNorm(w); if(n.length<2) continue;
    out.add(prefix+':'+n);
    // 구조화 필드는 '일차함수'를 '함수'로도 찾을 수 있게 2~4글자 부분 토큰 생성.
    let made=0;
    for(let len=2;len<=Math.min(4,n.length);len++){
      for(let i=0;i+len<=n.length;i++){
        out.add(prefix+':'+n.slice(i,i+len));
        if(++made>=24) break;
      }
      if(made>=24) break;
    }
  }
  return [...out].slice(0,40);
}
function problemSearchTokens(d){
  const out=new Set();
  const add=(xs)=>xs.forEach(x=>out.add(x));
  if(d.grade) add(problemFieldSearchTokens('g',d.grade));
  if(d.semester) add(problemFieldSearchTokens('s',d.semester));
  add(problemFieldSearchTokens('major',d.majorUnit||d.major||''));
  add(problemFieldSearchTokens('middle',d.middleUnit||d.middle||''));
  const concepts=[d.mainConceptId,...(d.relatedConceptIds||[]),...(d.conceptTags||[])].filter(Boolean);
  concepts.forEach(v=>add(problemFieldSearchTokens('concept',v)));
  add(problemFieldSearchTokens('geometry',d.geometryStructure||''));
  add(problemFieldSearchTokens('ask',d.askType||''));
  (d.solutionSkills||[]).forEach(v=>add(problemFieldSearchTokens('skill',v)));
  // 자유검색은 본문/출처의 단어 단위만 인덱싱해 배열 폭증을 방지한다.
  problemLexemes([problemReadableProblemText(d),d.sourceName||d.bookName||''].join(' ')).slice(0,35).forEach(w=>out.add('q:'+problemTokenNorm(w)));
  return [...out].filter(Boolean).slice(0,180);
}
function problemPrimarySearchToken(f){
  const candidates=[
    ['concept',f.concept],['skill',f.skill],['ask',f.ask],['geometry',f.geometry],
    ['middle',f.middle],['major',f.major],['g',f.grade],['s',f.semester]
  ];
  for(const [prefix,val] of candidates){
    const n=problemTokenNorm(val);
    if(n.length>=2) return prefix+':'+n;
  }
  const qword=problemLexemes(f.q||'')[0];
  return qword ? 'q:'+problemTokenNorm(qword) : '';
}

function problemErrorText(e){
  const code=String(e?.code||'').replace(/^firebase\//,'');
  const msg=String(e?.message||e||'알 수 없는 오류')
    .replace(/^FirebaseError:\s*/,'')
    .replace(/\s+/g,' ')
    .trim();
  return [code,msg].filter(Boolean).join(' · ').slice(0,500);
}
function problemTransientError(e){
  const t=(String(e?.code||'')+' '+String(e?.message||e||'')).toLowerCase();
  return /unavailable|deadline-exceeded|aborted|resource-exhausted|internal|network|failed to fetch|timeout|timed out/.test(t);
}
async function problemRetry(task,{tries=3,delay=450}={}){
  let last;
  for(let i=0;i<tries;i++){
    try{return await task(i);}
    catch(e){
      last=e;
      if(i===tries-1||!problemTransientError(e)) throw e;
      await new Promise(r=>setTimeout(r,delay*(i+1)));
    }
  }
  throw last;
}
function problemFirestoreClean(value){
  if(Array.isArray(value)) return value.map(problemFirestoreClean).filter(v=>v!==undefined);
  if(value&&typeof value==='object'&&!(value instanceof Date)){
    const out={};
    Object.entries(value).forEach(([k,v])=>{
      if(v===undefined||typeof v==='function') return;
      out[k]=problemFirestoreClean(v);
    });
    return out;
  }
  return value;
}
function problemSafeSearchTokens(tokens){
  return [...new Set((tokens||[])
    .map(x=>String(x||'').trim())
    .filter(Boolean)
    .map(x=>x.slice(0,120))
  )].slice(0,160);
}
async function problemAddDoc(col,data){
  const clean=problemFirestoreClean(data);
  return problemRetry(async()=>{
    const ref=await fsdb.collection(col).add(clean);
    return ref.id;
  });
}
async function problemSetDoc(col,id,data,merge=true){
  const clean=problemFirestoreClean(data);
  return problemRetry(async()=>{
    await fsdb.collection(col).doc(id).set(clean,{merge});
    return true;
  });
}
async function problemUpdateDoc(col,id,data){
  const clean=problemFirestoreClean(data);
  return problemRetry(async()=>{
    const ref=fsdb.collection(col).doc(id);
    try{ await ref.update(clean); }
    catch(e){
      if(/not-found|No document to update/i.test(String(e?.code||'')+' '+String(e?.message||''))){
        await ref.set(clean,{merge:true});
      }else throw e;
    }
    return true;
  });
}
async function problemDeleteDoc(col,id){
  return problemRetry(async()=>{
    await fsdb.collection(col).doc(id).delete();
    return true;
  },{tries:2,delay:300});
}


function problemCourseMeta(courseId){
  const course=courseById(courseId), name=String(course?.name||'').normalize('NFKC');
  const m=name.match(/([초중고]\s*\d)\s*[-·]?\s*([12])\s*학기/);
  return {
    courseId:courseId||'',
    courseName:name,
    grade:m?m[1].replace(/\s+/g,''):'',
    semester:m?`${m[2]}학기`:''
  };
}
function operationalQuestionSourceKey(q){
  if(!q) return '';
  if(q.sourceType==='TEXTBOOK'){
    return q.sourceKey||textbookSourceKey(q.sourceCourseId,q.sourceBook,q.sourcePage,q.sourceProblemNo);
  }
  if(q.sourceType==='PRINT'){
    const p=sourceNorm(q.printId), no=sourceProblemNorm(q.sourceProblemNo);
    return p&&no ? `print::${p}::q${no}` : '';
  }
  if(q.sourceType==='MNM' && q.problemId) return `mnm::${q.problemId}`;
  return '';
}
function problemOriginRef(originType,originId){
  if(!originId) return null;
  if(originType==='student-question') return {collection:'questions',id:originId};
  if(originType==='learning-library') return {collection:'solutionPhotos',id:originId};
  return null;
}
async function findCanonicalProblemBySourceKey(sourceKey){
  if(!sourceKey) return null;
  if(sourceKey.startsWith('mnm::')){
    const id=sourceKey.slice(5);
    if(id){
      const doc=await fsdb.collection('problems').doc(id).get();
      if(doc.exists) return {id:doc.id,...doc.data()};
    }
  }
  try{
    const snap=await fsdb.collection('problems').where('sourceKeys','array-contains',sourceKey).limit(1).get();
    if(!snap.empty) return {id:snap.docs[0].id,...snap.docs[0].data()};
  }catch(e){ console.warn('[문제 출처키 검색]',e); }
  return null;
}
async function findOpenProblemDraftBySourceKey(sourceKey){
  if(!sourceKey) return null;
  try{
    const snap=await fsdb.collection('problemDrafts').where('sourceKey','==',sourceKey).limit(10).get();
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    return docs.find(d=>!['saved','superseded','error'].includes(d.status)) || docs.find(d=>d.status==='saved') || null;
  }catch(e){ console.warn('[문제후보 출처키 검색]',e); return null; }
}
async function linkProblemOrigin(originType,originId,{problemId='',problemDraftId=''}={}){
  const ref=problemOriginRef(originType,originId);
  if(!ref) return;
  const patch={};
  if(problemId) patch.problemId=problemId;
  if(problemDraftId) patch.problemDraftId=problemDraftId;
  if(problemId) patch.problemLinkedAt=new Date().toISOString();
  else if(problemDraftId) patch.problemCandidateAt=new Date().toISOString();
  if(Object.keys(patch).length) await problemSetDoc(ref.collection,ref.id,patch,true);
}
function operationalProblemMetaFromQuestion(q){
  const sourceKey=operationalQuestionSourceKey(q), cm=problemCourseMeta(q?.sourceCourseId||'');
  const firstPhoto=(q?.photos||[])[0]||null;
  return {
    originType:'student-question', originId:q?.id||'', sourceKey,
    sourceType:q?.sourceType||'question', sourceCourseId:q?.sourceCourseId||'',

async function analyzeOperationalProblemDraft(d){

  const cropKey=d.cropKey||photoStorageKey(d.media?.[0])||'';
  if(!cropKey) return d;
  if(d.analysis?.status==='analyzed') return d;
  try{

    const patch=problemAiPatch(a,d,'operational-vision');
    await problemUpdateDoc('problemDrafts',d.id,patch);
    Object.assign(d,patch);

    d.status='review';
  }

}
async function ensureOperationalProblemCandidate(meta){
  if(!meta?.originType||!meta?.originId) return {status:'ignored'};
  const sourceKey=meta.sourceKey||'';

  // 1. 이미 정식 문제로 존재하면 즉시 연결한다.
  const existing=await findCanonicalProblemBySourceKey(sourceKey);
  if(existing){
    await appendProblemOriginMeta(existing.id,meta);
    await linkProblemOrigin(meta.originType,meta.originId,{problemId:existing.id});
    if(meta.explanation || (meta.explanationPhotos||[]).length){
      await addTeacherExplanationToProblem(existing.id,{text:meta.explanation,photos:meta.explanationPhotos,questionId:meta.originType==='student-question'?meta.originId:''});
    }
    return {status:'linked',problemId:existing.id};
  }

  // 2. 같은 출처의 문제후보가 이미 있으면 새로 만들지 않고 보강한다.
  let draft=await findOpenProblemDraftBySourceKey(sourceKey);
  const problemPhoto=meta.problemPhoto||null;
  const cropKey=photoStorageKey(problemPhoto)||'';
  if(draft){
    const origins=Array.isArray(draft.origins)?draft.origins:[];
    const hasOrigin=origins.some(x=>x.type===meta.originType&&x.id===meta.originId);
    const patch={
      sourceKey:sourceKey||draft.sourceKey||'',
      originTypes:[...new Set([...(draft.originTypes||[]),meta.originType])],
      origins:hasOrigin?origins:[...origins,{type:meta.originType,id:meta.originId,at:new Date().toISOString()}],
      ...(meta.originType==='learning-library'?{solutionAssetIds:[...new Set([...(draft.solutionAssetIds||[]),meta.originId])]}:{}),
      updatedAt:new Date().toISOString()
    };
    if(meta.originType==='learning-library'&&meta.originId) patch.solutionAssetIds=[...new Set([...(draft.solutionAssetIds||[]),meta.originId])];
    if(problemPhoto && !draft.cropKey){
      patch.media=[problemPhoto]; patch.cropKey=cropKey; patch.cropUrl='';
      patch.analysis={...(draft.analysis||{}),needsVision:true,status:'vision-pending'};
    }
    if(meta.problemText && !draft.problemText && !draft.rawText) patch.problemText=meta.problemText;
    if(meta.grade && !draft.grade) patch.grade=meta.grade;
    if(meta.semester && !draft.semester) patch.semester=meta.semester;
    if(meta.explanation) patch.explanation=meta.explanation;
    if((meta.explanationPhotos||[]).length) patch.explanationPhotos=meta.explanationPhotos;
    await problemUpdateDoc('problemDrafts',draft.id,patch);
    Object.assign(draft,patch);
  }else{
    const now=new Date().toISOString();
    const sourceId=await problemAddDoc('problemSources',{
      title:meta.originType==='learning-library'
        ? `${meta.sourceBook||'교재'} ${meta.sourcePage||''}p ${meta.sourceProblemNo||''}번`
        : `학생질문 ${meta.originId}`,
      sourceType:meta.originType,
      sourceKey, courseId:meta.sourceCourseId||'', book:meta.sourceBook||'',
      page:meta.sourcePage||'', problemNo:meta.sourceProblemNo||'', printId:meta.printId||'',
      createdAt:now, ingestVersion:'v92-operational'
    });
    draft={
      sourceId,sourceName:meta.originType==='learning-library'?'학습보관함':'학생질문',
      sourceKey,sourceCourseId:meta.sourceCourseId||'',sourceBook:meta.sourceBook||'',
      sourcePage:meta.sourcePage||'',sourceProblemNo:meta.sourceProblemNo||'',
      problemNo:meta.sourceProblemNo||'',grade:meta.grade||'',semester:meta.semester||'',
      majorUnit:meta.unit||'',middleUnit:'',
      problemText:meta.problemText||'',rawText:meta.problemText||'',questionText:meta.questionText||'',
      type:'short',answer:'',cropKey,media:problemPhoto?[problemPhoto]:[],
      explanation:meta.explanation||'',explanationPhotos:meta.explanationPhotos||[],
      solutionAssetIds:meta.originType==='learning-library'?[meta.originId]:[],
      originTypes:[meta.originType],origins:[{type:meta.originType,id:meta.originId,at:now}],
      analysis:cropKey?{version:PROBLEM_ANALYSIS_VERSION,needsVision:true,status:'vision-pending'}:{version:PROBLEM_ANALYSIS_VERSION,needsVision:false,status:'source-only'},
      autoIntake:true,status:'review',ingestVersion:'v92-operational',createdAt:now,updatedAt:now
    };
    draft.confidence=problemDraftConfidence(draft);
    const id=await problemAddDoc('problemDrafts',draft);
    draft.id=id;
    if(problemStore.ingest.loaded) problemStore.ingest.drafts.unshift(draft);
  }

  await linkProblemOrigin(meta.originType,meta.originId,{problemDraftId:draft.id});

  // 질문 사진이 있으면 사용자를 기다리게 하지 않고 뒤에서 AI 분석한다.
  if(draft.cropKey){
    await analyzeOperationalProblemDraft(draft);
    if(problemDraftStatus(draft)==='ready'){
      if(!problemStore.ingest.drafts.some(x=>x.id===draft.id)) problemStore.ingest.drafts.push(draft);
      const saved=await saveProblemDraft(draft.id,{silent:true});
      if(saved?.problemId){
        await appendProblemOriginMeta(saved.problemId,meta);
        for(const o of (draft.origins||[])) await linkProblemOrigin(o.type,o.id,{problemId:saved.problemId,problemDraftId:draft.id});
        if(meta.explanation || (meta.explanationPhotos||[]).length){
          await addTeacherExplanationToProblem(saved.problemId,{text:meta.explanation,photos:meta.explanationPhotos,questionId:meta.originType==='student-question'?meta.originId:''});
        }
        return {...saved,status:saved.status||'saved'};
      }
    }
  }
  return {status:'candidate',problemDraftId:draft.id};
}

async function saveProblemDraft(draftId,options={}){
  const silent=!!options.silent;
  const d=problemStore.ingest.drafts.find(x=>x.id===draftId);
  if(!d) return {ok:false,status:'missing'};
  const computed=problemDraftStatus(d);
  if(computed!=='ready'){
    if(!silent) alert(`아직 검토가 필요한 문항입니다. (자료완성도 ${problemDraftConfidence(d)}%)`);
    return {ok:false,status:'not-ready'};
  }
  if((d.type||'short')!=='constructed' && !String(d.answer||'').trim()){
    if(!silent) alert('정답 확인 전에는 최종 저장할 수 없습니다.');
    return {ok:false,status:'answer-missing'};
  }
  try{
    const publicData=problemDraftPublicData(d);
    assertNoAnswerLeak(publicData);
    const fpInfo=problemFingerprintInfo(d);
    const dupSnap=fpInfo.safe
      ? await fsdb.collection('problems').where('dedupFingerprint','==',publicData.dedupFingerprint).limit(1).get()
      : {empty:true,docs:[]};
    if(!dupSnap.empty){
      const existingDoc=dupSnap.docs[0], existingId=existingDoc.id, existingData=existingDoc.data()||{};
      const incomingType=d.type||'short';
      const existingType=existingData.type||'short';
      const rank={short:1,mc:2,constructed:3};
      if(incomingType!==existingType && (rank[incomingType]||0)>(rank[existingType]||0)){
        await problemUpdateDoc('problems',existingId,{type:incomingType,updatedAt:new Date().toISOString(),typeAutoRepaired:true});
      }
      if(d.sourceKey || (d.originTypes||[]).length){
        const originPatch={updatedAt:new Date().toISOString()};
        if(d.sourceKey) originPatch.sourceKeys=firebase.firestore.FieldValue.arrayUnion(d.sourceKey);
        if((d.originTypes||[]).length) originPatch.originTypes=firebase.firestore.FieldValue.arrayUnion(...d.originTypes);
        await fsdb.collection('problems').doc(existingId).set(originPatch,{merge:true});
      }
      if((d.type||'short')!=='constructed'){
        const existingKey=await fsdb.collection('problemKeys').doc(existingId).get();
        if(!existingKey.exists){
          const answer=String(d.answer||'').trim();
          if(!answer) throw new Error('duplicate problem has no private answer key and draft answer is empty');
          await problemSetDoc('problemKeys',existingId,{problemId:existingId,answer,acceptedAnswers:Array.isArray(d.acceptedAnswers)&&d.acceptedAnswers.length?d.acceptedAnswers:[answer],explanation:d.explanation||'',sourceDraftId:d.id,repairedFromDuplicate:true,answerSourceFile:d.answerSourceFile||'',answerSourcePage:d.answerSourcePage||null,answerLinkBasis:d.answerLinkBasis||'',updatedAt:new Date().toISOString()});
        }else if(d.answerSourceFile){
          await problemSetDoc('problemKeys',existingId,{answerSourceFile:d.answerSourceFile,answerSourcePage:d.answerSourcePage||null,answerLinkBasis:d.answerLinkBasis||'',updatedAt:new Date().toISOString()});
        }
      }
      await problemUpdateDoc('problemDrafts',d.id,{status:'saved',canonicalProblemId:existingId,duplicateOf:existingId,savedAt:new Date().toISOString(),confidence:problemDraftConfidence(d)});
      d.status='saved'; d.canonicalProblemId=existingId; d.duplicateOf=existingId; d.confidence=problemDraftConfidence(d);
      for(const o of (d.origins||[])){ try{await linkProblemOrigin(o.type,o.id,{problemId:existingId,problemDraftId:d.id});}catch(_){} }
      if(!silent) render();
      return {ok:true,status:'duplicate',problemId:existingId};
    }
    const problemId=await problemAddDoc('problems',publicData);
    if((d.type||'short')!=='constructed'){
      const answer=String(d.answer||'').trim();
      try{
        await problemSetDoc('problemKeys',problemId,{problemId,answer,acceptedAnswers:Array.isArray(d.acceptedAnswers)&&d.acceptedAnswers.length?d.acceptedAnswers:(answer?[answer]:[]),explanation:d.explanation||'',sourceDraftId:d.id,answerSourceFile:d.answerSourceFile||'',answerSourcePage:d.answerSourcePage||null,answerLinkBasis:d.answerLinkBasis||'',updatedAt:new Date().toISOString()});
      }catch(keyErr){
        try{ await problemDeleteDoc('problems',problemId); }catch(_){}
        throw new Error('정답키 저장 실패 · '+problemErrorText(keyErr));
      }
    }
    try{
      await problemUpdateDoc('problemDrafts',d.id,{status:'saved',canonicalProblemId:problemId,savedAt:new Date().toISOString(),confidence:problemDraftConfidence(d)});
    }catch(draftErr){
      console.error('problem draft backlink update failed',draftErr);
      d.saveWarning='초안 상태 동기화 실패 · '+problemErrorText(draftErr);
    }
    d.status='saved'; d.canonicalProblemId=problemId; d.confidence=problemDraftConfidence(d);
    for(const o of (d.origins||[])){ try{await linkProblemOrigin(o.type,o.id,{problemId,problemDraftId:d.id});}catch(_){} }
    if((d.explanation||'') || (d.explanationPhotos||[]).length){
      try{await addTeacherExplanationToProblem(problemId,{text:d.explanation||'',photos:d.explanationPhotos||[],questionId:d.answeredQuestionId||''});}catch(_){}
    }
    if(!silent) render();
    return {ok:true,status:'saved',problemId};
  }catch(e){
    console.error('save problem draft',e);
    const detail=problemErrorText(e);
    if(!silent) alert(`문항 저장 중 오류가 발생했어요.\n${d.problemNo||d.no||d.id}: ${detail}`);
    return {ok:false,status:'error',error:detail,problemNo:d.problemNo||d.no||d.id};
  }
}
async function saveAllReadyProblemDrafts(){
  const run=problemStore.saveRun;
  if(run.active){alert(`이미 저장 중이에요. (${run.done}/${run.total})`);return;}
  const rows=problemStore.ingest.drafts.filter(d=>problemDraftStatus(d)==='ready');
  if(!rows.length){alert('현재 저장 가능한 초안이 없어요.');return;}
  if(!confirm(`${rows.length}문항을 문제저장소에 저장할까요?`))return;

  Object.assign(run,{active:true,total:rows.length,done:0,saved:0,duplicates:0,failed:0,message:`문제 저장 시작 · 0/${rows.length}`,errors:[]});
  render();

  for(let i=0;i<rows.length;i++){
    run.message=`문제 저장 중 · ${i+1}/${rows.length} · ${rows[i].problemNo||rows[i].no||''}`;
    const el=document.getElementById('problemSaveRunStatus');
    if(el) el.textContent=run.message;
    const btn=document.getElementById('problemSaveAllBtn');
    if(btn) btn.textContent=`저장 중 ${i}/${rows.length}`;

    const result=await saveProblemDraft(rows[i].id,{silent:true});
    run.done=i+1;
    const btn2=document.getElementById('problemSaveAllBtn');
    if(btn2) btn2.textContent=`저장 중 ${run.done}/${rows.length}`;
    if(result?.status==='saved') run.saved++;
    else if(result?.status==='duplicate') run.duplicates++;
    else{
      run.failed++;
      run.errors.push({
        id:rows[i].id,
        no:rows[i].problemNo||rows[i].no||rows[i].id,
        error:result?.error||result?.status||'알 수 없는 오류'
      });
    }
  }

  run.active=false;
  run.message=`저장 완료 · 신규 ${run.saved} · 중복연결 ${run.duplicates}${run.failed?` · 실패 ${run.failed}`:''}`;
  problemStore.loaded=false; problemStore.items=[]; problemStore.lastDoc=null;
  render();
  const detail=run.errors.length
    ? '\n\n실패내역\n'+run.errors.slice(0,8).map(x=>`${x.no}: ${x.error}`).join('\n')
    : '';
  alert(run.message+detail);
}
async function createProblemDraftsFromManifest(packet,{confirmWarnings=true}={}){
  const check=validateProblemIngestPacket(packet);
  if(!check.ok) throw new Error('수집 매니페스트 오류: '+check.errors.join(' / '));
  if(check.warnings.length && confirmWarnings && !confirm(`검토 경고 ${check.warnings.length}건이 있습니다.\n\n${check.warnings.slice(0,8).join('\n')}\n\n그래도 수집 대기열을 만들까요?`)) return {cancelled:true};
  const problems=Array.isArray(packet.problems)?packet.problems:[], now=new Date().toISOString(), src=packet.source||{};
  const sourceId=await fsAdd('problemSources',{
    title:src.title||src.fileName||'PDF 원본',fileName:src.fileName||'',sourceType:src.sourceType||'pdf',
    grade:src.grade||'',semester:src.semester||'',majorUnit:src.majorUnit||'',middleUnit:src.middleUnit||'',
    pageCount:Number(src.pageCount||0)||null,problemCount:problems.length,
    ingestMethod:src.ingestMethod||'manifest',segmentationMeta:src.segmentationMeta||null,createdAt:now,ingestVersion:'v87.3'
  });
  if(!sourceId) throw new Error('원본 등록 실패');
  const draftIds=[];
  try{
    for(let i=0;i<problems.length;i++){
      const x=problems[i]||{};
      let draft={...x,sourceId,sourceName:src.title||src.fileName||'',problemNo:x.problemNo||x.no||String(i+1).padStart(2,'0'),
        grade:x.grade||src.grade||'',semester:x.semester||src.semester||'',majorUnit:x.majorUnit||src.majorUnit||'',middleUnit:x.middleUnit||src.middleUnit||'',
        status:'review',ingestVersion:'v87.3',createdAt:now};
      draft=mergeProblemRuleAnalysis(draft);
      draft.confidence=problemDraftConfidence(draft); draft.status=problemDraftStatus(draft);
      const id=await fsAdd('problemDrafts',draft);
      if(!id) throw new Error(`${draft.problemNo}번 초안 저장 실패`);
      draftIds.push(id);
    }
  }catch(e){
    for(const id of draftIds) try{await fsDelete('problemDrafts',id);}catch(_){}
    try{await fsDelete('problemSources',sourceId);}catch(_){}
    throw e;
  }
  problemStore.ingest.loaded=false; await loadProblemIngestQueue();
  return {sourceId,draftIds,count:draftIds.length,warnings:check.warnings};
}

function problemPdfNumberCandidate(raw){
  // 원문자(①②…, ⑴, ❶ 등)는 객관식 보기 번호이지 문항 번호가 아니다. NFKC 정규화 전에 걸러야 한다(정규화하면 ①→1 이 되어 문항 번호로 오인됨).
  if(/^[\s]*[\u2460-\u2473\u2474-\u2487\u24EB-\u24F4\u2776-\u2793\u3251-\u325F\u32B1-\u32BF]/.test(String(raw||''))) return null;
  const s=String(raw||'').normalize('NFKC').replace(/\s+/g,'').trim();
  if(!s) return null;

  // 특정 출판사 PDF: 01이 0101, 02가 0202 ... 로 중복 추출되는 경우.
  // 반드시 일반 숫자보다 먼저 판정해야 0101을 101로 오인하지 않는다.
  let m=s.match(/^0([1-9])0\1$/);
  if(m) return {no:String(Number(m[1])).padStart(2,'0'),n:Number(m[1]),strength:5,kind:'duplicated'};
  if(/^10010$/.test(s)) return {no:'10',n:10,strength:5,kind:'duplicated'};

  const decorated=/[()[\].번:：]/.test(s)||/^문제/.test(s);
  m=s.match(/^(?:문제)?[\[(]?0*([1-9]\d{0,2})[\])?.번:：]?$/);
  if(!m) return null;

  const n=Number(m[1]);
  const digits=s.replace(/\D/g,'');

  return {

}
// 번호와 본문이 한 text item 으로 합쳐진 PDF("1. 18과 24의 …")용. 맨 앞의 "숫자." / "숫자)" 뒤에 공백과 본문이 이어질 때만 인정한다.
// "3.14" 같은 소수, 4자리 이상 숫자, 번호만 있는 줄은 해당하지 않는다. 인정돼도 아래 연속 번호·단 정렬·경계품질 검사를 그대로 거친다.

function problemPdfNormalizeNo(raw){

    if(xn<0.01||xn>0.82||yn<0.02||yn>0.98) continue;
    found.push({...c,x,y,xn,yn,raw:String(it.str||'')});

function problemPdfClusterRails(plans){

    if(p.isAnswerPage) continue;

  }
  if(!pts.length) return {left:null,right:null,clusters:[]};

  const sorted=[...pts].sort((a,b)=>a.xn-b.xn), clusters=[];
  const tol=.016;

    let best=null,dist=Infinity;

    }
    if(!best){best={mean:p.xn,rows:[]};clusters.push(best);}
    best.rows.push(p);
    best.mean=best.rows.reduce((a,x)=>a+x.xn,0)/best.rows.length;

  for(const c of clusters){
    const pages=new Set(c.rows.map(x=>x.page));
    const edgeRatio=c.rows.length?c.rows.filter(x=>x.yn<.09||x.yn>.94).length/c.rows.length:1;
    const positional=(c.mean<.25||(.48<c.mean&&c.mean<.75))?10:0;
    const baseScore=c.rows.reduce((a,x)=>a+Number(x.strength||1),0)+pages.size*1.5+positional;
    c.edgeRatio=edgeRatio;

    c.pageCount=pages.size;
  }
  const pickRail=(group)=>{
    const usable=group.filter(c=>c.edgeRatio<=.70);
    if(!usable.length) return null;
    const top=Math.max(...usable.map(c=>c.score));
    const viable=usable.filter(c=>c.pageCount>=2&&c.score>=Math.max(18,top*.55));
    const pool=viable.length?viable:[...usable].sort((a,b)=>b.score-a.score).slice(0,1);

    return [...pool].sort((a,b)=>a.mean-b.mean)[0]||null;

function problemPdfSequentialLabels(plans,rails){

  // ②사슬이 걸친 쪽 수가 적은 것(문제 쪽에 모여 있음) ③시작 번호가 1 ④앞선 것.

  };

    if(!best||c.strength>best.strength

  const acceptedPages=new Set(accepted.map(x=>x.page));

}
// 영역 아래 끝: 다음 영역 시작 글자(nextTop, 쪽 위 기준)의 윗부분이 걸치지 않도록 기준선 위 14pt 까지 내려 자르되,
// 이 영역 안 마지막 글줄 기준선 아래 3pt 밑으로는 올리지 않고(밀집 조판 보호), 기준선 위 7pt 아래로는 내려가지 않는다.
function problemPdfRegionBottom(p,x0,x1,top,nextTop){
  const hi=nextTop-7;

  for(const it of p.items||[]){
    if(!String(it.str||'').trim()) continue;
    const tr=it.transform||[], ix=Number(tr[4]||0), base=p.height-Number(tr[5]||0);
    if(ix<x0+8||ix>x1-4||base<top+4||base>=nextTop-4) continue;

  }

// ---- 번호 없는 대표 문항(대표유형/대표문제) ----
// 기준: 원본에 '유형 01' 같은 유형 번호가 있으면 그 번호로 안정적인 식별자('유형01-대표')를 만든다.
// 원본(문제 쪽 전체)에 유형 번호가 전혀 없을 때만 앱이 쪽 순서대로 '대표01…'을 부여한다(원본 인쇄 번호가 아님, idSource='app-generated').
// 유형 번호가 빠졌거나 겹치면 추측하지 않고 식별자에 쪽·단을 넣고 reviewReason 을 남겨 검토로 둔다.
const PROBLEM_PDF_TYPE_HEAD_RE=/^유형\s*0*(\d{1,3})(?=\s|$)/;

function problemPdfRepresentativeRegions(plans,rails,numbered){
  const twoCol=!!rails.right, ev=[];
  for(const p of plans){
    if(p.isAnswerPage) continue;
    for(const it of p.items||[]){
      const str=String(it.str||'').trim(); if(!str) continue;
      const tr=it.transform||[], x=Number(tr[4]||0), top=p.height-Number(tr[5]||0), xn=x/Math.max(1,p.width);
      if(!Number.isFinite(x)||!Number.isFinite(top)||top<p.height*.03||top>p.height*.96) continue;
      const head=str.match(PROBLEM_PDF_TYPE_HEAD_RE), mark=!head&&PROBLEM_PDF_REP_MARK_RE.test(str);
      if(!head&&!mark) continue;

        const L=rails.left?rails.left.mean:.09, R=rails.right.mean;
        if(xn<.5){ if(xn>L+.07) continue; side='L'; } else { if(xn>R+.07||xn<R-.05) continue; side='R'; }
      }else if(xn>.25) continue;

    else if(!m.head){ problemNo=`대표-p${m.page}${m.side}${seq}`; idSource='unresolved'; reviewReason='type-number-missing'; }
    else if(count.get(m.head.no)>1){ problemNo=`유형${String(m.head.no).padStart(2,'0')}-대표@p${m.page}${m.side}`; idSource='unresolved'; reviewReason='type-number-duplicate'; typeNo=String(m.head.no).padStart(2,'0'); }

    if(twoCol){ if(m.side==='L'){x0=0;x1=p.width*.505;} else {x0=p.width*.495;x1=p.width;} }
    const top=Math.max(0,m.top-14);
    // 아래 끝: 같은 단에서 이 표시 다음에 나오는 번호 문항 또는 다음 유형 제목/대표 표시

    for(const e of ev) if(e!==m&&e.page===m.page&&e.side===m.side&&e.top>m.top+4) nextTop=nextTop===null?e.top:Math.min(nextTop,e.top);
    const bottom=nextTop!==null?problemPdfRegionBottom(p,x0,x1,top,nextTop):p.height-22;
    out.push({problemNo,printedProblemNo:'',page:m.page,x0,y0:top,x1,y1:Math.min(p.height,bottom),column:m.side,markerX:m.x,markerY:m.top,
      segmentationMethod:'text-rail-sequence',markerPrefixLen:0,idSource,typeNo,reviewReason,representative:true});
  }

// ---- '심화 01'처럼 유형/문항 번호와 별도 체계를 쓰는 심화문제 ----
// 빠른정답 표가 '심화01' 답을 제공하는 교재에서는 문제 쪽의 '심화 01' 라벨도 같은 ID로 수집해야 한다.
const PROBLEM_PDF_ADVANCED_MARK_RE=/^심화\s*0*(\d{1,2})$/;
function problemPdfAdvancedRegions(plans,numbered){
  const events=[];

    if(p.isAnswerPage) continue;
    for(const it of p.items||[]){
      const str=String(it.str||'').normalize('NFKC').trim(), m=str.match(PROBLEM_PDF_ADVANCED_MARK_RE);
      if(!m) continue;
      const tr=it.transform||[], x=Number(tr[4]||0), top=p.height-Number(tr[5]||0), xn=x/Math.max(1,p.width);
      if(!Number.isFinite(x)||!Number.isFinite(top)||xn<.04||xn>.82||top<p.height*.03||top>p.height*.96) continue;
      events.push({p,page:p.pageNo,n:Number(m[1]),x,top,xn,side:xn>=.48?'R':'L',item:it});
    }

  if(!events.length) return [];
  events.sort((a,b)=>a.page-b.page||(a.side===b.side?a.top-b.top:(a.side==='L'?-1:1)));
  const counts=new Map(); for(const e of events) counts.set(e.n,(counts.get(e.n)||0)+1);
  const pageHasRight=new Set(events.filter(e=>e.side==='R').map(e=>e.page));
  return events.map((e,i)=>{
    const twoCol=pageHasRight.has(e.page), x0=twoCol?(e.side==='L'?0:e.p.width*.495):0, x1=twoCol?(e.side==='L'?e.p.width*.505:e.p.width):e.p.width;
    const top=Math.max(0,e.top-14), id='심화'+String(e.n).padStart(2,'0');
    let nextTop=null;
    for(const n of events) if(n.page===e.page&&n.side===e.side&&n.top>e.top+4) nextTop=nextTop===null?n.top:Math.min(nextTop,n.top);
    for(const n of numbered||[]){
      const sameColumn=n.column===e.side||(e.side==='L'&&n.column==='FULL'&&!twoCol);
      if(n.page===e.page&&sameColumn&&Number.isFinite(n.markerY)&&n.markerY>e.top+4) nextTop=nextTop===null?n.markerY:Math.min(nextTop,n.markerY);
    }
    const bottom=nextTop!==null?problemPdfRegionBottom(e.p,x0,x1,top,nextTop):e.p.height-22;

      problemNo:duplicate?id+'@p'+e.page+e.side:id,
      printedProblemNo:id,page:e.page,x0,y0:top,x1,y1:Math.min(e.p.height,bottom),
      column:twoCol?e.side:'FULL',markerX:e.x,markerY:e.top,
      segmentationMethod:'text-rail-sequence',markerPrefixLen:0,
      idSource:duplicate?'unresolved':'printed-advanced-number',typeNo:id,advanced:true,
      reviewReason:duplicate?'advanced-number-duplicate':''

  });
}
function problemPdfBuildRegions(plans){
  const rails=problemPdfClusterRails(plans);
  const seq=problemPdfSequentialLabels(plans,rails);
  const all=[], usedPrinted=new Set(), hasDuplicatePrinted=seq.labels.some((x,i,a)=>a.findIndex(y=>y.n===x.n)!==i);

  for(let i=0;i<seq.labels.length;i++){
    const label=seq.labels[i], p=plans.find(x=>x.pageNo===label.page); if(!p) continue;
    const peers=seq.labels.filter(x=>x.page===label.page&&x.side===label.side).sort((a,b)=>b.y-a.y);
    const idx=peers.indexOf(label), next=idx>=0?peers[idx+1]:null;
    const twoCol=!!rails.right;
    let x0=0,x1=p.width;
    if(twoCol){
      if(label.side==='L'){x0=0;x1=p.width*.505;}
      else{x0=p.width*.495;x1=p.width;}
    }
    const markerTop=p.height-label.y;
    const top=Math.max(0,markerTop-14);
    const bottom=next?problemPdfRegionBottom(p,x0,x1,top,p.height-next.y):p.height-22;
    const printedNo=String(label.n).padStart(2,'0');
    const problemNo=hasDuplicatePrinted?String(i+1).padStart(3,'0'):printedNo;
    all.push({
      problemNo,printedProblemNo:printedNo,page:p.pageNo,x0,y0:top,x1,y1:Math.min(p.height,bottom),
      column:twoCol?label.side:'FULL',markerX:label.x,markerY:markerTop,
      segmentationMethod:'text-rail-sequence',markerPrefixLen:Number(label.prefixLen||0)
    });
    usedPrinted.add(printedNo);
  }
  const reps=problemPdfRepresentativeRegions(plans,rails,all);
  const advanced=problemPdfAdvancedRegions(plans,all);
  if(reps.length||advanced.length){
    all.push(...reps,...advanced);
    const rank=r=>r.column==='R'?1:0;
    const advancedByPage=new Map();
    for(const r of advanced){ const list=advancedByPage.get(r.page)||[]; list.push(r); advancedByPage.set(r.page,list); }
    const gridPages=new Set();
    for(const [page,list] of advancedByPage){
      if(list.filter(r=>r.column==='L').length>=2&&list.filter(r=>r.column==='R').length>=2) gridPages.add(page);
    }
    all.sort((a,b)=>{
      if(a.page!==b.page) return a.page-b.page;
      if(gridPages.has(a.page)) return a.y0-b.y0||a.x0-b.x0;
      return rank(a)-rank(b)||a.y0-b.y0;
    });
  }
  return {
    regions:all,
    meta:{
      representative:reps.length,
      advanced:advanced.length,
      method:'text-rail-sequence',
      quality:seq.quality,
      detected:all.length,
      candidateCount:seq.candidateCount,
      noise:seq.noise,gaps:seq.gaps,resets:seq.resets,
      layout:rails.right?'two-column':'single-column',
      leftRail:rails.left?Number(rails.left.mean.toFixed(4)):null,
      rightRail:rails.right?Number(rails.right.mean.toFixed(4)):null
    }
  };
}

// ---- 쪽 마지막 문항 아래쪽 정리 ----
// 다음 문항 번호가 없는 쪽의 마지막 문항은 영역이 쪽 아래 끝까지 늘어나 안내 상자·꼬리말·쪽 번호가 본문 글과 문항 이미지에 섞인다.
// 보수적 규칙: (1) 문항 안 글 줄 사이에 쪽 높이의 25% 이상 빈틈이 있고 (2) 그 뒤의 글이 모두 쪽 아래 20% 구역에만 있을 때만 그 틈에서 자른다.
// 빈틈 안에 그림(화면에 그려진 어두운 픽셀 3행 이상)이 있으면 그림 끝까지는 남긴다. 조건이 하나라도 안 맞으면 자르지 않는다(그림·소문항 손실 방지).
const PROBLEM_PDF_TRAIL_GAP=.25, PROBLEM_PDF_TRAIL_ZONE=.80;
// 꼬리말 구역 규칙: 쪽 아래 8% 안의 줄이 (a) 쪽 번호 모양("3", "1 / 2", "- 3 -", "3쪽")이거나, (b) 다른 쪽의 같은 위치(±3pt, ±8pt)에도 글이 있거나(반복되는 꼬리말), (c) 쪽 아래 4% 안이면 꼬리말로 본다.
// 꼬리말은 큰 빈틈이 없어도 문항에서 제외한다. 본문과 꼬리말 사이(빈틈)에 그림이 있으면 아래 ink 검사로 남긴다.
const PROBLEM_PDF_FOOTER_BAND=.92, PROBLEM_PDF_FOOTER_EDGE=.96;
const PROBLEM_PDF_PAGE_NUMBER_RE=/^\s*[-–—]?\s*\d{1,4}\s*(?:\/\s*\d{1,4})?\s*(?:쪽|페이지|p|P|page|Page)?\s*[-–—]?\s*$/;
function problemPdfFooterRecurrence(plans){
  const bottom=new Map();   // 쪽 번호 -> 아래 구역 글 위치 목록
  for(const p of plans||[]){
    const list=[];
    for(const it of p.items||[]){
      if(!String(it.str||'').trim()) continue;
      const tr=it.transform||[], yb=p.height-Number(tr[5]||0), x=Number(tr[4]||0);
      if(Number.isFinite(yb)&&Number.isFinite(x)&&yb>=PROBLEM_PDF_FOOTER_BAND*p.height) list.push({yb,x});
    }
    bottom.set(p.pageNo,list);
  }
  return (pageNo,it,pageHeight)=>{
    if(bottom.size<2) return false;   // 한 쪽짜리 PDF 는 반복 여부를 알 수 없다
    const tr=it.transform||[], yb=pageHeight-Number(tr[5]||0), x=Number(tr[4]||0);
    for(const [n,list] of bottom) if(n!==pageNo&&list.some(o=>Math.abs(o.yb-yb)<=3&&Math.abs(o.x-x)<=8)) return true;
    return false;
  };
}
function problemPdfTrailingCut(items,region,pageHeight,opts){
  const recur=opts&&opts.recur, rows=[];
  for(const it of items||[]){
    const str=String(it.str||'').trim(); if(!str) continue;
    const tr=it.transform||[], x=Number(tr[4]||0), yb=pageHeight-Number(tr[5]||0);
    const h=Math.abs(Number(it.height||tr[3]||10))||10;
    if(!Number.isFinite(x)||!Number.isFinite(yb)) continue;
    // 쪽 가운데 정렬 꼬리말("M&m · 91")은 두 단 사이 경계를 가로지른다. 오른쪽 단에서는 글 시작점이 단 왼쪽 경계 바로 앞이라도, 쪽 아래 구역 글이 이 영역과 가로로 겹치면 꼬리말로 본다.
    const w=Number(it.width)||0, inFooterBand=yb>=PROBLEM_PDF_FOOTER_BAND*pageHeight, overlapsRegion=inFooterBand&&x+w>region.x0+2&&x<region.x1-4;
    if((x<region.x0+8&&!overlapsRegion)||x>region.x1-4||yb<region.y0) continue;
    rows.push({yb,x,str,top:yb-h*.9,bottom:yb+h*.25,recur:!!(recur&&recur(it))});
  }
  rows.sort((a,b)=>a.yb-b.yb||a.x-b.x);
  const lines=[];
  for(const r of rows){
    const l=lines[lines.length-1];
    if(l&&Math.abs(r.yb-l.yb)<=4){ l.top=Math.min(l.top,r.top); l.bottom=Math.max(l.bottom,r.bottom); l.text+=r.str; l.recur=l.recur||r.recur; }
    else lines.push({yb:r.yb,top:r.top,bottom:r.bottom,text:r.str,recur:r.recur});
  }
  let a=null, b=null;
  // 규칙 A: 큰 빈틈(쪽 높이 25%↑) 뒤의 글이 모두 쪽 아래 20% 구역
  for(let i=0;i<lines.length-1&&!a;i++){
    if(lines[i+1].top-lines[i].bottom<PROBLEM_PDF_TRAIL_GAP*pageHeight) continue;
    if(lines.slice(i+1).every(l=>l.top>=PROBLEM_PDF_TRAIL_ZONE*pageHeight)) a={lastBodyBottom:lines[i].bottom,trailStart:lines[i+1].top,trailLines:lines.length-1-i,rule:'gap'};
  }
  // 규칙 B: 맨 끝의 줄들이 꼬리말(쪽 번호 모양·반복 위치·맨 아래 4%)
  const isFooter=l=>l.yb>=PROBLEM_PDF_FOOTER_BAND*pageHeight&&(l.yb>=PROBLEM_PDF_FOOTER_EDGE*pageHeight||l.recur||PROBLEM_PDF_PAGE_NUMBER_RE.test(l.text));
  let f=lines.length; while(f>1&&isFooter(lines[f-1])) f--;
  if(f<lines.length) b={lastBodyBottom:lines[f-1].bottom,trailStart:lines[f].top,trailLines:lines.length-f,rule:'footer'};
  if(a&&b) return a.trailStart<=b.trailStart?a:b;
  return a||b;
}
async function problemPdfInkRuns(page,x0,x1,yFrom,yTo,thr=215){
  const vp=page.getViewport({scale:1}), canvas=document.createElement('canvas');
  canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height);
  const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const xa=Math.max(0,Math.floor(x0)), xb=Math.min(canvas.width,Math.ceil(x1)), ya=Math.max(0,Math.floor(yFrom)), yb=Math.min(canvas.height,Math.ceil(yTo));
  if(xb<=xa||yb<=ya) return [];
  const w=xb-xa, data=ctx.getImageData(xa,ya,w,yb-ya).data, rows=[];
  for(let y=0;y<yb-ya;y++){
    let n=0; for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(data[i]*.3+data[i+1]*.59+data[i+2]*.11<thr) n++; }
    rows.push(n>=2);
  }
  const runs=[]; let st=-1;
  for(let y=0;y<=rows.length;y++){
    if(y<rows.length&&rows[y]){ if(st<0) st=y; }
    else if(st>=0){ if(y-st>=3) runs.push({top:ya+st,bottom:ya+y}); st=-1; }   // 가는 선(1~2행)은 그림으로 보지 않는다
  }
  return runs;
}
// ---- 교사용 쪽 안의 "정답/풀이" 줄 잘라내기 ----
// 교사용 교재는 문제 바로 아래에 빨간 "정답 ④ / 풀이"가 같은 쪽 안에 인쇄돼 있다(실제 교재에서 재현). 그대로 두면 문항 이미지와 본문 글에
// 정답이 섞여 학생에게 보일 수 있다. 문항 영역 안에서 줄의 맨 앞이 "정답"(뒤에 한글이 붙는 "정답을"·"정답은" 같은 문장은 제외)인 첫 줄을 찾아
// 그 줄 위에서 영역을 자르고, 잘랐다는 표시(inlineAnswerCut)를 남긴다. 정답 줄이 번호 글줄 바로 밑(18pt 이내)이라 남는 문제 본문이 없으면 자르지 않고 검토 사유를 남긴다.
// 정답 값 자체는 이 단계에서 읽어 쓰지 않는다(정답표가 있을 때만 연결, 없으면 검토).
const PROBLEM_PDF_INLINE_ANSWER_RE=/^정답(?:[\s:：]|[^가-힣]|$)/;   // 공백을 남긴 줄 글에서 판정("정답 제3사분면"은 인정, "정답은 …"·"정답을 …" 문장은 제외)
function problemPdfCutInlineAnswers(plans,regions){
  for(const r of regions){
    const plan=plans.find(p=>p.pageNo===r.page); if(!plan) continue;
    const rows=[];
    for(const it of plan.items||[]){
      const str=String(it.str||''); if(!str.trim()) continue;
      const tr=it.transform||[], x=Number(tr[4]||0), y=plan.height-Number(tr[5]||0);
      if(!Number.isFinite(x)||!Number.isFinite(y)) continue;
      if(x<r.x0+8||x>r.x1-4||y<r.y0+20||y>r.y1+4) continue;
      let row=rows.find(q=>Math.abs(q.y-y)<=3); if(!row){row={y,items:[]};rows.push(row);} row.items.push({x,s:str});
    }
    rows.sort((a,b)=>a.y-b.y);
    for(const row of rows){
      row.items.sort((a,b)=>a.x-b.x);
      const text=row.items.map(i=>i.s).join('').normalize('NFKC').replace(/\s+/g,' ').trim();
      if(!PROBLEM_PDF_INLINE_ANSWER_RE.test(text)) continue;
      const cut=row.y-14;                       // 글줄 기준선 위로 14pt (글자 윗부분 포함)
      const base=Number.isFinite(r.markerY)?r.markerY:r.y0+14;   // 번호가 있는 글줄 기준선
      if(cut>=base+4){ r.y1=Math.min(r.y1,cut); r.inlineAnswerCut=true; }
      else if(!r.reviewReason) r.reviewReason='inline-answer-not-trimmed';
      break;
    }
  }
  return regions;
}
async function problemPdfTrimTrailingRegions(pages,plans,regions){
  const recurs=problemPdfFooterRecurrence(plans), last=new Map();
  for(const r of regions){ const k=r.page+'|'+(r.column||'FULL'), cur=last.get(k); if(!cur||r.y0>cur.y0) last.set(k,r); }
  for(const r of last.values()){
    try{
      const plan=plans.find(p=>p.pageNo===r.page); if(!plan) continue;
      const cut=problemPdfTrailingCut(plan.items,r,plan.height,{recur:it=>recurs(plan.pageNo,it,plan.height)}); if(!cut) continue;
      const runs=await problemPdfInkRuns(pages[r.page],r.x0,r.x1,cut.lastBodyBottom+1,cut.trailStart-2);
      const figBottom=runs.length?Math.max(...runs.map(x=>x.bottom)):0;
      // 마지막 본문 줄에 바로 이어지는 옅은 음영 영역(안내 상자 등)은 끝까지 포함해 가장자리가 잘리지 않게 한다
      const light=await problemPdfInkRuns(pages[r.page],r.x0,r.x1,cut.lastBodyBottom+1,cut.trailStart-2,250);
      const touch=light.find(x=>x.top<=cut.lastBodyBottom+6), boxBottom=touch?touch.bottom:0;
      const nb=Math.min(Math.max(cut.lastBodyBottom,figBottom,boxBottom)+8,cut.trailStart-2);
      const y1=Math.min(r.y1,Math.max(nb,r.y0+55));
      if(y1<r.y1){ r.y1=y1; r.trailingTrimmed=true; }
    }catch(e){ console.warn('problem region trailing trim skipped',e); }
  }
  return regions;
}

function problemPdfSourceMeta(fileName){
  const name=String(fileName||''), stem=name.replace(/\.pdf$/i,'');
  const grade=(name.match(/(초[4-6]|중[1-3]|고[1-3])/)||[])[1]||'';
  let semester=/(?:초|중|고)\d-2|2학기/.test(name)?'2학기':/(?:초|중|고)\d-1|1학기/.test(name)?'1학기':'';
  if(!semester && /^중2\s+실전pick\s+중2-0[12]\b/i.test(stem)) semester='2학기';

  // 기존 실전Pick 형식
  let m=stem.match(/(?:Plus\s*)?(?:중\d(?:-\d)?\s*)?0\d\s+(.+?)(?:\s*\(\d+\))?$/i);
  let unit=m?m[1].trim():'';

  // [불곰스터디 ...] 05 도형의 닮음 문제-1 / 04 여러가지 사각형 문제 / 01 ... 해설 형식
  if(!unit){
    const cleaned=stem.replace(/^\[[^\]]+\]\s*/,'').trim();
    m=cleaned.match(/^(?:0?)(\d{1,3})\s+(.+?)(?=\s+(?:문제|해설)(?:\s|[-(]|$)|\s*\(\d+주차\)|$)/i);
    if(m) unit=String(m[2]||'').replace(/\s+/g,' ').trim();
  }

  // 제목 끝의 회차/파일 역할 표현은 단원명에서 제거
  unit=unit.replace(/\s+(?:문제|해설)(?:-\d+)?(?:\(\d+주차\))?$/i,'').replace(/\s*\(\d+주차\)$/i,'').trim();
  return {grade,semester,majorUnit:unit,middleUnit:unit};
}
function problemPdfDecodePrivateGlyphs(value){
  const map={
    '\uE034':'1','\uE035':'2','\uE036':'3','\uE037':'4','\uE038':'5',
    '\uE039':'6','\uE03A':'7','\uE03B':'8','\uE03C':'9','\uE03D':'0',
    '\uE047':'=','\uE04F':':','\uE053':'/','\uE054':'∥',
    '\uE0C8':'°','\uE0AC':'π','\uE048':'+','\uE046':'+',
    '\uE0F0':'ℓ','\uE0FC':'x','\uE0FD':'y',
    // HancomEQN에서 선분/윗줄 표시용으로 반복 삽입되는 글리프.
    '\uE06D':''
  };
  let unknown=0;
  let out='';
  for(const ch of String(value||'')){
    const cp=ch.codePointAt(0);
    if(Object.prototype.hasOwnProperty.call(map,ch)){ out+=map[ch]; continue; }
    if((cp>=0xE000&&cp<=0xF8FF)||ch==='�'||ch==='□'){
      unknown++;
      // 알 수 없는 수식 글리프는 화면에 네모로 노출하지 않고 공백 처리.
      out+=' ';
      continue;
    }
    out+=ch;
  }
  out=out
    .replace(/[ \t]+/g,' ')
    .replace(/\s*([=:+/°])\s*/g,'$1')
    .replace(/\n[ \t]+/g,'\n')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
  return {text:out,unknown};
}
function problemPdfDecodeText(value){
  return problemPdfDecodePrivateGlyphs(value).text;
}
function problemTextGlyphIssue(value){
  const raw=String(value||'');
  const decoded=problemPdfDecodePrivateGlyphs(raw);
  const privateCount=(raw.match(/[\uE000-\uF8FF�□]/g)||[]).length;
  return {has:privateCount>0,privateCount,unknown:decoded.unknown,text:decoded.text};
}

function problemPdfRegionText(items,region,pageHeight){
  const rows=[];
  for(const it of items||[]){
    const tr=it.transform||[], x=Number(tr[4]||0), y=pageHeight-Number(tr[5]||0);
    if(x<region.x0+8||x>region.x1-4||y<region.y0-4||y>region.y1+4) continue;
    const text=String(it.str||'').trim(); if(!text) continue;
    // 문제번호와 같은 숫자가 본문에 다시 나올 수 있으므로, 실제 marker 좌표의 항목만 제거한다.
    if(Number.isFinite(region.markerX)&&Number.isFinite(region.markerY)&&Math.abs(x-region.markerX)<12&&Math.abs(y-region.markerY)<12){
      // 번호와 본문이 한 덩어리인 항목은 번호 앞부분만 떼고 본문은 남긴다.
      if(region.markerPrefixLen>0){
        const rest=String(it.str||'').normalize('NFKC').slice(region.markerPrefixLen).trim();
        if(rest) rows.push({x,y,s:rest});
      }
      continue;
    }
    rows.push({x,y,s:text});
  }
  rows.sort((a,b)=>Math.abs(a.y-b.y)>4?a.y-b.y:a.x-b.x);
  let out='',lastY=null;
  for(const r of rows){ if(lastY!==null&&Math.abs(r.y-lastY)>7) out+='\n'; else if(out&&!out.endsWith('\n')) out+=' '; out+=r.s; lastY=r.y; }
  const cleaned=out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  return problemPdfDecodeText(cleaned);
}

const PROBLEM_PDF_ANSWER_TITLE_RE=/정답표|빠른\s*정답|빠른\s*답|정답\s*(?:및|과)\s*해설|정답\s*및\s*풀이|답안표|정답\s*모음|해답/i;
// 같은 줄(y 좌표가 거의 같은 text item 들)을 붙여 한 줄 글로 만든다. 글자 조각마다 item 이 나뉜 PDF 도 한 줄이 된다.
// 글 폭(w)을 아는 경우 앞 글 끝과 다음 글 시작 사이가 PROBLEM_PDF_LINE_BREAK_GAP 보다 넓으면 다른 덩어리로 나눈다
// (꼬리말의 왼쪽 안내문과 오른쪽 끝 라벨이 한 줄로 이어 붙어 제목처럼 보이는 것을 막는다). 글 조각이 맞붙은 PDF 는 간격이 거의 0이라 한 줄로 유지된다.
const PROBLEM_PDF_LINE_BREAK_GAP=18;
function problemPdfAnswerTextLines(items){
  const out=[];
  for(const r of problemPdfGroupAnswerRows(items)){
    let cur=[], prevEnd=null;
    for(const it of r.items){
      if(cur.length&&prevEnd!==null&&it.w!==null&&it.x-prevEnd>PROBLEM_PDF_LINE_BREAK_GAP){ out.push(cur.join('')); cur=[]; }
      cur.push(it.text);
      prevEnd=it.w!==null?it.x+it.w:null;
    }
    if(cur.length) out.push(cur.join(''));
  }
  return out;
}
// 정답표 '제목' 줄: 짧고, 문장이 아니어야 한다. "정답은 마지막 쪽의 정답표에서 확인하세요." 같은 안내 문장은 제목이 아니다.
function problemPdfLineIsAnswerTitle(line){
  const t=String(line||'').normalize('NFKC').replace(/\s+/g,'');
  if(!t||t.length>60||!PROBLEM_PDF_ANSWER_TITLE_RE.test(t)) return false;
  if(/(?:다|요|까|죠)?[.!?。]$|(?:다|요|까|죠)$/.test(t)) return false;
  return true;
}
// lines: 줄 단위 글(problemPdfAnswerTextLines). 있으면 제목 줄로만 판정하고, 없으면(호환) 종전처럼 쪽 전체에서 키워드를 찾는다.
function problemPdfIsAnswerPageText(pageText,lines){
  const t=String(pageText||'').normalize('NFKC').replace(/\s+/g,' ').trim();
  if(!t) return false;
  if(Array.isArray(lines)){ if(lines.some(problemPdfLineIsAnswerTitle)) return true; }
  else if(PROBLEM_PDF_ANSWER_TITLE_RE.test(t)) return true;
  // '정답을 구하시오' 같은 문제 문장과 구분하기 위해 페이지 앞부분의 제목형 '정답/답안'만 인정.
  const head=t.slice(0,180);
  return /^(?:[^가-힣A-Za-z0-9]{0,8})?(?:정답|답안)(?:\s|$|[·:：\-])/i.test(head);
}

function parseMnmJsonLoose(raw){
  const text=String(raw||'').trim();
  if(!text) return {};
  try{return JSON.parse(text);}catch(_){}
  // ```json ... ``` 응답
  const fenced=text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fenced){
    try{return JSON.parse(fenced[1].trim());}catch(_){}
  }
  // 설명문이 JSON 앞/뒤에 붙은 경우 첫 완전한 JSON 객체/배열만 추출.
  const starts=[];
  for(let i=0;i<text.length;i++) if(text[i]==='{'||text[i]==='[') starts.push(i);
  for(const start of starts){
    const open=text[start], close=open==='{'?'}':']';
    let depth=0,inStr=false,esc=false;
    for(let i=start;i<text.length;i++){
      const ch=text[i];
      if(esc){esc=false;continue;}
      if(ch==='\\'&&inStr){esc=true;continue;}
      if(ch==='"'){inStr=!inStr;continue;}
      if(inStr) continue;
      if(ch===open) depth++;
      else if(ch===close){
        depth--;
        if(depth===0){
          const candidate=text.slice(start,i+1);
          try{return JSON.parse(candidate);}catch(_){break;}
        }
      }
    }
  }
  throw new Error('AI 응답에서 JSON 데이터를 찾지 못했습니다.');
}
async function readMnmJsonResponse(res){
  const raw=await res.text();
  try{return parseMnmJsonLoose(raw);}
  catch(e){
    const sample=String(raw||'').replace(/\s+/g,' ').slice(0,180);
    throw new Error(`${e.message}${sample?` · 응답: ${sample}`:''}`);
  }
}

async function problemPdfVisionRegions(pdf,pages,file,say,plans=[]){
  if(!PROBLEM_SEGMENT_API) throw new Error('AI 페이지 분리 서버가 연결되지 않았습니다.');
  const out=[];
  for(let n=1;n<=pdf.numPages;n++){
    const plan=plans.find(x=>x.pageNo===n);
    if(plan?.isAnswerPage) continue;
    say(`AI 문항경계 탐지 ${n}/${pdf.numPages}`);
    const blob=await problemPdfPageImageBlob(pages[n]);
    const pageFile=new File([blob],`${file.name.replace(/\.pdf$/i,'')}_page${n}.jpg`,{type:'image/jpeg'});
    const ref=await storeProblemCropFile(pageFile,{kind:'problem-page-segmentation'});
    const key=photoStorageKey(ref);
    if(!key) throw new Error(`${n}페이지 임시 이미지가 R2에 저장되지 않았습니다.`);
    try{
      const token=await photoApiToken();
      const res=await fetch(PROBLEM_SEGMENT_API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'X-MNM-Role':session?.mode||'user'},body:JSON.stringify({cropKey:key,page:n,fileName:file.name})});
      let data={};
      try{ data=await readMnmJsonResponse(res); }
      catch(parseErr){
        if(!res.ok) throw parseErr;
        throw new Error(`AI 페이지 분리 응답 해석 실패 · ${parseErr.message}`);
      }
      if(!res.ok) throw new Error([data?.error||`페이지 분리 ${res.status}`,data?.detail].filter(Boolean).join(' · '));
      for(const seg of (data.segments||[])){
        const left=Number(seg.left),top=Number(seg.top),right=Number(seg.right),bottom=Number(seg.bottom);
        if(!(right>left&&bottom>top)) continue;
        out.push({problemNo:String(seg.problemNo||out.length+1).padStart(2,'0'),page:n,
          x0:left*pages[n].getViewport({scale:1}).width,y0:top*pages[n].getViewport({scale:1}).height,
          x1:right*pages[n].getViewport({scale:1}).width,y1:bottom*pages[n].getViewport({scale:1}).height,column:'AI'});
      }
    } finally { try{await deleteStoredPhoto(ref);}catch(_){} }
  }
  return out;
}

async function problemPdfCropBlob(page,r){
  const scale=2, vp=page.getViewport({scale}), canvas=document.createElement('canvas');
  canvas.width=Math.ceil((r.x1-r.x0)*scale); canvas.height=Math.ceil((r.y1-r.y0)*scale);
  const ctx=canvas.getContext('2d',{alpha:false}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx,viewport:vp,transform:[1,0,0,1,-r.x0*scale,-r.y0*scale]}).promise;
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('crop 변환 실패')),'image/jpeg',.86));
}

function problemPdfChoiceAnswer(s){
  const t=String(s||'').trim();
  return /^[①②③④⑤]$/.test(t)?t:'';
}
function problemPdfAnswerNoKey(v){
  let t=String(v||'').normalize('NFKC').trim();
  if(!t) return '';
  t=t.replace(/^문제\s*/,'')
     .replace(/^[\[(]\s*/,'')
     .replace(/\s*[\])]\s*$/,'')
     .replace(/\s*(?:번|[.．:：\-])\s*$/,'')
     .trim();
  if(!/^\d{1,3}$/.test(t)) return '';
  const n=Number(t);
  if(!Number.isFinite(n)||n<1||n>300) return '';
  return String(n).padStart(2,'0');
}
// NFKC 는 전각 숫자·공백 정리에는 좋지만 ²→2, ½→1⁄2, ③→3 처럼 정답의 뜻을 바꾸는 글자도 일반 글자로 바꾼다. 그런 글자는 그대로 둔다.
const PROBLEM_PDF_KEEP_FORM_CHARS='\u00B2\u00B3\u00B9\u00BC-\u00BE\u2070-\u209F\u2150-\u215F\u2460-\u2473\u2776-\u2793';
function problemPdfNfkcKeepMath(v){
  return String(v||'').replace(new RegExp('[^'+PROBLEM_PDF_KEEP_FORM_CHARS+']+','g'),seg=>seg.normalize('NFKC'));
}
function problemPdfCleanAnswerText(v){
  const raw=problemPdfDecodeText(String(v||'')).trim();
  if(/^[①②③④⑤]$/.test(raw)) return raw;
  let t=problemPdfNfkcKeepMath(raw).replace(/\s+/g,' ').trim();
  if(!t) return '';
  t=t.replace(/^(?:정답|답)\s*[:：]?\s*/,'').trim();
  if(!t || /^[-–—·•]+$/.test(t)) return '';
  // 숫자 자체도 단답형 정답일 수 있으므로 여기서는 제거하지 않는다.
  if(t.length>80) return '';
  return t;
}
function problemPdfGroupAnswerRows(items){
  const clean=(items||[]).filter(x=>String(x.text||'').trim()).map(x=>({
    text:String(x.text||'').trim(), x:Number(x.x||0), y:Number(x.y||0), w:Number.isFinite(Number(x.w))&&x.w!==null&&x.w!==''?Number(x.w):null,
    h:Number.isFinite(Number(x.h))&&x.h!==null&&x.h!==''?Number(x.h):null
  })).sort((a,b)=>Math.abs(a.y-b.y)>5?b.y-a.y:a.x-b.x);
  const rows=[];
  for(const it of clean){
    let row=rows.find(r=>Math.abs(r.y-it.y)<=5);
    if(!row){ row={y:it.y,items:[]}; rows.push(row); }
    row.items.push(it);
  }
  rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x));
  return rows.sort((a,b)=>b.y-a.y);
}
// 한 칸의 답이 여러 text item 으로 쪼개진 경우 이어 붙인다. 앞 글자에 바짝 붙고 더 작고 약간 위에 있는 숫자는 위첨자(cm², x²)로 보고 ²·³ 같은 원래 표기로 되돌린다.
const PROBLEM_PDF_SUPERSCRIPT_MAP={'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
function problemPdfJoinAnswerCells(cells){
  let out='', prev=null;
  for(const c of cells||[]){
    const t=String(c.text||'').trim(); if(!t){continue;}
    let piece=t, sep=' ';
    if(prev){
      const prevEnd=prev.w!==null&&prev.w!==undefined?prev.x+prev.w:null;
      const gap=prevEnd===null?99:c.x-prevEnd, rise=c.y-prev.y;
      const smaller=c.h!==null&&c.h!==undefined&&prev.h!==null&&prev.h!==undefined&&c.h<prev.h*.92;
      if(gap<=1.5&&rise>=1.5&&rise<=8&&smaller&&/^[0-9]{1,2}$/.test(t)&&/[A-Za-z\uAC00-\uD7A3)\]]$/.test(out)){
        piece=t.replace(/[0-9]/g,d=>PROBLEM_PDF_SUPERSCRIPT_MAP[d]); sep='';
      }else if(gap<=0.8) sep='';
    }else sep='';
    out+=sep+piece; prev=c;
  }
  return out.trim();
}
function problemPdfExtractAnswerPairsFromItems(items){
  const out=new Map(), rows=problemPdfGroupAnswerRows(items);
  const setPair=(no,ans,confidence,method)=>{
    const key=problemPdfAnswerNoKey(no), answer=problemPdfCleanAnswerText(ans);
    if(!key||!answer||out.has(key)) return;
    out.set(key,{answer,confidence,method,basis:`정답표 문항번호 ${key}`});
  };
  // 대표 문항: 정답표의 '유형01 대표 | ④' → 식별자 '유형01-대표'. 같은 유형 번호가 다른 답으로 두 번 나오면 추측하지 않고 충돌로 둔다.
  const setRep=(typeNo,ans,cells)=>{
    const id=`유형${String(typeNo).padStart(2,'0')}-대표`, answer=problemPdfCleanAnswerText(ans);
    if(!answer) return;
    const isChoice=/^[①②③④⑤]$/.test(answer), basis=`정답표 '유형${String(typeNo).padStart(2,'0')} 대표' 행`;
    const prev=out.get(id);
    if(prev){ if(prev.answer!==answer) out.set(id,{answer:'',confidence:0,method:'needs-review',conflict:true,basis:`정답표에 '유형${String(typeNo).padStart(2,'0')} 대표'가 서로 다른 답으로 중복`}); return; }
    out.set(id,{answer,confidence:isChoice?1:0.93,method:isChoice?'answer-table-choice':'answer-table-text',basis,representative:true});
  };

  for(const row of rows){
    const xs=row.items;
    // A. 하나의 PDF text item 안에 "1. ③", "2) 12", "3 : x=2" 형태로 들어온 경우.
    for(const it of xs){
      const t=String(it.text||'').trim();
      const re=/(?:^|\s)(?:문제\s*)?0*([1-9]\d{0,2})\s*(?:번)?\s*[\.\):：\-]\s*([^\s].*?)(?=(?:\s+(?:문제\s*)?0*[1-9]\d{0,2}\s*(?:번)?\s*[\.\):：\-])|$)/g;
      let m;
      while((m=re.exec(t))){
        const ans=problemPdfCleanAnswerText(m[2]);
        if(ans) setPair(m[1],ans,0.97,/^[①②③④⑤]$/.test(ans)?'answer-table-choice':'answer-table-text');
      }
    }

    // R. '유형01 대표' 칸 다음의 칸들(다음 대표 칸이나 앞자리 0 번호 전까지)이 그 대표 문항의 답.
    const repRe=/^유형\s*0*(\d{1,3})\s*대표(?:\s*(?:유형|문제))?\s*(.*)$/;
    xs.forEach((x,i)=>{
      const m=String(x.text||'').trim().match(repRe); if(!m) return;
      let ans=m[2].trim();
      if(!ans){
        let e=i+1; while(e<xs.length&&!repRe.test(String(xs[e].text||'').trim())&&!/^0\d{1,2}$/.test(String(xs[e].text||'').normalize('NFKC').trim())) e++;
        ans=problemPdfJoinAnswerCells(xs.slice(i+1,e));
      }
      setRep(m[1],ans);
    });
    const hasRep=xs.some(x=>repRe.test(String(x.text||'').trim()));
    // C. 앞자리 0이 붙은 번호("001")가 한 행에 여러 개 있는 표: "유형01 대표 | ④ | 001 | a ≠ 2 | 002 | 4".
    // 앞자리 0 번호는 답과 헷갈릴 일이 거의 없으므로 번호로 보고, 다음 번호 전까지의 모든 칸(여러 text item 으로 쪼개진 답 포함)을 그 번호의 답으로 모은다.
    // 번호 앞의 칸(유형 이름, 원문자 대표 답)은 번호가 없는 문항의 것이라 이 단계에서는 쓰지 않는다.
    const zeroIdx=[]; xs.forEach((x,i)=>{ if(/^0\d{1,2}$/.test(String(x.text||'').normalize('NFKC').trim())&&problemPdfAnswerNoKey(x.text)) zeroIdx.push(i); });
    if(zeroIdx.length){
      zeroIdx.forEach((zi,k)=>{
        const end=k+1<zeroIdx.length?zeroIdx[k+1]:xs.length;
        const ans=problemPdfJoinAnswerCells(xs.slice(zi+1,end));
        if(ans) setPair(xs[zi].text,ans,/^[①②③④⑤]$/.test(ans)?1:0.93,/^[①②③④⑤]$/.test(ans)?'answer-table-choice':'answer-table-text');
      });
      continue;
    }
    if(hasRep) continue;   // '유형01 대표 | ④' 행의 원문자 답을 문항 번호 4 로 읽지 않는다

    // B. "1 | ③ | 2 | ⑤ | 3 | 12"처럼 번호와 답이 별도 text item인 다열 표.
    // 숫자 답(예: 12)도 있으므로 단순히 "숫자=다음 문제번호"로 보지 않는다.
    const evenLabels=[];
    for(let i=0;i<xs.length;i+=2) evenLabels.push(problemPdfAnswerNoKey(xs[i].text));
    const alternating = xs.length>=2 && xs.length%2===0 &&
      evenLabels.every(Boolean) &&
      evenLabels.every((k,i)=>i===0 || Number(k)===Number(evenLabels[i-1])+1);
    if(alternating){
      for(let i=0;i<xs.length;i+=2){
        const key=problemPdfAnswerNoKey(xs[i].text);
        const ans=problemPdfCleanAnswerText(xs[i+1]?.text);
        if(ans) setPair(key,ans,/^[①②③④⑤]$/.test(ans)?1:0.95,/^[①②③④⑤]$/.test(ans)?'answer-table-choice':'answer-table-text');
      }
    }else{
      // 한 행에 한 문제번호와 답이 있는 일반 표.
      for(let i=0;i<xs.length-1;i++){
        const key=problemPdfAnswerNoKey(xs[i].text);
        if(!key) continue;
        const ans=problemPdfCleanAnswerText(xs[i+1].text);
        if(!ans) continue;
        // 다음 셀도 문제번호처럼 보이고 행 전체가 번호열이라면 자동매칭하지 않는다.
        const allNumberLike=xs.every(x=>!!problemPdfAnswerNoKey(x.text));
        if(allNumberLike && xs.length>2) continue;
        setPair(key,ans,/^[①②③④⑤]$/.test(ans)?1:0.92,/^[①②③④⑤]$/.test(ans)?'answer-table-choice':'answer-table-text');
        break;
      }
    }
  }
  return out;
}
function problemPdfInferType(rawText,answerCandidate){
  const t=String(rawText||'').normalize('NFKC');
  if(answerCandidate?.method==='answer-table-choice' || /^[①②③④⑤]$/.test(String(answerCandidate?.answer||''))) return 'mc';
  // NFKC 정규화는 ①→1 로 바꿔 보기 번호를 지우므로, 원문에서 센다(정답표가 없는 학생용 PDF 의 객관식 판별).
  const circled=(String(rawText||'').match(/[①②③④⑤]/g)||[]).length;
  if(circled>=2) return 'mc';
  // 풀이 과정 제출 안내("풀이 과정을 식으로 쓰고…")만으로는 서술형으로 단정하지 않는다(최종 답이 정해지면 단답형, 풀이 과정 요구는 현재 저장 구조에 필드가 없음).
  if(/증명하시오|서술하시오|이유를\s*쓰시오/.test(t)) return 'constructed';
  return 'short';
}
function problemPdfExtractQuickAnswerPairsFromItems(items){
  const out=new Map(), rows=problemPdfGroupAnswerRows(items), allItems=rows.flatMap(r=>r.items);
  const typeHeads=[];
  for(const row of rows){
    for(const it of row.items){
      const m=String(it.text||'').trim().match(/^유형\s*0*(\d{1,2})$/);
      if(m) typeHeads.push({typeNo:Number(m[1]),x:it.x,y:it.y});
    }
  }
  if(!typeHeads.length) return out;
  const nearestColumn=x=>typeHeads.reduce((best,h)=>!best||Math.abs(h.x-x)<Math.abs(best.x-x)?h:best,null);
  const put=(key,answer,basis,representative=false)=>{
    const clean=problemPdfCleanAnswerText(answer);
    if(!key||!clean) return;
    const choice=/^[①②③④⑤]$/.test(clean);
    out.set(key,{answer:clean,confidence:choice?1:0.95,method:choice?'answer-table-choice':'answer-table-text',basis,representative});
  };
  for(const row of rows){
    for(const it of row.items){
      const t=String(it.text||'').trim();
      const rep=t.match(/^대표\s*([①②③④⑤])$/);
      if(rep){
        const col=nearestColumn(it.x);
        const head=typeHeads.filter(h=>Math.abs(h.x-col.x)<=2&&h.y>it.y&&h.y-it.y<=36).sort((a,b)=>a.y-b.y)[0];
        if(head) put('유형'+String(head.typeNo).padStart(2,'0')+'-대표',rep[1],"정답표 '유형"+String(head.typeNo).padStart(2,'0')+" 대표' 행",true);
        continue;
      }
      const q=t.match(/^(0\d{2})\s+(.+)$/);
      if(q){
        const key=problemPdfAnswerNoKey(q[1]), col=nearestColumn(it.x);
        const suffix=q[2].trim(), suffixWidth=Math.min(it.w||0,Math.max(4,suffix.length*6));
        const startX=it.x+Math.max(0,(it.w||0)-suffixWidth);
        const cells=[{text:suffix,x:startX,y:it.y,w:suffixWidth,h:it.h}];
        for(const fragment of row.items.filter(x=>x.x>=it.x+(it.w||0)-1&&Math.abs(x.x-col.x)<90&&x.x>it.x).sort((a,b)=>a.x-b.x)){
          if(fragment===it) continue;
          const prev=cells[cells.length-1], prevEnd=prev.x+(prev.w||0);
          if(fragment.x-prevEnd>18) break;
          cells.push(fragment);
        }
        put(key,problemPdfJoinAnswerCells(cells),'정답표 문항번호 '+key);
        continue;
      }
      const advanced=t.match(/^심화\s*0*(\d{1,2})\s*[:：]\s*(.*)$/);
      if(advanced){
        const key='심화'+String(Number(advanced[1])).padStart(2,'0'), col=nearestColumn(it.x);
        let answer=advanced[2].trim();
        if(!answer){
          const fragments=allItems.filter(x=>x!==it&&x.x>=it.x+(it.w||0)-1&&Math.abs(x.x-col.x)<90&&x.y<=it.y+14&&x.y>=it.y-14).sort((a,b)=>b.y-a.y||a.x-b.x);
          const numeric=fragments.filter(x=>/^\d+(?:\.\d+)?$/.test(String(x.text||'').trim()));
          if(numeric.length===2&&Math.abs(numeric[0].x-numeric[1].x)<=12&&Math.abs(numeric[0].y-numeric[1].y)>=3&&Math.abs(numeric[0].y-numeric[1].y)<=10){
            const [top,bottom]=numeric[0].y>numeric[1].y?numeric:numeric.slice().reverse();
            answer=String(top.text).trim()+'/'+String(bottom.text).trim();
          }else answer=problemPdfJoinAnswerCells(fragments);
        }
        put(key,answer,'정답표 심화 문항번호 '+key);
      }
    }
  }
  return out;
}
async function problemPdfExtractAnswerCandidates(pdf){
  const out=new Map();
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n), tc=await page.getTextContent();
    const items=(tc.items||[]).map(it=>({
      text:String(it.str||'').trim(),
      x:Number(it.transform?.[4]||0),
      y:Number(it.transform?.[5]||0),
      w:it.width,
      h:it.height
    }));
    const pageText=items.map(x=>x.text).join(' ');
    if(!problemPdfIsAnswerPageText(pageText,problemPdfAnswerTextLines(items))) continue;
    const quickPairs=problemPdfExtractQuickAnswerPairsFromItems(items);
    const pairs=quickPairs.size?quickPairs:problemPdfExtractAnswerPairsFromItems(items);
    for(const [key,val] of pairs.entries()){
      if(!out.has(key)) out.set(key,{...val,answerPage:n});
    }
  }
  return out;
}

function problemPdfPairedRole(fileName){
  const name=String(fileName||'').replace(/\\.pdf$/i,'');
  const token=/(^|[^A-Za-z0-9가-힣])(?:학생용|학생|student)(?=$|[^A-Za-z0-9가-힣])/i;
  const teacherToken=/(^|[^A-Za-z0-9가-힣])(?:교사용|교사|teacher)(?=$|[^A-Za-z0-9가-힣])/i;
  const student=token.test(name), teacher=teacherToken.test(name);
  return student===teacher?'':student?'student':'teacher';
}
function problemPdfPairStem(fileName){
  return String(fileName||'').replace(/\\.pdf$/i,'').normalize('NFKC').toLowerCase()
    .replace(/학생용|교사용|학생|교사|student|teacher/gi,'')
    .replace(/[^a-z0-9가-힣]+/g,'');
}
function problemPdfFindStudentTeacherPair(files){
  if(!Array.isArray(files)||files.length!==2) return null;
  const student=files.filter(f=>problemPdfPairedRole(f.name)==='student');
  const teacher=files.filter(f=>problemPdfPairedRole(f.name)==='teacher');
  if(student.length!==1||teacher.length!==1) return null;
  const studentStem=problemPdfPairStem(student[0].name), teacherStem=problemPdfPairStem(teacher[0].name);
  if(!studentStem||studentStem!==teacherStem) return null;
  return {student:student[0],teacher:teacher[0]};
}
async function problemPdfExtractAnswerMapFromFile(file){
  const pdfjs=await loadMnmPdfJs(), bytes=new Uint8Array(await file.arrayBuffer());
  const pdf=await pdfjs.getDocument({data:bytes,cMapUrl:PROBLEM_PDF_CMAP_URL,cMapPacked:true}).promise;
  const map=await problemPdfExtractAnswerCandidates(pdf);
  return new Map([...map.entries()].map(([key,value])=>[key,{...value,sourceFile:file.name}]));
}

async function supersedeOlderProblemSourceDrafts(fileName,newSourceId){
  if(!fileName||!newSourceId) return;
  try{
    const srcSnap=await fsdb.collection('problemSources').where('fileName','==',fileName).get();
    const oldSources=srcSnap.docs.filter(d=>d.id!==newSourceId&&!d.data()?.supersededBy);
    for(const srcDoc of oldSources){
      const draftSnap=await fsdb.collection('problemDrafts').where('sourceId','==',srcDoc.id).get();
      const batch=fsdb.batch();
      let touched=0;
      draftSnap.docs.forEach(d=>{
        const data=d.data()||{};
        if(data.status==='saved') return;
        batch.set(d.ref,{status:'superseded',supersededBy:newSourceId,supersededAt:new Date().toISOString()},{merge:true});
        touched++;
      });
      batch.set(srcDoc.ref,{supersededBy:newSourceId,supersededAt:new Date().toISOString(),supersededDraftCount:touched},{merge:true});
      await batch.commit();
    }
  }catch(e){
    console.warn('older problem source supersede skipped',e);
  }
}

    for(let n=1;n<=pdf.numPages;n++){ say(`페이지 분석 ${n}/${pdf.numPages}`); const pg=await pdf.getPage(n); pages[n]=pg; plans.push(await problemPdfPagePlan(pg,n)); }
    const built=problemPdfBuildRegions(plans);

      if(!reviewReason&&r.representative&&r.idSource==='printed-type-number'&&!key) reviewReason='answer-table-entry-missing';

    }
    say('수집 대기열 저장 중…');
    const ingestOut=await createProblemDraftsFromManifest({source:{title:file.name.replace(/\.pdf$/i,''),fileName:file.name,sourceType:'pdf',pageCount:pdf.numPages,grade:sourceMeta.grade,semester:sourceMeta.semester,majorUnit:sourceMeta.majorUnit,middleUnit:sourceMeta.middleUnit,ingestMethod:'browser-pdfjs-v3-rail-sequence',segmentationMeta},problems},{confirmWarnings:false});
    if(ingestOut?.sourceId) await supersedeOlderProblemSourceDrafts(file.name,ingestOut.sourceId);
    problemStore.ingest.loaded=false; await loadProblemIngestQueue();
    const mcCount=problems.filter(x=>x.type==='mc').length, constructedCount=problems.filter(x=>x.type==='constructed').length;
    say(`완료 · ${regions.length}문항 자동분리 · ${textDetected?'문항번호 레일+연속성':'AI 이미지'} 방식 · 경계품질 ${Math.round(Number(segmentationMeta.quality||0)*100)}% · 객관식 ${mcCount}문항${constructedCount?` · 서술형 ${constructedCount}문항`:''} · 뒤쪽 정답표 ${answerMap.size}개 자동연결 · 나머지 검토필요`);
  }catch(e){
    console.error('PDF auto ingest failed',e);
    for(const ref of uploadedRefs){
      try{ await deleteStoredPhoto(ref); }catch(cleanErr){ console.warn('temporary problem crop cleanup failed',cleanErr); }
    }
    say('자동분리 중단 · '+(e?.message||e));
    alert('PDF 자동분리를 완료하지 못했습니다.\n'+(e?.message||e));
