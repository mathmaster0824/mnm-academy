function monthRangeDailyScores(stuId, yearMonth){
  const rows = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    const rec = obj[stuId];
    if(!rec) return;
    const date = key.slice(-10);
    if(!date.startsWith(yearMonth)) return;
    if(rec.dailyTestScore!==undefined && rec.dailyTestScore!=='' && rec.dailyTestScore!==null){
      rows.push({date, score:Number(rec.dailyTestScore)});
    }
  });
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  return rows.map(r=>r.score);
}
function lastStepByType(stuId, stepType){
  let best = null;
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    const rec = obj[stuId];
    if(!rec || !rec.stepId) return;
    if((rec.stepType||'개념') !== stepType) return;
    const date = key.slice(-10);
    if(!best || date > best.date) best = {date, stepId: rec.stepId};
  });
  return best;
}
function monthlyAttendanceRate(stuId, yearMonth){
  const rows = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    const rec = obj[stuId]; if(!rec) return;
    const date = key.slice(-10);
    if(!date.startsWith(yearMonth)) return;
    const clsId = key.slice(0, key.length-11);
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup, date)) return;
    rows.push(rec.attendance || '출석');
  });
  if(!rows.length) return null;
  const absent = rows.filter(a=>a==='결석').length;
  const late = rows.filter(a=>a==='지각').length;
  return { rate: Math.round((rows.length-absent)/rows.length*100), total: rows.length, absent, late };
}
function monthlyHomeworkRate(stuId, yearMonth){
  const lessons = studentLessonRecords(stuId).filter(l=>l.date.startsWith(yearMonth));
  if(!lessons.length) return null;
  let totalExpected=0, totalSubmitted=0;
  lessons.forEach(l=>{
    const cls = classById(l.clsId);
    if(!cls) return;
    const range = homeworkDateRangeDates(cls.dayGroup, l.date);
    totalExpected += range.length;
    totalSubmitted += range.filter(d=>homeworkCountsAsCompleted(db.submissions[stuId+'_'+d],d)).length;
  });
  if(!totalExpected) return null;
  return Math.round(totalSubmitted/totalExpected*100);
}

function copyText(btn){
  if(!btn || !btn.getAttribute) return;
  const encoded = btn.getAttribute('data-text') || '';
  const text = decodeURIComponent(encoded);
  if(!text) return;

  const originalText = btn.textContent;
  const copied = ()=>{
    btn.textContent='복사됨 ✓';
    showCopyToast('복사되었습니다 ✓');
    setTimeout(()=>{ btn.textContent=originalText; },1500);
  };

  const fallbackCopy = ()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      const ok=document.execCommand('copy');
      if(ok) copied();
    }finally{
      ta.remove();
    }
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(copied).catch(fallbackCopy);
  }else{
    fallbackCopy();
  }
}

async function runAuditBulkDelete(){
  const targets = [];
  Object.keys(currentSubState._auditSelected).forEach(chkId=>{
    if(!currentSubState._auditSelected[chkId]) return;
    // chkId 형식: auditchk_{studentId}_{idx} — studentId 자체에 밑줄이 있을 수 있어 마지막 밑줄로 idx만 분리한다.
    const withoutPrefix = chkId.slice('auditchk_'.length);
    const lastUnderscore = withoutPrefix.lastIndexOf('_');
    const studentId = withoutPrefix.slice(0, lastUnderscore);
    const idx = Number(withoutPrefix.slice(lastUnderscore+1));
    const s = studentById(studentId);
    const w = s && (s.warnings||[])[idx];
    if(w) targets.push({studentId, episodeKey:w.episodeKey||null, date:w.date||'', reason:w.reason||''});
  });
  if(!targets.length){ alert('선택된 경고가 없어요.'); return; }
  openConfirm(`선택한 경고 ${targets.length}건을 삭제할까요?`, '삭제 직전에 Firestore 최신 데이터를 다시 확인한 뒤, 선택한 경고만 정확히 제거합니다. 다른 경고는 건드리지 않습니다.', async ()=>{
    await deleteSelectedAuditWarnings(targets);
    currentSubState._auditSelected = {};
    render();
  });
}

async function resetAllWarnings(){
  const newStart = todayISO();
  const withWarnings = (db.students||[]).filter(s => ((s.warnings||[]).length>0) || s.autoWarnLastDate);
  const startLabel = newStart.replaceAll('-','.');

  openConfirm(
    '전체 경고를 초기화하고 오늘부터 새로 시작할까요?',
    `기존 경고 기록을 0회로 초기화하고, 경고 계산 시작일을 ${startLabel}로 저장합니다.\n대상 학생: ${withWarnings.length}명\n숙제 제출 사진·인증·검사·코멘트 기록은 삭제하지 않습니다.\n${startLabel} 이전 숙제 미이행은 이후 경고 계산에 다시 사용되지 않습니다.\n\n안전을 위해, 대상 학생 전원이 한 번에 초기화되지 않으면 전체가 취소되고 아무도 바뀌지 않습니다 (일부만 초기화되는 상태는 발생하지 않습니다).`,
    async ()=>{
      // 원자적 순서: ①잠금 → ②새 시작일 결정 → ③Firestore 저장 확인 → ④학생 경고 일괄(batch) 초기화(전원 성공/전원 실패만 가능)
      // → ⑤로컬 상태 확정(성공시에만) → ⑥결과 안내(성공/부분아님 명시) → ⑦잠금 해제 → ⑧성공했을 때만 자동경고 재개
      warningAutoRunBusy = true; // ① 자동경고 생성 잠금
      let resetSucceeded = false;
      try{
        // ② 새 시작일은 위에서 이미 결정됨(newStart)
        // ③ Firestore에 먼저 저장하고, 성공을 "확인"하기 전에는 로컬 상태를 절대 바꾸지 않는다.
        const saved = await fsSet('meta','settings',{warningAssessmentStartDate:newStart},true);
        if(!saved){
          alert('경고 시작일 저장에 실패했습니다. 경고 초기화를 중단합니다.\n(로컬 상태는 변경되지 않았습니다.)');
          return;
        }

        // ④ 학생별 warnings/autoWarnLastDate 초기화 — Firestore batch로 원자적 처리.
        //    batch.commit()은 전부 성공하거나 전부 실패하거나 둘 중 하나만 가능하다 (부분 성공 없음).
        let batchOk = true;
        if(withWarnings.length){
          try{
            const batch = fsdb.batch();
            withWarnings.forEach(s=>{
              batch.update(fsdb.collection('students').doc(s.id), {warnings: [], autoWarnLastDate: null});
            });
            await batch.commit();
          }catch(e){
            batchOk = false;
          }
        }

        if(!batchOk){
          alert(`⚠️ 경고 초기화 실패\n\n경고 시작일(${startLabel})은 저장됐지만, 학생 경고 초기화 중 오류가 발생해서 대상 ${withWarnings.length}명 중 아무도 초기화되지 않았습니다. (일부만 반영되는 일은 없습니다.)\n\n네트워크를 확인한 뒤 다시 시도해주세요.\n안전을 위해 자동경고 재계산은 지금 실행하지 않습니다.`);
          return;
        }

        // ⑤ Firestore 저장이 확실히 성공한 뒤에만 로컬 상태를 확정한다.
        withWarnings.forEach(s=>{ s.warnings = []; s.autoWarnLastDate = null; });
        db.settings = {...(db.settings||{}), warningAssessmentStartDate:newStart};
        resetSucceeded = true;

        // ⑥ 완료 확인 — "부분 성공"이라는 표현은 존재할 수 없다(batch가 원자적이므로), 항상 전원 성공만 보고한다.
        alert(`경고를 초기화했습니다.\n대상 ${withWarnings.length}명 전원 성공.\n새 경고 계산 시작일: ${startLabel}\n오늘 숙제부터 새롭게 계산합니다.`);
      }finally{
        warningAutoRunBusy = false; // ⑦ 잠금 해제 (실패해도 재시도할 수 있어야 하므로 항상 해제)
        render();
        if(resetSucceeded){
          maybeRunAutoWarnings(); // ⑧ 전원 성공했을 때만, 새 시작일 기준으로 자동경고 재개
        }
        // 실패한 경우 여기서 자동경고를 재실행하지 않는다 — 관리자가 재시도하거나 원인을 확인할 때까지 대기.
      }
    }
  );
}
function showBackupText(){
  document.getElementById('backupTextArea').style.display='block';
  document.getElementById('backupTextContent').value = JSON.stringify(db);
}
function copyBackupText(){
  const el = document.getElementById('backupTextContent'); el.select();
  navigator.clipboard.writeText(el.value).then(()=>{ alert('복사됐어요!'); }).catch(()=>{ alert('자동 복사가 안 됐어요. 텍스트를 길게 눌러 직접 복사해주세요.'); });
}
function downloadBackup(){
  try{
    const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download = `mnm_backup_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }catch(e){ alert('다운로드에 실패했어요. "텍스트로 보기"를 이용해주세요.'); }
}

/* ---------------- STUDENT HOME ---------------- */
function renderStudentHome(){
  const stuId = session.studentId;
  const s = studentById(stuId);
  if(!s) return `<div class="empty">학생 정보를 찾을 수 없어요.</div>`;
  const cls = classById(s.classId);
  return `
    <div class="card">
      <h2 style="margin:0 0 4px;">${s.name} <span style="font-size:14px;color:#9c9880;">(${s.grade})</span></h2>
      <span class="studentcode">${s.code}</span> · ${cls?cls.name:'미배정'}
    </div>
    ${renderStudentHomeworkSummary(stuId)}
    ${renderStudentQuestionSummary(stuId)}
  `;
}

// 학생 첫 화면 전용: 기존 Firestore 데이터를 읽어서 요약만 보여준다. 저장/수정 없음.
function renderStudentHomeworkSummary(stuId){
  const rows = Object.entries(db.submissions)
    .filter(([key])=>key.startsWith(stuId+'_'))
    .map(([key,sub])=>({key,date:key.slice(-10),sub}))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const latest = rows[0];
  const recent = rows.slice(0,5);
  const latestComment = rows.find(r=>r.sub && r.sub.teacherComment);

  return `<div class="card">
    <div class="row between">
      <h3 style="margin:0;">📸 숙제 현황</h3>
      ${latest ? `<span class="badge ${submissionIsApproved(latest.sub)?'green':submissionIsPending(latest.sub)?'yellow':'red'}">${submissionIsApproved(latest.sub)?'숙제 인정':submissionIsPending(latest.sub)?'제출 완료 · 검토대기':'숙제 불합격'}</span>` : '<span class="badge gray">최근 인증 없음</span>'}
    </div>
    ${latest ? `<div style="margin-top:10px;font-size:13px;">최근 인증: <b>${fmtDate(latest.date)}</b>${latest.sub.submittedAt?` · ${new Date(latest.sub.submittedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`:''}</div>` : `<div class="empty" style="padding:16px 0 8px;">아직 등록된 숙제 인증이 없어요.</div>`}

    <div style="margin-top:12px;padding:12px 14px;background:#fff8e8;border:1px solid #e8cf95;border-radius:10px;">
      <div style="font-size:12px;font-weight:700;color:#9a6b16;margin-bottom:5px;">✏️ 선생님의 숙제 코멘트</div>
      <div style="font-size:14px;line-height:1.65;font-weight:600;">${latestComment ? latestComment.sub.teacherComment : '아직 등록된 코멘트가 없어요.'}</div>
      ${latestComment ? `<div style="margin-top:5px;font-size:11px;color:#8a8674;">${fmtDate(latestComment.date)} 숙제</div>` : ''}
    </div>

    ${recent.length ? `<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">
      ${recent.map(r=>`<span style="font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;">${fmtDate(r.date)} ${homeworkReviewMark(r.sub)} ${homeworkReviewLabel(r.sub)}</span>`).join('')}
    </div>` : ''}
  </div>`;
}

function renderStudentQuestionSummary(stuId){
  const myQs = db.questions.filter(q=>q.studentId===stuId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const latest = myQs[0];
  const latestAnswered = myQs.find(q=>q.answerText || (q.answerPhotos&&q.answerPhotos.length));
  const pending = myQs.filter(q=>q.status==='대기').length;

  return `<div class="card">
    <div class="row between">
      <h3 style="margin:0;">💬 질문 현황</h3>
      <span class="badge ${pending?'yellow':'green'}">${pending?`답변 대기 ${pending}건`:'답변 대기 없음'}</span>
    </div>
    ${latest ? `<div style="margin-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);">
      <div style="font-size:11px;color:#8a8674;">최근 질문 · ${fmtDate(latest.date)}</div>
      <div style="margin-top:5px;font-size:14px;line-height:1.6;">${latest.text||''}</div>
      <span class="badge ${latest.status==='답변완료'?'green':'yellow'}" style="margin-top:6px;">${latest.status||'대기'}</span>
    </div>` : `<div class="empty" style="padding:16px 0 8px;">아직 등록된 질문이 없어요.</div>`}

    <div style="margin-top:12px;padding:12px 14px;background:#f6f4ec;border:1px solid var(--line);border-radius:10px;">
      <div style="font-size:12px;font-weight:700;color:#6f6958;margin-bottom:5px;">📝 선생님의 질문 코멘트</div>
      ${latestAnswered ? `<div style="font-size:14px;line-height:1.65;font-weight:600;">${latestAnswered.answerText||'사진 답변이 등록되어 있어요.'}</div>
        <div style="margin-top:5px;font-size:11px;color:#8a8674;">${fmtDate(latestAnswered.date)} 질문에 대한 답변</div>
        ${(latestAnswered.answerPhotos||[]).length ? `<div class="thumbs" style="margin-top:8px;">${latestAnswered.answerPhotos.map((p,i)=>`<img src="${p}" onclick="openLightboxSet('q','${latestAnswered.id}','answerPhotos',${i})">`).join('')}</div>` : ''}` : `<div style="font-size:14px;color:#8a8674;">아직 등록된 답변이 없어요.</div>`}
    </div>
  </div>`;
}
// 학생 세 번째 페이지: 학습현황. 기존 데이터는 읽기만 하며 저장/수정하지 않는다.
function renderStudentProgressPage(){
  const stuId = session.studentId;
  const s = studentById(stuId);
  if(!s) return `<div class="empty">학생 정보를 찾을 수 없어요.</div>`;
  const cls = classById(s.classId);
  const status = studentStatus(stuId);
  const traffic = trafficForStudent(stuId);
  const trafficText = traffic==='red' ? 'STOP' : (traffic==='yellow' ? 'SLOW' : '순항중');
  const trafficIcon = traffic==='red' ? '🔴' : (traffic==='yellow' ? '🟡' : '🟢');

  const histRows=[];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    if(!obj[stuId]) return;
    histRows.push({date:key.slice(-10), ...obj[stuId]});
  });
  histRows.sort((a,b)=>b.date.localeCompare(a.date));

  const kmmRows=db.kmm.filter(k=>k.studentId===stuId).sort((a,b)=>b.date.localeCompare(a.date));

  const errorAgg={};
  Object.entries(db.submissions).forEach(([key,sub])=>{
    if(!key.startsWith(stuId+'_')) return;
    (sub.errorTypes||[]).forEach(et=>{ errorAgg[et.type]=(errorAgg[et.type]||0)+Number(et.percent||0); });
  });

  const homeworkRows=Object.entries(db.submissions)
    .filter(([key])=>key.startsWith(stuId+'_'))
    .map(([key,sub])=>({date:key.slice(-10),sub}))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const warningCount=verifiedWarnings(s).length;

  return `
    <div class="card">
      <div class="row between">
        <div>
          <h2 style="margin:0 0 4px;">🚦 학습현황</h2>
          <div style="font-size:13px;color:#8a8674;">${s.name} · ${cls?cls.name:'미배정'}</div>
        </div>
        <div style="text-align:center;min-width:105px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;">
          <div style="font-size:30px;line-height:1;">${trafficIcon}</div>
          <div style="margin-top:5px;font-size:13px;font-weight:800;">${trafficText}</div>
        </div>
      </div>
    </div>

    <div class="card" style="overflow-x:auto;">
      <h3 style="margin-top:0;">1. 출석·진도 이력</h3>
      ${histRows.length? `<table><tr><th>날짜</th><th>출석</th><th>일일테스트</th><th>진도</th><th>숙제완성도</th><th>학습완성도</th><th>특이사항</th></tr>
        ${histRows.slice(0,30).map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${h.attendance||'-'}</td><td>${h.dailyTestScore!==undefined&&h.dailyTestScore!==''?h.dailyTestScore:'-'}</td><td>${stepLabel(h.stepId)||'-'}${(h.extraSteps&&h.extraSteps.length)?'<br><span style="color:#9c9880;">+ '+h.extraSteps.map(id=>stepLabel(id)).filter(Boolean).join(', ')+'</span>':''}</td><td>${h.homeworkCompletionLevel||'-'}</td><td>${h.studyCompletionLevel||'-'}</td><td>${h.note||'-'}</td></tr>`).join('')}
        </table>`:`<div class="empty">기록이 없어요.</div>`}
    </div>

    <div class="card" style="overflow-x:auto;">
      <h3 style="margin-top:0;">2. KMM</h3>
      ${kmmRows.length? `<table><tr><th>날짜</th><th>범위</th><th>점수</th><th>결과</th><th>시상</th></tr>${kmmRows.map(k=>`<tr><td>${fmtDate(k.date)}</td><td>${k.range||'-'}</td><td>${k.score}</td><td>${k.score>=80?'<span class="badge green">PASS</span>':'<span class="badge red">FAIL</span>'}</td><td>${kmmAwardText(k.score)}</td></tr>`).join('')}</table>`:`<div class="empty">등록된 KMM 기록이 없어요.</div>`}
    </div>

    <div class="card" style="overflow-x:auto;">
      <h3 style="margin-top:0;">3. 내신 성적 누적</h3>
      <div style="font-size:12px;color:#8a8674;margin-bottom:10px;">학교 시험 점수가 입력될 때마다 이곳에 계속 누적됩니다.</div>
      ${renderSchoolExamHistoryTable(stuId)}
    </div>

    <div class="card">
      <h3 style="margin-top:0;">4. 오답유형</h3>
      ${renderDonut(errorAgg)}
    </div>

    <div class="card" style="overflow-x:auto;">
      <div class="row between"><h3 style="margin:0;">5. 숙제현황 및 누적경고횟수</h3>${warningCountBadge(warningCount)}</div>
      <div style="margin-top:8px;font-size:12px;color:#8a8674;">현재 표시되는 누적 경고는 기존 검증 경고만 사용합니다.</div>
      ${homeworkRows.length? `<table style="margin-top:12px;"><tr><th>날짜</th><th>제출</th><th>숙제 판정</th><th>코멘트</th></tr>${homeworkRows.slice(0,30).map(r=>`<tr><td>${fmtDate(r.date)}</td><td><span class="badge">제출됨</span></td><td><span class="badge ${submissionIsApproved(r.sub)?'green':submissionIsPending(r.sub)?'yellow':'red'}">${homeworkReviewMark(r.sub)} ${homeworkReviewLabel(r.sub)}</span>${submissionIsRejected(r.sub)&&r.sub.reviewReason?`<br><span style="font-size:11px;color:#a83b32;">${r.sub.reviewReason}</span>`:''}</td><td>${r.sub.teacherComment||'-'}</td></tr>`).join('')}</table>`:`<div class="empty">등록된 숙제 인증 기록이 없어요.</div>`}
    </div>`;
}

// 학생 두 번째 페이지: 기존 숙제계획/영상과 기존 숙제인증/Q&A 기능을 한 화면에 재배치한다.
// 데이터 스키마와 저장 함수는 변경하지 않는다.
function renderStudentHomeworkPage(){
  const stuId = session.studentId;
  const s = studentById(stuId);
  if(!s) return `<div class="empty">학생 정보를 찾을 수 없어요.</div>`;
  const cls = classById(s.classId);
  const wk = weekStartISO(todayISO());
  const myWeekPlan = s.classId ? (db.weeklyPlans[s.classId+'_'+wk] || {})[stuId] || {} : {};

  const videoAssignFlat = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    if(!obj[stuId]) return;
    const date = key.slice(-10);
    (obj[stuId].videoAssignments||[]).forEach((v,i)=> videoAssignFlat.push({...v,date,key,idx:i}));
  });
  videoAssignFlat.sort((a,b)=>b.date.localeCompare(a.date));

  return `
    <div class="card">
      <h2 style="margin:0 0 4px;">✏️ 오늘의 숙제</h2>
      <div style="font-size:13px;color:#8a8674;">${s.name} · ${cls?cls.name:'미배정'}</div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">1. 이번 주 숙제</h3>
      <div class="weekgrid" style="grid-template-columns:70px repeat(7,1fr);">
        <div></div>${['mon','tue','wed','thu','fri','sat','sun'].map(k=>`<div class="hd">${DAY_LABEL[k]}</div>`).join('')}
        <div></div>${['mon','tue','wed','thu','fri','sat','sun'].map(k=>`<div style="font-size:11px;padding:4px;border:1px solid var(--line);border-radius:6px;min-height:44px;">${myWeekPlan[k]||''}</div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">2. 개념동영상학습</h3>
      ${videoAssignFlat.length ? videoAssignFlat.map(v=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line);">
        <input type="checkbox" ${v.done?'checked':''} onchange="toggleVideoDoneByKey('${v.key}','${stuId}',${v.idx})">
        <a class="link" href="${v.url}" target="_blank">${v.title}</a><span style="color:#9c9880;font-size:11px;">(${fmtDate(v.date)})</span>
      </div>`).join('') : `<div class="empty">부여된 영상 과제가 없어요.</div>`}
    </div>

    <div style="margin-bottom:8px;font-size:14px;font-weight:800;color:var(--navy2);">3. 숙제인증</div>
    ${renderSubmissionCard(stuId, false, false)}

    <div style="margin-bottom:8px;font-size:14px;font-weight:800;color:var(--navy2);">4. 질문게시판</div>
    ${renderQnaStudentSection(stuId, false)}
  `;
}

function renderUnseenCommentBanner(stuId){
  const withComment = Object.entries(db.submissions)
    .filter(([k,v])=>k.startsWith(stuId+'_') && v.teacherComment && !v.commentSeen)
    .sort((a,b)=>b[0].localeCompare(a[0]));
  if(!withComment.length) return '';
  const [key, sub] = withComment[0];
  return `<div class="card" style="border:2px solid var(--gold);background:#fffbea;margin-bottom:14px;">
    <div style="font-size:13px;font-weight:700;color:var(--navy2);margin-bottom:6px;">✏️ 선생님이 숙제에 코멘트를 남기셨어요!</div>
    <div style="font-size:14px;line-height:1.6;">${sub.teacherComment}</div>
    <button class="btn sm gold" style="margin-top:10px;" onclick="markCommentSeen('${key}')">확인했어요</button>
  </div>`;
}
async function markCommentSeen(key){
  const ok = await fsUpdate('submissions', key, {commentSeen: true});
  if(ok && db.submissions[key]){ db.submissions[key].commentSeen = true; render(); }
}

initFirebase();
