<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&m 수학훈련소</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  :root{
    --navy:#141B2E; --navy2:#1D2A44; --navy3:#26365A;
    --gold:#C9A24B; --gold-l:#E8CE8B;
    --ink:#1A1D26; --paper:#F7F5F0; --line:#E4DFD3;
    --green:#3EA55A; --yellow:#E0A82E; --red:#D65A4A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Noto Serif KR',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  #loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-size:14px;flex-direction:column;gap:14px;}
  .spinner{width:34px;height:34px;border:3px solid #354569;border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #loginScreen{display:none;min-height:100vh;align-items:center;justify-content:center;background:
    radial-gradient(circle at 20% 10%, #202b47 0%, var(--navy) 45%, #0d1220 100%);}
  .login-card{width:min(420px,90vw);background:var(--navy2);border:1px solid #2c3a5c;border-radius:var(--radius);
    padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .brand{text-align:center;margin-bottom:28px;}
  .brand .steps{display:flex;justify-content:center;gap:4px;margin-bottom:10px;}
  .brand .steps span{display:block;width:14px;background:var(--gold);border-radius:2px;}
  .brand .steps span:nth-child(1){height:8px;}
  .brand .steps span:nth-child(2){height:16px;}
  .brand .steps span:nth-child(3){height:24px;}
  .brand .steps span:nth-child(4){height:32px;}
  .brand h1{color:#fff;font-size:26px;margin:0;letter-spacing:.5px;}
  .brand p{color:var(--gold-l);font-size:12px;margin:4px 0 0;letter-spacing:2px;}
  .mode-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .mode-tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #354569;background:#1a2540;color:#9aa6c4;font-weight:600;font-size:14px;}
  .mode-tabs button.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
  .login-card input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #354569;background:#0f1729;color:#fff;font-size:16px;margin-bottom:12px;letter-spacing:2px;}
  .login-card input::placeholder{color:#5b6889;letter-spacing:normal;}
  .btn-gold{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy);font-weight:700;font-size:15px;}
  .login-err{color:#ff9d8a;font-size:13px;margin:-4px 0 12px;min-height:16px;}
  .setup-note{color:#9aa6c4;font-size:12px;line-height:1.6;margin-top:14px;text-align:center;}

  #appShell{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
  .sidebar .brand-mini{padding:22px 18px 16px;border-bottom:1px solid #263254;}
  .sidebar .brand-mini h2{font-size:17px;margin:0;color:#fff;}
  .sidebar .brand-mini span{font-size:10px;color:var(--gold-l);letter-spacing:1.5px;}
  .nav-item{padding:13px 20px;color:#aab4d4;font-size:14px;font-weight:500;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;}
  .nav-item:hover{background:#1a2540;color:#fff;}
  .nav-item.active{background:#1a2540;color:#fff;border-left-color:var(--gold);}
  .nav-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #263254;}
  .nav-bottom button{width:100%;background:transparent;border:1px solid #354569;color:#9aa6c4;padding:9px;border-radius:8px;font-size:13px;margin-bottom:8px;}
  .conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--green);}
  .conn-dot.off{background:var(--red);}
  .conn-status{font-size:11px;color:#9aa6c4;padding:0 20px 12px;}
  .main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1200px;}
  .mobile-topbar{display:none;background:var(--navy);color:#fff;padding:14px 16px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .mobile-topbar button{background:none;border:none;color:#fff;font-size:22px;}
  .save-banner{display:none;background:#4a1f1f;color:#ffb3a3;padding:10px 16px;font-size:13px;border-radius:10px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;}
  .save-banner button{background:#ffb3a3;color:#4a1f1f;border:none;padding:6px 12px;border-radius:6px;font-weight:600;font-size:12px;}

  h1.page-title{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .page-sub{color:#7a7666;font-size:13px;margin:0 0 20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-top:3px solid var(--gold);}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--navy);font-family:'Noto Serif KR',serif;}
  .stat-card .lbl{font-size:12px;color:#8a8674;margin-top:2px;}
  .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-size:13px;font-weight:600;}
  .btn.outline{background:#fff;color:var(--navy);}
  .btn.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));border-color:var(--gold);color:var(--navy);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .between{justify-content:space-between;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;}
  th{color:#8a8674;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.green{background:#e4f5e8;color:var(--green);}
  .badge.yellow{background:#fdf2df;color:#a97c15;}
  .badge.red{background:#fbe6e2;color:var(--red);}
  .badge.gray{background:#eee;color:#888;}
  input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);}
  textarea{width:100%;resize:vertical;}
  .tabs2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tabs2 button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:#6b6858;}
  .tabs2 button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .step-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;padding:3px 10px 3px 3px;border-radius:20px;font-size:11px;}
  .step-chip b{background:var(--gold);color:var(--navy);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .empty{text-align:center;padding:50px 20px;color:#9c9880;}
  .empty .big{font-size:40px;margin-bottom:10px;}
  a.link{color:var(--navy);font-weight:600;text-decoration:underline;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
  .thumb-wrap{position:relative;}
  .thumb-x{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(10,12,20,.92);z-index:999;align-items:center;justify-content:center;padding:20px;}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:6px;}
  .lightbox .close{position:absolute;top:16px;right:22px;color:#fff;font-size:30px;background:none;border:none;}
  .lb-download{position:absolute;top:20px;left:22px;color:#fff;font-size:13px;background:rgba(255,255,255,.14);border:none;padding:8px 14px;border-radius:20px;font-weight:600;}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .lb-prev{left:10px;}
  .lb-next{right:10px;}
  .lb-counter{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:900;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:var(--radius);padding:22px;width:min(440px,94vw);}
  .modal h3{margin:0 0 8px;}
  .modal p{color:#6b6858;font-size:13px;line-height:1.6;}
  .modal .row{margin-top:18px;justify-content:flex-end;}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .legend{font-size:12px;display:flex;flex-direction:column;gap:5px;}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;}
  .studentcode{font-family:monospace;font-weight:700;letter-spacing:1px;background:#f1efe4;padding:2px 7px;border-radius:6px;}
  .weekgrid{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;font-size:12px;}
  .weekgrid .hd{font-weight:700;text-align:center;color:#8a8674;padding:4px;}
  .weekgrid textarea{width:100%;height:50px;font-size:11px;padding:4px;}
  @media(max-width:880px){
    .grid-stats{grid-template-columns:repeat(2,1fr);}
    .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:200;transition:left .25s;width:230px;overflow-y:auto;}
    .sidebar.open{left:0;}
    .mobile-topbar{display:flex;}
    .main{padding:16px;}
    .layout{display:block;}
    table{font-size:12px;}
    th,td{padding:6px 5px;}
  }

/* v7: 반별 수업기록 가독성 개선 - 데이터 로직 변경 없음 */
.class-record-list{display:flex;flex-direction:column;gap:14px;}
.class-student-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
.class-student-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line);}
.class-student-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:16px;}
.class-record-grid{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(300px,1.35fr) minmax(280px,1.15fr);gap:12px;align-items:start;}
.class-record-box{border:1px solid var(--line);border-radius:11px;background:#fcfbf7;padding:10px;min-width:0;}
.class-record-box h4{margin:0 0 8px;font-size:12px;color:#6b6858;}
.class-mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.class-field label{display:block;font-size:10px;color:#8a8674;margin-bottom:4px;}
.class-field input,.class-field select,.class-field textarea{width:100%;min-width:0;box-sizing:border-box;}
.class-field textarea{resize:vertical;}
.class-wide{grid-column:span 2;}
.class-bottom-grid{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(220px,.8fr) minmax(220px,.8fr);gap:12px;margin-top:12px;}
.class-note textarea{width:100%;min-height:64px;box-sizing:border-box;}
@media(max-width:1100px){.class-record-grid{grid-template-columns:1fr 1fr}.class-bottom-grid{grid-template-columns:1fr 1fr}.class-wide{grid-column:auto}}
@media(max-width:760px){.class-record-grid,.class-bottom-grid,.class-mini-grid{grid-template-columns:1fr}.class-student-card{padding:10px}.class-student-head{align-items:flex-start}.class-student-head .btn{flex:none}}


/* STAD 계획-정산형 UI */
.stad-todo-edit-row{display:grid;grid-template-columns:24px minmax(160px,1fr) 105px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stad-settle-grid{display:grid;grid-template-columns:34px minmax(170px,1fr) 86px 86px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stad-carry-row{display:grid;grid-template-columns:28px minmax(150px,1fr) minmax(150px,.8fr);gap:8px;align-items:center;padding:6px 0}
.stad-stars{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:700px){
  .stad-todo-edit-row{grid-template-columns:22px 1fr 96px}
  .stad-settle-grid{grid-template-columns:30px 1fr 76px;gap:6px}.stad-settle-grid .stad-expected{display:none}
  .stad-carry-row{grid-template-columns:26px 1fr}.stad-carry-row .stad-carry-when-wrap{grid-column:2}
}

</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div>M&amp;m 수학훈련소를 불러오는 중이에요...</div>
</div>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand">
      <div class="steps"><span></span><span></span><span></span><span></span></div>
      <h1>M&amp;m 수학훈련소</h1>
      <p>MATH MASTER TRAINING CENTER</p>
    </div>
    <div class="mode-tabs">
      <button id="tabDirector" class="active" onclick="setLoginMode('director')">원장 모드</button>
      <button id="tabStudent" onclick="setLoginMode('student')">학생 모드</button>
    </div>
    <div id="directorLogin">
      <input type="password" id="pwInput" placeholder="비밀번호를 입력해주세요" maxlength="20">
      <div class="login-err" id="pwErr"></div>
      <button class="btn-gold" onclick="tryDirectorLogin()">원장 모드로 입장</button>

      <button class="btn-gold" onclick="tryStudentLogin()">내 페이지 열기</button>
    </div>
  </div>
</div>

<div id="appShell">
  <div class="mobile-topbar">
    <button onclick="toggleSidebar(true)">☰</button>
    <strong>M&amp;m 수학훈련소</strong>
    <span style="width:22px;"></span>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="brand-mini"><h2>M&amp;m 수학훈련소</h2><span>MATH MASTER</span></div>
      <div id="navItems"></div>
      <div class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">실시간 연결됨</span></div>
      <div style="font-size:10px;color:#5b6889;padding:0 20px 10px;">버전: 2026-10-07 v96.3 · 숙제 즉시판정·코멘트 저장확인 + PDF 수식글꼴 자동복원 · 일일리포트 즉시반영 (STAD 복구 + 문제저장소 범용 PDF)</div>
      <div class="nav-bottom">
        <button onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="close" onclick="closeLightbox(event)">&times;</button>
  <button class="lb-download" onclick="downloadLightboxImage(event)">⬇ 저장</button>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="lbGoPrev(event)">&#8249;</button>
  <img id="lightboxImg" src="">
  <button class="lb-nav lb-next" id="lbNext" onclick="lbGoNext(event)">&#8250;</button>

</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <div class="row">
      <button class="btn outline" onclick="closeModal()">취소</button>
      <button class="btn danger" id="modalConfirmBtn">확인</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   M&m 수학훈련소 - Firebase(Firestore) 기반 실서비스 버전
   ========================================================= */

// ⚠️ 아래 firebaseConfig는 원장님의 Firebase 프로젝트 값으로 이미 채워져 있어요.
const firebaseConfig = {
  apiKey: "AIzaSyA4Uf5jRBd5K9CKU-W4l0Rk5KvQDp-Rq2M",
  authDomain: "math-master-6a888.firebaseapp.com",
  projectId: "math-master-6a888",
  storageBucket: "math-master-6a888.firebasestorage.app",
  messagingSenderId: "943375843047",
  appId: "1:943375843047:web:116ce75ba8d15cb126ec42"
};

firebase.initializeApp(firebaseConfig);
const fsdb = firebase.firestore();
const fauth = firebase.auth();

// 반복 진입 체감속도 개선: 이전에 받은 Firestore 데이터를 기기 캐시에 보관해
// 다음 진입 때 캐시를 먼저 보여주고 뒤에서 서버와 동기화한다.
const firestorePersistenceReady = fsdb.enablePersistence({synchronizeTabs:true})
  .then(()=>true)
  .catch(err=>{
    console.warn('[Firestore 캐시 비활성]', err?.code||err);
    return false;
  });

let session = null;
let loginMode = 'director';
let currentView = 'dashboard';
let currentSubState = {};
let unsubscribers = [];
let roleUnsubscribers = [];
let viewUnsubscribers = [];
let loadedViewData = new Set(); // 로그인 이후(원장/학생)에만 붙는, 날짜별로 계속 쌓이는 데이터용 리스너
let listenersReady = { settings:false, students:false, classes:false };

// local in-memory mirror, kept in sync by Firestore real-time listeners
let db = {
  settings:{ adminPassword:'0000', isDefaultPassword:true },
  classes:[], students:[], courses:[], videos:[],
  classRecords:{}, weeklyPlans:{}, fridaySupp:{}, submissions:{}, practiceProgress:{},
  questions:[], feedbacks:[], kmm:[], schoolExams:[], schoolScores:{}, timerState:{}, weekendSettings:{enabled:false}, weekendClasses:[], weekendSubmissions:{},
  stadSettings:{enabled:false, infoText:'', applyOpen:'', applyClose:'', zoomLink:''}, stadApplications:{}, stadDaily:{}, solutionPhotos:[], focusHistory:{},
  assignments:{}, answerSubmissions:{}
};

// v87 문제저장소: 운영 db와 분리. 화면을 열 때만 한 페이지씩 읽는다.
const problemStore = {
  items:[], selected:new Set(), lastDoc:null, page:1, hasMore:false,
  loading:false, loaded:false, queryToken:'', searchDebounce:null, filter:{q:'',grade:'',semester:'',major:'',middle:'',concept:'',geometry:'',ask:'',skill:''},
  tab:'library', ingest:{sources:[],drafts:[],loading:false,loaded:false,sourceFilter:'',statusFilter:'review',aiFilter:''},
  analysisRun:{active:false,total:0,done:0,current:'',message:'',error:''},
  saveRun:{active:false,total:0,done:0,saved:0,duplicates:0,failed:0,message:'',errors:[]}
};

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ---------------- FIRESTORE INIT & REAL-TIME LISTENERS ---------------- */
async function initFirebase(){
  try{
    await firestorePersistenceReady;
    try{ await fauth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
    if(!fauth.currentUser) await fauth.signInAnonymously();
  }catch(e){
    showFatalError('로그인 서버에 연결하지 못했어요. 인터넷 연결을 확인한 뒤 새로고침 해주세요.');
    return;
  }
  attachCoreListeners();
  startLoadingTimeoutWatchdog();
}

function showFatalError(msg){
  document.getElementById('loadingScreen').innerHTML = `
    <div style="text-align:center;padding:20px;max-width:340px;">
      <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
      <div style="margin-bottom:16px;">${msg}</div>
      <button class="btn-gold" onclick="location.reload()">다시 시도</button>
    </div>`;
}
// 안전장치: settings/students/classes 리스너 중 하나라도 실패하거나 응답이 없으면
// (네트워크 문제, 권한 오류, 알 수 없는 이유 등 어떤 원인이든) 로딩 화면에 영원히 갇히지 않도록,
// 일정 시간 뒤에도 준비가 안 됐으면 명확한 오류 화면 + 재시도 버튼을 띄운다.
function startLoadingTimeoutWatchdog(){
  setTimeout(()=>{
    if(!(listenersReady.settings && listenersReady.students && listenersReady.classes)){
      showFatalError('학생·반 정보를 불러오는 데 시간이 오래 걸리고 있어요. 인터넷 연결을 확인한 뒤 다시 시도해주세요.');
    }
  }, 12000);
}

function setConnStatus(ok){
  const dot = document.getElementById('connDot'); const txt = document.getElementById('connText');
  if(!dot) return;
  dot.classList.toggle('off', !ok);
  txt.textContent = ok ? '실시간 연결됨' : '연결 끊김 - 재시도 중';
}

// 로그인 전부터 필요하고, 시간이 지나도 크게 늘어나지 않는 "기준정보" 컬렉션들.
// 원장/학생 구분 없이 항상 전체를 구독해도 안전함 (읽기량이 크지 않음).
function attachCoreListeners(){
  const subs = [
    fsdb.collection('meta').doc('settings').onSnapshot(async doc=>{
      if(doc.exists){ db.settings = doc.data(); }
      else{
        db.settings = { adminPassword:'0000', isDefaultPassword:true };
        try{ await fsdb.collection('meta').doc('settings').set(db.settings); }catch(e){}
      }
      listenersReady.settings = true;
      maybeFinishLoading();
      scheduleRender();
    }, err=>{ setConnStatus(false); }),

    fsdb.collection('students').onSnapshot(snap=>{
      db.students = snap.docs.map(d=>({id:d.id, ...d.data()}));
      listenersReady.students = true;
      maybeFinishLoading();
      scheduleRender();
    }, err=>{ setConnStatus(false); }),

    fsdb.collection('classes').onSnapshot(snap=>{
      db.classes = snap.docs.map(d=>({id:d.id, ...d.data()}));
      listenersReady.classes = true;
      maybeFinishLoading();
      Object.keys(fridayWeekLoads).forEach(week=>{
        if(fridayWeekLoads[week]?.status==='waiting-classes') requestFridayWeekLoad(week);
      });
      scheduleRender();
    }, err=>{ setConnStatus(false); }),
    fsdb.collection('courses').onSnapshot(snap=>{ db.courses = snap.docs.map(d=>({id:d.id, ...d.data()})); scheduleRender(); }),
    // videos는 첫 화면에 필요하지 않으므로 수업/영상 화면 진입 때만 불러온다.
    fsdb.collection('weekendSettings').doc('main').onSnapshot(doc=>{
      db.weekendSettings = doc.exists ? doc.data() : {enabled:false};
      scheduleRender();
    }),
    fsdb.collection('weekendClasses').onSnapshot(snap=>{
      db.weekendClasses = snap.docs.map(d=>({id:d.id,...d.data()})); scheduleRender();
    }),
    fsdb.collection('stadSettings').doc('main').onSnapshot(doc=>{
      db.stadSettings = doc.exists ? doc.data() : {enabled:false, infoText:'', applyOpen:'', applyClose:''};
      scheduleRender();
    }),
  ];
  unsubscribers = subs;
  setConnStatus(true);
}

// 문서ID가 'prefix'로 시작하는 문서만 가져오는 범위 쿼리.
// (classRecords/weeklyPlans/fridaySupp는 '반ID_날짜', submissions/weekendSubmissions는
//  '학생ID_날짜' 형태의 키를 쓰므로, 이 방식으로 "내 것"만 정확히 걸러낼 수 있음)
function idRangeQuery(colName, prefix){
  const fp = firebase.firestore.FieldPath.documentId();
  return fsdb.collection(colName).where(fp, '>=', prefix).where(fp, '<', prefix + '\uf8ff');
}
const RECENT_RECORD_DAYS = 7;
function recentRecordStartISO(){ return dateDaysAgoISO(RECENT_RECORD_DAYS-1); }
function idRecentRangeQuery(colName, prefix, startDate=recentRecordStartISO()){
  const fp=firebase.firestore.FieldPath.documentId();
  return fsdb.collection(colName).where(fp,'>=',prefix+startDate).where(fp,'<',prefix+'\uf8ff');
}

// 로그인 이후에만 필요하고, 날짜가 지날수록 계속 쌓이는 "기록" 컬렉션들.
// 원장은 전체 학생을 관리해야 하니 컬렉션 전체를 구독하고,
// 학생은 자기 것만 구독해서 Firestore 읽기량을 크게 줄인다.
// (예전 구조는 로그인 전부터 이 컬렉션들을 전부 구독해서, 학생이 접속할 때마다
//  학원 전체의 몇 달치 기록을 통째로 다시 읽어와 Firestore 무료 할당량을 초과시켰음 — 2026-09-07 사건)
// 역할별 리스너가 실패했을 때(권한 오류, 색인 누락, 네트워크 등) 조용히 묻히지 않고
// "연결 끊김" 표시로 바로 드러나게 하는 공용 에러 핸들러. (2026-10-01: 실시간 연결됨은 떠있는데
// 실제 숙제/질문 데이터는 하나도 안 불러와지던 사건 이후 추가 — 그땐 core 리스너 2개만 연결상태를
// 판단해서, role 리스너가 조용히 실패해도 초록불이 계속 떠 있었음)
function roleListenerError(colName){
  return (err)=>{
    console.error('[역할별 리스너 오류]', colName, err);
    setConnStatus(false);
  };
}
function dateDaysAgoISO(days){
  const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-Number(days||0));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function shiftISODate(dateISO,days){
  const d=new Date(dateISO+'T12:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return toLocalISODate(d);
}
function mergeFridaySuppData(preferred,legacy){
  const merged={};
  Object.entries(legacy||{}).forEach(([stuId,value])=>{ if(value&&typeof value==='object') merged[stuId]={...value}; });
  Object.entries(preferred||{}).forEach(([stuId,value])=>{ if(value&&typeof value==='object') merged[stuId]={...(merged[stuId]||{}),...value}; });
  return merged;
}
async function readFridaySuppWeek(clsId,weekStart){
  const currentKey=clsId+'_'+weekStart;
  // 예전 일요일 키 기록도 읽기만 해서 현재 주 보강에 합쳐 보여준다. 원본/Firestore 문서는 옮기거나 지우지 않는다.
  const legacyKey=clsId+'_'+shiftISODate(weekStart,-1);
  const [currentDoc,legacyDoc]=await Promise.all([
    fsdb.collection('fridaySupp').doc(currentKey).get({source:'server'}),
    fsdb.collection('fridaySupp').doc(legacyKey).get({source:'server'})
  ]);
  const current=currentDoc.exists?currentDoc.data():{};
  const legacy=legacyDoc.exists?legacyDoc.data():{};
  return {key:currentKey,exists:!!(currentDoc.exists||legacyDoc.exists),data:mergeFridaySuppData(current,legacy),legacyFound:!!legacyDoc.exists};
}
async function ensureClassDateData(clsId,date,force){
  if(!session || session.mode!=='director' || !clsId || !/^\d{4}-\d{2}-\d{2}$/.test(date||'')) return;
  const wk=weekStartISO(date);
  // 금요일 보강은 저장·표시 모두 '<반ID>_<그 주 월요일>' 문서(renderFridaySupp/updateFriday)이므로 같은 키로 읽는다.
  // (이전에는 고른 날짜 그대로 읽어서, 로그인 때 읽지 않은 지난 주의 기록이 있어도 비어 보였다)
  const wants=[['classRecords',clsId+'_'+date],['weeklyPlans',clsId+'_'+wk],['fridaySupp',clsId+'_'+wk]];
  await Promise.all(wants.map(async ([col,key])=>{
    if(!force && db[col] && db[col][key]!==undefined) return;
    try{
      // v97: 반 페이지를 열 때는 캐시가 아니라 서버에서 직접 읽는다(일괄 적용 등 다른 경로로 저장된 기록이 빠지지 않게)
      if(col==='fridaySupp'){
        const result=await readFridaySuppWeek(clsId,wk);
        if(result.exists) db.fridaySupp[key]=result.data;
        else delete db.fridaySupp[key];
      }else{
        const doc=await fsdb.collection(col).doc(key).get({source:'server'});
        if(doc.exists){ db[col][key]=doc.data(); }
      }
    }catch(e){
      console.error('[수업 데이터 조회 오류]',col,key,e);
      currentSubState.classLoadError='이 날짜의 수업 기록을 서버에서 불러오지 못했어요. 비어 보여도 기록이 없는 게 아닐 수 있으니 새로고침 후 다시 확인해주세요.';
    }
  }));
  scheduleRender();
}
async function setClassDate(clsId,date){
  currentSubState.classDate=date;
  currentSubState._classDateLoaded=currentSubState._classDateLoaded||{};
  await ensureClassDateData(clsId,date);
  currentSubState._classDateLoaded[clsId+'_'+date]=true;
  render();
}

// 2026-10-12 숙제 조회 상태: 원장 화면에서 "조회 누락"과 "실제 미제출"을 구분하기 위한 상태.
// currentSubState는 화면 이동(goto)마다 초기화되므로 여기에 두면 안 된다 → 모듈 변수로 관리.
let homeworkLoadGen=0;                 // 로그인/계정전환마다 증가. 이전 세션의 비동기 결과 폐기용
let homeworkRecentLoadState='idle';    // 원장: loading | ready | error
let homeworkRecentStart='';
const homeworkKnownDates=new Set();    // 원장이 "이 날짜 불러오기"로 전체 학생을 조회한 날짜
const homeworkKnownStudents=new Set(); // 원장이 학생 상세에서 전체 기록을 조회한 학생
// 해당 날짜(·학생)의 숙제 기록을 서버에서 확실히 조회했는지. 모르면 미제출로 판정하지 않는다.
function homeworkRecordKnown(date, stuId){
  if(!session || session.mode!=='director') return true;
  if(!date || isLegacyHomeworkDate(date)) return true;
  if(stuId && homeworkKnownStudents.has(stuId)) return true;
  if(homeworkKnownDates.has(date)) return true;
  return homeworkRecentLoadState==='ready' && !!homeworkRecentStart && date>=homeworkRecentStart;
}
function submissionDocKeyDate(key){ const i=String(key||'').lastIndexOf('_'); return i>=0?String(key).slice(i+1):''; }
function attachRoleListeners(){
  roleUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
  roleUnsubscribers=[];
  if(!session) return;

  const isDirector=session.mode==='director';
  const hwGen=++homeworkLoadGen;
  homeworkRecentLoadState=isDirector?'loading':'idle';
  homeworkKnownDates.clear(); homeworkKnownStudents.clear();
  const stuId=session.studentId||null;
  const stu=stuId?studentById(stuId):null;
  const resolvedClass=stuId?classForStudent(stuId):null;
  const clsId=resolvedClass?resolvedClass.id:(stu?stu.classId:null);
  const studentClassIds=stuId?[...new Set(classesForStudent(stuId).map(c=>c.id).concat(clsId?[clsId]:[]))]:[];
  const subs=[];
  const recentStart=recentRecordStartISO();
  const currentWeek=weekStartISO(todayISO());
  clearWeekendAdminWeekListener();

  // 수업기록/주간계획/금요보강:
  // 로그인 때 전체 역사를 실시간 구독하지 않는다.
  // 최근 7일만 1회 읽고, 특정 과거 날짜는 화면에서 선택할 때 exact doc 1건을 읽는다.
  ['classRecords','weeklyPlans','fridaySupp'].forEach(col=>{ db[col]={}; });
  const classIds=isDirector?(db.classes||[]).map(c=>c.id):studentClassIds;
  Promise.all(classIds.flatMap(cid=>[
    fsdb.collection('classRecords')
      .where(firebase.firestore.FieldPath.documentId(),'>=',cid+'_'+recentStart)
      .where(firebase.firestore.FieldPath.documentId(),'<',cid+'_\uf8ff').get()
      .then(snap=>snap.docs.forEach(d=>{db.classRecords[d.id]=d.data();})),
    fsdb.collection('weeklyPlans').doc(cid+'_'+currentWeek).get()
      .then(doc=>{if(doc.exists)db.weeklyPlans[doc.id]=doc.data();}),
    fsdb.collection('fridaySupp')
      .where(firebase.firestore.FieldPath.documentId(),'>=',cid+'_'+recentStart)
      .where(firebase.firestore.FieldPath.documentId(),'<',cid+'_\uf8ff').get()
      .then(snap=>snap.docs.forEach(d=>{db.fridaySupp[d.id]=d.data();}))
  ])).then(()=>scheduleRender()).catch(e=>console.error('[최근 7일 수업기록 조회]',e));

  // 숙제: 원장은 학생별 N개 리스너 대신 최근 7일 전체를 단일 쿼리로 구독한다.
  db.submissions={};
  if(isDirector){
    homeworkRecentStart=recentStart;
    let dateQueryReady=false, idQueryReady=false;
    const markHomeworkReady=()=>{
      if(hwGen!==homeworkLoadGen) return;
      if(dateQueryReady && idQueryReady && homeworkRecentLoadState!=='error') homeworkRecentLoadState='ready';
      scheduleRender();
    };
    const markHomeworkError=(where,e)=>{
      if(hwGen!==homeworkLoadGen) return;
      console.error('[숙제 조회 실패]',where,e);
      homeworkRecentLoadState='error';
      setConnStatus(false);
      scheduleRender();
    };
    // (1) date 필드가 있는 최근 기록: 실시간 구독
    const q=fsdb.collection('submissions').where('date','>=',recentStart);
    subs.push(q.onSnapshot({includeMetadataChanges:true},snap=>{
      if(hwGen!==homeworkLoadGen) return;
      const recent={};
      snap.docs.forEach(d=>recent[d.id]=d.data());
      // date 필드가 있는 최근 문서만 교체한다. date 필드가 없는 기존 문서(보완 조회분)와
      // 원장이 직접 불러온 과거 날짜 데이터는 지우지 않는다.
      Object.keys(db.submissions).forEach(k=>{
        const d=db.submissions[k];
        if(d && d.date && d.date>=recentStart && !recent[k]) delete db.submissions[k];
      });
      Object.assign(db.submissions,recent);
      if(!snap.metadata.fromCache){ dateQueryReady=true; markHomeworkReady(); }
      else scheduleRender();
    },e=>{ roleListenerError('submissions-recent')(e); markHomeworkError('submissions-recent',e); }));
    // (2) date 필드가 없는 기존 기록 보완: 문서 ID(학생ID_날짜) 범위로 학생별 1회 조회.
    //     로그인(세션)마다 1번만 실행되며, 실시간 스냅샷 반복과 무관하다.
    (async()=>{
      try{
        const students=(db.students||[]).filter(x=>x && x.id);
        if(!students.length) throw new Error('학생 목록이 아직 로드되지 않았습니다.');
        let cursor=0;
        const worker=async()=>{
          while(cursor<students.length){
            const sid=students[cursor++].id;
            const snap=await idRecentRangeQuery('submissions',sid+'_',recentStart).get({source:'server'});
            if(hwGen!==homeworkLoadGen) return;
            snap.docs.forEach(d=>{ if(!db.submissions[d.id]) db.submissions[d.id]=d.data(); });
          }
        };
        await Promise.all(Array.from({length:Math.min(6,students.length)},worker));
        if(hwGen!==homeworkLoadGen) return;
        idQueryReady=true; markHomeworkReady();
      }catch(e){ markHomeworkError('submissions-id-fallback',e); }
    })();
    // 오래된 건이라도 아직 검토대기라면 놓치지 않는다.
    let pendingIds=new Set();
    subs.push(fsdb.collection('submissions').where('status','==','대기').onSnapshot(snap=>{
      if(hwGen!==homeworkLoadGen) return;
      const next=new Set(snap.docs.map(d=>d.id));
      pendingIds.forEach(id=>{
        if(next.has(id)) return;
        const row=db.submissions[id];
        if((row?.date||submissionDocKeyDate(id))<recentStart) delete db.submissions[id];
      });
      snap.docs.forEach(d=>db.submissions[d.id]=d.data());
      pendingIds=next; scheduleRender();
    },roleListenerError('submissions-pending')));
  }else if(stuId){
    subs.push(idRecentRangeQuery('submissions',stuId+'_',recentStart).onSnapshot(snap=>{
      const keep={};
      snap.docs.forEach(d=>keep[d.id]=d.data());
      Object.keys(db.submissions).forEach(k=>{
        if(k.startsWith(stuId+'_') && (db.submissions[k]?.date||k.slice(-10))>=recentStart) delete db.submissions[k];
      });
      Object.assign(db.submissions,keep); scheduleRender();
    },roleListenerError('submissions')));
  }

  // 주말학습 인증: 학생은 이번 주, 원장은 선택한 확인 주만 조회.
  db.weekendSubmissions={};
  if(isDirector){
    subscribeWeekendAdminWeek(currentSubState.weekendWeek || weekendReviewWeekStart(academicTodayISO()));
  }else if(stuId){
    subs.push(idRecentRangeQuery('weekendSubmissions',stuId+'_',currentWeek).onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.weekendSubmissions=m; scheduleRender();
    },roleListenerError('weekendSubmissions')));
  }

  // STAD 신청정보는 월 단위로 적고 작아서 유지. 일일 기록은 최근 7일만.
  if(isDirector){
    subs.push(fsdb.collection('stadApplications').onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.stadApplications=m; scheduleRender();
    },roleListenerError('stadApplications')));
    subs.push(fsdb.collection('stadDaily').where('date','>=',recentStart).onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.stadDaily=m; scheduleRender();
    },roleListenerError('stadDaily')));
  }else if(stuId){
    db.stadApplications={}; db.stadDaily={};
    subs.push(idRangeQuery('stadApplications',stuId+'_').onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.stadApplications=m; scheduleRender();
    },roleListenerError('stadApplications')));
    subs.push(idRecentRangeQuery('stadDaily',stuId+'_',recentStart).onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.stadDaily=m; scheduleRender();
    },roleListenerError('stadDaily')));
  }

  // 연습진도는 학생당 1문서라 전체여도 작다.
  if(isDirector){
    subs.push(fsdb.collection('practiceProgress').onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.practiceProgress=m; scheduleRender();
    },roleListenerError('practiceProgress')));
  }else if(stuId){
    db.practiceProgress={};
    subs.push(fsdb.collection('practiceProgress').doc(stuId).onSnapshot(doc=>{
      db.practiceProgress=doc.exists?{[stuId]:doc.data()}:{};
      scheduleRender();
    },roleListenerError('practiceProgress')));
  }

  // 내신성적은 학생 본인만 즉시, 원장은 해당 화면 진입 때만.
  if(!isDirector&&stuId){
    db.schoolScores={};
    subs.push(fsdb.collection('schoolScores').where('studentId','==',stuId).onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); db.schoolScores=m; scheduleRender();
    },roleListenerError('schoolScores')));
  }

  // 질문은 즉시성이 중요하므로 실시간 유지. KMM은 작은 텍스트 문서라 유지.
  ['questions','kmm'].forEach(col=>{
    if(isDirector){
      subs.push(fsdb.collection(col).onSnapshot(snap=>{
        db[col]=snap.docs.map(d=>({id:d.id,...d.data()})); scheduleRender();
      },roleListenerError(col)));
    }else if(stuId){
      db[col]=[];
      subs.push(fsdb.collection(col).where('studentId','==',stuId).onSnapshot(snap=>{
        db[col]=snap.docs.map(d=>({id:d.id,...d.data()})); scheduleRender();
      },roleListenerError(col)));
    }
  });

  }else db.focusHistory={};

  roleUnsubscribers=subs;
}

function studentLessonRecords(stuId){
  const seen = new Set();
  const recs = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    if(!obj[stuId]) return;
    const date = key.slice(-10);
    const clsId = key.slice(0, key.length-11);
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup, date)) return; // 실제 수업 요일이 아닌 날은 제외 (오탐 경고 방지)
    const k = date+'_'+clsId;
    if(seen.has(k)) return;
    seen.add(k);
    recs.push({date, clsId});
  });
  recs.sort((a,b)=>a.date.localeCompare(b.date));
  return recs;
}

const HOMEWORK_REVIEW_CUTOVER_DATE = '2026-09-07'; // 2026-09-07: 시스템 장애(서버 연결 지연) 사건으로 원장님 요청에 따라 리셋 기준일을 9/7로 이동
function isLegacyHomeworkDate(date){
  return !!date && String(date) < HOMEWORK_REVIEW_CUTOVER_DATE;
}
// v37 숙제 검토 상태 중앙 판정.
// 기존 과거 데이터 보호: status 필드가 없는 예전 인증은 '승인'으로 간주한다.
// 새 인증은 '대기', 원장 확인은 '확인', 불합격은 '불합격'.

const HOMEWORK_MAX_REVIEWS = 3;
// v97: 학생이 사진과 함께 제출하면 자동으로 저장되는 상태. 원장 수동 승인 없이 제출로 인정하며, 품질은 '숙제 완성도'(수업기록)로 따로 평가한다.
const HW_AUTO_SUBMITTED = '제출완료';
function submissionIsAutoSubmitted(sub){ return !!sub && String(sub.status||'').trim()===HW_AUTO_SUBMITTED; }

function homeworkReviewCount(sub){
  const n = Number(sub && sub.reviewCount);
  return Number.isFinite(n) && n > 0 ? Math.min(HOMEWORK_MAX_REVIEWS, Math.floor(n)) : 0;
}
function homeworkReviewsRemaining(sub){
  return Math.max(0, HOMEWORK_MAX_REVIEWS - homeworkReviewCount(sub));
}
function homeworkFirstSubmittedAt(sub){
  // 마감 판정에는 더 이상 쓰이지 않지만, "언제 처음 제출했는지" 참고 정보로는 계속 보존한다.
  if(!sub) return null;
  const raw = sub.firstSubmittedAt || sub.submittedAt || null;
  if(!raw) return null;
  if(raw && typeof raw.toDate==='function') return raw.toDate();
  if(raw && typeof raw.seconds==='number') return new Date(raw.seconds*1000);
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}
function submissionIsFinalRejected(sub){
  if(!sub) return false;
  const status = String(sub.status||'').trim();
  return status==='최종불합격' || (status==='불합격' && homeworkReviewCount(sub)>=HOMEWORK_MAX_REVIEWS);
}
/*
  숙제 최종 집계 상태 (제출 시각/마감 개념 없음 — 오직 원장의 수동 판정만 기준)
  - 제출이 있으면: 원장이 인정/불합격/대기 중 무엇으로 판정했는지가 전부다. 언제 제출했는지는 판정에 영향을 주지 않는다.
  - 제출이 아예 없으면: 그 날짜가 이미 지났으면 '미제출', 오늘이거나 아직 안 지났으면 '대기중'.
  - 1·2차 불합격은 재제출 가능 상태, 3차 불합격만 최종 미이행으로 확정.
*/

function homeworkEffectiveState(sub,date,stuId){
  // 리스타트 기준일 이전은 제출 유무와 무관하게 무조건 '인정'으로 취급한다.
  if(isLegacyHomeworkDate(date)) return 'approved';
  // 기록이 없더라도 서버 조회가 끝나지 않았거나 조회 범위 밖이면 '미제출'로 단정하지 않는다.
  if(!sub) return (date < todayISO()) ? (homeworkRecordKnown(date,stuId) ? 'missing' : 'unknown') : 'open';
  if(submissionIsApproved(sub,date)) return 'approved';
  if(submissionIsFinalRejected(sub)) return 'finalRejected';
  return submissionReviewState(sub,date); // 'pending' 또는 'rejected'
}
function homeworkCountsAsCompleted(sub,date){
  // 리스타트 기준일 이전은 제출 유무와 무관하게 무조건 완료로 취급한다.
  if(isLegacyHomeworkDate(date)) return true;
  if(!sub) return false;

  // 최종 인정 여부는 선생님의 판정이 우선한다.
  return submissionIsApproved(sub,date);
}
function homeworkCountsAsMissed(sub,date,stuId){
  // 리스타트 기준일 이전은 제출 유무와 무관하게 무조건 미이행이 아니라고 취급한다.
  if(isLegacyHomeworkDate(date)) return false;
  if(!sub) return date < todayISO() && homeworkRecordKnown(date,stuId);
  if(String(sub.status||'').trim()==='미인증') return date < todayISO();

  // 선생님이 인정한 기록은 어떤 경우에도 미이행/경고 대상으로 되돌리지 않는다.
  if(submissionIsApproved(sub,date)) return false;

  if(submissionIsFinalRejected(sub)) return true;
  // 1·2차 불합격(재제출 가능)이나 검토대기는 아직 미이행으로 확정하지 않는다.
  return false;
}
function submissionReviewState(sub,date,stuId){
  const recordDate = date || (sub && sub.date) || '';
  // 리스타트 기준일 이전은 제출 유무와 무관하게 무조건 보호(인정)한다.
  // (카톡 등 앱 밖으로 제출해서 Firestore에 기록 자체가 없는 날도 여기 해당됨 — 2026-09-07 리스타트)
  if(isLegacyHomeworkDate(recordDate)) return 'approved';
  if(!sub) return homeworkRecordKnown(recordDate,stuId) ? 'missing' : 'unknown';
  const status = String(sub.status||'').trim();
  if(!status) return 'approved'; // 기존 레거시 제출 보호
  if(status==='미인증') return 'missing'; // 선생님이 직접 확인을 해제한 기록: 제출 없음과 같게 취급
  if(status==='확인' || status==='approved') return 'approved';
  if(status===HW_AUTO_SUBMITTED) return 'approved'; // v97: 사진 제출 즉시 '제출 완료'(제출 사실만 의미, 품질 평가 아님)
  if(status==='최종불합격') return 'rejected';
  if(status==='불합격' || status==='rejected') return 'rejected';
  return 'pending'; // '대기' 및 알 수 없는 신규 상태는 안전하게 검토대기
}
function submissionIsApproved(sub,date){ return submissionReviewState(sub,date)==='approved'; }
function submissionIsPending(sub,date){ return submissionReviewState(sub,date)==='pending'; }
function submissionIsRejected(sub,date){ return submissionReviewState(sub,date)==='rejected'; }

function homeworkReviewMark(sub,date,stuId){
  const eff=homeworkEffectiveState(sub,date,stuId);
  if(eff==='unknown') return '…';
  return eff==='approved' ? '○' : (eff==='pending'||eff==='needsRevision') ? '△' : '×';
}
function homeworkReviewLabel(sub,date,stuId){
  const eff=homeworkEffectiveState(sub,date,stuId);
  if(eff==='unknown') return '조회 중';
  if(eff==='approved') return submissionIsAutoSubmitted(sub) ? '제출 완료' : homeworkIsTeacherDirect(sub) ? '선생님 직접 확인' : '인정';
  if(eff==='pending') return '검토대기';
  if(eff==='needsRevision') return '수정필요';
  if(eff==='missing') return (sub && String(sub.status||'').trim()==='미인증') ? '미인증' : '미제출';
  if(eff==='finalRejected') return '최종불합격';
  if(eff==='rejected') return '불합격';
  return '미인증';
}

function lessonHadHomeworkSubmission(stuId, clsId, date){
  const cls = classById(clsId);
  const range = cls ? homeworkDateRangeDates(cls.dayGroup, date) : [];
  if(!range.length) return submissionIsApproved(db.submissions[stuId+'_'+date]);
  return range.some(d => homeworkCountsAsCompleted(db.submissions[stuId+'_'+d],d));
}
function addDaysISO(dateISO, delta){
  const d = new Date(dateISO+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return toLocalISODate(d);
}
function isNextISODate(prevISO, nextISO){ return !!prevISO && addDaysISO(prevISO,1)===nextISO; }
// 원장이 학생별 숙제 현황을 확인·집계할 때 쓰는 날짜별 숙제 상태 목록.
// (예전 자동경고 시스템이 쓰던 함수를 그대로 이어받아 씀 — 마감/경고 관련 로직은 모두 제거하고
//  순수하게 "그 학생 반의 지난 수업일 범위 안에서 날짜별 숙제 상태가 어땠는지"만 계산한다.)
function homeworkStatusRowsForStudent(stuId){
  const today = todayISO();
  const seenLesson = new Set();
  const lessons = [];
  const addLesson = (date, clsId)=>{
    if(!date || !clsId || date>today) return;
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup,date)) return;
    const k=clsId+'|'+date;
    if(seenLesson.has(k)) return;
    seenLesson.add(k);
    lessons.push({date,clsId,dayGroup:cls.dayGroup});
  };
  studentLessonRecords(stuId).forEach(r=>addLesson(r.date,r.clsId));
  const s=studentById(stuId);
  const cls=s&&s.classId?classById(s.classId):null;
  if(cls && isLessonDay(cls.dayGroup,today)) addLesson(today,cls.id);
  lessons.sort((a,b)=>a.date.localeCompare(b.date));

  const byDate=new Map();
  for(const l of lessons){
    for(const d of homeworkDateRangeDates(l.dayGroup,l.date)){
      // 아직 지나지 않은 날짜(오늘 포함)는 미제출로 확정하지 않는다.
      if(d >= today) continue;
      const sub = subForClass(stuId,l.clsId,d);
      const reviewState = submissionReviewState(sub,d,stuId);
      const effectiveState = homeworkEffectiveState(sub,d,stuId);
      if(!byDate.has(d)) byDate.set(d,{
        date:d,
        submitted:effectiveState==='approved',
        pending:effectiveState==='pending' || effectiveState==='needsRevision',
        rejected:reviewState==='rejected',
        missed:effectiveState==='missing' || effectiveState==='finalRejected',
        unknown:effectiveState==='unknown',
        reviewState,
        effectiveState,
        assessedLessonDate:l.date,
        clsId:l.clsId
      });
    }
  }
  return [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
// ===== 2026-08-31 오전 기준 응급복구 =====
// 오늘 수정 과정에서 생성된 자동 경고는 DB에서 지우지 않고 화면/리포트에서 제외한다.
// 원장이 직접 입력한 수동 경고만 유효 경고로 취급한다.
// (예전 형식의 자동경고 문구뿐 아니라, auto:true로 명시된 것도 전부 화면 집계에서 제외한다.
//  자동경고 시스템 자체는 이제 완전히 중단됐으므로, 이 필터는 과거에 남은 기록을 감추는 역할만 한다.
//  실제 삭제는 "경고 오류 점검" 화면에서 관리자가 직접 확인 후 진행한다.)

function attachDirectorViewListeners(v){
  clearViewListeners();
  if(!session || session.mode!=='director') return;
  const addArray=(col)=>{
    viewUnsubscribers.push(fsdb.collection(col).onSnapshot(snap=>{
      db[col]=snap.docs.map(d=>({id:d.id,...d.data()})); loadedViewData.add(col); scheduleRender();
    },roleListenerError(col)));
  };

/* ---------------- IMAGE HELPERS (legacy dataURL + future object-storage refs) ---------------- */
function photoSrc(photo, preferThumb=false){
  if(!photo) return '';
  let src='';
  if(typeof photo==='string') src=photo; // legacy Firestore dataURL / URL
  else if(typeof photo==='object'){
    src=(preferThumb && photo.thumbUrl) || photo.url || photo.downloadUrl || photo.dataUrl || '';
    if(!src && photoStorageKey(photo) && PHOTO_API_BASE){
      return PHOTO_API_BASE.replace(/\/$/,'') + '/photo?key=' + encodeURIComponent(photoStorageKey(photo));
    }
  }
  if(src && !/^https?:\/\//i.test(src) && !src.startsWith('data:') && !src.startsWith('blob:') && PHOTO_API_BASE) return PHOTO_API_BASE.replace(/\/$/,'')+(src.startsWith('/')?'':'/')+src;
  return src;
}
function photoStorageKey(photo){ return photo && typeof photo==='object' ? (photo.storageKey||photo.key||'') : ''; }
function photoIsLegacyDataURL(photo){ return typeof photo==='string' && photo.startsWith('data:'); }
function photoRefForFirestore(photo){
  if(typeof photo==='string') return photo;
  if(!photo || typeof photo!=='object') return '';
  return {url:photo.url||photo.downloadUrl||'', thumbUrl:photo.thumbUrl||'', storageKey:photo.storageKey||photo.key||'', width:photo.width||null, height:photo.height||null, size:photo.size||null, contentType:photo.contentType||'image/jpeg'};
}
function hasLegacyEmbeddedPhotos(value){
  if(photoIsLegacyDataURL(value)) return true;
  if(Array.isArray(value)) return value.some(hasLegacyEmbeddedPhotos);
  if(value && typeof value==='object') return Object.values(value).some(hasLegacyEmbeddedPhotos);
  return false;
}
function firestorePayloadSizeKB(value){ return new Blob([JSON.stringify(value)]).size/1024; }
function embeddedPhotoLimitExceeded(value, limitKB){ return hasLegacyEmbeddedPhotos(value) && firestorePayloadSizeKB(value)>limitKB; }
// Object-storage switch point. Leave PHOTO_API_BASE empty until the private Worker is deployed.
// Existing dataURL photos remain fully compatible.
const PHOTO_API_BASE = 'https://mnm-photo-api.jihagondu.workers.dev';
const PROBLEM_ANALYSIS_API = PHOTO_API_BASE ? PHOTO_API_BASE.replace(/\/$/,'')+'/analyze-problem' : '';
const PROBLEM_SEGMENT_API = PHOTO_API_BASE ? PHOTO_API_BASE.replace(/\/$/,'')+'/segment-problem-page' : '';
async function photoApiToken(){
  const user=fauth.currentUser;
  if(!user) throw new Error('사진 저장 인증이 필요합니다.');
  return await user.getIdToken();
}
function absolutePhotoUrl(photo){
  const src=photoSrc(photo);
  if(!src) return '';
  if(/^https?:\/\//i.test(src) || src.startsWith('data:') || src.startsWith('blob:')) return src;
  return PHOTO_API_BASE ? PHOTO_API_BASE.replace(/\/$/,'') + (src.startsWith('/')?'':'/') + src : src;
}
async function deleteStoredPhoto(photo){
  const key=photoStorageKey(photo);
  if(!key || !PHOTO_API_BASE) return false;
  try{
    const token=await photoApiToken();
    const url=PHOTO_API_BASE.replace(/\/$/,'')+'/photo?key='+encodeURIComponent(key);
    const res=await fetch(url,{method:'DELETE',headers:{Authorization:'Bearer '+token,'X-MNM-Role':session?.mode||'user'}});
    return res.ok;
  }catch(e){ console.warn('R2 photo delete failed',e); return false; }
}
async function storePhotoFile(file, options={}){
  const maxW=options.maxW||480, quality=options.quality??0.4;
  if(PHOTO_API_BASE){
    try{
      const token=await photoApiToken();
      const form=new FormData();
      form.append('file',file,file.name||'photo.jpg');
      form.append('kind',options.kind||'photo');
      const res=await fetch(PHOTO_API_BASE.replace(/\/$/,'')+'/upload',{
        method:'POST',
        headers:{Authorization:'Bearer '+token,'X-MNM-Role':session?.mode||'user'},
        body:form
      });
      const out=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(out?.error || ('R2 upload '+res.status));
      const raw=out.photo || out;
      const key=raw.storageKey || raw.key || raw.r2Key || raw.r2_key || '';
      if(!key) throw new Error('R2 upload response has no storage key');
      const ref=photoRefForFirestore({
        ...raw,
        storageKey:key,
        url:raw.url || raw.downloadUrl || ('/photo?key='+encodeURIComponent(key)),
        contentType:raw.contentType || raw.type || file.type || 'image/jpeg',
        size:raw.size || file.size || null
      });
      return ref;
    }catch(e){
      console.warn('R2 photo upload failed; using compressed embedded fallback so homework submission is not blocked.',e);
      return await fileToCompressedDataURL(file,maxW,quality);
    }
  }
  return await fileToCompressedDataURL(file,maxW,quality);
}
function fileToCompressedDataURL(file, maxW=480, quality=0.4){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleMultiPhotoInput(inputEl, targetArrPush, maxW=480, quality=0.4){
  const files = Array.from(inputEl.files || []);
  let failed=0;
  for(const f of files){
    try{
      const photo = await storePhotoFile(f, {maxW, quality});
      await targetArrPush(photo);
    }catch(e){
      failed++;
      console.error('Photo upload failed.', e);
    }
  }
  inputEl.value='';
  if(failed) alert(`${failed}장의 사진 업로드에 실패했습니다. 다시 시도해주세요.`);
}

function studentById(id){

/* v97 복수 반 수강
   - 학생 프로필은 1건. 소속 반은 classes.studentIds(여러 반 가능) + 레거시 students.classId(단일)로 읽는다.
   - 대표 반(primary): students.classId가 소속 반이면 그 반, 아니면 첫 소속 반.
   - 숙제 제출 문서 키: 대표 반/단일 반 학생은 기존 그대로 '학생ID_날짜'.
     복수 반 학생의 대표 반이 아닌 반은 '학생ID_반ID_날짜'(슬롯 ID = '학생ID_반ID'). 끝 10자는 항상 날짜.
   - 과거 문서는 변환하지 않는다. */
function classesForStudent(stuId){
  const s=db.students.find(x=>x.id===stuId);
  const list=(db.classes||[]).filter(c=>(c.studentIds||[]).includes(stuId));
  if(!list.length && s && s.classId){ const c=classById(s.classId); if(c) list.push(c); }
  if(s && s.classId){ const i=list.findIndex(c=>c.id===s.classId); if(i>0) list.unshift(list.splice(i,1)[0]); }
  return list;
}
function classNamesForStudent(stuId){ const l=classesForStudent(stuId); return l.length?l.map(c=>c.name).join(' · '):'미배정'; }
function primaryClassId(stuId){ const l=classesForStudent(stuId); return l.length?l[0].id:''; }
function classForStudent(stuId){ const l=classesForStudent(stuId); return l.length?l[0]:null; }
function hwSlotId(stuId,clsId){
  if(!clsId) return stuId;
  const l=classesForStudent(stuId);
  if(l.length<2 || clsId===l[0].id || !l.some(c=>c.id===clsId)) return stuId;
  return stuId+'_'+clsId;
}
function hwSlotParts(id){
  if(typeof id!=='string') return null;
  const direct=db.students.find(x=>x.id===id);
  if(direct) return {student:direct,stuId:direct.id,clsId:''};
  for(const st of db.students){
    if(id.length>st.id.length+1 && id.startsWith(st.id+'_')){
      const clsId=id.slice(st.id.length+1);
      if(classById(clsId)) return {student:st,stuId:st.id,clsId};
    }
  }
  return null;
}
function baseStudentId(id){ const p=hwSlotParts(id); return p?p.stuId:id; }
// 반별 숙제 제출 조회. 슬롯 문서가 없으면 반 정보가 없는 기존(레거시) 기본 문서를 그대로 인정한다.
function subForClass(stuId,clsId,date){
  if(!clsId) return db.submissions[stuId+'_'+date];
  const slot=hwSlotId(stuId,clsId);
  if(slot!==stuId){
    const sec=db.submissions[slot+'_'+date];
    if(sec) return sec;
    const legacy=db.submissions[stuId+'_'+date];
    return (legacy && !legacy.classId) ? legacy : undefined;
  }
  const base=db.submissions[stuId+'_'+date];
  if(base && base.classId && base.classId!==clsId) return undefined;
  return base;
}

const COURSE_ORDER = [
  '[초등] 초2-1학기','[초등] 초2-2학기','[초등] 초3-1학기','[초등] 초3-2학기','[초등] 초4-1학기','[초등] 초4-2학기',
  '[초등] 초5-1학기','[초등] 초5-2학기','[초등] 초6-1학기','[초등] 초6-2학기',
  '[중등] 중1-1학기','[중등] 중1-2학기','[중등] 중2-1학기','[중등] 중2-2학기','[중등] 중3-1학기','[중등] 중3-2학기',
  '[고등] 공수 1','[고등] 공수 2','[고등] 대수','[고등] 미적분1','[고등] 확통'
];
function sortedCourses(){

const GRADE_ORDER = ['초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'];
function sortedStudents(list){
  return [...(list||db.students)].sort((a,b)=>{
    const ga = GRADE_ORDER.indexOf(a.grade), gb = GRADE_ORDER.indexOf(b.grade);
    if(ga!==gb){ if(ga===-1) return 1; if(gb===-1) return -1; return ga-gb; }
    return (a.name||'').localeCompare(b.name||'');

function nextStudentCode(grade){
  const levelMap = {'초':'0','중':'1','고':'2'};
  const level = levelMap[grade[0]] || '0';
  const gradeNum = grade[1];
  const seqPrefix = level+gradeNum;
  const existing = db.students.filter(s=>s.code && s.code.startsWith(seqPrefix)).map(s=>parseInt(s.code.slice(2),10));
  const next = (existing.length? Math.max(...existing):0)+1;
  return seqPrefix + String(next).padStart(2,'0');
}

function studentDailyScores(studentId){
  const rows = [];
  Object.entries(db.classRecords).forEach(([key,recObj])=>{
    const date = key.slice(-10);
    const rec = recObj[studentId];
    if(rec && rec.dailyTestScore !== undefined && rec.dailyTestScore !== '' && rec.dailyTestScore !== null){
      rows.push({date, score:Number(rec.dailyTestScore)});
    }
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date));
  return rows;
}
function studentStatus(studentId){
  const scores = studentDailyScores(studentId);
  const last3 = scores.slice(-3);
  let dailyStatus = 'PASS';
  if(last3.length===3 && last3.every(r=>r.score<60)) dailyStatus = 'STOP';
  else if(last3.length===3 && last3.every(r=>r.score<80)) dailyStatus = 'SLOW';

  const latestKmm = db.kmm.filter(k=>k.studentId===studentId).sort((a,b)=>b.date.localeCompare(a.date))[0];
  let kmmStatus = 'PASS';
  if(latestKmm){
    if(latestKmm.score < 60) kmmStatus = 'STOP';
    else if(latestKmm.score < 80) kmmStatus = 'SLOW';
  }
  const rank = {PASS:0, SLOW:1, STOP:2};
  return rank[dailyStatus] >= rank[kmmStatus] ? dailyStatus : kmmStatus;
}
function statusBadge(status){
  if(status==='STOP') return `<span class="badge red">STOP</span>`;
  if(status==='SLOW') return `<span class="badge yellow">SLOW</span>`;
  return `<span class="badge green">순항중</span>`;
}
function warningCountBadge(count){
  if(count>=3) return `<span class="badge red">OUT 대상 (${count}회)</span>`;
  if(count===2) return `<span class="badge red">경고 2회 (다음이 마지막)</span>`;
  if(count===1) return `<span class="badge yellow">경고 1회</span>`;
  return `<span class="badge gray">경고 없음</span>`;
}
function trafficForStudent(studentId){
  const status = studentStatus(studentId);

  // 신호등은 경고 이력과 무관하게, 최근 학습 상태(시험 점수)만 기준으로 추천합니다.
  // (경고는 별도로 "경고 기록" 카드에서 확인하고, 관리자가 직접 판단합니다.)
  if(status==='STOP') return 'red';
  if(status==='SLOW') return 'yellow';

  // 일일테스트 기준: 80점 이상 순항 / 60~79점 주의 / 60점 미만 관찰필요.
  // 최근 기록을 우선 사용하여 '현재 상태'를 반영합니다.
  const scores = studentDailyScores(studentId);
  if(!scores.length) return 'green';
  const latest = scores.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
  const score = Number(latest && latest.score);
  if(!Number.isFinite(score)) return 'green';
  if(score>=80) return 'green';
  if(score>=60) return 'yellow';
  return 'red';
}

const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_LABEL = {sun:'일',mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토'};
function homeworkRangeForClassDate(dayGroup, dateISO){
  const dow = new Date(dateISO+'T00:00:00').getDay();
  const lessonDays = dayGroup==='mon-wed' ? [1,3] : [2,4];
  if(!lessonDays.includes(dow)) return [];
  const idx = lessonDays.indexOf(dow);
  const prevDow = idx===0 ? lessonDays[lessonDays.length-1] : lessonDays[idx-1];
  let gap = dow - prevDow; if(gap<=0) gap += 7;
  const result = [];
  for(let back = gap; back>=1; back--){
    const d = new Date(dateISO+'T00:00:00'); d.setDate(d.getDate()-back);
    result.push(DAY_KEYS[d.getDay()]);
  }
  return result;
}
function homeworkDateRangeDates(dayGroup, dateISO){
  const dow = new Date(dateISO+'T00:00:00').getDay();
  const lessonDays = dayGroup==='mon-wed' ? [1,3] : [2,4];
  if(!lessonDays.includes(dow)) return [];
  const idx = lessonDays.indexOf(dow);
  const prevDow = idx===0 ? lessonDays[lessonDays.length-1] : lessonDays[idx-1];
  let gap = dow - prevDow; if(gap<=0) gap += 7;
  const result = [];
  for(let back = gap; back>=1; back--){
    const d = new Date(dateISO+'T00:00:00'); d.setDate(d.getDate()-back);
    result.push(toLocalISODate(d));
  }
  return result; // 실제 날짜(YYYY-MM-DD), 오래된 순
}
function weekStartISO(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const dow = d.getDay();
  const diff = dow===0? -6 : 1-dow;
  d.setDate(d.getDate()+diff);
  return toLocalISODate(d);
}
function weekDates(weekStart){
  const arr=[]; for(let i=0;i<7;i++){ const d=new Date(weekStart+'T00:00:00'); d.setDate(d.getDate()+i); arr.push(toLocalISODate(d)); } return arr;
}

/* ---------------- FIRESTORE WRITE HELPERS ---------------- */
async function fsSet(col, id, data, merge=true){
  try{ await fsdb.collection(col).doc(id).set(data, {merge}); return true; }
  catch(e){
    console.error('[Firestore 저장 실패]', {collection:col, code:e?.code||'', message:e?.message||'', payloadKB:firestorePayloadSizeKB(data)});
    if(col==='submissions'){
      const code=String(e?.code||'');
      const msg=String(e?.message||'');
      const tooLarge=firestorePayloadSizeKB(data)>950 || /resource.exhausted|maximum size|too large|exceeds.*size/i.test(code+' '+msg);
      const detail=tooLarge
        ? '제출 데이터 용량이 너무 큽니다. 사진은 삭제하지 말고 선생님께 알려주세요.'
        : /permission.denied|unauthenticated/i.test(code)
          ? '저장 권한 또는 로그인 인증을 확인해야 합니다. 사진은 삭제하지 말고 선생님께 알려주세요.'
          : /unavailable|deadline.exceeded|network/i.test(code+' '+msg)
            ? '서버 연결이 원활하지 않습니다. 사진을 유지한 채 잠시 후 다시 시도해주세요.'
            : '서버 저장 오류가 발생했습니다. 사진은 삭제하지 말고 선생님께 알려주세요.';
      alert('숙제 제출이 완료되지 않았어요.\\n'+detail+'\\n오류 코드: '+(code||'unknown')+'\\n상세 오류: '+(msg||String(e||'알 수 없음')).slice(0,300));
    }else{
      alert('저장에 실패했어요. 인터넷 연결을 확인한 뒤 다시 시도해주세요.');
    }
    return false;
  }
}
async function fsAdd(col, data){
  try{ const ref = await fsdb.collection(col).add(data); return ref.id; }
  catch(e){ alert('저장에 실패했어요. 인터넷 연결을 확인한 뒤 다시 시도해주세요.'); return null; }
}
async function fsDelete(col, id){
  try{ await fsdb.collection(col).doc(id).delete(); return true; }
  catch(e){ alert('삭제에 실패했어요. 인터넷 연결을 확인한 뒤 다시 시도해주세요.'); return false; }
}
async function fsUpdate(col, id, data){
  try{ await fsdb.collection(col).doc(id).update(data); return true; }
  catch(e){ try{ await fsdb.collection(col).doc(id).set(data,{merge:true}); return true; }catch(e2){ alert('저장에 실패했어요.'); return false; } }
}

function getTodaysFridaySupp(){

const fridayWeekLoads={};
function requestFridayWeekLoad(date){
  const week=weekStartISO(date);
  const existing=fridayWeekLoads[week];
  if(existing && existing.status!=='idle' && existing.status!=='waiting-classes') return;
  if(!listenersReady.classes){
    fridayWeekLoads[week]={status:'waiting-classes',errors:[]};
    return;
  }
  const classes=sortedClasses();
  fridayWeekLoads[week]={status:'loading',errors:[]};
  Promise.all(classes.map(async cls=>{
    try{
      const result=await readFridaySuppWeek(cls.id,week);
      if(result.exists) db.fridaySupp[result.key]=result.data;
      else delete db.fridaySupp[result.key];
    }catch(e){
      console.error('[금요일 보강 주간 조회 오류]',cls.id,week,e);
      fridayWeekLoads[week].errors.push(cls.name||cls.id);
    }
  })).then(()=>{
    const state=fridayWeekLoads[week];
    state.status=state.errors.length?'error':'loaded';
    if(currentView==='dashboard'||currentView==='fridaySupp') render();
  });
}
function retryFridayWeekLoad(date){
  const week=weekStartISO(date);
  delete fridayWeekLoads[week];
  requestFridayWeekLoad(week);
  render();
}
function getFridaySuppRows(date){
  const thisWeek = weekStartISO(date);
  const rows = [];
  Object.entries(db.fridaySupp).forEach(([key, byStu])=>{
    const weekPart = key.slice(-10);
    if(weekPart !== thisWeek) return;
    const clsId = key.slice(0, key.length - 11);
    const cls = classById(clsId);
    Object.entries(byStu||{}).forEach(([stuId, supp])=>{
      if(!supp || !supp.needed) return;
      const s = studentById(stuId);
       rows.push({ key, stuId, studentName: s? s.name : '(삭제된 학생)', className: cls? cls.name : '-', time: supp.time||'', note: supp.note||'', tasksText:supp.tasksText||'', done: !!supp.done });
    });
  });
  rows.sort((a,b)=>{
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time) return -1;
    if(b.time) return 1;
    return a.studentName.localeCompare(b.studentName);
  });
  return rows;
}
function getFridayDuplicateRows(date){
  const byStudent={};
  getFridaySuppRows(date).forEach(r=>{(byStudent[r.stuId]=byStudent[r.stuId]||[]).push(r);});
  return Object.values(byStudent).filter(group=>group.length>1);
}

// ---- 금요일 보강 "시간대별" 보기: 그 주 예약 학생을 1시간 단위 시간대로 묶어 보여 주고 보강 완료를 체크한다 ----
// 반별 보기와 같은 데이터(db.fridaySupp)를 그대로 읽고 쓴다(별도 저장 구조 없음). 예약 체크·시간·할 일 입력은 반별 보기에서 한다.
let fridayViewMode=''; // ''(자동) | 'time' | 'class' — 직접 고르면 앱을 닫기 전까지 유지
function fridayViewModeFor(week){
  if(fridayViewMode==='time'||fridayViewMode==='class') return fridayViewMode;
  // 자동: 오늘이 금요일이고 오늘이 속한 주를 보고 있으면 시간대별(완료 체크용), 그 외에는 반별(예약 입력용)
  const today=todayISO();
  return (new Date(today+'T00:00:00').getDay()===5 && weekStartISO(today)===week)?'time':'class';
}
function setFridayViewMode(mode){ fridayViewMode=(mode==='time'||mode==='class')?mode:''; render(); }
function fridaySlotOf(time){
  const m=String(time||'').match(/^([01]\d|2[0-3]):[0-5]\d$/);
  return m?`${m[1]}:00`:'';
}
function fridayTimeSlots(rows){
  const slots=new Map();
  rows.forEach(r=>{ const k=fridaySlotOf(r.time); if(!slots.has(k)) slots.set(k,[]); slots.get(k).push(r); });
  return [...slots.entries()].sort((a,b)=>a[0]===''?1:b[0]===''?-1:a[0].localeCompare(b[0])).map(([k,list])=>({
    slot:k, label:k?`${k}–${k.slice(0,2)}:59`:'시간 미정',
    rows:[...list].sort((a,b)=>String(a.time||'').localeCompare(String(b.time||''))||a.studentName.localeCompare(b.studentName,'ko'))
  }));
}
async function fridayDoneFromTime(el,key,stuId){

// 경고 계산 시작일은 관리자 '전체 경고 초기화' 시 자동 갱신됩니다.
// 기존 설치본과의 호환을 위해 저장값이 없을 때만 2026-08-27을 fallback으로 사용합니다.
function warningMatchesTarget(w, target){
  if(!w) return false;
  if(target.id) return w.id === target.id;
  if(target.episodeKey) return w.episodeKey === target.episodeKey;
  return w.date === target.date && w.reason === target.reason;
}
async function deleteSelectedAuditWarnings(targets){
  // targets: [{studentId, episodeKey, date, reason}, ...]
  if(!targets.length){ alert('선택된 경고가 없어요.'); return; }
  const byStudent = {};
  targets.forEach(t=>{ (byStudent[t.studentId] = byStudent[t.studentId]||[]).push(t); });
  let successCount=0, failCount=0;
  const failNames=[];
  for(const [studentId, list] of Object.entries(byStudent)){
    const ref = fsdb.collection('students').doc(studentId);
    try{
      const result = await fsdb.runTransaction(async (tx)=>{
        // 삭제 직전에 항상 Firestore 최신값을 다시 읽는다 (다른 탭/기기가 그 사이 추가한 경고를 보존하기 위해).
        const snap = await tx.get(ref);
        if(!snap.exists) return {removed:0, total:list.length};
        const cur = snap.data() || {};
        let curWarnings = cur.warnings || [];
        let removed = 0;
        list.forEach(target=>{
          const idx = curWarnings.findIndex(w=>warningMatchesTarget(w, target));
          if(idx!==-1){ curWarnings = curWarnings.slice(0,idx).concat(curWarnings.slice(idx+1)); removed++; }
        });
        if(removed>0) tx.update(ref, {warnings: curWarnings});
        return {removed, total:list.length};
      });
      successCount += result.removed;
      if(result.removed < result.total){ failCount += (result.total-result.removed); failNames.push(studentById(studentId)?.name||studentId); }
    }catch(e){
      failCount += list.length;
      failNames.push(studentById(studentId)?.name||studentId);
    }
  }
  alert(`선택한 경고 삭제 결과\n성공: ${successCount}건\n실패: ${failCount}건${failNames.length?'\n확인 필요한 학생: '+failNames.join(', '):''}`);
  render();
}

/* ---------------- SEED LOADER ---------------- */
async function loadSeedData(){
  const batchArr = [];
  let batch = fsdb.batch();
  let opCount = 0;
  function pushOp(fn){ fn(batch); opCount++; if(opCount>=400){ batchArr.push(batch); batch=fsdb.batch(); opCount=0; } }

  const courseIdByName = {};
  SEED_DATA.courses.forEach(c=>{
    const existing = db.courses.find(x=>x.name===c.name);
    if(existing){ courseIdByName[c.name]=existing.id; return; }
    const newId = uid('course');
    const steps = c.steps.map(s=>({id:uid('step'), name:s}));
    pushOp(b=> b.set(fsdb.collection('courses').doc(newId), {name:c.name, steps}));
    courseIdByName[c.name]=newId;
  });

  SEED_DATA.classes.forEach(c=>{
    let cls = db.classes.find(x=>x.name===c.name);
    let clsId = cls ? cls.id : uid('cls');
    const studentIds = cls ? [...(cls.studentIds||[])] : [];
    if(!cls){ pushOp(b=> b.set(fsdb.collection('classes').doc(clsId), {name:c.name, dayGroup:c.dayGroup, studentIds:[]})); }
    c.students.forEach(st=>{
      let existing = db.students.find(x=>x.name===st.name && x.grade===st.grade);
      let stuId = existing ? existing.id : uid('stu');
      if(!existing){
        const code = nextStudentCode(st.grade);
        // reflect locally so subsequent nextStudentCode calls see it
        db.students.push({id:stuId, code, name:st.name, grade:st.grade, classId:clsId, memo:'', goal:'', diligence:80, warnings:[], status:'active'});
        pushOp(b=> b.set(fsdb.collection('students').doc(stuId), {code, name:st.name, grade:st.grade, classId:clsId, memo:'', goal:'', diligence:80, warnings:[], status:'active'}));
      }else{
        pushOp(b=> b.update(fsdb.collection('students').doc(stuId), {classId:clsId}));
      }
      if(!studentIds.includes(stuId)) studentIds.push(stuId);
    });
    pushOp(b=> b.set(fsdb.collection('classes').doc(clsId), {studentIds}, {merge:true}));
  });

  batchArr.push(batch);
  try{
    for(const b of batchArr){ await b.commit(); }
  }catch(e){ alert('명단을 불러오는 중 문제가 생겼어요. 다시 시도해주세요.'); }
}

function buildDailyReportText(s, date, r, dayGroup, clsId){
  const trafficEmoji = {green:'🟢',yellow:'🟡',red:'🔴'}[dailyTrafficForStudentDate(s.id, date)] || '⚪';
  const stepTxt = r.stepId ? (stepShortLabel(r.stepId)||stepLabel(r.stepId)||r.stepLabelSnapshot||'-') : (r.stepLabelSnapshot||'-');
  const extraStepsTxt = (r.extraSteps&&r.extraSteps.length)
    ? ' + '+r.extraSteps.map((id,i)=>stepShortLabel(id)||stepLabel(id)||(r.extraStepLabelSnapshots||[])[i]||'').filter(Boolean).join(', ')
    : ((r.extraStepLabelSnapshots&&r.extraStepLabelSnapshots.length) ? ' + '+r.extraStepLabelSnapshots.filter(Boolean).join(', ') : '');
  // 숙제완성도는 수업기록의 수기 등급이 아니라 실제 submissions 인증 기록으로 계산.
  const hwDates = homeworkDateRangeDates(dayGroup, date);
  const subOf = d => clsId ? subForClass(s.id,clsId,d) : db.submissions[s.id+'_'+d];
  const hwApproved = hwDates.filter(d=>homeworkCountsAsCompleted(subOf(d),d));
  const hwPending = hwDates.filter(d=>submissionIsPending(subOf(d),d));
  const hwMissing = hwDates.filter(d=>{
    const sub=subOf(d);
    return !sub || submissionIsRejected(sub,d);
  });
  const hwCompletionText = hwDates.length
    ? `${hwApproved.length}/${hwDates.length} 제출${hwPending.length ? ` · 검토대기 ${hwPending.map(d=>d.slice(5).replace('-','/')).join(', ')}` : ''}${hwMissing.length ? ` · 미제출·재제출 필요 ${hwMissing.map(d=>d.slice(5).replace('-','/')).join(', ')}` : (hwApproved.length===hwDates.length ? ' · 전체 제출' : '')}`
    : '확인할 숙제 날짜 없음';

  // v97: 완성도는 수업 중 원장이 기록한 값만 사용한다(제출 비율로 자동 추정하지 않음).
  const hwQualityTxt = HW_QUALITY_GUIDE[r.homeworkCompletionLevel] ? `${r.homeworkCompletionLevel} — ${HW_QUALITY_GUIDE[r.homeworkCompletionLevel]}` : '미평가';
  const lessonDetailTxt = String(r.lessonDetail||'').replace(/\s*\n+\s*/g,' ').trim();
  const lessonDetailLine = lessonDetailTxt ? `\n· 수업 상세: ${lessonDetailTxt}` : '';
  const todayKmm = db.kmm.find(k=>k.studentId===s.id && k.date===date);
  const hasScore = r.dailyTestScore!==undefined && r.dailyTestScore!=='' && r.dailyTestScore!==null;
  let examLine;
  let kmmMakeupTxt = '';
  if(todayKmm){
    const awardTxt = kmmAwardText(todayKmm.score);
    examLine = `· KMM 결과: ${todayKmm.score}점 (${todayKmm.score>=80?'PASS':'FAIL'})${awardTxt? ' — '+awardTxt:''}`;
    if(todayKmm.score < 70){
      kmmMakeupTxt = `\n📌 KMM 기본 점수(70점) 미달로, 수업 전후 30분 보강이 진행될 예정입니다.`;
    }
  }else if(hasScore){
    examLine = `· 일일테스트: ${r.dailyTestScore}점 (${Number(r.dailyTestScore)>=80?'PASS':'FAIL'})`;
  }else{
    examLine = `· 일일테스트: 오늘은 시험이 없었어요`;
  }
  const homeworkWarningCount = verifiedWarnings(s).length;
  const warnTxt = homeworkWarningCount > 0
    ? `
⚠️ 숙제 미인증이 3회 연속 확인되어 경고가 부과되었습니다. 현재 누적 경고는 ${homeworkWarningCount}회입니다.`
    : '';
  const doneToday = (db.practiceProgress[s.id]?.tracks||[]).filter(t=>t.done && t.doneDate===date);
  const bookDoneTxt = doneToday.length ? '\n' + doneToday.map(t=>`🎉 ${t.book} 교재를 완료했습니다!`).join('\n') : '';
  return `[M&m 수학훈련소] ${s.name} 학생 오늘의 학습 리포트 · ${fmtDate(date)}
${trafficEmoji} 출석: ${r.attendance||'-'}
${examLine}${kmmMakeupTxt}
· 오늘 ${r.stepType==='유형'?'유형학습':'개념학습'}: ${stepTxt}${extraStepsTxt}${lessonDetailLine}
${r.practiceBook? `· 문제 적용: ${r.practiceBook}${r.practiceRange? ' '+r.practiceRange : ''}${(r.extraPractice&&r.extraPractice.length)? ', '+r.extraPractice.map(e=>`${e.book}${e.range?' '+e.range:''}`).join(', ') : ''}` : ((r.extraPractice&&r.extraPractice.length)? `· 문제 적용: ${r.extraPractice.map(e=>`${e.book}${e.range?' '+e.range:''}`).join(', ')}` : '')}
· 숙제 제출 이행: ${hwCompletionText}
· 숙제 완성도: ${hwQualityTxt}
${r.note? `· 특이사항: ${r.note}` : ''}${warnTxt}${bookDoneTxt}`;
}
function allStepOptions(){
  let opts=''; db.courses.forEach(c=>{ c.steps.forEach(st=>{ opts+=`<option value="${st.id}">[${c.name}] ${st.name}</option>`; }); }); return opts;

// v97: 표준 STEP에 맞는 항목이 없을 때 쓰는 통계용 표준값. 구체 내용은 lessonDetail에 따로 저장한다.
const STEP_ETC_ID='__etc__', STEP_ETC_LABEL='기타·직접입력';
const HW_QUALITY_GUIDE={'상':'지정 범위를 대부분 완료했고 풀이 과정과 오답 정리가 충실함','중':'일부 누락이 있거나 풀이·오답 정리가 충분하지 않음','하':'미완성 범위가 많거나 풀이 흔적이 부족함'};
function stepLabel(stepId){
  if(stepId===STEP_ETC_ID) return STEP_ETC_LABEL;
  for(const c of db.courses){ const st=(c.steps||[]).find(x=>x.id===stepId); if(st) return `[${c.name}] ${st.name}`; }
  return '';
}
function stepShortLabel(stepId){
  if(stepId===STEP_ETC_ID) return STEP_ETC_LABEL;
  for(const c of db.courses){
    const st = (c.steps||[]).find(x=>x.id===stepId);
    if(st){
      const parts = st.name.split('>');
      let tail = parts.length>1 ? parts[parts.length-1].trim() : st.name.trim();
      tail = tail.replace(/^STEP\s*\d+\s*/i, '').trim();
      return `[${c.name}] ${tail || st.name}`;
    }
  }
  return '';
}
function courseIdForStep(stepId){
  if(!stepId) return null;
  for(const c of db.courses){ if((c.steps||[]).some(st=>st.id===stepId)) return c.id; }
  return null;
}
function lastRecordedStep(stuId, beforeDate){
  let best = null;
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    const rec = obj[stuId];
    if(!rec || !rec.stepId) return;
    const date = key.slice(-10);
    if(date >= beforeDate) return;
    if(!best || date > best.date) best = {date, stepId: rec.stepId};
  });
  return best;
}

function suggestedHomeworkLevel(stuId, dayGroup, date){
  const hwDateRange = homeworkDateRangeDates(dayGroup, date);
  const totalRangeDays = hwDateRange.length;
  if(!totalRangeDays) return '';
  const submittedCount = hwDateRange.filter(d=>homeworkCountsAsCompleted(db.submissions[stuId+'_'+d],d)).length;
  const ratio = submittedCount/totalRangeDays;
  return ratio>=0.8?'상':ratio>=0.5?'중':'하';
}
// 2026-09-08: 원장님 요청으로 교재 체계를 실제 수업 진행 방식(회독 기반)에 맞춰 재정리.
// 구조: 학년군('초'/'중'/'고') → 분류(1회독/2회독/3회독/심화회독/방학특강) → 묶음 목록(묶음 하나 = 그 분류에서 같이 등록할 책들).
// 분류 안에 묶음이 2개 이상이면 "택1" (그중 하나를 선택해서 등록)이라는 뜻.
const BOOK_PRESETS = {
  '초': {
    '1회독': [['개념책','유형책','연산책']],
    '2회독': [['개념책 2회독','유형책 2회독','쎈']],
    '3회독': [['쎈 2회독','최상위'], ['쎈 2회독','에이급']] // 택1, 심화 단계
  },
  '중': {
    '1회독': [['개념책','익힘책','연산책']],
    '2회독': [['익힘책 2회독','최상위라이트'], ['익힘책 2회독','일품']], // 택1: 일반은 최상위라이트, 상위권은 일품 병행
    '심화회독': [['고쟁이']] // 잘하는 학생만, 보통 방학특강으로 진행
  },
  '고': {
    '1회독': [['CODI']],
    '방학특강': [['라쎈']],
    '2회독': [['라쎈 2회독','마플시너지']],
    '3회독': [['고쟁이'], ['올림포스(고난도)']] // 택1, 심화 단계
  }
};
function allPresetBookNames(){
  const names = new Set();
  Object.values(BOOK_PRESETS).forEach(cats=>{
    Object.values(cats).forEach(bundles=>{ bundles.forEach(bundle=>{ bundle.forEach(b=>names.add(b)); }); });
  });
  return names;
}
const UNIT_LIST_OVERRIDES = {
  '[중등] 중1-1학기': ['1. 소인수분해','2. 정수와 유리수','3. 문자와 식','4. 그래프'],
  '[중등] 중1-2학기': ['1. 기본도형','2. 평면도형','3. 입체도형','4. 통계'],
  '[중등] 중2-1학기': ['1. 유리수','2. 식의 계산','3. 부등식','4. 연립방정식','5. 일차함수'],
  '[중등] 중2-2학기': ['1. 삼각형','2. 사각형','3. 닮음','4. 피타고라스','5. 확률'],
  '[중등] 중3-1학기': ['1. 제곱근','2. 인수분해','3. 이차방정식','4. 이차함수'],
  '[중등] 중3-2학기': ['1. 삼각비','2. 원','3. 산포도'],
};
function courseUnitsList(courseId){
  const course = courseById(courseId);
  if(!course) return [];
  if(UNIT_LIST_OVERRIDES[course.name]) return UNIT_LIST_OVERRIDES[course.name];
  const seen = new Set(); const units = [];
  (course.steps||[]).forEach(st=>{
    const unit = st.name.split('>')[0].trim();
    if(!seen.has(unit)){ seen.add(unit); units.push(unit); }
  });
  return units;
}
function collectAllBookNames(){
  const names = new Set();
  Object.values(db.practiceProgress).forEach(rec=>{ (rec.tracks||[]).forEach(t=>{ if(t.book) names.add(t.book); }); });
  Object.values(db.classRecords).forEach(obj=>{ Object.values(obj).forEach(r=>{ if(r.practiceBook) names.add(r.practiceBook); (r.extraPractice||[]).forEach(e=>{ if(e.book) names.add(e.book); }); }); });
  return names;
}

async function confirmAddPresetBundle(stuId, bundleIndex){
  const draft = currentSubState._newTrackDraft[stuId];
  if(!draft || !draft.courseId){ alert('학년학기를 먼저 선택해주세요.'); return; }
  const s = studentById(stuId);
  const gradeLevel = s && s.grade ? s.grade[0] : '';
  const bundles = (BOOK_PRESETS[gradeLevel]||{})[draft.category] || [];
  const bundle = bundles[bundleIndex];
  if(!bundle){ alert('교재 묶음을 찾을 수 없어요.'); return; }
  const rec = db.practiceProgress[stuId] || {tracks:[]};
  const existing = new Set((rec.tracks||[]).filter(t=>t.courseId===draft.courseId).map(t=>t.book));
  const newTracks = bundle.filter(b=>!existing.has(b)).map(b=>({id:uid('trk'), book:b, courseId:draft.courseId, completedUnits:[], done:false}));
  if(!newTracks.length){ alert('이미 이 학년학기에 등록되어 있어요.'); return; }
  const tracks = [...(rec.tracks||[]), ...newTracks];
  const ok = await fsSet('practiceProgress', stuId, {tracks});
  if(ok){ currentSubState._addingTrack[stuId] = false; delete currentSubState._newTrackDraft[stuId]; render(); }
}
async function toggleTrackUnit(stuId, trackId, checked, unit){
  const rec = db.practiceProgress[stuId] || {tracks:[]};
  const tracks = (rec.tracks||[]).map(t=>{
    if(t.id!==trackId) return t;
    let completed = [...(t.completedUnits||[])];
    if(checked){ if(!completed.includes(unit)) completed.push(unit); }
    else{ completed = completed.filter(u=>u!==unit); }
    return {...t, completedUnits: completed};
  });
  await fsSet('practiceProgress', stuId, {tracks});
}

    : `<select style="width:130px;font-size:11px;" onchange="if(this.value==='__custom__'){currentSubState._extraPracticeDraft['${rowKey}'].custom=true;render();}else{currentSubState._extraPracticeDraft['${rowKey}'].book=this.value;}">

function toggleAddExtraPractice(clsId,date,stuId){
  const rowKey = `${clsId}_${date}_${stuId}`;
  currentSubState._addingExtraPractice = currentSubState._addingExtraPractice || {};
  currentSubState._addingExtraPractice[rowKey] = !currentSubState._addingExtraPractice[rowKey];
  if(currentSubState._addingExtraPractice[rowKey]){
    currentSubState._extraPracticeDraft = currentSubState._extraPracticeDraft || {};
    currentSubState._extraPracticeDraft[rowKey] = {book:'', range:'', custom:false};
  }
  render();
}
async function confirmAddExtraPractice(clsId,date,stuId){
  const rowKey = `${clsId}_${date}_${stuId}`;
  const draft = currentSubState._extraPracticeDraft[rowKey];
  if(!draft || !draft.book){ alert('교재명을 선택하거나 입력해주세요.'); return; }
  const key = clsId+'_'+date;
  const cur = (db.classRecords[key]||{})[stuId] || {};
  const extra = [...(cur.extraPractice||[]), {book:draft.book, range:draft.range||''}];
  await fsSet('classRecords', key, {[stuId]: {extraPractice: extra}});
  currentSubState._addingExtraPractice[rowKey] = false;
  delete currentSubState._extraPracticeDraft[rowKey];
  render();
}
async function removeExtraPractice(clsId,date,stuId,idx){
  const key = clsId+'_'+date;
  const cur = (db.classRecords[key]||{})[stuId] || {};
  const extra = (cur.extraPractice||[]).filter((_,i)=>i!==idx);
  await fsSet('classRecords', key, {[stuId]: {extraPractice: extra}});
}
function focusKey(clsId,date,stuId){ return `${clsId}_${date}_${stuId}`; }
function focusRecord(clsId,date,stuId){ return db.focusHistory?.[focusKey(clsId,date,stuId)] || null; }
function focusHistoryForStudent(stuId, beforeDate){
  return Object.values(db.focusHistory||{}).filter(x=>x && x.studentId===stuId && x.selected!==false && (!beforeDate || x.date < beforeDate)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function recentFocusCount(stuId, clsId, beforeDate, lessonLimit=5){
  const lessonDates = [...new Set(Object.values(db.focusHistory||{}).filter(x=>x && x.classId===clsId && x.selected!==false && (!beforeDate || x.date < beforeDate)).map(x=>x.date))].sort((a,b)=>b.localeCompare(a)).slice(0,lessonLimit);
  return Object.values(db.focusHistory||{}).filter(x=>x && x.studentId===stuId && x.classId===clsId && x.selected!==false && lessonDates.includes(x.date)).length;
}
async function toggleTeacherFocus(clsId,date,stuId){
  if(!session || session.mode!=='director') return;
  const key=focusKey(clsId,date,stuId);
  const cur=db.focusHistory?.[key];
  if(cur && cur.selected!==false){
    await fsdb.collection('focusHistory').doc(key).delete();
  }else{
    await fsdb.collection('focusHistory').doc(key).set({classId:clsId, studentId:stuId, date, selected:true, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  }
}

async function updateClassRec(clsId,date,stuId,field,val){
  const key=clsId+'_'+date;
  db.classRecords[key]=db.classRecords[key]||{};
  const before={...(db.classRecords[key][stuId]||{})};
  const next={...before,[field]:val};
  if(field==='stepId') next.stepLabelSnapshot=val?(stepShortLabel(val)||stepLabel(val)||before.stepLabelSnapshot||''):'';
  if(field==='extraSteps') next.extraStepLabelSnapshots=(Array.isArray(val)?val:[]).map(id=>stepShortLabel(id)||stepLabel(id)||id);
  db.classRecords[key][stuId]=next;
  render(); // 입력 즉시 일일 리포트에 반영
  const ok=await fsSet('classRecords',key,{[stuId]:next});
  if(!ok){
    db.classRecords[key][stuId]=before;
    render();
  }
  return ok;
}
function videoAssignHistoryForStudent(stuId){
  const flat = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    const date = key.slice(-10);
    if(obj[stuId] && obj[stuId].videoAssignments){
      obj[stuId].videoAssignments.forEach(v=> flat.push({...v, date}));
    }
  });
  flat.sort((a,b)=> a.date.localeCompare(b.date));
  return flat;
}
function renderVideoAssignPicker(clsId, date, stuId){
  const rowKey = `${clsId}_${date}_${stuId}`;
