<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&m 수학훈련소</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  :root{
    --navy:#141B2E; --navy2:#1D2A44; --navy3:#26365A;
    --gold:#C9A24B; --gold-l:#E8CE8B;
    --ink:#1A1D26; --paper:#F7F5F0; --line:#E4DFD3;
    --green:#3EA55A; --yellow:#E0A82E; --red:#D65A4A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.serif{font-family:'Noto Serif KR',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  #loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-size:14px;flex-direction:column;gap:14px;}
  .spinner{width:34px;height:34px;border:3px solid #354569;border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #loginScreen{display:none;min-height:100vh;align-items:center;justify-content:center;background:
    radial-gradient(circle at 20% 10%, #202b47 0%, var(--navy) 45%, #0d1220 100%);}
  .login-card{width:min(420px,90vw);background:var(--navy2);border:1px solid #2c3a5c;border-radius:var(--radius);
    padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .brand{text-align:center;margin-bottom:28px;}
  .brand .steps{display:flex;justify-content:center;gap:4px;margin-bottom:10px;}
  .brand .steps span{display:block;width:14px;background:var(--gold);border-radius:2px;}
  .brand .steps span:nth-child(1){height:8px;}
  .brand .steps span:nth-child(2){height:16px;}
  .brand .steps span:nth-child(3){height:24px;}
  .brand .steps span:nth-child(4){height:32px;}
  .brand h1{color:#fff;font-size:26px;margin:0;letter-spacing:.5px;}
  .brand p{color:var(--gold-l);font-size:12px;margin:4px 0 0;letter-spacing:2px;}
  .mode-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .mode-tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #354569;background:#1a2540;color:#9aa6c4;font-weight:600;font-size:14px;}
  .mode-tabs button.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
  .login-card input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #354569;background:#0f1729;color:#fff;font-size:16px;margin-bottom:12px;letter-spacing:2px;}
  .login-card input::placeholder{color:#5b6889;letter-spacing:normal;}
  .btn-gold{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--navy);font-weight:700;font-size:15px;}
  .login-err{color:#ff9d8a;font-size:13px;margin:-4px 0 12px;min-height:16px;}
  .setup-note{color:#9aa6c4;font-size:12px;line-height:1.6;margin-top:14px;text-align:center;}

  #appShell{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
  .sidebar .brand-mini{padding:22px 18px 16px;border-bottom:1px solid #263254;}
  .sidebar .brand-mini h2{font-size:17px;margin:0;color:#fff;}
  .sidebar .brand-mini span{font-size:10px;color:var(--gold-l);letter-spacing:1.5px;}
  .nav-item{padding:13px 20px;color:#aab4d4;font-size:14px;font-weight:500;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;}
  .nav-item:hover{background:#1a2540;color:#fff;}
  .nav-item.active{background:#1a2540;color:#fff;border-left-color:var(--gold);}
  .nav-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #263254;}
  .nav-bottom button{width:100%;background:transparent;border:1px solid #354569;color:#9aa6c4;padding:9px;border-radius:8px;font-size:13px;margin-bottom:8px;}
  .conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--green);}
  .conn-dot.off{background:var(--red);}
  .conn-status{font-size:11px;color:#9aa6c4;padding:0 20px 12px;}
  .main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1200px;}
  .mobile-topbar{display:none;background:var(--navy);color:#fff;padding:14px 16px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .mobile-topbar button{background:none;border:none;color:#fff;font-size:22px;}
  .save-banner{display:none;background:#4a1f1f;color:#ffb3a3;padding:10px 16px;font-size:13px;border-radius:10px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;}
  .save-banner button{background:#ffb3a3;color:#4a1f1f;border:none;padding:6px 12px;border-radius:6px;font-weight:600;font-size:12px;}

  h1.page-title{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .page-sub{color:#7a7666;font-size:13px;margin:0 0 20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-top:3px solid var(--gold);}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--navy);font-family:'Noto Serif KR',serif;}
  .stat-card .lbl{font-size:12px;color:#8a8674;margin-top:2px;}
  .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-size:13px;font-weight:600;}
  .btn.outline{background:#fff;color:var(--navy);}
  .btn.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));border-color:var(--gold);color:var(--navy);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .between{justify-content:space-between;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;}
  th{color:#8a8674;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.green{background:#e4f5e8;color:var(--green);}
  .badge.yellow{background:#fdf2df;color:#a97c15;}
  .badge.red{background:#fbe6e2;color:var(--red);}
  .badge.gray{background:#eee;color:#888;}
  input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);}

  .tabs2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tabs2 button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:#6b6858;}
  .tabs2 button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .step-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;padding:3px 10px 3px 3px;border-radius:20px;font-size:11px;}
  .step-chip b{background:var(--gold);color:var(--navy);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .empty{text-align:center;padding:50px 20px;color:#9c9880;}
  .empty .big{font-size:40px;margin-bottom:10px;}
  a.link{color:var(--navy);font-weight:600;text-decoration:underline;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
  .thumb-wrap{position:relative;}
  .thumb-x{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(10,12,20,.92);z-index:999;align-items:center;justify-content:center;padding:20px;}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:6px;}
  .lightbox .close{position:absolute;top:16px;right:22px;color:#fff;font-size:30px;background:none;border:none;}
  .lb-download{position:absolute;top:20px;left:22px;color:#fff;font-size:13px;background:rgba(255,255,255,.14);border:none;padding:8px 14px;border-radius:20px;font-weight:600;}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .lb-prev{left:10px;}
  .lb-next{right:10px;}
  .lb-counter{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:900;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:var(--radius);padding:22px;width:min(440px,94vw);}
  .modal h3{margin:0 0 8px;}
  .modal p{color:#6b6858;font-size:13px;line-height:1.6;}
  .modal .row{margin-top:18px;justify-content:flex-end;}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .legend{font-size:12px;display:flex;flex-direction:column;gap:5px;}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;}
  .studentcode{font-family:monospace;font-weight:700;letter-spacing:1px;background:#f1efe4;padding:2px 7px;border-radius:6px;}
  .stopwatch{font-size:38px;font-family:monospace;font-weight:700;color:var(--navy);text-align:center;}
  .weekgrid{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;font-size:12px;}
  .weekgrid .hd{font-weight:700;text-align:center;color:#8a8674;padding:4px;}
  .weekgrid textarea{width:100%;height:50px;font-size:11px;padding:4px;}
  @media(max-width:880px){
    .grid-stats{grid-template-columns:repeat(2,1fr);}
    .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:200;transition:left .25s;width:230px;overflow-y:auto;}
    .sidebar.open{left:0;}
    .mobile-topbar{display:flex;}
    .main{padding:16px;}
    .layout{display:block;}
    table{font-size:12px;}
    th,td{padding:6px 5px;}
  }

/* v7: 반별 수업기록 가독성 개선 - 데이터 로직 변경 없음 */
.class-record-list{display:flex;flex-direction:column;gap:14px;}
.class-student-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
.class-student-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line);}
.class-student-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:16px;}
.class-record-grid{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(300px,1.35fr) minmax(280px,1.15fr);gap:12px;align-items:start;}
.class-record-box{border:1px solid var(--line);border-radius:11px;background:#fcfbf7;padding:10px;min-width:0;}
.class-record-box h4{margin:0 0 8px;font-size:12px;color:#6b6858;}
.class-mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.class-field label{display:block;font-size:10px;color:#8a8674;margin-bottom:4px;}
.class-field input,.class-field select,.class-field textarea{width:100%;min-width:0;box-sizing:border-box;}
.class-field textarea{resize:vertical;}
.class-wide{grid-column:span 2;}
.class-bottom-grid{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(220px,.8fr) minmax(220px,.8fr);gap:12px;margin-top:12px;}
.class-note textarea{width:100%;min-height:64px;box-sizing:border-box;}
@media(max-width:1100px){.class-record-grid{grid-template-columns:1fr 1fr}.class-bottom-grid{grid-template-columns:1fr 1fr}.class-wide{grid-column:auto}}
@media(max-width:760px){.class-record-grid,.class-bottom-grid,.class-mini-grid{grid-template-columns:1fr}.class-student-card{padding:10px}.class-student-head{align-items:flex-start}.class-student-head .btn{flex:none}}

</style>
</head>

<div id="loadingScreen">

</div>

<div id="loginScreen">
  <div class="login-card">

      <div class="steps"><span></span><span></span><span></span><span></span></div>

</div>

<div id="appShell">

    <div class="main" id="mainArea"></div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="close" onclick="closeLightbox(event)">&times;</button>

</div>

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toLocalISODate(new Date()); }
function academicTodayISO(){
  // 자정~오전 6시 사이는 아직 "전날"로 취급 (밤늦게 숙제하다 자정 넘겨도 같은 날로 기록되게)
  const now = new Date();
  if(now.getHours() < 6){ now.setDate(now.getDate()-1); }
  return toLocalISODate(now);
}
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}(${['일','월','화','수','목','금','토'][dt.getDay()]})`; }

/* ---------------- FIRESTORE INIT & REAL-TIME LISTENERS ---------------- */
async function initFirebase(){
  try{
    await fauth.signInAnonymously();
  }catch(e){
    showFatalError('로그인 서버에 연결하지 못했어요. 인터넷 연결을 확인한 뒤 새로고침 해주세요.');
    return;
  }
  attachListeners();
}

function showFatalError(msg){
  document.getElementById('loadingScreen').innerHTML = `
    <div style="text-align:center;padding:20px;max-width:340px;">
      <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
      <div style="margin-bottom:16px;">${msg}</div>
      <button class="btn-gold" onclick="location.reload()">다시 시도</button>
    </div>`;
}

function setConnStatus(ok){
  const dot = document.getElementById('connDot'); const txt = document.getElementById('connText');
  if(!dot) return;
  dot.classList.toggle('off', !ok);
  txt.textContent = ok ? '실시간 연결됨' : '연결 끊김 - 재시도 중';
}


let warningAutoRunBusy = false;
let warningInputsReady = { students:false, classes:false, classRecords:false, submissions:false, settings:false };
let warningSettingsConfirmed = false; // 설정 문서가 실제로 응답을 받았는지(성공/실패 무관하게 "확인됨" 상태인지)

async function maybeRunAutoWarnings(){
  if(warningAutoRunBusy) return;
  if(!(warningInputsReady.students && warningInputsReady.classes && warningInputsReady.classRecords && warningInputsReady.submissions && warningInputsReady.settings)) return;
  warningAutoRunBusy = true;
  try{
    await checkAutoWarnings();
  }finally{
    warningAutoRunBusy = false;
  }
}

function attachListeners(){
  const subs = [
    fsdb.collection('meta').doc('settings').onSnapshot(async doc=>{
      if(doc.exists){ db.settings = doc.data(); }
      else{
        db.settings = { adminPassword:'0000', isDefaultPassword:true };
        try{ await fsdb.collection('meta').doc('settings').set(db.settings); }catch(e){}
      }
      // 설정 문서가 실제로 응답(성공)했을 때만 "확인됨" 처리한다.
      // 이 시점 이전에는 자동경고 계산 자체가 절대 실행되지 않는다 (FAIL-CLOSED, 원칙 A).
      warningSettingsConfirmed = true;
      warningInputsReady.settings = true;
      listenersReady.settings = true;
      maybeFinishLoading();
      render();
      maybeRunAutoWarnings();
    }, err=>{
      setConnStatus(false);
      // 설정 로딩이 실패한 경우 절대 "확인됨" 처리하지 않는다 → 자동경고는 계속 보류된다.
      warningSettingsConfirmed = false;
      warningInputsReady.settings = false;
    }),

    fsdb.collection('students').onSnapshot(snap=>{
      db.students = snap.docs.map(d=>({id:d.id, ...d.data()}));

function studentLessonRecords(stuId){
  const seen = new Set();
  const recs = [];
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    if(!obj[stuId]) return;
    const date = key.slice(-10);
    const clsId = key.slice(0, key.length-11);
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup, date)) return; // 실제 수업 요일이 아닌 날은 제외 (오탐 경고 방지)
    const k = date+'_'+clsId;

    seen.add(k);
    recs.push({date, clsId});
  });

  return recs;
}

const HOMEWORK_REVIEW_CUTOVER_DATE = '2026-09-01';
function isLegacyHomeworkDate(date){
  return !!date && String(date) < HOMEWORK_REVIEW_CUTOVER_DATE;
}
// v37 숙제 검토 상태 중앙 판정.
// 기존 과거 데이터 보호: status 필드가 없는 예전 인증은 '승인'으로 간주한다.
// 새 인증은 '대기', 원장 확인은 '확인', 불합격은 '불합격'.

const HOMEWORK_MAX_REVIEWS = 3;

function homeworkReviewCount(sub){
  const n = Number(sub && sub.reviewCount);
  return Number.isFinite(n) && n > 0 ? Math.min(HOMEWORK_MAX_REVIEWS, Math.floor(n)) : 0;
}
function homeworkReviewsRemaining(sub){
  return Math.max(0, HOMEWORK_MAX_REVIEWS - homeworkReviewCount(sub));
}

function homeworkDeadlineAt(date){
  // 숙제 날짜 D의 마감 = D+1 오전 06:00 (한국시간 KST, UTC+9).
  // 학생/선생님 기기의 시간대 설정이 달라도 같은 절대시각으로 판정한다.
  const parts = String(date||'').split('-').map(Number);
  if(parts.length!==3 || parts.some(x=>!Number.isFinite(x))) return new Date(NaN);
  const [y,m,d] = parts;
  // D+1 06:00 KST = D 21:00 UTC
  return new Date(Date.UTC(y, m-1, d, 21, 0, 0, 0));
}
function homeworkFirstSubmittedAt(sub){
  if(!sub) return null;
  const raw = sub.firstSubmittedAt || sub.submittedAt || null;
  if(!raw) return null;
  if(raw && typeof raw.toDate==='function') return raw.toDate();
  if(raw && typeof raw.seconds==='number') return new Date(raw.seconds*1000);
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}

function homeworkWasSubmittedOnTime(sub,date){
  if(!sub) return false;
  if(isLegacyHomeworkDate(date)) return true;
  const first = homeworkFirstSubmittedAt(sub);
  if(!first) return false;
  return first.getTime() <= homeworkDeadlineAt(date).getTime();
}

function homeworkDeadlinePassed(date,nowValue){
  const now = nowValue ? new Date(nowValue) : new Date();
  return now.getTime() > homeworkDeadlineAt(date).getTime();
}
function submissionIsFinalRejected(sub){
  if(!sub) return false;
  const status = String(sub.status||'').trim();
  return status==='최종불합격' || (status==='불합격' && homeworkReviewCount(sub)>=HOMEWORK_MAX_REVIEWS);
}
/*
  숙제 최종 집계 상태
  - 학생이 '최초 제출'을 기한 안에 했는지가 기한 준수 기준.
  - 선생님 검토 시점은 기한 판정에 영향을 주지 않음.
  - 1·2차 불합격은 재검사 가능 상태, 3차 불합격만 최종 미이행.
  - 기한을 넘긴 제출도 선생님이 직접 '인정'하면 최종 인정이 우선한다.
*/

function homeworkEffectiveState(sub,date,nowValue){
  if(isLegacyHomeworkDate(date)){
    if(!sub) return 'missing';
    return submissionReviewState(sub,date);
  }
  if(!sub) return homeworkDeadlinePassed(date,nowValue) ? 'missing' : 'open';

  // 선생님이 '인정'한 숙제는 제출시각 판정과 관계없이 최종 인정한다.
  // 기한 정보는 관리 참고값일 뿐, 교사 판정을 뒤집지 않는다.
  if(submissionIsApproved(sub,date)) return 'approved';

  if(submissionIsFinalRejected(sub)) return 'finalRejected';
  if(!homeworkWasSubmittedOnTime(sub,date)) return 'late';
  return submissionReviewState(sub,date);
}
function homeworkCountsAsCompleted(sub,date){
  if(!sub) return false;
  if(isLegacyHomeworkDate(date)) return true;

  // 최종 인정 여부는 선생님의 판정이 우선한다.
  return submissionIsApproved(sub,date);
}
function homeworkCountsAsMissed(sub,date,nowValue){
  if(isLegacyHomeworkDate(date)) return !sub;
  if(!sub) return homeworkDeadlinePassed(date,nowValue);

  // 선생님이 인정한 기록은 어떤 경우에도 미이행/경고 대상으로 되돌리지 않는다.
  if(submissionIsApproved(sub,date)) return false;

  if(submissionIsFinalRejected(sub)) return true;
  if(!homeworkWasSubmittedOnTime(sub,date)) return true;
  return false;
}
function submissionReviewState(sub,date){
  if(!sub) return 'missing';
  const recordDate=date || sub.date || '';
  if(isLegacyHomeworkDate(recordDate)) return 'approved';
  const status = String(sub.status||'').trim();
  if(!status) return 'approved'; // 기존 레거시 제출 보호
  if(status==='확인' || status==='approved') return 'approved';
  if(status==='최종불합격') return 'rejected';
  if(status==='불합격' || status==='rejected') return 'rejected';
  return 'pending'; // '대기' 및 알 수 없는 신규 상태는 안전하게 검토대기
}
function submissionIsApproved(sub,date){ return submissionReviewState(sub,date)==='approved'; }
function submissionIsPending(sub,date){ return submissionReviewState(sub,date)==='pending'; }
function submissionIsRejected(sub,date){ return submissionReviewState(sub,date)==='rejected'; }

function homeworkDeadlineAnomalyRows(){
  return Object.entries(db.submissions||{}).map(([key,sub])=>{
    const idx=key.lastIndexOf('_');
    const studentId=key.slice(0,idx);
    const date=key.slice(idx+1);
    const first=homeworkFirstSubmittedAt(sub);
    return {
      key, studentId, date,
      student:studentById(studentId),
      approved:submissionIsApproved(sub,date),
      onTime:homeworkWasSubmittedOnTime(sub,date),
      firstSubmittedAt:first ? first.toISOString() : null
    };
  }).filter(x=>x.approved && !x.onTime && !isLegacyHomeworkDate(x.date));
}

function homeworkReviewMark(sub,date){
  const eff=homeworkEffectiveState(sub,date);
  return eff==='approved' ? '○' : (eff==='pending'||eff==='needsRevision') ? '△' : '×';
}
function homeworkReviewLabel(sub,date){
  const eff=homeworkEffectiveState(sub,date);
  if(eff==='approved') return '인정';
  if(eff==='pending') return '검토대기';
  if(eff==='needsRevision') return '수정필요';
  if(eff==='late') return '기한 미준수';
  if(eff==='missed') return submissionIsFinalRejected(sub)?'최종불합격':'미이행';
  return '미인증';
}

function confirmedWarningStartDateForGeneration(){
  // 화면 표시용 warningAssessmentStartDate()와 달리, 이 함수는 절대 fallback 기본값을 반환하지 않는다.
  // 설정이 아직 로딩되지 않았거나, 로딩됐어도 값이 없거나 형식이 이상하면 null을 반환해서
  // 호출 측이 "생성 중단(FAIL-CLOSED)"으로 처리하게 한다.
  if(!warningSettingsConfirmed) return null;
  const v = db.settings && db.settings.warningAssessmentStartDate;
  if(typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
  return v;
}
function warningEpisodeIsDuplicate(existingWarnings, episodeKey, dates){
  return (existingWarnings || []).some(w =>
    w && (
      w.episodeKey === episodeKey ||
      (String(w.reason || '').includes('숙제') && String(w.reason || '').includes(dates.join(', ')))
    )
  );
}
// 여러 탭/기기가 동시에 접속해 있어도 같은 경고가 두 번 기록되지 않도록,
// 실제 Firestore 기록은 트랜잭션 안에서 "다시 한번" 중복을 확인한 뒤에만 쓴다.
async function writeAutoWarningIfMissing(studentId, episodeKey, dates, warning){
  const ref = fsdb.collection('students').doc(studentId);
  try{
    const wrote = await fsdb.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      if(!snap.exists) return false;
      const cur = snap.data() || {};
      const curWarnings = cur.warnings || [];
      if(warningEpisodeIsDuplicate(curWarnings, episodeKey, dates)) return false; // 이미 다른 탭/기기가 방금 기록함
      tx.update(ref, {warnings: [...curWarnings, warning]});
      return true;
    });
    return wrote;
  }catch(e){
    console.warn('[경고 엔진] 트랜잭션 기록 실패 — 이번 실행에서는 기록하지 않음', e);
    return false;
  }
}
// ============================================================
// ★★★ 정책 변경 (2026-09-02): 자동경고 시스템 완전 중단 ★★★
// 이제부터 경고는 관리자가 "+ 경고 추가" 버튼으로 수동 입력한 것만 인정한다.
// 아래 상수가 false인 한, checkAutoWarnings()는 무엇이 와도(설정 유무·시작일 값·
// 새로고침·다중 탭 등 어떤 조건에서도) Firestore에 단 한 건도 기록하지 않는다.
// 기존 계산 로직(episode 계산, 트랜잭션 기록 등)은 향후 참고를 위해 아래에 그대로
// 남겨두지만, 이 스위치 때문에 영원히 도달(실행)되지 않는다.
// 다시 자동경고를 쓰고 싶다면 이 값만 true로 바꾸면 되고, 그 전까지는 이 라인이
// 자동경고 WRITE 경로 전체를 원천 차단하는 유일하고 확실한 지점이다.
// ============================================================
const AUTO_WARNING_SYSTEM_ENABLED = false;
// 실제 경고 생성(Firestore 기록) 경로. 화면 표시(감사/미리보기)에는 영향 없음.
async function checkAutoWarnings(){
  if(!AUTO_WARNING_SYSTEM_ENABLED){
    // 자동경고 시스템 중단 — 이 아래 코드는 절대 실행되지 않는다 (FAIL-CLOSED보다 더 강한 전면 차단).
    return;
  }
  // FAIL-CLOSED (원칙 A·B): 설정이 확인되지 않았거나 시작일이 확정되지 않았으면
  // 절대로 경고를 계산하거나 Firestore에 기록하지 않는다.
  // 과거 기본값(2026-08-27 등)으로 대체 계산하는 일은 이 함수 안에서 일어날 수 없다.
  const confirmedStart = confirmedWarningStartDateForGeneration();
  if(!confirmedStart){
    console.warn('[경고 엔진] 경고 계산 시작일이 아직 확인되지 않아 자동경고 생성을 보류합니다 (FAIL-CLOSED).');
    return;
  }
  // 저장된 경고 계산 시작일 이후 숙제 판정만 사용.
  // 기존 기록은 수정/삭제하지 않고, 확정된 3회 연속 미인증 경고만 중복 없이 추가한다.
  const students = Object.values(db.students || {}).filter(s => s && s.id && s.status !== 'withdrawn' && s.status !== '퇴원');
  for(const s of students){
    const episodes = warningEpisodesForStudentPreview(s.id) || [];
    for(const ep of episodes){
      const dates = ep.missedDates || [];
      if(!dates.length || dates[0] < confirmedStart) continue;

      const episodeKey = ep.episodeKey || `homework3days|${s.id}|${dates.join('|')}`;
      if(warningEpisodeIsDuplicate(s.warnings, episodeKey, dates)) continue; // 빠른 로컬 사전 체크 (최종 확인은 트랜잭션에서)

      const warning = {
        date: dates[dates.length - 1],
        reason: `숙제 인증 3회 연속 미이행 (${dates.join(', ')})`,
        episodeKey,
        type: 'homework3days',
        auto: true
      };

      const wrote = await writeAutoWarningIfMissing(s.id, episodeKey, dates, warning);
      if(wrote){
        s.warnings = [...(s.warnings || []), warning];
      }
    }
  }
}

function addDaysISO(dateISO, delta){
  const d = new Date(dateISO+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return toLocalISODate(d);
}
function isNextISODate(prevISO, nextISO){ return !!prevISO && addDaysISO(prevISO,1)===nextISO; }
function warningAssessmentRowsForStudent(stuId){
  const today = todayISO(); // 원장님이 보는 점검/리포트용 계산이므로 실제 달력 날짜 기준
  const seenLesson = new Set();
  const lessons = [];
  const addLesson = (date, clsId)=>{
    if(!date || !clsId || date>today) return;
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup,date)) return;
    const k=clsId+'|'+date;
    if(seenLesson.has(k)) return;
    seenLesson.add(k);
    lessons.push({date,clsId,dayGroup:cls.dayGroup});
  };
  studentLessonRecords(stuId).forEach(r=>addLesson(r.date,r.clsId));
  const s=studentById(stuId);
  const cls=s&&s.classId?classById(s.classId):null;
  if(cls && isLessonDay(cls.dayGroup,today)) addLesson(today,cls.id);
  lessons.sort((a,b)=>a.date.localeCompare(b.date));

  const byDate=new Map();
  for(const l of lessons){
    for(const d of homeworkDateRangeDates(l.dayGroup,l.date)){
      // 마감 전 날짜는 미제출로 확정하지 않는다.
      // 숙제 화면과 경고 계산이 반드시 같은 KST 마감 helper를 사용한다.
      const deadline = homeworkDeadlineAt(d);
      if(Date.now() <= deadline.getTime()) continue;
      const sub = db.submissions[stuId+'_'+d];
      const reviewState = submissionReviewState(sub,d);
      const effectiveState = homeworkEffectiveState(sub,d);
      // 최초 제출이 기한 안이면 선생님이 나중에 검사해도 검토대기로 보호한다.
      // 최초 제출 자체가 늦었거나 3차 최종불합격이면 미이행으로 확정한다.
      if(!byDate.has(d)) byDate.set(d,{
        date:d,
        submitted:effectiveState==='approved',
        pending:effectiveState==='pending' || effectiveState==='needsRevision',
        rejected:reviewState==='rejected',
        missed:effectiveState==='missed' || effectiveState==='late',
        reviewState,
        effectiveState,
        assessedLessonDate:l.date,
        clsId:l.clsId
      });
    }
  }
  return ([...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date))).filter(r => r.date >= warningAssessmentStartDate());
}
function warningEpisodesForStudentPreview(stuId){
  const rows=warningAssessmentRowsForStudent(stuId);
  const episodes=[];
  let missed=[];
  for(const row of rows){
    // 평가자료 사이에 날짜가 비면 '연속 3일'로 이어 붙이지 않는다.
    if(missed.length && !isNextISODate(missed[missed.length-1].date,row.date)) missed=[];
    if(row.pending){ missed=[]; continue; } // 검토 대기는 판정 보류: 연속 미이행을 확정하지 않음
    if(row.submitted){ missed=[]; continue; }
    // 1차/2차 불합격(최종불합격 아님)은 재제출이 가능한 상태이므로 미이행으로 확정하지 않는다.
    // (최종불합격만 'finalRejected'로 별도 판정되며, 그것만 미이행으로 카운트된다.)
    if(row.effectiveState==='rejected'){ missed=[]; continue; }
    missed.push(row);
    if(missed.length===3){
      const dates=missed.map(x=>x.date);
      episodes.push({
        missedDates:dates,
        date:missed[2].assessedLessonDate,
        clsId:missed[2].clsId,
        episodeKey:`homework3days|${stuId}|${dates.join('|')}`
      });
      // 6일 연속이면 3일씩 비중복으로 경고 2회가 되도록 소비한다.
      missed=[];
    }
  }
  return episodes;
}
function warningPreviewRows(){
  const rows=[];
  (db.students||[]).filter(s=>s.status!=='withdrawn').forEach(s=>{
    const eps=warningEpisodesForStudentPreview(s.id);
    eps.forEach(ep=>rows.push({student:s,episode:ep}));
  });
  rows.sort((a,b)=>a.episode.missedDates[2].localeCompare(b.episode.missedDates[2])||a.student.name.localeCompare(b.student.name));
  return rows;
}

// v8: 전체 학생 숙제/경고 검증용 읽기 전용 집계. Firebase 쓰기 없음.
function allStudentHomeworkWarningAuditRows(){
  return (db.students||[])
    .filter(s=>s.status!=='withdrawn')
    .map(s=>{
      const rows=warningAssessmentRowsForStudent(s.id);
      const episodes=warningEpisodesForStudentPreview(s.id);
      const submitted=rows.filter(r=>r.submitted).length;
      const pending=rows.filter(r=>r.pending).length;
      const missing=rows.filter(r=>!r.submitted && !r.pending).length;
      return {student:s, rows, episodes, submitted, pending, missing};
    })
    .sort((a,b)=>{
      const ac=classById(a.student.classId)?.name||'';
      const bc=classById(b.student.classId)?.name||'';
      return ac.localeCompare(bc,'ko') || a.student.name.localeCompare(b.student.name,'ko');
    });
}

/* ---------------- IMAGE HELPERS (사진은 Firestore 문서 안에 압축 저장 — 문서당 1MB 제한 고려해 강하게 압축) ---------------- */
function fileToCompressedDataURL(file, maxW=480, quality=0.4){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleMultiPhotoInput(inputEl, targetArrPush, maxW=480, quality=0.4){
  const files = Array.from(inputEl.files || []);
  for(const f of files){
    try{ const durl = await fileToCompressedDataURL(f, maxW, quality); targetArrPush(durl); }catch(e){}
  }
}

function nextStudentCode(grade){
  const levelMap = {'초':'0','중':'1','고':'2'};
  const level = levelMap[grade[0]] || '0';
  const gradeNum = grade[1];
  const seqPrefix = level+gradeNum;
  const existing = db.students.filter(s=>s.code && s.code.startsWith(seqPrefix)).map(s=>parseInt(s.code.slice(2),10));
  const next = (existing.length? Math.max(...existing):0)+1;
  return seqPrefix + String(next).padStart(2,'0');
}

function studentDailyScores(studentId){
  const rows = [];
  Object.entries(db.classRecords).forEach(([key,recObj])=>{
    const date = key.slice(-10);
    const rec = recObj[studentId];
    if(rec && rec.dailyTestScore !== undefined && rec.dailyTestScore !== '' && rec.dailyTestScore !== null){
      rows.push({date, score:Number(rec.dailyTestScore)});
    }
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date));
  return rows;
}
function studentStatus(studentId){
  const scores = studentDailyScores(studentId);
  const last3 = scores.slice(-3);
  let dailyStatus = 'PASS';
  if(last3.length===3 && last3.every(r=>r.score<60)) dailyStatus = 'STOP';
  else if(last3.length===3 && last3.every(r=>r.score<80)) dailyStatus = 'SLOW';

  const latestKmm = db.kmm.filter(k=>k.studentId===studentId).sort((a,b)=>b.date.localeCompare(a.date))[0];
  let kmmStatus = 'PASS';
  if(latestKmm){
    if(latestKmm.score < 60) kmmStatus = 'STOP';
    else if(latestKmm.score < 80) kmmStatus = 'SLOW';
  }
  const rank = {PASS:0, SLOW:1, STOP:2};
  return rank[dailyStatus] >= rank[kmmStatus] ? dailyStatus : kmmStatus;
}
function statusBadge(status){

  return `<span class="badge gray">경고 없음</span>`;
}
function trafficForStudent(studentId){
  const status = studentStatus(studentId);

  // 신호등은 경고 이력과 무관하게, 최근 학습 상태(시험 점수)만 기준으로 추천합니다.
  // (경고는 별도로 "경고 기록" 카드에서 확인하고, 관리자가 직접 판단합니다.)
  if(status==='STOP') return 'red';
  if(status==='SLOW') return 'yellow';

  // 일일테스트 기준: 80점 이상 순항 / 60~79점 주의 / 60점 미만 관찰필요.
  // 최근 기록을 우선 사용하여 '현재 상태'를 반영합니다.
  const scores = studentDailyScores(studentId);
  if(!scores.length) return 'green';
  const latest = scores.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
  const score = Number(latest && latest.score);
  if(!Number.isFinite(score)) return 'green';
  if(score>=80) return 'green';
  if(score>=60) return 'yellow';
  return 'red';
}

const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_LABEL = {sun:'일',mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토'};
function homeworkRangeForClassDate(dayGroup, dateISO){
  const dow = new Date(dateISO+'T00:00:00').getDay();
  const lessonDays = dayGroup==='mon-wed' ? [1,3] : [2,4];
  if(!lessonDays.includes(dow)) return [];
  const idx = lessonDays.indexOf(dow);
  const prevDow = idx===0 ? lessonDays[lessonDays.length-1] : lessonDays[idx-1];
  let gap = dow - prevDow; if(gap<=0) gap += 7;
  const result = [];
  for(let back = gap; back>=1; back--){
    const d = new Date(dateISO+'T00:00:00'); d.setDate(d.getDate()-back);
    result.push(DAY_KEYS[d.getDay()]);
  }
  return result;
}
function homeworkDateRangeDates(dayGroup, dateISO){
  const dow = new Date(dateISO+'T00:00:00').getDay();
  const lessonDays = dayGroup==='mon-wed' ? [1,3] : [2,4];
  if(!lessonDays.includes(dow)) return [];
  const idx = lessonDays.indexOf(dow);
  const prevDow = idx===0 ? lessonDays[lessonDays.length-1] : lessonDays[idx-1];
  let gap = dow - prevDow; if(gap<=0) gap += 7;
  const result = [];
  for(let back = gap; back>=1; back--){
    const d = new Date(dateISO+'T00:00:00'); d.setDate(d.getDate()-back);
    result.push(toLocalISODate(d));
  }
  return result; // 실제 날짜(YYYY-MM-DD), 오래된 순
}
function weekStartISO(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const dow = d.getDay();
  const diff = dow===0? -6 : 1-dow;
  d.setDate(d.getDate()+diff);
  return toLocalISODate(d);
}
function weekDates(weekStart){
  const arr=[]; for(let i=0;i<7;i++){ const d=new Date(weekStart+'T00:00:00'); d.setDate(d.getDate()+i); arr.push(toLocalISODate(d)); } return arr;
}

function getTodaysFridaySupp(){
  const thisWeek = weekStartISO(todayISO());
  const rows = [];
  Object.entries(db.fridaySupp).forEach(([key, byStu])=>{
    const weekPart = key.slice(-10);
    if(weekPart !== thisWeek) return;
    const clsId = key.slice(0, key.length - 11);
    const cls = classById(clsId);
    Object.entries(byStu||{}).forEach(([stuId, supp])=>{
      if(!supp || !supp.needed) return;
      const s = studentById(stuId);
      rows.push({ key, stuId, studentName: s? s.name : '(삭제된 학생)', className: cls? cls.name : '-', time: supp.time||'', note: supp.note||'', done: !!supp.done });
    });
  });
  rows.sort((a,b)=>{
    if(a.time && b.time) return a.time.localeCompare(b.time);
    if(a.time) return -1;
    if(b.time) return 1;
    return a.studentName.localeCompare(b.studentName);
  });
  return rows;
}

// 경고 계산 시작일은 관리자 '전체 경고 초기화' 시 자동 갱신됩니다.
// 기존 설치본과의 호환을 위해 저장값이 없을 때만 2026-08-27을 fallback으로 사용합니다.
const DEFAULT_WARNING_ASSESSMENT_START_DATE = '2026-08-27';
function warningAssessmentStartDate(){
  return (db.settings && db.settings.warningAssessmentStartDate) || DEFAULT_WARNING_ASSESSMENT_START_DATE;
}

// ---------------- 경고 오류 점검(관리자 전용) ----------------
function extractWarningEvidenceDates(w){
  if(!w) return [];
  // episodeKey 형식: homework3days|studentId|date1|date2|date3 (가장 신뢰도 높은 근거)
  if(w.episodeKey && typeof w.episodeKey === 'string'){
    const parts = w.episodeKey.split('|');
    if(parts.length >= 5 && parts[0]==='homework3days'){
      const dates = parts.slice(2).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
      if(dates.length) return dates;
    }
  }
  // episodeKey가 없거나 형식이 다르면 reason 문자열에서 YYYY-MM-DD 패턴을 추출 (예전 형식 보호)
  if(w.reason){
    const matches = String(w.reason).match(/\d{4}-\d{2}-\d{2}/g);
    if(matches && matches.length) return matches;
  }
  return [];
}
function classifyWarningForAudit(student, w){
  const isAuto = w.auto === true;
  const evidenceDates = extractWarningEvidenceDates(w);
  const startDate = warningAssessmentStartDate();

  if(!isAuto){
    return {verdict:'수동경고', detail:'auto 필드가 없어 수동으로 입력된 경고로 간주합니다. 자동 오류 판정 대상이 아니며, 삭제하려면 반드시 직접 내용을 확인해주세요.', evidenceDates, startDate};
  }
  if(!evidenceDates.length){
    return {verdict:'확인 필요', detail:'근거 날짜를 추출할 수 없는 형식입니다. 직접 확인해주세요.', evidenceDates, startDate};
  }
  if(evidenceDates[0] < startDate){
    return {verdict:'오류 의심', detail:`근거 날짜(${evidenceDates[0]})가 현재 경고 시작일(${startDate})보다 이전입니다.`, evidenceDates, startDate};
  }
  // 시작일 이후 근거 → episodeKey만 믿지 않고 실제 submissions로 재검증한다.
  const recheck = evidenceDates.map(d=>({date:d, state: homeworkEffectiveState(db.submissions[student.id+'_'+d], d)}));
  const approvedDay = recheck.find(r=>r.state==='approved');
  if(approvedDay) return {verdict:'오류 의심', detail:`${approvedDay.date} 날짜는 선생님이 "인정" 처리한 기록입니다. 미이행에 포함되면 안 됩니다.`, evidenceDates, startDate, recheck};
  const pendingDay = recheck.find(r=>r.state==='pending' || r.state==='needsRevision');
  if(pendingDay) return {verdict:'오류 의심', detail:`${pendingDay.date} 날짜는 아직 "검토대기" 상태입니다. 미이행으로 확정하면 안 됩니다.`, evidenceDates, startDate, recheck};
  const resubmittableDay = recheck.find(r=>r.state==='rejected');
  if(resubmittableDay) return {verdict:'오류 의심', detail:`${resubmittableDay.date} 날짜는 1차/2차 불합격(재제출 가능) 상태입니다. 최종불합격이 아니므로 미이행이 아닙니다.`, evidenceDates, startDate, recheck};
  const allConfirmedMissed = recheck.every(r=>r.state==='missing' || r.state==='finalRejected' || r.state==='late');
  if(allConfirmedMissed) return {verdict:'정상', detail:'근거 날짜 3일 모두 재검증 결과 실제 미이행(미제출/기한초과/최종불합격)이 확인됩니다.', evidenceDates, startDate, recheck};
  return {verdict:'확인 필요', detail:'재검증 결과가 애매합니다. 직접 확인해주세요.', evidenceDates, startDate, recheck};
}
function warningMatchesTarget(w, target){
  if(!w) return false;
  if(target.id) return w.id === target.id;
  if(target.episodeKey) return w.episodeKey === target.episodeKey;
  return w.date === target.date && w.reason === target.reason;
}
async function deleteSelectedAuditWarnings(targets){
  // targets: [{studentId, episodeKey, date, reason}, ...]
  if(!targets.length){ alert('선택된 경고가 없어요.'); return; }
  const byStudent = {};
  targets.forEach(t=>{ (byStudent[t.studentId] = byStudent[t.studentId]||[]).push(t); });
  let successCount=0, failCount=0;
  const failNames=[];
  for(const [studentId, list] of Object.entries(byStudent)){
    const ref = fsdb.collection('students').doc(studentId);
    try{
      const result = await fsdb.runTransaction(async (tx)=>{
        // 삭제 직전에 항상 Firestore 최신값을 다시 읽는다 (다른 탭/기기가 그 사이 추가한 경고를 보존하기 위해).
        const snap = await tx.get(ref);
        if(!snap.exists) return {removed:0, total:list.length};
        const cur = snap.data() || {};
        let curWarnings = cur.warnings || [];
        let removed = 0;
        list.forEach(target=>{
          const idx = curWarnings.findIndex(w=>warningMatchesTarget(w, target));
          if(idx!==-1){ curWarnings = curWarnings.slice(0,idx).concat(curWarnings.slice(idx+1)); removed++; }
        });
        if(removed>0) tx.update(ref, {warnings: curWarnings});
        return {removed, total:list.length};
      });
      successCount += result.removed;
      if(result.removed < result.total){ failCount += (result.total-result.removed); failNames.push(studentById(studentId)?.name||studentId); }
    }catch(e){
      failCount += list.length;
      failNames.push(studentById(studentId)?.name||studentId);
    }
  }
  alert(`선택한 경고 삭제 결과\n성공: ${successCount}건\n실패: ${failCount}건${failNames.length?'\n확인 필요한 학생: '+failNames.join(', '):''}`);
  render();
}

        ${eps.length ? `현재 기록 기준 예상 경고 <b>${eps.length}회</b>` : `현재 기록 기준 <b>연속 3회 미인증 구간 없음</b>`}
      </div>
    </div>`;
}

/* ---------------- SEED LOADER ---------------- */
async function loadSeedData(){
  const batchArr = [];
  let batch = fsdb.batch();
  let opCount = 0;
  function pushOp(fn){ fn(batch); opCount++; if(opCount>=400){ batchArr.push(batch); batch=fsdb.batch(); opCount=0; } }

  const courseIdByName = {};
  SEED_DATA.courses.forEach(c=>{
    const existing = db.courses.find(x=>x.name===c.name);
    if(existing){ courseIdByName[c.name]=existing.id; return; }
    const newId = uid('course');
    const steps = c.steps.map(s=>({id:uid('step'), name:s}));
    pushOp(b=> b.set(fsdb.collection('courses').doc(newId), {name:c.name, steps}));
    courseIdByName[c.name]=newId;
  });

  SEED_DATA.classes.forEach(c=>{
    let cls = db.classes.find(x=>x.name===c.name);
    let clsId = cls ? cls.id : uid('cls');
    const studentIds = cls ? [...(cls.studentIds||[])] : [];
    if(!cls){ pushOp(b=> b.set(fsdb.collection('classes').doc(clsId), {name:c.name, dayGroup:c.dayGroup, studentIds:[]})); }
    c.students.forEach(st=>{
      let existing = db.students.find(x=>x.name===st.name && x.grade===st.grade);
      let stuId = existing ? existing.id : uid('stu');
      if(!existing){
        const code = nextStudentCode(st.grade);
        // reflect locally so subsequent nextStudentCode calls see it
        db.students.push({id:stuId, code, name:st.name, grade:st.grade, classId:clsId, memo:'', goal:'', diligence:80, warnings:[], status:'active'});
        pushOp(b=> b.set(fsdb.collection('students').doc(stuId), {code, name:st.name, grade:st.grade, classId:clsId, memo:'', goal:'', diligence:80, warnings:[], status:'active'}));
      }else{
        pushOp(b=> b.update(fsdb.collection('students').doc(stuId), {classId:clsId}));
      }
      if(!studentIds.includes(stuId)) studentIds.push(stuId);
    });
    pushOp(b=> b.set(fsdb.collection('classes').doc(clsId), {studentIds}, {merge:true}));
  });

  batchArr.push(batch);
  try{
    for(const b of batchArr){ await b.commit(); }
  }catch(e){ alert('명단을 불러오는 중 문제가 생겼어요. 다시 시도해주세요.'); }
}

  openConfirm('처음 세팅했던 명단·커리큘럼을 불러올까요?',

function buildDailyReportText(s, date, r, dayGroup){
  const trafficEmoji = {green:'🟢',yellow:'🟡',red:'🔴'}[dailyTrafficForStudentDate(s.id, date)] || '⚪';
  const stepTxt = r.stepId ? stepShortLabel(r.stepId) : '-';
  const extraStepsTxt = (r.extraSteps&&r.extraSteps.length) ? ' + '+r.extraSteps.map(id=>stepShortLabel(id)).filter(Boolean).join(', ') : '';
  // 숙제완성도는 수업기록의 수기 등급이 아니라 실제 submissions 인증 기록으로 계산.

function allStepOptions(){
  let opts=''; db.courses.forEach(c=>{ c.steps.forEach(st=>{ opts+=`<option value="${st.id}">[${c.name}] ${st.name}</option>`; }); }); return opts;
}
function stepLabel(stepId){
  for(const c of db.courses){ const st=(c.steps||[]).find(x=>x.id===stepId); if(st) return `[${c.name}] ${st.name}`; }
  return '';
}
function stepShortLabel(stepId){
  for(const c of db.courses){
    const st = (c.steps||[]).find(x=>x.id===stepId);
    if(st){
      const parts = st.name.split('>');
      let tail = parts.length>1 ? parts[parts.length-1].trim() : st.name.trim();
      tail = tail.replace(/^STEP\s*\d+\s*/i, '').trim();
      return `[${c.name}] ${tail || st.name}`;
    }
  }
  return '';
}
function courseIdForStep(stepId){
  if(!stepId) return null;
  for(const c of db.courses){ if((c.steps||[]).some(st=>st.id===stepId)) return c.id; }
  return null;
}
function lastRecordedStep(stuId, beforeDate){
  let best = null;
  Object.entries(db.classRecords).forEach(([key,obj])=>{
    const rec = obj[stuId];
    if(!rec || !rec.stepId) return;
    const date = key.slice(-10);
    if(date >= beforeDate) return;
    if(!best || date > best.date) best = {date, stepId: rec.stepId};
  });
  return best;
}

function suggestedHomeworkLevel(stuId, dayGroup, date){
  const hwDateRange = homeworkDateRangeDates(dayGroup, date);
  const totalRangeDays = hwDateRange.length;
  if(!totalRangeDays) return '';
  const submittedCount = hwDateRange.filter(d=>homeworkCountsAsCompleted(db.submissions[stuId+'_'+d],d)).length;
  const ratio = submittedCount/totalRangeDays;
  return ratio>=0.8?'상':ratio>=0.5?'중':'하';
}
const BOOK_PRESETS = {
  '초': ['개념책','유형책','연산책','쎈','최상위','에이급'],
  '중': ['개념책','익힘책','최상위','일품','고쟁이','내신기출'],

function courseUnitsList(courseId){
  const course = courseById(courseId);
  if(!course) return [];
  if(UNIT_LIST_OVERRIDES[course.name]) return UNIT_LIST_OVERRIDES[course.name];
  const seen = new Set(); const units = [];
  (course.steps||[]).forEach(st=>{
    const unit = st.name.split('>')[0].trim();
    if(!seen.has(unit)){ seen.add(unit); units.push(unit); }
  });
  return units;
}
function collectAllBookNames(){
  const names = new Set();
  Object.values(db.practiceProgress).forEach(rec=>{ (rec.tracks||[]).forEach(t=>{ if(t.book) names.add(t.book); }); });
  Object.values(db.classRecords).forEach(obj=>{ Object.values(obj).forEach(r=>{ if(r.practiceBook) names.add(r.practiceBook); (r.extraPractice||[]).forEach(e=>{ if(e.book) names.add(e.book); }); }); });

}

async function toggleTrackUnit(stuId, trackId, checked, unit){
  const rec = db.practiceProgress[stuId] || {tracks:[]};
  const tracks = (rec.tracks||[]).map(t=>{
    if(t.id!==trackId) return t;
    let completed = [...(t.completedUnits||[])];
    if(checked){ if(!completed.includes(unit)) completed.push(unit); }
    else{ completed = completed.filter(u=>u!==unit); }
    return {...t, completedUnits: completed};
  });
  await fsSet('practiceProgress', stuId, {tracks});
}

async function confirmAddExtraPractice(clsId,date,stuId){

async function applyBulkTrack(clsId, btn){
  const courseId = document.getElementById('bulkTrackCourseSel').value;
  if(!courseId){ alert('학년학기를 선택해주세요.'); return; }
  const bundle = bookBundleForCourse(courseId);
  if(!bundle.length){ alert('이 학년학기는 자동으로 등록할 표준 교재 세트가 없어요 (초등/중등만 지원해요). 학생별로 개별 등록해주세요.'); return; }
  const cls = classById(clsId);
  const students = (cls.studentIds||[]).map(studentById).filter(Boolean);
  const original = btn.textContent;
  btn.textContent = '등록 중...'; btn.disabled = true;
  let count = 0;
  for(const s of students){
    const rec = db.practiceProgress[s.id] || {tracks:[]};
    const existing = new Set((rec.tracks||[]).filter(t=>t.courseId===courseId).map(t=>t.book));
    const newTracks = bundle.filter(b=>!existing.has(b)).map(b=>({id:uid('trk'), book:b, courseId, completedUnits:[], done:false}));
    if(newTracks.length){
      const tracks = [...(rec.tracks||[]), ...newTracks];
      await fsSet('practiceProgress', s.id, {tracks});
      count++;
    }
  }
  btn.textContent = `✅ ${count}명에게 등록됨`;
  setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 2000);
}

const WEEKEND_SLOTS = [
  {id:'sat_am',label:'토 오전'},
  {id:'sat_pm',label:'토 저녁'},
  {id:'sun_am',label:'일 오전'},
  {id:'sun_pm',label:'일 저녁'}
];
function isMiddleHighStudent(s){
  return !!s && (String(s.grade||'').startsWith('중') || String(s.grade||'').startsWith('고'));
}
function weekendClassForStudent(stuId){
  return (db.weekendClasses||[]).find(c=>(c.studentIds||[]).includes(stuId)) || null;
}
function weekendAvailableForStudent(stuId){
  const s=studentById(stuId);
  return !!(db.weekendSettings&&db.weekendSettings.enabled && isMiddleHighStudent(s) && weekendClassForStudent(stuId));
}
function weekendWeekStart(dateISO){
  const d=new Date((dateISO||todayISO())+'T00:00:00');
  const day=d.getDay();
  const delta=(day===0?-6:1-day);
  d.setDate(d.getDate()+delta);
  return toLocalISODate(d);
}
function weekendSubmissionKey(stuId,wk,slot){ return `${stuId}_${wk}_${slot}`; }
function weekendSubmission(stuId,wk,slot){ return db.weekendSubmissions[weekendSubmissionKey(stuId,wk,slot)] || null; }
function weekendCountForStudent(stuId,wk){
  return WEEKEND_SLOTS.filter(x=>!!weekendSubmission(stuId,wk,x.id)).length;
}
async function setWeekendEnabled(enabled){
  await fsSet('weekendSettings','main',{enabled:!!enabled,updatedAt:new Date().toISOString()});
}

  await fsSet('weekendClasses',uid('weekendClass'),{
    school,grade,level,name:`${school} ${grade} ${level}`,studentIds:[],createdAt:new Date().toISOString()
  });
}
function deleteWeekendClass(id){
  openConfirm('주말학습 반을 삭제할까요?','반 설정만 삭제됩니다. 기존 주말학습 인증 사진 기록은 삭제하지 않습니다.',async()=>{

  });
}
async function toggleWeekendStudent(classId,stuId,checked){
  const cls=(db.weekendClasses||[]).find(c=>c.id===classId); if(!cls)return;
  let ids=[...(cls.studentIds||[])];
  if(checked){
    // 한 학생은 한 주말학습 반에만 배정
    for(const other of (db.weekendClasses||[])){
      if(other.id===classId || !(other.studentIds||[]).includes(stuId)) continue;
      await fsSet('weekendClasses',other.id,{studentIds:(other.studentIds||[]).filter(id=>id!==stuId)});
    }
    if(!ids.includes(stuId)) ids.push(stuId);
  }else ids=ids.filter(id=>id!==stuId);
  await fsSet('weekendClasses',classId,{studentIds:ids});
}

async function fixVideoUnitNumbers(){
  const toFix = [];
  db.videos.forEach(v=>{
    if(!v.courseId || !v.unit) return;
    const units = courseUnitsList(v.courseId);
    if(units.includes(v.unit)) return; // 이미 정확히 일치
    const match = units.find(u => u.replace(/^\d+\.\s*/, '').trim() === v.unit.trim());
    if(match) toFix.push({video:v, newUnit:match});
  });
  if(!toFix.length){
    alert('고칠 게 없어요. 이미 정상이거나, 일치하는 단원을 찾지 못했어요 (커리큘럼에 등록 안 된 단원명일 수 있어요).');
    return;
  }
  openConfirm('단원명을 일괄 수정할까요?', `${toFix.length}개 영상의 단원명에 번호를 붙여드릴게요. 예: "${toFix[0].video.unit}" → "${toFix[0].newUnit}"`, async ()=>{
    for(const {video, newUnit} of toFix){
      await fsUpdate('videos', video.id, {unit: newUnit});
    }
    alert(`${toFix.length}개 영상의 단원명을 고쳤어요.`);
  });
}

function deleteStudentPermanently(stuId){
  const s = studentById(stuId);
  openConfirm('이 학생을 완전히 삭제할까요?',
    `${s.name} 학생과 관련된 모든 기록(출석·진도·시험·숙제인증·질문·경고·피드백)이 전부 영구적으로 사라져요. 이 작업은 되돌릴 수 없어요. 기록을 남기고 싶으시면 "퇴원 처리"를 이용해주세요.`,
    async ()=>{
      const batch = fsdb.batch();
      batch.delete(fsdb.collection('students').doc(stuId));
      db.classes.forEach(c=>{
        if((c.studentIds||[]).includes(stuId)){
          batch.set(fsdb.collection('classes').doc(c.id), {studentIds:c.studentIds.filter(id=>id!==stuId)}, {merge:true});
        }
      });
      Object.entries(db.classRecords).forEach(([key,rec])=>{
        if(rec[stuId]) batch.set(fsdb.collection('classRecords').doc(key), {[stuId]: firebase.firestore.FieldValue.delete()}, {merge:true});
      });
      Object.entries(db.weeklyPlans).forEach(([key,plan])=>{
        if(plan[stuId]) batch.set(fsdb.collection('weeklyPlans').doc(key), {[stuId]: firebase.firestore.FieldValue.delete()}, {merge:true});
      });
      Object.keys(db.submissions).forEach(key=>{ if(key.startsWith(stuId+'_')) batch.delete(fsdb.collection('submissions').doc(key)); });
      db.questions.filter(q=>q.studentId===stuId).forEach(q=> batch.delete(fsdb.collection('questions').doc(q.id)));
      db.kmm.filter(k=>k.studentId===stuId).forEach(k=> batch.delete(fsdb.collection('kmm').doc(k.id)));
      db.feedbacks.filter(f=>f.studentId===stuId).forEach(f=> batch.delete(fsdb.collection('feedbacks').doc(f.id)));
      try{ await batch.commit(); }catch(e){ alert('삭제 중 문제가 발생했어요.'); }
      currentSubState.studentDetail = null;
    }
  );
}
function withdrawStudent(stuId){
  const s = studentById(stuId);
  openConfirm('이 학생을 퇴원 처리할까요?',
    `${s.name} 학생이 반에서 빠지고, 더 이상 학생 코드로 로그인할 수 없게 돼요. 그동안의 숙제·성적·경고 기록은 그대로 보존되고, 학생별 관리 > "퇴원생" 탭에서 언제든 다시 확인할 수 있어요.`,
    async ()=>{
      await fsUpdate('students', stuId, {status:'withdrawn'});
      const cls = classById(s.classId);
      if(cls) await fsSet('classes', cls.id, {studentIds:(cls.studentIds||[]).filter(id=>id!==stuId)});
    }
  );
}
function reinstateStudent(stuId){
  const s = studentById(stuId);
  openConfirm('이 학생을 다시 재원 처리할까요?', `${s.name} 학생의 상태가 "재원생"으로 돌아가요. (반 배정은 반 관리 탭에서 다시 해주셔야 해요)`,
    async ()=>{ await fsUpdate('students', stuId, {status:'active'}); }
  );
}
function promptReissueAll(){
  openConfirm('전체 학생 코드를 재발급할까요?','기존에 학생에게 알려준 코드는 더 이상 작동하지 않아요. 학년 순서대로 새 코드가 발급돼요.', async ()=>{
    const byGrade = {};
    db.students.forEach(s=>{ (byGrade[s.grade] = byGrade[s.grade]||[]).push(s); });
    const batch = fsdb.batch();
    Object.keys(byGrade).forEach(grade=>{
      const levelMap = {'초':'0','중':'1','고':'2'};
      const level = levelMap[grade[0]] || '0'; const gradeNum = grade[1];
      byGrade[grade].forEach((s,i)=>{ batch.update(fsdb.collection('students').doc(s.id), {code: level+gradeNum+String(i+1).padStart(2,'0')}); });
    });
    try{ await batch.commit(); }catch(e){ alert('재발급 중 문제가 발생했어요.'); }
  });
}

function renderDonut(agg){
  const colors = {'개념부족':'#D65A4A','계산실수':'#E0A82E','문제해석':'#3EA55A','유형미숙':'#4a7fd6','성실부족':'#8a5fc9'};
  const total = Object.values(agg).reduce((a,b)=>a+b,0);
  if(!total) return `<div class="empty" style="padding:20px;">아직 데이터가 없어요.</div>`;
  let cum=0; const R=48, C=2*Math.PI*R;
  const circles = Object.entries(agg).map(([type,val])=>{
    const frac = val/total; const dash = frac*C;
    const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${colors[type]||'#999'}" stroke-width="16" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-cum}" />`;
    cum += dash; return el;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);">${circles}</svg>
    <div class="legend">${Object.entries(agg).map(([type,val])=>`<div><span class="sw" style="background:${colors[type]||'#999'};"></span>${type} ${Math.round(val/total*100)}%</div>`).join('')}</div>
  </div>`;
}

async function confirmSubmission(stuId,date,btn){
  if(isLegacyHomeworkDate(date)){ alert('8/31까지의 과거 숙제는 조회만 가능합니다.'); return; }
  const sub = db.submissions[stuId+'_'+date];
  if(!sub){ alert('제출된 숙제가 없습니다.'); return; }
  if(submissionIsFinalRejected(sub)){ alert('3회 검사가 끝난 최종 불합격 숙제입니다.'); return; }
  if(btn){ btn.disabled=true; }
  const nextCount = Math.min(HOMEWORK_MAX_REVIEWS, homeworkReviewCount(sub)+1);
  const ok = await fsUpdate('submissions', stuId+'_'+date, {
    status:'확인',
    reviewCount:nextCount,
    reviewReason:'',
    reviewedAt:new Date().toISOString()
  });
  if(!ok && btn){ btn.disabled=false; }
}
function rejectSubmission(stuId,date){
  if(isLegacyHomeworkDate(date)){ alert('8/31까지의 과거 숙제는 조회만 가능합니다.'); return; }
  const s=studentById(stuId);
  const name=s?s.name:'학생';
  const sub=db.submissions[stuId+'_'+date];
  if(!sub){ alert('제출된 숙제가 없습니다.'); return; }
  if(submissionIsFinalRejected(sub)){
    alert('이미 3회 검사가 끝난 최종 불합격 숙제입니다.');
    return;
  }

  const nextCount=Math.min(HOMEWORK_MAX_REVIEWS, homeworkReviewCount(sub)+1);
  const finalReject=nextCount>=HOMEWORK_MAX_REVIEWS;
  const reason=prompt(`${name} 숙제를 ${nextCount}차 검사 불합격 처리합니다.\n사유를 짧게 적어주세요.`, '숙제 내용 미완료');
  if(reason===null) return;
  const trimmed=String(reason||'').trim();

  openConfirm(
    finalReject ? '3차 검사입니다. 최종 불합격 처리할까요?' : `${nextCount}차 검사 불합격 처리할까요?`,
    finalReject
      ? '최종 불합격 후에는 추가 제출할 수 없고 해당 숙제는 미이행으로 처리됩니다.'
      : `불합격 처리 후 숙제 검사 기회가 ${HOMEWORK_MAX_REVIEWS-nextCount}회 남습니다.`,
    async ()=>{
      await fsUpdate('submissions', stuId+'_'+date, {
        status:finalReject ? '최종불합격' : '불합격',
        reviewCount:nextCount,
        reviewReason:trimmed,
        reviewedAt:new Date().toISOString()
      });
    }

/* 실제 시계(타임스탬프) 기반 스톱워치 — 화면이 꺼지거나 뒤로가기로 새로고침돼도 폰에 저장된 값으로 이어서 계산돼요 */
let swRunStartTs = null;   // 현재 재생 중이면 시작 시각(ms), 아니면 null
let swBaseSeconds = 0;     // 이전에 정지했던 시점까지 누적된 초
let swDisplayInterval = null;
let swActiveStuId = null, swActiveDate = null;
let swTickCount = 0;
function parseTimeToSeconds(t){ if(!t) return 0; const parts=t.split(':').map(Number); return (parts[0]||0)*60+(parts[1]||0); }
function formatSeconds(sec){ const m=String(Math.floor(sec/60)).padStart(2,'0'); const s=String(sec%60).padStart(2,'0'); return `${m}:${s}`; }
function swCurrentElapsed(){ return swBaseSeconds + (swRunStartTs ? Math.floor((Date.now()-swRunStartTs)/1000) : 0); }
async function saveTimerServer(stuId, date){
  try{ await fsSet('timerState', stuId+'_'+date, {baseSeconds: swBaseSeconds, runStartTs: swRunStartTs, updatedAt: Date.now()}); }catch(e){}
}
function swUpdateDisplay(){
  const formatted = formatSeconds(swCurrentElapsed());
  const el = document.getElementById('swDisplay'); if(el) el.textContent = formatted;
  if(currentSubState._draftSub) currentSubState._draftSub.time = formatted;
  if(swActiveStuId && swActiveDate){
    saveDraftLocal(swActiveStuId, swActiveDate);
    swTickCount++;
    if(swTickCount % 10 === 0) saveTimerServer(swActiveStuId, swActiveDate); // 10초마다 서버 백업 (너무 자주 쓰지 않도록)
  }
}
function swStart(){
  if(swRunStartTs) return;
  swBaseSeconds = parseTimeToSeconds(currentSubState._draftSub ? currentSubState._draftSub.time : '00:00');
  swRunStartTs = Date.now();
  if(swDisplayInterval) clearInterval(swDisplayInterval);
  swDisplayInterval = setInterval(swUpdateDisplay, 1000);
  swUpdateDisplay();
  if(swActiveStuId && swActiveDate) saveTimerServer(swActiveStuId, swActiveDate);
}
function swStop(){
  if(!swRunStartTs) return;
  swBaseSeconds = swCurrentElapsed();
  swRunStartTs = null;
  if(swDisplayInterval){ clearInterval(swDisplayInterval); swDisplayInterval=null; }
  swUpdateDisplay();
  if(swActiveStuId && swActiveDate) saveTimerServer(swActiveStuId, swActiveDate);
}
function swReset(){
  swRunStartTs = null; swBaseSeconds = 0;
  if(swDisplayInterval){ clearInterval(swDisplayInterval); swDisplayInterval=null; }
  const el = document.getElementById('swDisplay'); if(el) el.textContent = '00:00';
  if(currentSubState._draftSub) currentSubState._draftSub.time = '00:00';
  if(swActiveStuId && swActiveDate){ saveDraftLocal(swActiveStuId, swActiveDate); saveTimerServer(swActiveStuId, swActiveDate); }
}
function renderDraftSizeIndicator(draft){
  const sizeKB = Math.round(new Blob([JSON.stringify({hwPhotos:draft.hwPhotos,practicePhotos:draft.practicePhotos})]).size/1024);
  const limit = 850;
  const pct = Math.min(100, Math.round(sizeKB/limit*100));
  const color = pct>=90 ? 'var(--red)' : pct>=65 ? 'var(--gold)' : 'var(--green)';
  const msg = pct>=90 ? '용량이 거의 다 찼어요! 사진을 몇 장 지워주세요 (✕ 버튼).' : pct>=65 ? '사진이 많이 쌓였어요. 계속 추가하면 저장이 안 될 수 있어요.' : '';
  return `<div style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#8a8674;margin-bottom:3px;"><span>사진 용량</span><span>${sizeKB}KB / ${limit}KB</span></div>
    <div style="background:#eee;border-radius:6px;height:6px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${color};"></div></div>
    ${msg? `<div style="font-size:11px;color:${color};margin-top:4px;">${msg}</div>`:''}
  </div>`;
}
async function uploadSubPhoto(inputEl, field){

function toggleErrorType(type,checked){

function setErrorPercent(type,val){

async function submitHomework(stuId,date){
  const draft = currentSubState._draftSub;
  const existingSubmission = db.submissions[stuId+'_'+date] || null;
  const preservedFirstSubmittedAt = existingSubmission ? (existingSubmission.firstSubmittedAt || existingSubmission.submittedAt || null) : null;
  const key = stuId+'_'+date;
  const existing = db.submissions[key];

  if(submissionIsFinalRejected(existing)){
    alert('이 숙제는 3회 검사가 끝나 최종 불합격 처리되었습니다. 추가 제출할 수 없습니다.');
    return;
  }

  const nowIso = new Date().toISOString();
  const payload = {
    ...draft,
    status:'대기',
    reviewCount:homeworkReviewCount(existing),
    reviewReason:'',
    reviewedAt:null,
    submittedAt:nowIso,
    // 재제출해도 최초 제출시각은 절대 덮어쓰지 않는다.
    firstSubmittedAt:preservedFirstSubmittedAt || nowIso
  };
  const sizeKB = new Blob([JSON.stringify(payload)]).size/1024;
  if(sizeKB > 850){
    alert('사진 용량이 너무 커요. 사진 개수를 줄이거나 다시 찍어서 올려주세요.');
    return;
  }
  const ok = await fsSet('submissions', key, payload, false);
  if(ok){
    db.submissions[key] = payload; // 즉시 화면에 확인 표시가 뜨도록 로컬에도 바로 반영
    clearDraftLocal(stuId, date);
    fsDelete('timerState', key).catch(()=>{});
    if(swDisplayInterval){ clearInterval(swDisplayInterval); swDisplayInterval=null; }
    swRunStartTs = null; swBaseSeconds = 0; swActiveStuId=null; swActiveDate=null;
    currentSubState._draftSub = null; currentSubState._draftSubKey = null;
    render();
  }
}

/* ---------------- 경고 판단용: 날짜별 숙제 제출 현황 한눈에 보기 (읽기 전용) ---------------- */
function homeworkContentForDate(stuId, clsId, date){
  if(!clsId) return '';
  const wk = weekStartISO(date);
  const plan = db.weeklyPlans[clsId+'_'+wk];
  if(!plan) return '';
  const per = plan[stuId] || {};
  const dayKey = DAY_KEYS[new Date(date+'T00:00:00').getDay()];
  return per[dayKey] || '';
}
function mostRecentLessonDateOnOrBefore(dayGroup, dateISO){
  let d = new Date(dateISO+'T00:00:00');
  for(let i=0;i<7;i++){
    const iso = toLocalISODate(d);
    if(isLessonDay(dayGroup, iso)) return iso;
    d.setDate(d.getDate()-1);
  }
  return null;
}
function homeworkGlanceRowsForStudent(stuId, limitDays){
  const today = todayISO(); // 원장님이 보는 화면이므로 실제 달력 날짜 기준 (학생 제출용 '오전 6시 규칙'은 여기 적용 안 함)
  const seenLesson = new Set();
  const lessons = [];
  const addLesson = (date, clsId)=>{
    if(!date || !clsId || date>today) return;
    const cls = classById(clsId);
    if(!cls || !isLessonDay(cls.dayGroup,date)) return;
    const k=clsId+'|'+date;
    if(seenLesson.has(k)) return;
    seenLesson.add(k);
    lessons.push({date,clsId,dayGroup:cls.dayGroup});
  };
  studentLessonRecords(stuId).forEach(r=>addLesson(r.date,r.clsId));
  const s=studentById(stuId);
  const cls=s&&s.classId?classById(s.classId):null;
  // 원장님이 그 반의 최근 수업 페이지를 아직 안 열어봤어도, 반 스케줄만으로 "가장 최근 수업일"을
  // 항상 계산해서 추가한다 — 학생마다 범위가 들쭉날쭉해 보이지 않도록 일관되게 맞추기 위함.
  if(cls){
    const recent = mostRecentLessonDateOnOrBefore(cls.dayGroup, today);
    if(recent) addLesson(recent, cls.id);
  }
  lessons.sort((a,b)=>a.date.localeCompare(b.date));

  const byDate=new Map();
  for(const l of lessons){
    for(const d of homeworkDateRangeDates(l.dayGroup,l.date)){
      const sub = db.submissions[stuId+'_'+d];
      byDate.set(d, {state: homeworkEffectiveState(sub, d), clsId: l.clsId});
    }
  }
  const dates = [...byDate.keys()].sort();
  const sliced = limitDays ? dates.slice(-limitDays) : dates;
  return sliced.map(d=>{
    const info = byDate.get(d);
    return {date:d, state:info.state, content: homeworkContentForDate(stuId, info.clsId, d)};
  });
}

async function addWarning(stuId){
  const dateEl = document.getElementById('warnDate_'+stuId);
  const reasonEl = document.getElementById('warnReason_'+stuId);
  const date = dateEl.value || todayISO();
  const reason = reasonEl.value.trim();
  if(!reason){ alert('경고 사유를 입력해주세요.'); return; }
  const s = studentById(stuId);
  // 경고는 이제 관리자가 직접 입력한 것만 존재한다. manual:true / auto:false로 명확히 표시해서
  // "경고 오류 점검" 화면 등 어디서든 자동경고와 절대 혼동되지 않게 한다.
  const newWarnings = [...(s.warnings||[]), {id:uid('warn'), date, reason, manual:true, auto:false}];
  await fsUpdate('students', stuId, {warnings:newWarnings});
}
function deleteWarningByIndex(stuId, idx){
  const s = studentById(stuId);
  const w = s && (s.warnings||[])[idx];
  if(!w){ alert('이미 삭제됐거나 목록이 바뀌었어요. 화면을 새로고침해주세요.'); render(); return; }

    // id가 없는 예전 경고도 episodeKey → date+reason 순으로 안전하게 찾아서 지운다 (예전 삭제 실패 버그 수정).
    await deleteSelectedAuditWarnings([{studentId:stuId, id:w.id||null, episodeKey:w.episodeKey||null, date:w.date||'', reason:w.reason||''}]);
  });
}

function finalAuditRowForStudent(stu){
  const sid = stu.id;

  const classRecs = [];
  Object.entries(db.classRecords||{}).forEach(([key,obj])=>{
    if(obj && obj[sid]) classRecs.push({key, ...(obj[sid]||{})});
  });

  const kmmRows = (db.kmm||[]).filter(k=>k.studentId===sid);
  const questionRows = (db.questions||[]).filter(q=>q.studentId===sid);
  const submissionRows = Object.entries(db.submissions||{})
    .filter(([key])=>key.startsWith(sid+'_'))
    .map(([key,v])=>({key, ...(v||{})}));

  const assessRows = warningAssessmentRowsForStudent(sid)||[];
  const submitted = assessRows.filter(r=>r.submitted).length;
  const pendingHomework = assessRows.filter(r=>r.pending).length;
  const missed = assessRows.filter(r=>!r.submitted && !r.pending).length;

  // 2026-09-02부터 경고는 관리자가 수동으로만 입력하며, type:'homework3days' 표시를 달지 않는다.
  // (그 표시는 이제 중단된 옛 자동경고 시스템 전용이었음.) 그래서 실제 화면에 보이는 경고 횟수와
  // 항상 일치하도록, 여기서도 verifiedWarnings()와 같은 기준(수동경고 전체)으로 집계한다.
  const homeworkWarnings = verifiedWarnings(stu);
  const pendingQuestions = questionRows.filter(q=>!(q.answerText || q.answerImage || q.teacherComment)).length;

  const issues = [];
  if(!classRecs.length) issues.push('수업기록 없음');
  if(assessRows.length && submitted===0) issues.push('숙제 인증 없음');
  if(pendingQuestions>0) issues.push(`미답변 질문 ${pendingQuestions}`);
  if(homeworkWarnings.length>0) issues.push(`경고 ${homeworkWarnings.length}`);

  return {
    name:stu.name,
    grade:stu.grade||'',
    classRecords:classRecs.length,
    kmm:kmmRows.length,
    submissions:submissionRows.length,
    questions:questionRows.length,
    pendingQuestions,
    homeworkAssess:assessRows.length,
    homeworkSubmitted:submitted,
    homeworkPending:pendingHomework,
    homeworkMissed:missed,
    warnings:homeworkWarnings.length,
    issues
  };
}

function classRecordContextForStudentDate(stuId,date){
  for(const [key,obj] of Object.entries(db.classRecords||{})){
    if(!key.endsWith('_'+date) || !obj || !obj[stuId]) continue;
    const clsId = key.slice(0, -(date.length+1));
    const cls = classById(clsId);
    return {cls, record:obj[stuId]||{}};
  }
  return {cls:null, record:{}};
}

function homeworkPlanTextForStudentDate(stuId, cls, date){
  if(!cls) return '-';
  const days = homeworkRangeForClassDate(cls.dayGroup, date);
  const wk = weekStartISO(date);
  const plan = db.weeklyPlans[cls.id+'_'+wk];
  if(!plan || !days.length) return '-';
  const per = plan[stuId] || {};
  const rows = days.map(d=>per[d] ? `[${DAY_LABEL[d]}] ${per[d]}` : '').filter(Boolean);
  return rows.length ? rows.join(' / ') : '-';
}

function dailyTrafficForStudentDate(stuId, date){
  const s = studentById(stuId);
  if(!s) return 'green';

  // 신호등은 경고 이력과 무관하게, 그날의 시험 점수·숙제 인증 상태만으로 판정합니다.

  // 1. 해당 날짜 일일테스트 점수 판정.
  const scoreRow = studentDailyScores(stuId).find(r=>String(r.date||'')===String(date||''));
  const hasScore = !!scoreRow && Number.isFinite(Number(scoreRow.score));
  const score = hasScore ? Number(scoreRow.score) : null;
  let testTraffic = 'green';
  if(hasScore){
    if(score < 60) testTraffic = 'red';
    else if(score < 80) testTraffic = 'yellow';
  }

  // 2. 숙제 인증 상태 판정.
  // 한 번의 미인증만으로 빨강 처리하지 않는다.
  // 해당 수업일 기준 확인 대상 숙제 중 미인증이 있으면 '주의(노랑)' 요소로 반영한다.
  const cls = classById(s.classId);
  const dayGroup = cls && cls.dayGroup;
  const hwDates = dayGroup ? homeworkDateRangeDates(dayGroup, date) : [];
  const hwNotApprovedCount = hwDates.filter(d=>!homeworkCountsAsCompleted(db.submissions[stuId+'_'+d],d)).length;
  const homeworkTraffic = hwNotApprovedCount > 0 ? 'yellow' : 'green';

  // 3. 일일테스트 + 숙제 중 더 강한 상태를 최종 신호등으로 사용.
  const rank = {green:0, yellow:1, red:2};
  return rank[testTraffic] >= rank[homeworkTraffic] ? testTraffic : homeworkTraffic;
}

function monthlyTrafficForStudent(stuId, ym){
  const monthScores = studentDailyScores(stuId)
    .filter(r=>String(r.date||'').startsWith(ym))
    .map(r=>Number(r.score))
    .filter(Number.isFinite);

  // 신호등은 경고 이력과 무관하게, 해당 월 일일테스트 평균으로만 판정합니다.
  // 80점 이상: 순항 / 60~79점: 주의 / 60점 미만: 관찰필요.
  if(!monthScores.length) return 'green';
  const avg = monthScores.reduce((a,b)=>a+b,0) / monthScores.length;
  if(avg>=80) return 'green';
  if(avg>=60) return 'yellow';
  return 'red';
}

function buildMonthlyReportPlainForMonth(stuId, traffic, comment, ym){
  const s = studentById(stuId);
  if(!s) return '';

  const monthLabel = `${Number(ym.slice(5))}월`;

  const records = [];
  Object.entries(db.classRecords||{}).forEach(([key,obj])=>{
    const date = key.slice(-10);
    if(!date.startsWith(ym) || !obj || !obj[stuId]) return;
    records.push({date, ...(obj[stuId]||{})});
  });
  records.sort((a,b)=>a.date.localeCompare(b.date));

  const attendanceCount = records.filter(r=>r.attendance && r.attendance!=='결석').length;
  const absenceCount = records.filter(r=>r.attendance==='결석').length;
  const latestProgress = records.slice().reverse().find(r=>r.stepId || r.practiceBook);

  // 일일테스트는 평균을 내지 않고 해당 월 전체 점수를 날짜별로 그대로 나열.
  const dailyScores = studentDailyScores(stuId)
    .filter(r=>String(r.date||'').startsWith(ym))
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));

  const kmmRows = (db.kmm||[]).filter(k=>k.studentId===stuId && String(k.date||'').startsWith(ym));
  const kmmScores = kmmRows.map(k=>Number(k.score)).filter(Number.isFinite);
  const kmmAvg = kmmScores.length ? Math.round(kmmScores.reduce((a,b)=>a+b,0)/kmmScores.length*10)/10 : null;

  const errorCount = {};
  records.forEach(r=>(r.errorTypes||[]).forEach(e=>{ errorCount[e]=(errorCount[e]||0)+1; }));
  const topErrors = Object.entries(errorCount).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const assessRows = (warningAssessmentRowsForStudent(stuId)||[]).filter(r=>r.date.startsWith(ym));
  const submittedCount = assessRows.filter(r=>r.submitted).length;
  const pendingCount = assessRows.filter(r=>r.pending).length;
  const missedCount = assessRows.filter(r=>!r.submitted && !r.pending).length;
  const totalAssess = assessRows.length;
  const decidedCount = submittedCount + missedCount;
  const submitRate = decidedCount ? Math.round(submittedCount/decidedCount*100) : null;

  const verified = verifiedWarnings(s);
  const monthWarnings = verified.filter(w=>String(w.date||'').startsWith(ym));

  const trafficLabel = traffic==='green'?'🟢 순항중':traffic==='yellow'?'🟡 주의':'🔴 관찰필요';
  const progressText = latestProgress
    ? `${latestProgress.stepId ? stepShortLabel(latestProgress.stepId) : ''}${latestProgress.practiceBook ? ` / ${latestProgress.practiceBook}${latestProgress.practiceRange?' '+latestProgress.practiceRange:''}` : ''}`.replace(/^ \/ /,'')
    : '-';

  return `[M&m 수학훈련소] ${s.name} 학생 ${monthLabel} 월말 리포트
${trafficLabel}

1. 출석·진도
· 수업기록 ${records.length}회 / 출석 ${attendanceCount}회 / 결석 ${absenceCount}회
· 최근 진도: ${progressText || '-'}

2. 일일테스트
${dailyScores.length
  ? dailyScores.map(r=>`· ${String(r.date||'').slice(5).replace('-','/')} ${r.score}점 ${Number(r.score)>=80?'🟢':Number(r.score)>=60?'🟡':'🔴'}`).join('\n')
  : '· 기록 없음'}
${dailyScores.length
  ? `· 월간 평균 ${Math.round((dailyScores.reduce((sum,r)=>sum+Number(r.score),0)/dailyScores.length)*10)/10}점 → ${trafficLabel}`
  : ''}

3. KMM
· 응시 ${kmmRows.length}회${kmmAvg!==null ? ` / 평균 ${kmmAvg}점` : ''}
${kmmRows.length ? kmmRows.map(k=>`· ${String(k.date||'').slice(5).replace('-','/')} ${k.score}점 (${Number(k.score)>=80?'PASS':'FAIL'})`).join('\n') : '· 기록 없음'}

4. 오답유형
${topErrors.length ? topErrors.map(([name,c])=>`· ${name}: ${c}회`).join('\n') : '· 기록 없음'}

5. 숙제 현황
· 판정 대상 ${totalAssess}회 / 인정 ${submittedCount}회 / 검토대기 ${pendingCount}회 / 미인증·불합격 ${missedCount}회${submitRate!==null ? ` / 확정분 이행률 ${submitRate}%` : ''}
· 이번 달 경고 ${monthWarnings.length}회 / 누적 경고 ${verified.length}회

6. 다음 달 학습 방향
${comment || '-'}`;
}

function schoolExamHistoryForStudent(stuId){
  const rows = [];
  Object.entries(db.schoolScores||{}).forEach(([key,scoreRow])=>{

    const exam = (db.schoolExams||[]).find(e=>e.id===scoreRow.examId);

      range: exam.range||'',
      score: scoreRow.score

  });

function normalizeSchoolExamDate(e){
  // 기존 schoolExams 데이터의 날짜 표현을 안전하게 흡수한다.
  // 우선순위: date → examDate → testDate
  const raw = e && (e.date ?? e.examDate ?? e.testDate);
  if(raw===undefined || raw===null) return '';

  // Firestore Timestamp 호환
  if(raw && typeof raw==='object'){
    if(typeof raw.toDate==='function'){
      const d = raw.toDate();
      if(d && !isNaN(d.getTime())){
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
    }
    if(typeof raw.seconds==='number'){
      const d = new Date(raw.seconds*1000);
      if(!isNaN(d.getTime())){
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
    }
  }

  const s = String(raw).trim();
  if(!s) return '';

  // YYYY-MM-DD / YYYY.MM.DD / YYYY/MM/DD
  let m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(m) return `${m[1]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[3])).padStart(2,'0')}`;

  // YYYYMMDD
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;

  // 2026년 9월 3일
  m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);
  if(m) return `${m[1]}-${String(Number(m[2])).padStart(2,'0')}-${String(Number(m[3])).padStart(2,'0')}`;

  // Date-parsable fallback
  const d = new Date(s);
  if(!isNaN(d.getTime())){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return '';
}

function renderSchoolExamCalendar(){
  const baseYm = currentSubState.examCalendarMonth || todayISO().slice(0,7);
  currentSubState.examCalendarMonth = baseYm;

  const [yy,mm] = baseYm.split('-').map(Number);
  const first = new Date(yy, mm-1, 1);
  const last = new Date(yy, mm, 0);
  const firstDow = first.getDay();
  const daysInMonth = last.getDate();

  // 모든 기존 schoolExams 레코드를 읽고 날짜를 정규화해서 표시한다.
  const allExams = (db.schoolExams||[]).map(e=>({
    ...e,
    _calendarDate: normalizeSchoolExamDate(e)
  }));

  const monthExams = allExams
    .filter(e=>String(e._calendarDate||'').startsWith(baseYm))
    .sort((a,b)=>{
      const d = String(a._calendarDate||'').localeCompare(String(b._calendarDate||''));
      if(d!==0) return d;
      const s = String(a.school||'').localeCompare(String(b.school||''));
      if(s!==0) return s;
      return Number(a.grade||0)-Number(b.grade||0);
    });

  const byDate = {};
  monthExams.forEach(e=>{
    const d = e._calendarDate;
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push(e);
  });

  const cells = [];
  for(let i=0;i<firstDow;i++){
    cells.push(`<div style="min-height:102px;background:#faf9f4;border:1px solid var(--line);border-radius:10px;"></div>`);
  }

  for(let d=1; d<=daysInMonth; d++){
    const iso = `${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDate[iso] || [];
    cells.push(`
      <div style="min-height:102px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;">
        <div style="font-weight:800;font-size:12px;margin-bottom:5px;">${d}</div>

            <b>${e.school||'-'} ${e.grade||''}학년</b><br>
            <span>${e.examName||e.name||'시험'}</span>
            ${e.range?`<br><span class="muted">${e.range}</span>`:''}
          </div>`).join('')}
      </div>`);
  }

  const undated = allExams.filter(e=>!e._calendarDate);

  return `
    <div class="card">
      <div class="row between" style="gap:10px;flex-wrap:wrap;">
        <div>
          <h3 style="margin:0;">📅 전체 학교 내신 시험 일정</h3>
          <div class="muted" style="font-size:11px;margin-top:4px;">
            기존에 저장된 모든 학교·학년 시험을 읽어 달력에 표시합니다.
          </div>
        </div>
        <div class="row" style="gap:6px;">
          <button class="btn sm outline" onclick="shiftExamCalendarMonth(-1)">‹ 이전달</button>
          <b style="align-self:center;">${yy}년 ${mm}월</b>
          <button class="btn sm outline" onclick="shiftExamCalendarMonth(1)">다음달 ›</button>
          <button class="btn sm outline" onclick="currentSubState.examCalendarMonth=todayISO().slice(0,7);render();">이번달</button>
        </div>
      </div>

      <div style="overflow-x:auto;margin-top:12px;">
        <div style="display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:5px;min-width:760px;">
          ${['일','월','화','수','목','금','토'].map(x=>`<div style="text-align:center;font-size:11px;font-weight:800;padding:5px;">${x}</div>`).join('')}
          ${cells.join('')}
        </div>
      </div>

      <div class="muted" style="font-size:11px;margin-top:10px;">
        이번 달 표시 ${monthExams.length}개 · 전체 저장 시험 ${(db.schoolExams||[]).length}개
      </div>

      ${undated.length ? `
        <details style="margin-top:10px;">
          <summary style="cursor:pointer;font-weight:700;font-size:12px;">⚠️ 날짜를 읽지 못한 기존 시험 ${undated.length}개 확인</summary>
          <div style="margin-top:8px;">
            ${undated.map(e=>`<div style="font-size:11px;padding:5px 0;border-bottom:1px solid var(--line);">
              ${e.school||'-'} ${e.grade||''}학년 · ${e.examName||e.name||'시험'} · 원본 날짜: ${String(e.date ?? e.examDate ?? e.testDate ?? '-')}
            </div>`).join('')}
          </div>
        </details>` : ''}
    </div>`;
}

  `;
}

async function applyGradeRange(grade, btn){
  const range = document.getElementById(`gradeRange_${grade}`).value;
  const targets = db.students.filter(s=>s.status!=='withdrawn' && s.grade===grade)
    .map(s=>latestKmmForStudent(s.id)).filter(k=>k && isKmmMakeupActive(k));
  const original = btn.textContent;
  btn.textContent = '적용 중...'; btn.disabled = true;
  for(const k of targets){ await fsUpdate('kmm', k.id, {range}); }
  btn.textContent = `✅ ${targets.length}명 적용됨`;
  setTimeout(()=>{ btn.textContent = original; btn.disabled=false; }, 1800);
}
async function saveKmmRowCompact(stuId, kmmId, btn){
  const noteEl = document.getElementById(`kmmNote_${stuId}`);
  const scoreEl = document.getElementById(`kmmRetryScore_${kmmId}`);
  const note = noteEl.value;
  await fsUpdate('students', stuId, {kmmMakeupNote: note});
  const val = scoreEl.value;
  if(val===''){
    const original = btn.textContent;
    btn.textContent = '✅ 메모 저장됨';
    setTimeout(()=>{ btn.textContent = original; }, 1500);
    return;
  }
  const score = Number(val);
  const kmmRow = db.kmm.find(k=>k.id===kmmId);
  const ok = await fsUpdate('kmm', kmmId, {retryScore: score, retryDate: todayISO()});
  if(!ok) return;
  if(score>=70){

    openMessagePreview(`${s.name} 학생 재시험 통과!`, kmmRetryPassMessage(s.name, kmmRow?.range, score));
  }else{

function kmmAward(score){

  if(score>=95) return {label:'금상', emoji:'🥇'};
  if(score>=85) return {label:'은상', emoji:'🥈'};
  if(score>=70) return {label:'동상', emoji:'🥉'};
  if(score>=60) return {label:'장려상', emoji:'💪'};
  return null;
}
function kmmAwardText(score){
  const a = kmmAward(score);
  return a ? `${a.emoji} ${a.label}` : '';
}
function kmmResultPhrase(kmmRow){
  if(!kmmRow) return '';

  if(kmmRow.score>=80) return `이번 KMM에서 ${kmmRow.score}점으로 PASS 기준을 충족했습니다.`;
