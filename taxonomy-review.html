<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&m 분류체계 검수</title><style>body{font:16px system-ui;background:#f8f6ef;color:#244638;max-width:960px;margin:24px auto;padding:16px}details,section{background:white;border:1px solid #ddd9ca;border-radius:10px;padding:14px;margin:10px 0}summary{cursor:pointer;font-weight:700}input,select{font:inherit;padding:8px;max-width:100%;border:1px solid #aaa;border-radius:6px}small{color:#666}li{margin:8px 0}#status{color:#805b23}</style><h1>M&m 분류체계 관리</h1><p>중등 분류 후보 검수용 · 운영 데이터와 연결되지 않은 읽기 전용 화면</p><label>과정 <select id="course"><option value="">전체</option></select></label> <label>검색 <input id="query" placeholder="단원·개념·ID"></label><p id="status" role="status">불러오는 중</p><main id="out"></main><script>
const course=document.getElementById('course'),query=document.getElementById('query'),out=document.getElementById('out'),statusEl=document.getElementById('status');let units=[];
function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function render(){out.replaceChildren();const q=query.value.trim().toLowerCase();let count=0;for(const u of units){if(course.value&&u.courseId!==course.value)continue;const match=(u.name+' '+u.id).toLowerCase().includes(q);const topics=u.topics.filter(t=>match||(t.name+' '+t.id).toLowerCase().includes(q));if(!match&&!topics.length)continue;count++;const d=node('details','');d.open=!!q;d.append(node('summary',u.courseId+' · '+u.name+' ('+topics.length+'개 개념)'));d.append(node('small',u.id+' · 검수 대기'));const list=node('ul','');for(const t of topics){const li=node('li',t.name+' ');li.append(node('small',t.id));list.append(li)}d.append(list);out.append(d)}statusEl.textContent=count+'개 단원 표시 · 모든 항목은 후보 상태';}
course.addEventListener('change',render);query.addEventListener('input',render);fetch('./taxonomy/middle-school.draft.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{units=data.units;for(const id of new Set(units.map(u=>u.courseId))){const o=node('option',id);o.value=id;course.append(o)}render()}).catch(()=>{statusEl.textContent='분류 데이터를 불러오지 못했습니다. 개발 브랜치의 파일 경로를 확인하세요.'});
</script></html>
