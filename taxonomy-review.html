 data=structuredClone(seed);try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.version===seed.version&&Array.isArray(saved.units))data=saved}catch{};const course=document.getElementById('course'),query=document.getElementById('query'),out=document.getElementById('out'),statusEl=document.getElementById('status');const courses=[...new Set(seed.units.map(u=>u.courseId))];let storageError=false;

function save(){try{localStorage.setItem(key,JSON.stringify(data));storageError=false}catch{storageError=true}render()}
function button(label,fn){const b=node('button',label);b.onclick=fn;return b}
function edit(x){const n=prompt('분류명',x.name);if(n&&n.trim()){x.name=n.trim();x.status='candidate';save()}}
function controls(x){const s=node('span','');s.append(button('이름 수정',()=>edit(x)));const sel=node('select','');for(const [v,l] of [['candidate','검수 대기'],['approved','승인'],['rejected','반려']]){const o=node('option',l);o.value=v;sel.append(o)}sel.value=x.status;sel.onchange=()=>{x.status=sel.value;save()};s.append(sel);return s}
function addTopic(u){const n=prompt('신규 개념명');if(!n||!n.trim())return;u.topics.push({id:u.id+'-C-'+crypto.randomUUID(),name:n.trim(),status:'candidate'});save()}
function render(){const opened=new Set([...out.querySelectorAll('details[open]')].map(d=>d.dataset.id));out.replaceChildren();const q=query.value.trim().toLowerCase();let count=0;for(const u of data.units){if(course.value&&u.courseId!==course.value)continue;const match=(u.name+' '+u.id).toLowerCase().includes(q);const topics=u.topics.filter(t=>match||(t.name+' '+t.id).toLowerCase().includes(q));if(!match&&!topics.length)continue;count++;const d=node('details','');d.dataset.id=u.id;d.open=!!q||opened.has(u.id);d.append(node('summary',u.courseId+' · '+u.name+' ('+topics.length+'개 개념)'));d.append(node('small',u.id),controls(u),button('개념 추가',()=>addTopic(u)));const list=node('ul','');for(const t of topics){const li=node('li',t.name+' ');li.append(node('small',t.id),controls(t));list.append(li)}d.append(list);out.append(d)}statusEl.textContent=count+'개 단원 표시'+(storageError?' · 브라우저 저장 실패: JSON 내보내기 필요':' · 운영 미반영');}
for(const id of courses){const o=node('option',id);o.value=id;course.append(o)}course.onchange=render;query.oninput=render;document.getElementById('add').onclick=()=>{if(!course.value){alert('과정을 먼저 선택하세요');return}const n=prompt('신규 단원명');if(n&&n.trim()){data.units.push({id:course.value+'-U-'+crypto.randomUUID(),courseId:course.value,name:n.trim(),status:'candidate',topics:[]});save()}};document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mnm-taxonomy-reviewed.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
